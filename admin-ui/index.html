<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>운영 관리자 · 운명상회</title>
  <!--
    이 파일은 정적 루트(`사주/`) 밖에 있다. ADR-0002 D1 의 결정이며, 정적 미들웨어가
    인증 검사 없이 파일을 내보내는 것을 구조적으로 막는다. 서빙은 `/admin` 라우트만 한다.

    설정값·키·엔드포인트 비밀을 인라인하지 않는다(ADR-0002 D2-5).
    화면에 들어가는 모든 데이터는 인증된 `/api/admin/v1/*` 응답으로만 온다.
  -->
  <style>
    /*
      관리자 팔레트는 의미 기반 이름으로 독립 정의한다(ADR-0002 D3).
      레퍼런스의 색상값·토큰 이름을 가져오지 않는다. 대비비는 흰 배경 기준
      WCAG AA(4.5:1) 이상을 먼저 만족시키는 값으로 골랐다.
    */
    :root {
      --admin-bg: #f6f6f8;
      --admin-surface: #ffffff;
      --admin-line: #dfdfe4;
      --admin-text: #1b1b1f;         /* 16.1:1 */
      --admin-text-muted: #5b5b63;   /*  6.9:1 */
      --admin-text-disabled: #8a8a93;
      --admin-state-ok: #1f6f3f;     /*  5.3:1 */
      --admin-state-warn: #8a5a00;   /*  5.4:1 */
      --admin-state-error: #a3231f;  /*  5.9:1 */
      --admin-action-danger: #b3261e;
      --admin-focus: #1f4fd8;
      --admin-space-1: 4px;
      --admin-space-2: 8px;
      --admin-space-3: 12px;
      --admin-space-4: 16px;
      --admin-space-6: 24px;
      --admin-space-8: 32px;
      --admin-radius: 4px;           /* 관리자는 작은 반경 한 단계만 쓴다 */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--admin-bg);
      color: var(--admin-text);
      font-family: 'Pretendard', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    a { color: var(--admin-focus); }
    :focus-visible { outline: 2px solid var(--admin-focus); outline-offset: 2px; }

    .admin-header {
      display: flex; align-items: baseline; gap: var(--admin-space-3);
      padding: var(--admin-space-4) var(--admin-space-6);
      background: var(--admin-surface);
      border-bottom: 1px solid var(--admin-line);
    }
    .admin-header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .admin-header .admin-env { color: var(--admin-text-muted); font-size: 12px; }
    .admin-header .admin-who { margin-left: auto; color: var(--admin-text-muted); font-size: 12px; }

    .admin-nav {
      display: flex; gap: var(--admin-space-1);
      padding: 0 var(--admin-space-6);
      background: var(--admin-surface);
      border-bottom: 1px solid var(--admin-line);
    }
    .admin-nav a {
      padding: var(--admin-space-3) var(--admin-space-4);
      color: var(--admin-text-muted); text-decoration: none;
      border-bottom: 2px solid transparent;
    }
    .admin-nav a[aria-current='page'] { color: var(--admin-text); border-bottom-color: var(--admin-text); }

    /* 표 중심 화면은 넓게, 폼·상세는 좁게 — 두 단계만 쓴다. */
    main { max-width: 1280px; margin: 0 auto; padding: var(--admin-space-6); }
    main[data-width='narrow'] { max-width: 720px; }

    .admin-panel {
      background: var(--admin-surface);
      border: 1px solid var(--admin-line);
      border-radius: var(--admin-radius);
      padding: var(--admin-space-6);
    }
    .admin-panel h2 { margin: 0 0 var(--admin-space-2); font-size: 15px; }
    .admin-panel p { margin: 0 0 var(--admin-space-2); color: var(--admin-text-muted); }
    .admin-note { color: var(--admin-text-disabled); font-size: 12px; }

    /* 상태는 색만으로 표현하지 않는다. 색 + 텍스트 라벨을 함께 쓴다(ADR-0002 D4). */
    .admin-status { display: inline-flex; align-items: center; gap: var(--admin-space-2); font-weight: 600; }
    .admin-status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .admin-status[data-tone='ok'] { color: var(--admin-state-ok); }
    .admin-status[data-tone='warn'] { color: var(--admin-state-warn); }
    .admin-status[data-tone='error'] { color: var(--admin-state-error); }

    /* 금액은 같은 정렬축에 둔다. */
    .admin-amount { text-align: right; font-variant-numeric: tabular-nums; }

    /* 로그인 폼. 관리자에서 사용자 입력을 받는 유일한 지점이다. */
    .admin-form { display: grid; gap: var(--admin-space-4); margin-top: var(--admin-space-4); }
    .admin-field { display: grid; gap: var(--admin-space-1); }
    .admin-field label { font-size: 13px; font-weight: 600; color: var(--admin-text); }
    .admin-field input {
      padding: var(--admin-space-3);
      font: inherit;
      color: var(--admin-text);
      background: var(--admin-surface);
      border: 1px solid var(--admin-line);
      border-radius: var(--admin-radius);
    }
    .admin-field input:focus-visible { outline: 2px solid var(--admin-focus); outline-offset: 1px; }
    .admin-actions { display: flex; align-items: center; gap: var(--admin-space-3); }
    .admin-button {
      padding: var(--admin-space-3) var(--admin-space-6);
      font: inherit; font-weight: 600;
      color: var(--admin-surface);
      background: var(--admin-text);
      border: 1px solid var(--admin-text);
      border-radius: var(--admin-radius);
      cursor: pointer;
    }
    .admin-button[disabled] { background: var(--admin-text-disabled); border-color: var(--admin-text-disabled); cursor: progress; }
    .admin-button[data-variant='quiet'] {
      color: var(--admin-text); background: var(--admin-surface); border-color: var(--admin-line); font-weight: 500;
    }
    /* 실패 이유는 색만으로 알리지 않는다(D4) — 상태 라벨과 문장을 같이 준다. */
    .admin-form-error { display: grid; gap: var(--admin-space-1); }
    .admin-alt {
      margin-top: var(--admin-space-6);
      padding-top: var(--admin-space-4);
      border-top: 1px solid var(--admin-line);
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="admin-header">
    <h1>운영 관리자</h1>
    <span class="admin-env" data-admin-env>환경 확인 중</span>
    <span class="admin-who" data-admin-who></span>
  </header>

  <nav class="admin-nav" aria-label="관리자 메뉴" data-admin-nav hidden>
    <a href="/admin" aria-current="page">개요</a>
    <a href="/admin/orders">주문</a>
    <a href="/admin/members">회원·리포트</a>
    <a href="/admin/settings">설정</a>
  </nav>

  <main data-width="narrow">
    <!--
      빈 목록 / 필터 결과 없음 / 조회 실패 / 권한 없음을 서로 다른 상태로 구분한다
      (ADR-0002 D4, 06-SCREENS A35). 셸 단계에서는 뒤 두 가지가 쓰인다.
    -->
    <section class="admin-panel" data-admin-state="loading">
      <h2>확인 중</h2>
      <p>로그인 상태와 권한을 확인하고 있습니다.</p>
    </section>

    <!--
      직원 로그인. 일반 회원 로그인은 소셜 로그인만 지원하므로 여기서는 쓰지 않는다 —
      직원 계정은 조직이 발급·회수하는 이메일/비밀번호 계정이어야 한다.
      비밀번호는 인증 서비스로 바로 전송하고, 이 화면과 서버 어디에도 보관하지 않는다.
    -->
    <section class="admin-panel" data-admin-state="anonymous" hidden>
      <h2>직원 로그인</h2>
      <p>운영 관리자는 직원 계정으로만 들어올 수 있습니다.</p>

      <form class="admin-form" data-admin-login novalidate>
        <div class="admin-field">
          <label for="admin-email">이메일</label>
          <input id="admin-email" name="email" type="email" autocomplete="username"
                 inputmode="email" required autocapitalize="off" spellcheck="false" />
        </div>
        <div class="admin-field">
          <label for="admin-password">비밀번호</label>
          <input id="admin-password" name="password" type="password"
                 autocomplete="current-password" required />
        </div>
        <div class="admin-form-error" data-admin-login-error hidden role="alert">
          <span class="admin-status" data-tone="error">로그인 실패</span>
          <span data-admin-login-error-detail></span>
        </div>
        <div class="admin-actions">
          <button class="admin-button" type="submit" data-admin-login-submit>로그인</button>
          <span class="admin-note" data-admin-login-note hidden>확인 중입니다…</span>
        </div>
      </form>

      <!--
        비밀번호가 없는 직원 계정(조직 계정으로 처음 만들어진 경우)을 위한 경로다.
        권한 판정은 어느 경로로 들어와도 같다 — 서버의 직원 membership 하나만 본다.
      -->
      <div class="admin-alt" data-admin-sso hidden>
        <p class="admin-note">비밀번호가 없는 직원 계정은 조직 계정으로 들어올 수 있습니다.</p>
        <div class="admin-actions">
          <button class="admin-button" type="button" data-variant="quiet" data-admin-sso-google>조직 계정으로 로그인</button>
        </div>
      </div>
    </section>

    <section class="admin-panel" data-admin-state="forbidden" hidden>
      <h2><span class="admin-status" data-tone="error">권한 없음</span></h2>
      <p data-admin-forbidden-detail>이 계정에는 운영 관리자 권한이 없습니다.</p>
      <p class="admin-note" data-admin-forbidden-note hidden></p>
      <div class="admin-actions">
        <button class="admin-button" type="button" data-variant="quiet" data-admin-signout>다른 계정으로 로그인</button>
      </div>
    </section>

    <section class="admin-panel" data-admin-state="error" hidden>
      <h2><span class="admin-status" data-tone="warn">조회 실패</span></h2>
      <p data-admin-error-detail>권한을 확인하지 못했습니다. 잠시 후 다시 시도해 주세요.</p>
    </section>

    <section class="admin-panel" data-admin-state="ready" hidden>
      <h2><span class="admin-status" data-tone="ok">접속됨</span></h2>
      <p>관리자 셸이 열렸습니다. 주문·회원 화면은 다음 단계(T08~T10)에서 붙습니다.</p>
      <p data-admin-scope></p>
      <div class="admin-actions">
        <button class="admin-button" type="button" data-variant="quiet" data-admin-signout>로그아웃</button>
      </div>
    </section>
  </main>

  <!--
    공용 인증 스크립트와, 사이트가 이미 쓰고 있는 인증 SDK 를 그대로 쓴다.
    새 CDN 출처를 추가하지 않는다(ADR-0002 D2-5).
  -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/umsh-auth-session.js"></script>
  <script src="/js/umsh-account-pages.js"></script>
  <script>
    (function () {
      var states = {};
      document.querySelectorAll('[data-admin-state]').forEach(function (node) {
        states[node.getAttribute('data-admin-state')] = node;
      });

      function show(name) {
        Object.keys(states).forEach(function (key) { states[key].hidden = key !== name; });
      }

      function setText(selector, value) {
        var node = document.querySelector(selector);
        if (node) node.textContent = value;
      }

      function setHidden(selector, hidden) {
        var node = document.querySelector(selector);
        if (node) node.hidden = hidden;
      }

      // 인증 클라이언트는 한 번만 만든다. 설정값은 런타임에 서버에서 받아오며
      // 이 파일에 인라인하지 않는다.
      var clientPromise = null;
      function authClient() {
        if (clientPromise) return clientPromise;
        clientPromise = (async function () {
          var config = await fetch('/api/auth/config').then(function (response) { return response.json(); });
          if (!config.enabled || !window.supabase || !window.supabase.createClient) return null;
          var helper = window.UMSHAuthSession;
          return (helper && helper.createClient(window.supabase, config.url, config.publishableKey)) ||
            window.supabase.createClient(config.url, config.publishableKey, {
              auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                flowType: 'pkce',
                storage: window.localStorage,
              },
            });
        })();
        return clientPromise;
      }

      async function currentSession() {
        var client = await authClient();
        if (!client) return null;
        var session = (await client.auth.getSession()).data.session || null;
        var helper = window.UMSHAuthSession;
        if (helper && helper.enforceDeviceAuthSession) {
          session = await helper.enforceDeviceAuthSession(session, client);
        }
        return session && session.access_token ? session : null;
      }

      // 권한 판정은 서버만 한다. 화면에서 권한을 추정하지 않는다.
      async function checkAuthority(session) {
        var helper = window.UMSHAccountPages;
        var response;
        try {
          response = await fetch('/api/admin/v1/me', { headers: helper.authHeaders(session) });
        } catch (_error) {
          show('error');
          return;
        }

        if (response.status === 401) { show('anonymous'); return; }
        if (response.status === 403) {
          // 왜 막혔는지 서버가 알려 준 이유를 그대로 보여 준다. "권한 없음" 한 줄로는
          // 직원 권한 원본이 없는 상태와 권한이 회수된 상태를 구분할 수 없다.
          setText('[data-admin-forbidden-detail]', '이 계정에는 운영 관리자 권한이 없습니다.');
          setHidden('[data-admin-forbidden-note]', true);
          try {
            var denied = await response.json();
            if (denied && denied.error) setText('[data-admin-forbidden-detail]', denied.error);
            if (denied && denied.code) {
              setText('[data-admin-forbidden-note]', '코드: ' + denied.code);
              setHidden('[data-admin-forbidden-note]', false);
            }
          } catch (_error) {
            // 본문이 없으면 기본 문구를 남긴다.
          }
          show('forbidden');
          return;
        }
        if (!response.ok) {
          setText('[data-admin-error-detail]', '권한 확인 응답이 ' + response.status + ' 입니다. 잠시 후 다시 시도해 주세요.');
          show('error');
          return;
        }

        var me = await response.json();
        setText('[data-admin-env]', me.environment ? '환경 ' + me.environment : '');
        setText('[data-admin-who]', me.email || '');
        setText('[data-admin-scope]', '권한: ' + (me.role || '') + ' · ' + (me.scopes || []).join(', '));
        var nav = document.querySelector('[data-admin-nav]');
        if (nav) nav.hidden = false;
        show('ready');
      }

      function loginFailureMessage(error) {
        var raw = String((error && error.message) || '');
        // 어떤 계정이 존재하는지 알려 주지 않는다. 실패 사유는 한 문장으로 합친다.
        if (/Invalid login credentials/i.test(raw)) return '이메일 또는 비밀번호가 올바르지 않습니다.';
        if (/Email not confirmed/i.test(raw)) return '계정 이메일 인증이 끝나지 않았습니다. 운영 담당자에게 문의해 주세요.';
        if (/rate|too many/i.test(raw)) return '시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.';
        return '로그인하지 못했습니다. 잠시 후 다시 시도해 주세요.';
      }

      function bindLogin() {
        var form = document.querySelector('[data-admin-login]');
        if (!form) return;
        form.addEventListener('submit', async function (event) {
          event.preventDefault();
          var submit = form.querySelector('[data-admin-login-submit]');
          var email = String(form.elements.email.value || '').trim();
          var password = String(form.elements.password.value || '');

          setHidden('[data-admin-login-error]', true);
          if (!email || !password) {
            setText('[data-admin-login-error-detail]', '이메일과 비밀번호를 모두 입력해 주세요.');
            setHidden('[data-admin-login-error]', false);
            return;
          }

          if (submit) submit.disabled = true;
          setHidden('[data-admin-login-note]', false);
          try {
            var client = await authClient();
            if (!client) throw new Error('auth unavailable');
            var result = await client.auth.signInWithPassword({ email: email, password: password });
            if (result.error) throw result.error;

            // 비밀번호를 폼에 남겨 두지 않는다.
            form.elements.password.value = '';
            var helper = window.UMSHAuthSession;
            if (helper && helper.rememberDeviceAuthSession) helper.rememberDeviceAuthSession(result.data.session);

            show('loading');
            await checkAuthority(result.data.session);
          } catch (error) {
            setText('[data-admin-login-error-detail]', loginFailureMessage(error));
            setHidden('[data-admin-login-error]', false);
          } finally {
            if (submit) submit.disabled = false;
            setHidden('[data-admin-login-note]', true);
          }
        });
      }

      // 조직 계정 경로는 그 provider 가 실제로 켜져 있을 때만 노출한다.
      // 눌러도 안 되는 버튼을 주지 않는다.
      async function bindSingleSignOn() {
        var config = await fetch('/api/auth/config').then(function (response) { return response.json(); });
        if (!config.enabled || !config.providers || !config.providers.google) return;
        setHidden('[data-admin-sso]', false);

        var button = document.querySelector('[data-admin-sso-google]');
        if (!button) return;
        button.addEventListener('click', async function () {
          var client = await authClient();
          if (!client) { show('error'); return; }
          button.disabled = true;
          var result = await client.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/admin' },
          });
          if (result && result.error) {
            button.disabled = false;
            setText('[data-admin-login-error-detail]', '조직 계정 로그인을 시작하지 못했습니다.');
            setHidden('[data-admin-login-error]', false);
          }
        });
      }

      function bindSignOut() {
        document.querySelectorAll('[data-admin-signout]').forEach(function (button) {
          button.addEventListener('click', async function () {
            var client = await authClient();
            if (client && client.auth && client.auth.signOut) {
              await client.auth.signOut({ scope: 'local' }).catch(function () { return undefined; });
            }
            var helper = window.UMSHAuthSession;
            if (helper && helper.clearDeviceAuthSession) helper.clearDeviceAuthSession();
            setText('[data-admin-who]', '');
            setText('[data-admin-env]', '');
            var nav = document.querySelector('[data-admin-nav]');
            if (nav) nav.hidden = true;
            show('anonymous');
          });
        });
      }

      async function start() {
        if (!window.UMSHAccountPages || !window.UMSHAuthSession) { show('error'); return; }
        bindLogin();
        bindSignOut();
        bindSingleSignOn().catch(function () { return undefined; });

        var session = null;
        try {
          session = await currentSession();
        } catch (_error) {
          show('error');
          return;
        }
        if (!session) { show('anonymous'); return; }
        await checkAuthority(session);
      }

      start();
    })();
  </script>
</body>
</html>

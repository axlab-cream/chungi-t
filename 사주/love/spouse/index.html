    <style>
      :root { color-scheme: dark; --bg:#050403; --panel:rgba(20,14,12,.84); --line:rgba(222,188,113,.32); --gold:#e8c76f; --gold-soft:#f2dc9a; --text:#fff7df; --muted:rgba(255,247,223,.7); --danger:#ef4444; --red:#a8261e; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:#000; color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      button,input,select,textarea { font:inherit; } button { cursor:pointer; }
      .stage { width:min(100vw,430px); min-height:100vh; margin:0 auto; background:var(--bg); overflow:hidden; }
      .appbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; height:72px; padding:16px 20px; background:rgba(4,3,2,.9); border-bottom:1px solid rgba(232,199,111,.14); backdrop-filter:blur(12px); }
      .back { width:38px; height:38px; border-radius:50%; border:1px solid rgba(232,199,111,.35); background:rgba(255,255,255,.03); color:var(--text); font-size:22px; }
      .brand { display:grid; justify-items:center; gap:2px; } .brand strong { font-family:Georgia,"Times New Roman",serif; font-size:24px; color:var(--gold-soft); }
      .brand span,.eyebrow,label,.small { font-size:11px; font-weight:800; color:var(--gold); }
      .scroll { height:calc(100vh - 72px); overflow-y:auto; padding:0 20px 32px; }
      .hero { min-height:370px; margin:0 -20px; padding:210px 20px 28px; background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(5,4,3,.88) 78%,var(--bg)),url("/assets/umsh-love-card-bg.webp") center/cover; }
      .hero h1 { margin:8px 0 10px; font-size:32px; line-height:1.15; } .hero p,.panel p,.report-head p { margin:0; color:var(--muted); line-height:1.65; font-size:14px; }
      .panel { margin-top:16px; padding:20px; border:1px solid var(--line); border-radius:18px; background:var(--panel); box-shadow:0 24px 80px rgba(0,0,0,.34); }
      .panel h2 { margin:8px 0 10px; font-size:24px; line-height:1.22; } .field { display:grid; gap:8px; margin-top:14px; } .field-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      input,select,textarea { width:100%; border:1px solid rgba(232,199,111,.42); border-radius:12px; background:rgba(255,255,255,.06); color:var(--text); padding:13px 14px; outline:none; } textarea { min-height:92px; resize:vertical; }
      .is-error { border-color:var(--danger); box-shadow:0 0 0 2px rgba(239,68,68,.18); } .error { min-height:18px; color:#ff9b9b; font-size:12px; line-height:1.5; } .hint { margin-left:4px; color:var(--muted); font-size:12px; font-weight:500; }
      .actions,.pager { display:grid; grid-template-columns:.9fr 1.35fr; gap:10px; margin-top:18px; } .btn { min-height:52px; border-radius:12px; border:1px solid rgba(232,199,111,.35); background:rgba(255,255,255,.06); color:var(--text); font-weight:900; } .btn.primary { border-color:rgba(255,210,142,.32); background:linear-gradient(180deg,#c83b31,var(--red)); } .btn:disabled { opacity:.55; cursor:not-allowed; }
      .toc-grid,.chapter-list { display:grid; gap:10px; } .hidden { display:none !important; } .status { margin-top:12px; padding:12px; border-radius:12px; background:rgba(232,199,111,.09); color:var(--gold-soft); font-size:13px; line-height:1.55; }
      .report-shell { padding-bottom:34px; } .report-head { margin:18px 0 12px; } .report-head h2 { margin:6px 0; font-size:26px; line-height:1.25; }
      .toc-card,.chapter-card { border:1px solid rgba(232,199,111,.24); border-radius:14px; background:rgba(255,255,255,.045); padding:14px; text-align:left; color:var(--text); } .toc-card span { display:block; margin-bottom:4px; color:var(--gold); font-size:12px; font-weight:900; } .chapter-list { margin-top:14px; }
      .chapter-card { display:grid; grid-template-columns:44px 1fr; gap:12px; align-items:center; } .chapter-card b { width:38px; height:38px; display:grid; place-items:center; border-radius:50%; background:rgba(232,199,111,.15); color:var(--gold-soft); } .toc-card.is-active,.chapter-card.is-active { border-color:var(--gold); background:rgba(166,38,30,.38); }
      .reading { margin-top:16px; } .reading img { display:block; width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:14px; border:1px solid rgba(232,199,111,.24); } .reading h3 { margin:18px 0 10px; font-size:22px; line-height:1.25; } .reading-hook { margin:0 0 12px; color:#e8c76f; font-size:14px; line-height:1.5; } .reading pre { white-space:pre-wrap; margin:0; color:rgba(255,247,223,.86); font:inherit; line-height:1.72; }
    
      .chapter-card.is-pending strong::after { content:" · 준비중"; color:rgba(232,199,111,.72); font-size:12px; font-weight:700; }
      .chapter-card.is-generating strong::after { content:" · 작성중"; color:#f2dc9a; font-size:12px; font-weight:700; }
      .chapter-card.is-ready strong::after { content:""; }
      .umsh-section-skeleton { margin-top:14px; padding:18px; border-radius:14px; border:1px dashed rgba(232,199,111,.35); background:rgba(255,255,255,.04); }
      .umsh-section-skeleton strong { display:block; margin-bottom:8px; color:#f2dc9a; }
      .umsh-section-skeleton p { margin:0 0 14px; color:rgba(255,247,223,.72); line-height:1.6; font-size:14px; }
      .interpret-progress { height:4px; border-radius:999px; overflow:hidden; background:rgba(232,199,111,.16); }
      .interpret-progress::before { content:""; display:block; width:40%; height:100%; background:linear-gradient(90deg,#e8c76f,#a8261e); animation:progress-scan 1.65s ease-in-out infinite; }
      @keyframes progress-scan { 0% { transform:translateX(-120%); } 100% { transform:translateX(280%); } }

  <body>
    <main class="stage" data-umsh-chrome data-service="배우자운" data-price="14,900원">
      <header class="appbar"><button class="back" type="button" data-back aria-label="뒤로">‹</button><div class="brand"><strong>운명상회</strong><span>배우자운</span></div><span class="small">14,900원</span></header>
      <div class="scroll">
        <section class="hero"><span class="eyebrow">LOVE · 배우자운</span><h1>내가 결혼하게 될 사람</h1><p>배우자궁과 배우자성, 자미두수 자료 관점을 겹쳐서 오래 함께할 인연의 기준을 살펴봅니다.</p></section>
        <div class="public-detail" data-public-detail data-service-public-detail></div>

        <section class="panel" data-screen="auth"><span class="eyebrow">UMSH · 운명상회</span><h2>공통 로그인으로 연결 중</h2><p>운명상회 로그인 페이지에서 인증한 뒤 배우자운 풀이를 이어갑니다.</p><div class="status hidden" data-auth-status></div></section>
        <section class="panel hidden" data-screen="profile"><span class="eyebrow">PROFILE</span><h2>사주 프로필 등록</h2><p>배우자궁과 배우자성을 보려면 먼저 본인의 기본 사주 정보가 필요합니다.</p><form data-profile-form><div class="field"><label for="name">이름</label><input id="name" name="name" autocomplete="name" placeholder="홍길동" /><div class="error" data-error-for="name"></div></div><div class="field-row"><div class="field"><label for="gender">성별</label><select id="gender" name="gender"><option value="male">남자</option><option value="female">여자</option></select></div><div class="field"><label for="calendar">달력</label><select id="calendar" name="calendar"><option value="solar">양력</option><option value="lunar">음력</option></select></div></div><div class="field"><label for="birth">생년월일</label><input id="birth" name="birth" inputmode="numeric" maxlength="8" placeholder="YYYYMMDD" /><div class="error" data-error-for="birth"></div></div><div class="actions"><button class="btn" type="button" data-logout>로그아웃</button><button class="btn primary" type="submit">등록하기</button></div></form></section>
        <section class="panel hidden" data-screen="form"><span class="eyebrow">LOVE · SPOUSE</span><h2>어떤 인연을 기다리고 있나요?</h2><p data-profile-summary></p><form data-spouse-form>
          <div class="field"><label for="relationshipStatus">현재 관계 상태</label><select id="relationshipStatus" name="relationshipStatus"><option value="싱글이에요">싱글이에요</option><option value="연애 중이에요">연애 중이에요</option><option value="결혼을 고민 중이에요">결혼을 고민 중이에요</option><option value="이별 후 새 인연을 기다려요">이별 후 새 인연을 기다려요</option></select></div>
          <div class="field"><label for="marriagePriority">결혼에서 가장 중요한 기준</label><select id="marriagePriority" name="marriagePriority"><option value="성격과 정서적 안정">성격과 정서적 안정</option><option value="생활과 책임감">생활과 책임감</option><option value="경제 감각과 현실성">경제 감각과 현실성</option><option value="대화와 갈등 회복">대화와 갈등 회복</option><option value="가족과 미래 계획">가족과 미래 계획</option></select></div>
          <div class="field"><label for="meetingRoute">인연을 만나는 경로</label><select id="meetingRoute" name="meetingRoute"><option value="일과 프로젝트">일과 프로젝트</option><option value="소개와 지인 모임">소개와 지인 모임</option><option value="공부와 취미">공부와 취미</option><option value="온라인과 새로운 커뮤니티">온라인과 새로운 커뮤니티</option><option value="아직 잘 모르겠어요">아직 잘 모르겠어요</option></select></div>
          <div class="field"><label for="concern">지금 제일 걸리는 점 <span class="hint">선택</span></label><textarea id="concern" name="concern" maxlength="160" placeholder="예: 좋은 사람을 만나도 결혼으로 이어질지 모르겠어요."></textarea></div>
          <div class="actions"><button class="btn" type="button" data-reset-form>초기화</button><button class="btn primary" type="submit">배우자운 확인하기</button></div>
        </form></section>
        <section class="report-shell hidden" data-screen="report"><div class="report-head"><span class="eyebrow">LOVE · SPOUSE REPORT</span><h2 data-report-title>배우자운 해석문</h2><p data-report-subtitle></p></div><div class="toc-grid" data-category-list></div><div class="chapter-list" data-chapter-list></div><article class="panel reading" data-reading></article></section>
      </div>
    </main>
    <script src="/js/umsh-chrome.js"></script>
    <script src="/js/umsh-auth-session.js"></script>
    <script src="/js/umsh-loading.js"></script>
    <script src="/js/umsh-progressive-report.js"></script>
    <script src="/js/service-step-url.js"></script>
    <script src="/js/service-public-detail.js"></script>
    <script>
      const $ = (selector, root = document) => root.querySelector(selector);
      const state = { supabase:null, session:null, authConfig:null, profile:null, report:null, category:'', sectionId:'', paidResumeStarted:false };
      const screens = { auth:$('[data-screen="auth"]'), profile:$('[data-screen="profile"]'), form:$('[data-screen="form"]'), report:$('[data-screen="report"]') };
      function showScreen(name) { $('[data-public-detail]')?.classList.add('hidden'); window.UMSHServiceSteps?.markByScreen(name); Object.entries(screens).forEach(([key,node]) => node.classList.toggle('hidden', key !== name)); }
      function showPublicDetail() {
        window.UMSHServiceDetail?.render();
        $('[data-public-detail]')?.classList.remove('hidden'); window.UMSHServiceSteps?.markStory();
        Object.values(screens).forEach((node) => node?.classList.add('hidden'));
      }

      async function ensureSessionAndContinue() {
        window.UMSHServiceSteps?.markAuth();
        await initAuth().catch((error) => {
          setStatus(error.message);
        });
        if (!state.session) openCommonLogin();
      }
      function setLoading(on, copy) {
        if (on) {
          window.UMSHLoading.show(copy || { title: '배우자궁과 인연의 결을 정리하고 있습니다', subtitle: '잠시만 기다려 주세요.' });
        } else {
          window.UMSHLoading.hide();
        }
      }
      function setStatus(message) { const node = $('[data-auth-status]'); node.textContent = message || ''; node.classList.toggle('hidden', !message); }
      function authHeaders() { return state.session?.access_token ? { Authorization:`Bearer ${state.session.access_token}` } : {}; }
      function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char]); }
      function openCommonLogin() { const returnTo = window.UMSHCommonAuth?.currentPageReturnTo() || `${location.pathname}${location.search}${location.hash}`; const url = window.UMSHCommonAuth?.commonLoginUrl('love-spouse', returnTo) || `/signup?entry=love-spouse&returnTo=${encodeURIComponent(returnTo)}#login`; location.replace(url); }
      async function api(path, options = {}) { const response = await fetch(path, { ...options, headers:{ 'Content-Type':'application/json', ...authHeaders(), ...(options.headers || {}) } }); const payload = await response.json().catch(() => ({})); if (!response.ok) { const error = new Error(payload.error || '요청을 처리하지 못했습니다.'); error.code = payload.code; error.paymentUrl = payload.paymentUrl; throw error; } return payload; }
      async function initAuth() { state.authConfig = await fetch('/api/auth/config').then((res) => res.json()); if (!state.authConfig.enabled || !window.supabase || !window.UMSHAuthSession) { showScreen('profile'); return; } state.supabase = window.UMSHAuthSession.createClient(window.supabase, state.authConfig.url, state.authConfig.publishableKey); const { data } = await state.supabase.auth.getSession(); state.session = await window.UMSHAuthSession.enforceDeviceAuthSession(data.session, state.supabase); state.supabase.auth.onAuthStateChange((_event,session) => { window.UMSHAuthSession.enforceDeviceAuthSession(session, state.supabase).then((nextSession) => { state.session = nextSession; routeAfterAuth(); }).catch(() => { state.session = session || null; routeAfterAuth(); }); }); routeAfterAuth(); }
      async function routeAfterAuth() { if (!state.session) { showScreen('profile'); return; } setLoading(true); try { const payload = await api('/api/user/profile'); state.profile = payload.profile; if (payload.complete || window.UMSHAuthSession?.isSharedProfileComplete(payload.profile)) { $('[data-profile-summary]').textContent = `${state.profile.name}님의 배우자궁과 결혼 인연의 흐름을 함께 봅니다.`; showScreen('form'); resumePaidRequest(); } else showScreen('profile'); } catch (_error) { showScreen('profile'); } finally { setLoading(false); } }
      function validBirthText(value) { if (!/^\d{8}$/.test(value)) return false; const year=Number(value.slice(0,4)); const month=Number(value.slice(4,6)); const day=Number(value.slice(6,8)); const date=new Date(year,month-1,day); return year>=1900 && year<=new Date().getFullYear() && date.getFullYear()===year && date.getMonth()===month-1 && date.getDate()===day; }
      function validateProfile(form) { const errors={}; if (!/^[가-힣]{2,5}$/.test(form.name.value.trim())) errors.name='이름은 한글 2자 이상 5자 이하로 입력해 주세요.'; if (!validBirthText(form.birth.value.trim())) errors.birth='존재하는 날짜와 정상 연도를 입력해 주세요.'; ['name','birth'].forEach((key) => { const input=$(`[name="${key}"]`,form); const error=$(`[data-error-for="${key}"]`); input.classList.toggle('is-error',Boolean(errors[key])); error.textContent=errors[key] || ''; }); return Object.keys(errors).length===0; }
      async function saveProfile(event) { event.preventDefault(); const form=event.currentTarget; if (!validateProfile(form)) return; await initAuth().catch(() => undefined); if (!state.session) { openCommonLogin(); return; } const birthText=form.birth.value.trim(); setLoading(true); try { const payload=await api('/api/user/profile',{ method:'POST', body:JSON.stringify({ name:form.name.value.trim(), birthTimeKnown:false, birth:{ year:Number(birthText.slice(0,4)), month:Number(birthText.slice(4,6)), day:Number(birthText.slice(6,8)), hour:12, minute:0, gender:form.gender.value, calendar:form.calendar.value } }) }); state.profile=payload.profile; $('[data-profile-summary]').textContent=`${state.profile.name}님의 배우자궁과 결혼 인연의 흐름을 함께 봅니다.`; showScreen('form'); } catch (error) { setStatus(error.message); } finally { setLoading(false); } }
      
      async function openProgressiveReport(payload) {
        const apply = (next) => {
          if (!next || !next.report) return;
          state.report = next.report;
          state.publicId = next.publicId || next.report.publicId || state.publicId || '';
          const sections = state.report.sections || [];
          if (!sections.length) return;
          const still = sections.find((section) => section.id === state.sectionId);
          if (!still) {
            state.category = sections[0].category;
            state.sectionId = sections[0].id;
          } else {
            state.category = still.category;
          }
          renderReport();
          showScreen('report');
        };
        setLoading(false);
        await window.UMSHProgressiveReport.followProgress({
          payload,
          fetchReport: (reportId) => api('/api/report/' + encodeURIComponent(reportId)),
          onUpdate: apply,
        });
      }

      async function generateReport(event) { event.preventDefault(); const form=event.currentTarget; await initAuth().catch(() => undefined); if (!state.session) { openCommonLogin(); return; } const requestBody={ relationshipStatus:form.relationshipStatus.value, marriagePriority:form.marriagePriority.value, meetingRoute:form.meetingRoute.value, concern:form.concern.value.trim() }; setLoading(true); try { const payload=await api('/api/love/spouse/analyze',{ method:'POST', body:JSON.stringify(requestBody) }); await openProgressiveReport(payload); } catch (error) { if (error.code==='PROFILE_REQUIRED') showScreen('profile'); if (error.code==='PAYMENT_REQUIRED') { window.UMSHPaymentBridge?.save('love_spouse', requestBody, location.pathname); location.assign(error.paymentUrl || `/payment?product=love_spouse&returnTo=${encodeURIComponent(location.pathname)}`); return; } setStatus(error.message); } finally { setLoading(false); } }
      async function resumePaidRequest() { if (state.paidResumeStarted || new URLSearchParams(location.search).get('paid') !== '1') return; const orderId=new URLSearchParams(location.search).get('orderId'); const pending=window.UMSHPaymentBridge?.load('love_spouse'); if (!orderId || !pending) return; state.paidResumeStarted=true; setLoading(true); try { const payload=await api('/api/love/spouse/analyze',{ method:'POST', body:JSON.stringify({ ...pending.payload, orderId }) }); await openProgressiveReport(payload); window.UMSHPaymentBridge?.clear(); await api(`/api/payment/orders/${encodeURIComponent(orderId)}/viewed`,{ method:'POST' }).catch(()=>{}); history.replaceState(null,'',location.pathname); } catch (error) { setStatus(error.message); } finally { setLoading(false); } }
      function sectionsByCategory(category) { return state.report.sections.filter((section) => section.category===category); }
      function renderReport() { $('[data-report-title]').textContent=state.report.title; $('[data-report-subtitle]').textContent=state.report.subtitle; const categories=Array.from(new Map(state.report.sections.map((section) => [section.category,section.categoryEn])).entries()); $('[data-category-list]').innerHTML=categories.map(([category,categoryEn])=>`<button class="toc-card ${category===state.category?'is-active':''}" type="button" data-category="${escapeHtml(category)}"><span>${escapeHtml(categoryEn)}</span><strong>${escapeHtml(category)}</strong></button>`).join(''); renderChapters(); renderReading(); }
      function renderChapters() { $('[data-chapter-list]').innerHTML=sectionsByCategory(state.category).map((section,index)=>`<button class="chapter-card ${section.id===state.sectionId?'is-active':''} ${window.UMSHProgressiveReport.chapterStatusClass(section)}" type="button" data-section-id="${escapeHtml(section.id)}"><b>${String(index+1).padStart(2,'0')}</b><strong>${escapeHtml(section.classification)}</strong></button>`).join(''); }
      function renderReading() { const section=state.report.sections.find((item)=>item.id===state.sectionId) || state.report.sections[0]; const index=state.report.sections.findIndex((item)=>item.id===section.id); const body=window.UMSHProgressiveReport.sectionReady(section)?`<p class="reading-hook">${escapeHtml(section.hook)}</p><pre>${escapeHtml(section.interpretation)}</pre>`:window.UMSHProgressiveReport.readingPlaceholder(section); $('[data-reading]').innerHTML=`<img src="${escapeHtml(section.imageSrc)}" alt="${escapeHtml(section.imageAlt)}" /><span class="eyebrow">${escapeHtml(section.categoryEn)} · ${index+1}/${state.report.sections.length}</span><h3>${escapeHtml(section.classification)}</h3>${body}<div class="pager"><button class="btn" type="button" data-prev ${index<=0?'disabled':''}>이전</button><button class="btn primary" type="button" data-next ${index>=state.report.sections.length-1?'disabled':''}>다음</button></div>`; }
      function moveSection(delta) { const index=state.report.sections.findIndex((section)=>section.id===state.sectionId); const next=state.report.sections[index+delta]; if (!next) return; state.category=next.category; state.sectionId=next.id; renderReport(); }
      document.addEventListener('click', async (event) => { const category=event.target.closest('[data-category]'); if (category && state.report) { state.category=category.dataset.category; state.sectionId=sectionsByCategory(state.category)[0].id; renderReport(); } const sectionButton=event.target.closest('[data-section-id]'); if (sectionButton) { state.sectionId=sectionButton.dataset.sectionId; renderChapters(); renderReading(); } if (event.target.closest('[data-prev]')) moveSection(-1); if (event.target.closest('[data-next]')) moveSection(1);
        if (event.target.closest('[data-start-report]')) { event.preventDefault(); await ensureSessionAndContinue(); } if (event.target.closest('[data-back]')) history.length>1 ? history.back() : location.assign('/'); if (event.target.closest('[data-logout]') && state.supabase) { await state.supabase.auth.signOut(); state.session=null; openCommonLogin(); } if (event.target.closest('[data-reset-form]')) $('[data-spouse-form]').reset(); });
      $('[data-profile-form]').addEventListener('submit',saveProfile); $('[data-spouse-form]').addEventListener('submit',generateReport); showPublicDetail(); if (window.UMSHServiceSteps?.isAuthStep()) ensureSessionAndContinue();
    </script>
  </body>
</html>

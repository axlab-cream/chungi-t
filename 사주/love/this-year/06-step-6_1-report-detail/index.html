    <style>

      --bg: #09090d;
      --panel: #11131a;
      --panel-2: #171923;
      --panel-3: #202433;
      --ink: #fff7f2;
      --soft: #e3d9ea;
      --muted: #aca6b8;
      --line: rgba(255, 255, 255, 0.14);
      --pink: #ff8fb7;
      --cyan: #8eddf0;
      --gold: #f4c96b;

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;

    body {

    button,

    .phone {

    .topbar {

    .brand strong {

      gap: 8px;

    .quick-link,
    .send-btn,

      background: rgba(255, 255, 255, 0.06);
    }

    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }

    .icon-button:focus-visible,
    .nav-button:focus-visible,
    .quick-link:focus-visible,
    .send-btn:focus-visible,
    .pdf-button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .contextbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(17, 19, 26, 0.96);
    }

    /* 공용 크롬이 상단과 하단을 맡는다. 저장 해석의 도구는 본문 끝 공통 영역에서만 제공한다. */

    .context-chip {
      min-width: 0;
      align-self: center;
      margin: 0;
      color: var(--soft);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pdf-button {
      height: 32px;
      padding: 0 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
    }

    .scroll-area {
      min-height: 0;
      overflow: auto;
      scroll-behavior: smooth;
      padding: 14px 14px 24px;
    }

      min-height: 520px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: #10131b;
    }

    .hero img {
      width: 100%;
      height: 100%;
      min-height: 520px;
      display: block;
      object-fit: cover;
      object-position: center 42%;
      transform: scale(1.01);

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:

    .hero-copy {

      right: 0;

    .eyebrow {
      width: fit-content;
      max-width: 100%;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(9, 9, 13, 0.54);
      color: var(--gold);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.13;
      letter-spacing: 0;
      word-break: keep-all;

    .lead {

      color: var(--soft);
      font-size: 14px;
      font-weight: 650;
      line-height: 1.58;
      word-break: keep-all;
    }

    .flow-strip {

    .flow-item {
      min-width: 0;
      display: grid;
      gap: 4px;
      padding: 10px 8px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
    }

    .flow-item span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
    }

    .flow-item strong {
      color: var(--ink);
      font-size: 12px;
      line-height: 1.25;
    }

    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }

    .nav-button {
      min-width: 0;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;

    .state-panel,
    .detail-card,
    .source-panel,
    .related-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 19, 26, 0.92);
    }

    .state-panel {
      display: none;
      gap: 12px;
      padding: 22px;
      min-height: 260px;
      align-content: center;
      text-align: center;
    }

    .state-panel.is-visible {
      display: grid;
    }

    .state-panel h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }

    .state-panel p {
      margin: 0;
      color: var(--soft);
      font-size: 14px;
      line-height: 1.6;
    }

    .detail-stack {
      display: grid;
      gap: 10px;
    }

    /* 2026-09-18: 결제 흐름에서는 이 그리드가 채워지지 않아 내부 라벨만 62px 떠 있었다.
       비어 있으면 패널째 감춘다. 옛 경로가 채우면 그때만 보인다. */
    .source-panel:has(#source-grid:empty) {
      display: none;
    }

    .source-panel {
      display: grid;
      gap: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .source-grid {
      display: grid;
      gap: 8px;
    }

    .source-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
    }

    .source-row span {
      color: var(--gold);
      font-size: 11px;
      font-weight: 950;
    }

    .source-row p {
      margin: 0;
      color: var(--soft);
      font-size: 12px;
      line-height: 1.45;
    }

    .detail-card {
      display: grid;
      gap: 10px;
      padding: 15px;
    }

    .detail-card h2,
    .source-panel h2,
    .related-panel h2 {
      margin: 0;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .detail-card p {
      margin: 0;
      color: var(--soft);
      font-size: 14px;
      line-height: 1.62;
      word-break: keep-all;
    }

    .tagline {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 2px;
    }

    .tagline span {
      padding: 6px 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      font-size: 11px;
      font-weight: 850;
    }

    .action-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .action-list li {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      padding: 10px;
      border-radius: 8px;
      background: rgba(142, 221, 240, 0.08);
      color: var(--soft);
      font-size: 13px;
      line-height: 1.45;
    }

    .action-list b {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(142, 221, 240, 0.18);
      color: var(--cyan);
      font-size: 12px;
    }

    .talk-guide {
      display: grid;
      gap: 8px;
    }

    .talk-row {
      display: grid;
      gap: 5px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
    }

    .talk-row strong {
      color: var(--gold);
      font-size: 12px;
    }

    .talk-row p {
      color: var(--soft);
      font-size: 13px;
    }

    .related-panel {
      display: grid;
      gap: 10px;
      padding: 14px;
      margin-top: 10px;
    }

    .related-list {
      display: grid;
      gap: 8px;
    }

    .quick-link {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 46px;
      padding: 10px 12px;
      border-radius: 8px;
      text-decoration: none;
    }

    .quick-link span {
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .quick-link strong {
      min-width: 0;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.3;
      word-break: keep-all;
    }

    .quick-link i {
      color: var(--cyan);
      font-style: normal;
      font-weight: 950;
    }

    .chat-input {
      z-index: 4;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 10px 12px 12px;
      border-top: 1px solid var(--line);
      background: rgba(9, 9, 13, 0.96);
    }

    textarea {
      width: 100%;
      min-height: 44px;
      max-height: 112px;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      background: #11131a;
      color: var(--ink);
      outline: 0;
      line-height: 1.35;
    }

    textarea::placeholder {
      color: #8e8998;
    }

    .send-btn {
      width: 58px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(255, 143, 183, 0.94), rgba(142, 221, 240, 0.88));
      color: #11131a;
      font-size: 13px;
      font-weight: 950;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 78px;
      z-index: 20;
      width: min(calc(100% - 32px), 420px);
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 19, 26, 0.96);
      color: var(--soft);
      font-size: 13px;
      line-height: 1.45;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.34);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    [hidden] {
      display: none !important;
    }

    @media (min-width: 900px) {
      body {
        place-items: center;
        padding: 24px;
      }

      .phone {
        height: min(920px, calc(100svh - 48px));
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
        overflow: hidden;
      }
    }

    @media (max-width: 380px) {
      h1 {
        font-size: 24px;
      }

      .hero,
      .hero img {
        min-height: 470px;
      }

      .flow-strip {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero img {
        animation: slow-drift 14s ease-in-out infinite alternate;
      }

      @keyframes slow-drift {
        from { transform: scale(1.01) translateY(0); }
        to { transform: scale(1.045) translateY(-10px); }
      }
    }
  
      /* Shared UMSH chrome: keep the fixed bottom nav clear of the page's own CTA.
         The shell publishes its measured height, but that measurement can land before
         layout settles, so the floor keeps the reserve honest either way. */
      body.umsh-has-chrome { padding-bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      /* .phone is overflow:hidden, which makes it a scroll container the page never
         scrolls, so the design's own sticky CTA never pinned. overflow:clip keeps the
         same clipping without the scrollport, and the CTA sticks to the viewport again. */
      body.umsh-has-chrome .phone { overflow: clip; }
      body.umsh-has-chrome .sticky-actions { bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      body.umsh-has-chrome .sticky-cta { bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      body.umsh-has-chrome .toast { bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px) + 12px); }
      /* 05 목차의 검색·필터 줄은 sticky로 목록 위에 겹쳐 떠 있었다. 상단 GNB가 이미
         고정이라 두 겹이 되고 뒤 카드가 가려져서, 목록과 같이 흐르게 둔다. */
      body.umsh-has-chrome .toolbar { position: static; backdrop-filter: none; }
      /* The saved 사주 profile the account already holds, shown instead of re-asking. */
      .thisyear-saved-profile { display: grid; gap: 6px; border: 1px solid rgba(255, 168, 200, 0.4); border-radius: 10px; background: rgba(255, 168, 200, 0.08); padding: 14px; margin-bottom: 14px; }
      .thisyear-saved-profile b { color: #ffd7e6; font-size: 14px; }
      .thisyear-saved-profile span { color: rgba(255, 240, 246, 0.78); font-size: 13px; line-height: 1.55; }
      .thisyear-saved-profile button { justify-self: start; margin-top: 4px; min-height: 38px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; background: rgba(255, 255, 255, 0.06); color: inherit; padding: 0 12px; font: inherit; font-weight: 800; cursor: pointer; }
</style>

  <script>
    const DETAIL_ROUTE = "index.html";
    const LIST_ROUTE = "../05-step-5-chat/chat.html";
    const DETAILS = JSON.parse(document.getElementById("DETAIL_DATA").textContent);
    const CALCULATED_FACTS = JSON.parse(document.getElementById("CALCULATED_FACTS").textContent);
    const params = new URLSearchParams(window.location.search);
    const isLocalPreview = window.location.protocol === "file:";

    const els = {
      chip: document.getElementById("context-chip"),
      state: document.getElementById("state-panel"),
      content: document.getElementById("detail-content"),
      groupTitle: document.getElementById("group-title"),
      title: document.getElementById("detail-title"),
      conclusion: document.getElementById("detail-conclusion"),
      hero: document.getElementById("hero-image"),
      sourceGrid: document.getElementById("source-grid"),
      stack: document.getElementById("detail-stack"),
      toast: document.getElementById("toast"),
      scroll: document.getElementById("scroll-area"),
    };

    function currentSectionId() {
      return params.get("section") || DETAILS[0].section_id;
    }

    function getAccessMode() {
      if (params.get("payment") === "processing") return "processing";
      if (params.get("entitlement") === "denied" || params.get("access") === "locked") return "locked";
      if (params.get("report") === "missing") return "missing";
      if (!isLocalPreview && !params.get("report_id")) return "missing";
      return "ready";
    }

    function withRoute(sectionId) {
      const nextParams = new URLSearchParams(params);
      nextParams.set("section", sectionId);
      return DETAIL_ROUTE + "?" + nextParams.toString() + "#step-6_1-report";
    }

    function listRoute() {
      const nextParams = new URLSearchParams(params);
      nextParams.delete("section");
      const query = nextParams.toString();
      return LIST_ROUTE + (query ? "?" + query : "") + "#step-5-chat";
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("is-visible");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("is-visible"), 2200);
    }

    function showState(title, message, actionLabel, action) {
      els.content.hidden = true;
      els.state.classList.add("is-visible");
      els.state.innerHTML = "";
      const h = document.createElement("h2");
      h.textContent = title;
      const p = document.createElement("p");
      p.textContent = message;
      const button = document.createElement("button");
      button.className = "nav-button";
      button.type = "button";
      button.textContent = actionLabel;
      button.addEventListener("click", action);
      els.state.append(h, p, button);
    }

    function renderSources(detail) {
      const rows = [
        ...CALCULATED_FACTS.confirmed_facts.map((fact) => ({
          label: fact.label,
          text: fact.value,
        })),
        {
          label: CALCULATED_FACTS.personalization_note ? "개인 계산 기준" : "개인화 대기",
          text: CALCULATED_FACTS.personalization_note || "생년월일시, 애인성 기준, 현재 상태, 올해 세운 십성, 대운 십성, 월운이 연결되면 세부 조건이 채워집니다.",
        },
        ...detail.evidence
          .filter((entry) => entry.kind === "rag")
          .slice(0, 3)
          .map((entry) => ({
            label: entry.label,
            text: entry.value,
          })),
      ];
      els.sourceGrid.innerHTML = "";
      rows.forEach((row) => {
        const item = document.createElement("div");
        item.className = "source-row";
        const label = document.createElement("span");
        label.textContent = row.label;
        const text = document.createElement("p");
        text.textContent = row.text;
        item.append(label, text);
        els.sourceGrid.append(item);
      });
    }

    function renderBlock(block) {
      const card = document.createElement("article");
      card.className = "detail-card";
      const title = document.createElement("h2");
      title.textContent = block.title;
      card.append(title);

      if (block.type === "action") {
        const p = document.createElement("p");
        p.textContent = block.content;
        const list = document.createElement("ol");
        list.className = "action-list";
        (block.data.actions || []).forEach((action, index) => {
          const li = document.createElement("li");
          const b = document.createElement("b");
          b.textContent = String(index + 1);
          const span = document.createElement("span");
          span.textContent = action;
          li.append(b, span);
          list.append(li);
        });
        card.append(p, list);
      } else {
        const p = document.createElement("p");
        p.textContent = block.content;
        card.append(p);
      }
      return card;
    }

    function renderDetail() {
      const mode = getAccessMode();
      if (mode === "processing") {
        showState("리포트 생성 중", "결제는 이어졌고 상세 결과를 정리하는 중입니다. 잠시 뒤 다시 확인할 수 있습니다.", "목록으로", () => (window.location.href = listRoute()));
        return;
      }
      if (mode === "locked") {
        showState("상세 열람이 필요합니다", "이 상세 풀이는 구매한 리포트에서만 열립니다. 이전 화면에서 열람 상태를 다시 확인해 주세요.", "이전 화면으로", () => (window.location.href = "../04-step-4-report/index.html#step-4-report"));
        return;
      }
      if (mode === "missing") {
        showState("리포트를 찾을 수 없습니다", "결과 식별값이 없거나 만료되었습니다. 목록에서 다시 들어오면 상태를 복원할 수 있습니다.", "목록으로", () => (window.location.href = listRoute()));
        return;
      }

      let detail = DETAILS.find((entry) => entry.section_id === currentSectionId());
      if (!detail) {
        detail = DETAILS[0];
        showToast("없는 항목이라 첫 번째 상세로 이동했어요.");
        window.history.replaceState(null, "", withRoute(detail.section_id));
      }

      const currentIndex = DETAILS.findIndex((entry) => entry.section_id === detail.section_id);
      els.state.classList.remove("is-visible");
      els.content.hidden = false;
      els.chip.textContent = detail.group_title + " · " + (currentIndex + 1) + "/" + DETAILS.length;
      els.groupTitle.textContent = detail.group_title;
      els.title.textContent = detail.title;
      els.conclusion.textContent = detail.conclusion;
      els.hero.src = "../assets/thisyear/report-sections/00-year-love-report-hero-v1.png";
      els.hero.alt = "창가에서 휴대폰을 보며 올해의 만남을 생각하는 여성";
      renderSources(detail);
      els.stack.innerHTML = "";
      detail.interpretation_blocks.forEach((block) => els.stack.append(renderBlock(block)));
      els.scroll.scrollTop = 0;
    }

    document.getElementById("btn-back").addEventListener("click", () => {
      if (window.history.length > 1 && document.referrer) {
        window.history.back();
        return;
      }
      window.location.href = listRoute();
    });

    document.getElementById("btn-vault").addEventListener("click", () => {
      showToast("보관함 연결은 운영 환경에서 열립니다.");
    });

    document.getElementById("btn-pdf").addEventListener("click", () => {
      if (window.UMSHReportPdf && window.UMSHReportPdf.openFromStorage()) return;
      window.print();
    });

    window.addEventListener("popstate", renderDetail);
    renderDetail();
  </script>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>내 애인 바람필까? | 상세 리포트</title>
  <meta name="description" content="명리궁합, 오행, 일지 흐름으로 관계 온도와 확인 대화 타이밍을 보는 상세 리포트입니다." />

  <style>
    :root {
      color-scheme: dark;
      --bg: #040202;
      --panel: rgba(255, 250, 242, 0.06);
      --panel-strong: rgba(120, 18, 16, 0.42);
      --ink: #fff8ef;
      --muted: rgba(255, 232, 205, 0.72);
      --soft: rgba(255, 232, 205, 0.56);
      --gold: #f1bf6d;
      --red: #c93a2f;
      --deep-red: #6e1411;
      --green: #93cfa8;
      --line: rgba(255, 226, 183, 0.18);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(154, 24, 20, 0.28), transparent 42%),
        linear-gradient(180deg, #0b0404, #040202 46%, #000);
      color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      letter-spacing: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: start center;
    }

    button,
    input {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.42;
    }

    .phone {
      width: min(100vw, 448px);
      min-height: 100svh;
      background: var(--bg);
      box-shadow: var(--shadow);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 2, 2, 0.94);
      backdrop-filter: blur(16px);
    }

    .brand {
      min-width: 0;
      display: grid;
      gap: 3px;
      text-decoration: none;
      color: var(--ink);
    }

    .brand span {
      color: var(--gold);
      font-size: 12px;
      font-weight: 950;
    }

    .brand strong {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      line-height: 1.25;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .icon-btn,
    .pill-btn {
      min-height: 36px;
      border: 1px solid rgba(255, 226, 183, 0.24);
      background: rgba(255, 255, 255, 0.055);
      color: var(--ink);
    }

    .icon-btn {
      width: 36px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 50%;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
    }

    .primary-btn {
      border-color: rgba(255, 226, 183, 0.42);
      background: linear-gradient(180deg, var(--red), var(--deep-red));
      color: #fffaf2;
    }

    .contextbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255, 226, 183, 0.1);
      background: #070303;
    }

    .contextbar span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .offline {
      display: none;
      margin: 12px 16px 0;
      padding: 12px 14px;
      border: 1px solid rgba(255, 196, 118, 0.3);
      border-radius: 8px;
      background: rgba(132, 78, 14, 0.24);
      color: #ffe4b8;
      font-size: 13px;
      font-weight: 850;
      line-height: 1.5;
    }

    .offline.is-visible { display: block; }

    #detail-root {
      display: grid;
      gap: 14px;
      padding: 14px 16px 96px;
    }

    .hero {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 0%, rgba(201, 58, 47, 0.2), transparent 44%),
        rgba(255, 255, 255, 0.04);
    }

    .hero-visual {
      position: relative;
      min-height: 360px;
      overflow: hidden;
      background: #0a0505;
    }

    .hero-visual img {
      display: block;
      width: 100%;
      height: 420px;
      object-fit: cover;
      object-position: 50% 22%;
      opacity: 0.94;
    }

    .hero-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0.08) 44%, #040202 96%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.42), transparent 40%, rgba(0, 0, 0, 0.36));
    }

    .hero-copy {
      display: grid;
      gap: 10px;
      padding: 16px;
    }

    .kicker,
    .block-kicker {
      width: fit-content;
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(241, 191, 109, 0.13);
      color: var(--gold);
      font-size: 12px;
      font-weight: 950;
      line-height: 1;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      color: var(--ink);
      font-size: 28px;
      line-height: 1.2;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .hero-copy p {
      color: var(--muted);
      font-size: 15px;
      font-weight: 760;
      line-height: 1.65;
      word-break: keep-all;
    }

    .status-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .status-line span {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border: 1px solid rgba(255, 226, 183, 0.16);
      border-radius: 999px;
      color: rgba(255, 239, 215, 0.82);
      background: rgba(255, 255, 255, 0.045);
      font-size: 12px;
      font-weight: 900;
    }

    .section-card,
    .state-card,
    .related-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        radial-gradient(circle at 0% 0%, rgba(201, 58, 47, 0.13), transparent 34%),
        rgba(255, 255, 255, 0.045);
    }

    .section-card {
      display: grid;
      gap: 14px;
      padding: 16px;
    }

    .section-card h2 {
      margin-top: 8px;
      color: var(--ink);
      font-size: 22px;
      line-height: 1.25;
      word-break: keep-all;
    }

    .section-card > p,
    .reading p,
    .state-card p {
      color: var(--muted);
      font-size: 15px;
      font-weight: 740;
      line-height: 1.72;
      word-break: keep-all;
    }

    .headline-answer {
      padding: 16px;
      border: 1px solid rgba(241, 191, 109, 0.24);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(201, 58, 47, 0.28), rgba(0, 0, 0, 0.18)),
        rgba(255, 255, 255, 0.045);
    }

    .headline-answer strong {
      display: block;
      color: #fffaf2;
      font-size: 19px;
      line-height: 1.45;
      word-break: keep-all;
    }

    .evidence-grid,
    .signal-grid,
    .action-grid {
      display: grid;
      gap: 9px;
    }

    .evidence-row,
    .signal-row,
    .action-row {
      display: grid;
      gap: 6px;
      padding: 12px;
      border: 1px solid rgba(255, 226, 183, 0.13);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.18);
    }

    .evidence-row span,
    .signal-row span,
    .action-row span {
      color: var(--gold);
      font-size: 12px;
      font-weight: 950;
    }

    .evidence-row strong,
    .signal-row strong,
    .action-row strong {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.48;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .visual-block {
      overflow: hidden;
      border: 1px solid rgba(255, 226, 183, 0.14);
      border-radius: 8px;
      background: #0b0505;
    }

    .visual-block img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: 50% 18%;
    }

    .visual-block figcaption {
      padding: 11px 12px 12px;
      color: var(--soft);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.5;
    }

    .visual-block.image-failed img {
      display: none;
    }

    .hero.image-failed .hero-visual {
      min-height: 220px;
      display: grid;
      place-items: center;
    }

    .hero.image-failed .hero-visual img {
      display: none;
    }

    .hero.image-failed .hero-visual::before {
      content: "이미지를 불러오지 못했어요. 해석은 계속 볼 수 있어요.";
      position: relative;
      z-index: 1;
      max-width: 260px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 850;
      line-height: 1.55;
      text-align: center;
    }

    .visual-block.image-failed figcaption::before {
      content: "이미지를 불러오지 못했어요. ";
      color: #ffd49b;
    }

    .reading {
      display: grid;
      gap: 12px;
    }

    .quote {
      padding: 14px;
      border-left: 3px solid var(--gold);
      border-radius: 8px;
      background: rgba(241, 191, 109, 0.1);
      color: #fff4e2;
      font-size: 15px;
      font-weight: 850;
      line-height: 1.7;
      word-break: keep-all;
    }

    .signal-row.is-watch {
      border-color: rgba(255, 172, 112, 0.26);
      background: rgba(129, 59, 25, 0.19);
    }

    .action-row {
      border-color: rgba(147, 207, 168, 0.22);
      background: rgba(36, 89, 57, 0.16);
    }

    .action-row span {
      color: #bde6ca;
    }

    .nav-bar {
      position: sticky;
      bottom: 0;
      z-index: 4;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px 16px max(14px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(7, 3, 3, 0.94);
      backdrop-filter: blur(16px);
    }

    .nav-bar button {
      min-height: 42px;
      border: 1px solid rgba(255, 226, 183, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--ink);
      font-size: 14px;
      font-weight: 900;
    }

    .nav-bar button:last-child {
      border-color: rgba(255, 226, 183, 0.42);
      background: linear-gradient(180deg, var(--red), var(--deep-red));
      color: #fffaf2;
    }

    .related-card {
      display: grid;
      gap: 12px;
      padding: 16px;
    }

    .related-card h2 {
      font-size: 20px;
      line-height: 1.28;
    }

    .related-list {
      display: grid;
      gap: 8px;
    }

    .related-list button {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-height: 54px;
      padding: 11px 12px;
      border: 1px solid rgba(255, 226, 183, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--ink);
      text-align: left;
    }

    .related-list strong {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.35;
    }

    .related-list span {
      color: var(--gold);
      font-size: 12px;
      font-weight: 950;
    }

    .state-card {
      display: grid;
      gap: 14px;
      padding: 18px;
    }

    .state-card h1 {
      font-size: 24px;
    }

    .state-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .state-actions button {
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid rgba(255, 226, 183, 0.18);
      background: rgba(255, 255, 255, 0.055);
      color: var(--ink);
      font-weight: 900;
    }

    .state-actions button.primary-btn {
      border-color: rgba(255, 226, 183, 0.42);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 78px;
      z-index: 10;
      width: min(360px, calc(100vw - 32px));
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      padding: 12px 14px;
      border: 1px solid rgba(255, 226, 183, 0.22);
      border-radius: 8px;
      background: rgba(18, 8, 7, 0.95);
      color: var(--ink);
      font-size: 13px;
      font-weight: 850;
      line-height: 1.45;
      box-shadow: var(--shadow);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (min-width: 860px) {
      .phone {
        width: min(100vw, 960px);
      }

      #detail-root {
        grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
        align-items: start;
        padding: 18px 22px 104px;
      }

      .hero,
      .related-card {
        position: sticky;
        top: 86px;
      }

      .section-card {
        gap: 16px;
      }

      .hero-visual img {
        height: 520px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  
      /* Shared UMSH chrome: keep the fixed bottom nav clear of the page's own CTA.
         The shell publishes its measured height, but that measurement can land before
         layout settles, so the floor keeps the reserve honest either way. */
      body.umsh-has-chrome .app,
      body.umsh-has-chrome .phone { padding-bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      body.umsh-has-chrome .sticky-cta,
      body.umsh-has-chrome .sticky,
      body.umsh-has-chrome .submit-dock { bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      .signal-saved-profile { display: grid; gap: 6px; border: 1px solid rgba(22, 181, 188, 0.45); border-radius: 10px; background: rgba(22, 181, 188, 0.08); padding: 14px; margin-bottom: 14px; }
      .signal-saved-profile b { color: #80f1dc; font-size: 14px; }
      .signal-saved-profile span { color: rgba(248, 255, 251, 0.76); font-size: 13px; line-height: 1.55; }
      .signal-saved-profile button { justify-self: start; margin-top: 4px; min-height: 38px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; background: rgba(255, 255, 255, 0.06); color: inherit; padding: 0 12px; font: inherit; font-weight: 800; cursor: pointer; }
</style>

  </head>
<body>
  <main class="phone" data-umsh-chrome data-service="관계 신호" data-price="19,900원" data-active="home" id="step-6_1-report" aria-label="내 애인 바람필까 상세 리포트">
    <header class="appbar topbar">
      <a class="brand" href="../01-step-1-story/index.html" aria-label="운명상회 홈">
        <span>운명상회</span>
        <strong>내 애인 바람필까?</strong>
      </a>
      <div class="top-actions">
        <button class="icon-btn" type="button" id="btn-back" aria-label="목록으로 돌아가기">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

      <button class="pill-btn primary-btn" type="button" id="btn-list">목록</button>
    </div>

    <div class="offline" id="offline">연결이 불안정해요. 이미 열린 상세 내용은 계속 볼 수 있고, 새 계산값은 연결이 돌아오면 다시 확인해 주세요.</div>
    <div id="detail-root"></div>
    <nav class="nav-bar" aria-label="상세 리포트 탐색">
      <button type="button" id="btn-prev">이전</button>
      <button type="button" id="btn-next">다음</button>

  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const service = {
        service_key: "couple_signal",
        service_slug: "couple-signal",
        service_title: "내 애인 바람필까?",
        category: "커플궁합",
        price_krw: 19900,
        report_version: "couple-signal-v1",
        basis: ["명리궁합", "오행", "일지"]
      };

      const keys = {
        reportInput: "umsh:report-input:couple_signal",
        reportPreview: "umsh:report-preview:couple_signal",
        activeReport: "umsh:active-report:couple_signal",
        activeSection: "umsh:active-report-section:couple_signal",
        scrollReturn: "umsh:step5-return:couple_signal"
      };

      const groups = [
        {
          id: "relationship_temperature",
          title: "지금 우리 관계 온도",
          subtitle: "연락, 표현, 데이트 에너지가 식은 건지 안정된 건지 먼저 봅니다.",
          axis: "관계 온도",
          image: "../assets/signal/05-relationship_temperature.webp",
          evidence_ids: ["zip-연예-qa-000024", "zip-연예-qa-000027", "item-22-p1-0027", "item-22-p1-0028"],
          fact_keys: ["input.self.birth", "input.partner.birth", "calculated_facts.element_relation", "calculated_facts.day_branch_relation"],
          items: [
            ["relationship_temperature_true_love", "찐사랑 유지각", "표현은 줄어도 약속의 구체성과 생활 공유가 남아 있는지 봅니다."],
            ["relationship_temperature_boredom", "권태기 살짝 온 듯", "새로움이 줄어든 건지 마음의 방향이 달라진 건지 분리합니다."],
            ["relationship_temperature_attention_gap", "관심 식은 척인지 진짜인지", "반응 속도보다 먼저 봐야 할 말투와 태도 변화를 체크합니다."],
            ["relationship_temperature_expression_left", "표현은 줄었는데 마음은 남은 케이스", "다정함의 방식이 바뀐 사람과 식은 사람의 차이를 봅니다."],
            ["relationship_temperature_contact_tension", "연락 텐션 변화", "답장 간격, 질문 유무, 마무리 말투가 같이 변했는지 살핍니다."],
            ["relationship_temperature_date_energy", "데이트 에너지 변화", "만남을 피하는 건지 익숙해서 덜 꾸미는 건지 생활 리듬으로 봅니다."],
            ["relationship_temperature_stable_or_cold", "안정기인지 식은 건지 구분", "편안함과 무심함의 경계를 약속, 시간, 관심 배분으로 나눕니다."]
          ]
        },
        {
          id: "partner_signal_radar",
          title: "애인의 바람기 레이더",
          subtitle: "매력, 관심 욕구, 외부 유혹에 흔들릴 수 있는 환경을 봅니다.",
          axis: "외부 변수",

        const states = {
          locked: {
            title: "전체 리포트 열람 후 볼 수 있어요",
            text: "상세 해석은 결제와 본인 리포트 확인이 끝난 뒤 열립니다. 무료 티저로 돌아가거나 결과 목록에서 다시 이어갈 수 있어요.",
            primary: "무료 티저",
            secondary: "목록"
          },
          generating: {
            title: "상세 리포트를 여는 중이에요",
            text: "결제는 다시 하지 않아도 됩니다. 결과 생성이 끝나면 같은 리포트에서 이어서 볼 수 있어요.",
            primary: "다시 확인",
            secondary: "목록"
          },
          missing: {
            title: "리포트 연결이 끊겼어요",
            text: "결과 목록에서 항목을 다시 선택하면 상세 해석을 이어서 볼 수 있습니다.",
            primary: "목록",
            secondary: "무료 티저"
          },
          invalid: {
            title: "목록에 없는 항목이에요",
            text: "05 결과 목록에 있는 항목만 상세로 열 수 있습니다. 목록에서 보고 싶은 항목을 다시 선택해 주세요.",
            primary: "목록",
            secondary: "무료 티저"
          }
        };
        const state = states[kind] || states.missing;
        root.innerHTML = `
          <section class="state-card">
            <span class="kicker">상태 확인</span>
            <h1>${escapeHtml(state.title)}</h1>
            <p>${escapeHtml(state.text)}</p>
            <div class="state-actions">
              <button class="primary-btn" type="button" data-state-primary>${escapeHtml(state.primary)}</button>
              <button type="button" data-state-secondary>${escapeHtml(state.secondary)}</button>
            </div>
          </section>
        `;
        btnPrev.disabled = true;
        btnNext.disabled = true;
      }

      function renderEvidence(item, copy) {
        const rows = factRows(item);
        return `
          <section class="section-card" data-evidence-ids="${escapeHtml(item.evidence_ids.join(" "))}" data-calculated-fact-keys="${escapeHtml(item.calculated_fact_keys.join(" "))}">
            <div>
              <span class="block-kicker">확인된 근거</span>
              <h2>고전 기준과 입력값을 분리해서 봅니다</h2>
            </div>
            <div class="evidence-grid">
              ${rows.map(([label, value]) => `
                <div class="evidence-row">
                  <span>${escapeHtml(label)}</span>
                  <strong>${escapeHtml(value)}</strong>
                </div>
              `).join("")}
            </div>
            <p>${escapeHtml(copy.basis)} 계산값이 아직 연결되지 않은 항목은 새 숫자나 기간을 만들지 않고, 확인 가능한 관계 신호 중심으로만 읽습니다.</p>
          </section>
        `;
      }

      function renderVisualEvidence(item, asset) {
        if (!asset.evidence) return "";
        return `
          <figure class="visual-block" data-asset-key="couple-signal-06-${escapeHtml(item.section_id)}-evidence">
            <img src="${escapeHtml(asset.evidence)}" alt="${escapeHtml(asset.evidence_alt)}" loading="lazy" />
            <figcaption>상세 근거 블록용 장면입니다. 해석 문구는 이미지가 아니라 본문에서만 제공합니다.</figcaption>
          </figure>
        `;
      }

      function renderSignals(item, copy) {
        const rows = [
          ["현실에서 보이는 모습", copy.reality],
          ["시기·강약·조건", copy.condition],
          ["주의할 선택", copy.caution]
        ];
        return `
          <section class="section-card" data-evidence-ids="${escapeHtml(item.evidence_ids.join(" "))}" data-calculated-fact-keys="${escapeHtml(item.calculated_fact_keys.join(" "))}">
            <div>
              <span class="block-kicker">상세 해석</span>
              <h2>관계 신호로 번역하면 이렇습니다</h2>
            </div>
            <div class="reading">
              <p>${escapeHtml(copy.answer)}</p>
              <div class="quote">${escapeHtml(copy.conclusion)}</div>
            </div>
            <div class="signal-grid">
              ${rows.map(([label, value], index) => `
                <div class="signal-row ${index === 2 ? "is-watch" : ""}">
                  <span>${escapeHtml(label)}</span>
                  <strong>${escapeHtml(value)}</strong>
                </div>
              `).join("")}
            </div>
          </section>
        `;
      }

      function renderActions(item, copy) {
        return `
          <section class="section-card" data-evidence-ids="${escapeHtml(item.evidence_ids.join(" "))}" data-calculated-fact-keys="${escapeHtml(item.calculated_fact_keys.join(" "))}">
            <div>
              <span class="block-kicker">지금 할 행동</span>
              <h2>오늘 또는 이번 주에 할 수 있는 것</h2>
            </div>
            <div class="action-grid">
              ${copy.actions.map((action, index) => `
                <div class="action-row">
                  <span>${String(index + 1).padStart(2, "0")}</span>
                  <strong>${escapeHtml(action)}</strong>
                </div>
              `).join("")}
            </div>
          </section>
        `;
      }

      function renderRelated(item) {
        const related = relatedFor(item);
        const buttons = [
          related.previous ? { label: "이전", item: related.previous } : null,
          related.next ? { label: "다음", item: related.next } : null,
          ...related.siblings.map((sibling) => ({ label: item.group.title, item: sibling }))
        ].filter(Boolean).slice(0, 6);

        return `
          <section class="related-card">
            <div>
              <span class="block-kicker">연관 항목</span>
              <h2>같이 보면 흐름이 선명해져요</h2>
            </div>
            <div class="related-list">
              ${buttons.map((entry) => `
                <button type="button" data-related-section="${escapeHtml(entry.item.section_id)}">
                  <strong>${escapeHtml(entry.item.title)}</strong>
                  <span>${escapeHtml(entry.label)}</span>
                </button>
              `).join("")}
            </div>
          </section>
        `;
      }

      function renderDetail(item) {
        const asset = sectionAsset(item);
        const copy = detailCopy(item);
        const related = relatedFor(item);
        document.getElementById("context-label").textContent = `${item.group.title} · ${item.title}`;
        btnPrev.disabled = !related.previous;
        btnNext.disabled = !related.next;
        btnPrev.dataset.target = related.previous?.section_id || "";
        btnNext.dataset.target = related.next?.section_id || "";

        root.innerHTML = `
          <div>
            <section class="hero" data-asset-key="couple-signal-06-${escapeHtml(item.section_id)}-hero">
              <div class="hero-visual">
                <img src="${escapeHtml(asset.hero)}" alt="${escapeHtml(asset.hero_alt)}" />
              </div>
              <div class="hero-copy">
                <span class="kicker">${escapeHtml(item.group.title)}</span>
                <h1>${escapeHtml(item.title)}</h1>
                <p>${escapeHtml(item.preview)}</p>
                <div class="status-line" aria-label="분석 기준">
                  <span>${escapeHtml(service.category)}</span>
                  <span>${escapeHtml(service.basis.join(" · "))}</span>
                  <span>${escapeHtml(service.report_version)}</span>
                </div>
              </div>
            </section>
          </div>
          <div>
            <section class="section-card" data-evidence-ids="${escapeHtml(item.evidence_ids.join(" "))}" data-calculated-fact-keys="${escapeHtml(item.calculated_fact_keys.join(" "))}">
              <span class="block-kicker">한 줄 결론</span>
              <div class="headline-answer">
                <strong>${escapeHtml(copy.conclusion)}</strong>
              </div>
              <p>이 상세 페이지는 “그랬다/아니다”를 찍지 않고, 현재 관계에서 확인할 수 있는 온도·외부 변수·대화 타이밍을 순서대로 정리합니다.</p>
            </section>
            ${renderEvidence(item, copy)}
            ${renderVisualEvidence(item, asset)}
            ${renderSignals(item, copy)}
            ${renderActions(item, copy)}
            ${renderRelated(item)}
          </div>
        `;

        writeJson(sessionStorage, keys.activeSection, {
          service,
          report_id: reportId(),
          group: {
            id: item.group.id,
            title: item.group.title,
            subtitle: item.group.subtitle,
            image: item.group.image,
            evidence_ids: item.group.evidence_ids
          },
          item: {
            section_id: item.section_id,
            title: item.title,
            preview: item.preview,
            evidence_ids: item.evidence_ids,
            calculated_fact_keys: item.calculated_fact_keys
          },
          siblings: groups.find((group) => group.id === item.group.id).items.map((row) => ({
            section_id: row[0],
            title: row[1],
            preview: row[2],
            route: `../06-step-6_1-report-detail/index.html?section=${encodeURIComponent(row[0])}#step-6_1-report`
          })),
          created_at: new Date().toISOString()
        });
      }

      function goList() {
        writeJson(sessionStorage, keys.scrollReturn, {
          section_id: selectedSectionId(),
          report_id: reportId(),
          created_at: new Date().toISOString()
        });
        if (document.referrer && document.referrer.includes("05-step-5-chat")) {
          history.back();
          return;
        }
        location.href = "../05-step-5-chat/chat.html#step-5-chat";
      }

      function navigateSection(sectionId, replace = false) {
        const item = findItem(sectionId);
        if (!item) {
          renderStateCard("invalid");
          return;
        }
        const nextUrl = `?service_key=${encodeURIComponent(service.service_key)}&report_id=${encodeURIComponent(reportId() || "local-review")}&report_version=${encodeURIComponent(service.report_version)}&group=${encodeURIComponent(item.group.id)}&section=${encodeURIComponent(item.section_id)}#step-6_1-report`;
        if (replace) {
          history.replaceState({ section_id: item.section_id }, "", nextUrl);
        } else {
          history.pushState({ section_id: item.section_id }, "", nextUrl);
        }
        renderDetail(item);
        document.getElementById("step-6_1-report").scrollIntoView({ block: "start" });
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove("is-visible"), 2300);
      }

      function boot() {
        const state = activeState();
        const item = findItem(selectedSectionId());
        if (state !== "ready") {
          renderStateCard(state);
          return;
        }
        if (!item) {
          renderStateCard("invalid");
          return;
        }
        navigateSection(item.section_id, true);
      }

      document.getElementById("btn-back").addEventListener("click", goList);
      document.getElementById("btn-list").addEventListener("click", goList);
      document.getElementById("btn-save").addEventListener("click", () => showToast("현재 상세 항목을 보관함에 연결해 둘게요."));
      btnPrev.addEventListener("click", () => {
        if (btnPrev.dataset.target) navigateSection(btnPrev.dataset.target);
      });
      btnNext.addEventListener("click", () => {
        if (btnNext.dataset.target) navigateSection(btnNext.dataset.target);
      });
      root.addEventListener("click", (event) => {
        const related = event.target.closest("[data-related-section]");
        const primary = event.target.closest("[data-state-primary]");
        const secondary = event.target.closest("[data-state-secondary]");
        if (related) navigateSection(related.dataset.relatedSection);
        if (primary || secondary) {
          const label = (primary || secondary).textContent.trim();
          if (label === "무료 티저") location.href = "../04-step-4-report/index.html#step-4-report";
          else if (label === "다시 확인") location.reload();
          else goList();
        }
      });
      document.addEventListener("error", (event) => {
        if (event.target?.tagName === "IMG") {
          event.target.closest(".hero, .visual-block")?.classList.add("image-failed");
        }
      }, true);
      window.addEventListener("popstate", () => {
        const item = findItem(selectedSectionId());
        if (item) renderDetail(item);
      });
      function updateOffline() {
        offline.classList.toggle("is-visible", navigator.onLine === false);
      }
      window.addEventListener("online", updateOffline);
      window.addEventListener("offline", updateOffline);
      updateOffline();
      boot();
    })();
  </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/js/common-auth-return.js"></script>
    <script src="/js/umsh-auth-session.js"></script>
    <script src="/js/payment-bridge.js"></script>
    <script src="/js/umsh-chrome.js"></script>
    <script src="/js/signal-service.js" defer></script>
  </body>
</html>

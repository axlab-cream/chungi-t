  <body>
    <main class="payment-page" data-umsh-chrome data-service="MY" data-active="account">
      <header class="appbar topbar"></header>
      <section class="payment-shell myhub" aria-labelledby="page-title">
        <h1 id="page-title">1:1 문의</h1>
        <p class="payment-intro">문의를 남기면 확인 후 이 화면에서 답변을 드립니다. 급한 결제 문의는 결제 내역에서 주문을 확인한 뒤 남겨 주세요.</p>
        <form class="myhub-inquiry-form" data-inquiry-form>
          <label class="payment-label" for="inquiry-category">문의 종류
            <select id="inquiry-category" name="category" required>
              <option value="">골라 주세요</option>
              <option value="payment">결제·환불</option>
              <option value="generation">풀이가 만들어지지 않아요</option>
              <option value="interpretation">풀이 내용</option>
              <option value="access">로그인·이용</option>
              <option value="privacy">개인정보</option>
              <option value="other">기타</option>
            </select>
          </label>
          <label class="payment-label" for="inquiry-text">문의 내용
            <textarea id="inquiry-text" name="text" rows="6" minlength="10" maxlength="2000" required placeholder="어떤 화면에서 무엇이 안 되는지 적어 주세요. 결제 문의는 결제일과 상품명을 함께 적어 주시면 빨리 확인합니다."></textarea>
          </label>
          <p class="myhub-count" data-inquiry-count>0 / 2,000자</p>
          <button class="payment-submit" type="submit">문의 남기기</button>
          <p class="payment-status" data-inquiry-status role="status" aria-live="polite"></p>
        </form>
        <h2 class="myhub-group-title">내 문의</h2>
        <div class="myhub-inquiries" data-inquiry-list><p class="myhub-empty">불러오는 중입니다.</p></div>
        <p class="myhub-links" style="margin-top:18px"><a href="/faq">자주 묻는 질문</a><a href="/support">고객센터 안내</a><a href="/my">마이페이지로</a></p>
      </section>
    </main>

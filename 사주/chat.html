<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>천명사주 · 사주 상담</title>
  <link rel="stylesheet" href="/css/immersive-chat.css" />
</head>
<body>
  <main class="phone chat-phone" aria-label="천명사주 텍스트 상담">
    <header class="topbar">
      <div class="chat-brand-logo" aria-label="UMSH 운명상회">
        <span>UMSH</span>
        <b>운명상회</b>
      </div>
      <button class="icon-button" type="button" id="btn-back" aria-label="사주 결과로">←</button>
      <button class="pdf-button topbar-pdf-button" type="button" id="btn-pdf" aria-label="PDF 다운받기">PDF</button>
    </header>
    <p class="saju-chip" id="chat-saju-label">개인 사주 기반 상담</p>
    <section id="chat-log" class="chat-log" aria-live="polite"></section>
    <form id="chat-form" class="chat-input">
      <textarea id="chat-message" rows="2" placeholder="지금 마음에 걸린 걸 그대로 적어주세요..." required></textarea>
      <button type="submit" class="send-btn" id="btn-send">전송</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/umsh-auth-session.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>

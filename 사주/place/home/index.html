    <style>
      :root {
        color-scheme: dark;
        --bg: #050403;
        --panel: rgba(20, 14, 12, 0.78);
        --panel-solid: #110c0b;
        --line: rgba(222, 188, 113, 0.32);
        --gold: #e8c76f;
        --gold-soft: #f2dc9a;
        --text: #fff7df;
        --muted: rgba(255, 247, 223, 0.7);
        --danger: #ef4444;
        --red: #a8261e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #000;
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .stage {
        width: min(100vw, 430px);
        min-height: 100vh;
        margin: 0 auto;
        background: var(--bg);
        position: relative;
        overflow: hidden;
      }

      .appbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 72px;
        padding: 16px 20px;
        background: rgba(4, 3, 2, 0.9);
        border-bottom: 1px solid rgba(232, 199, 111, 0.14);
        backdrop-filter: blur(12px);
      }

      .back {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid rgba(232, 199, 111, 0.35);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        font-size: 22px;
      }

      .brand {
        display: grid;
        justify-items: center;
        gap: 2px;
      }

      .brand strong {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        letter-spacing: 0;
        color: var(--gold-soft);
      }

      .brand span,
      .eyebrow,
      .chip,
      label,
      .small {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .brand span,
      .eyebrow,
      label,
      .small {
        color: var(--gold);
      }

      .scroll {
        height: calc(100vh - 72px);
        overflow-y: auto;
        padding: 0 20px 32px;
      }

      .hero {
        min-height: 370px;
        margin: 0 -20px;
        padding: 210px 20px 28px;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.15), rgba(5, 4, 3, 0.9) 78%, var(--bg)),
          url("/assets/umsh-place-card-bg.webp") center / cover;
      }

      .hero h1 {
        margin: 8px 0 10px;
        font-size: 32px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .hero p,
      .panel p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
        font-size: 14px;
      }

      .panel {
        margin-top: 16px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
      }

      .panel h2 {
        margin: 8px 0 10px;
        font-size: 24px;
        line-height: 1.22;
        letter-spacing: 0;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid rgba(232, 199, 111, 0.42);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        padding: 13px 14px;
        outline: none;
      }

      textarea {
        min-height: 86px;
        resize: vertical;
      }

      .is-error {
        border-color: var(--danger);
        box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.18);
      }

      .error {
        min-height: 18px;
        color: #ff9b9b;
        font-size: 12px;
        line-height: 1.5;
      }

      .actions {
        display: grid;
        grid-template-columns: 0.9fr 1.35fr;
        gap: 10px;
        margin-top: 18px;
      }

      .btn {
        min-height: 52px;
        border-radius: 12px;
        border: 1px solid rgba(232, 199, 111, 0.35);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        font-weight: 900;
      }

      .btn.primary {
        border-color: rgba(255, 210, 142, 0.32);
        background: linear-gradient(180deg, #c83b31, var(--red));
      }

      .btn.gold {
        color: #130d08;
        background: linear-gradient(135deg, #f6dda1, #b98325);
      }

      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .provider-grid,
      .survey-grid,
      .toc-grid {
        display: grid;
        gap: 10px;
      }

      .provider-grid {
        margin-top: 18px;
      }

      .survey-card,
      .toc-card,
      .chapter-card {
        border: 1px solid rgba(232, 199, 111, 0.24);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.045);
        padding: 14px;
      }

      .survey-card strong,
      .toc-card strong,
      .chapter-card strong {
        display: block;
        line-height: 1.45;
      }

      .option-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
      }

      .option {
        min-height: 44px;
        border-radius: 10px;
        border: 1px solid rgba(232, 199, 111, 0.25);
        background: rgba(0, 0, 0, 0.16);
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .option.is-active,
      .toc-card.is-active,
      .chapter-card.is-active {
        border-color: var(--gold);
        color: var(--text);
        background: rgba(166, 38, 30, 0.38);
      }

      .hidden {
        display: none !important;
      }

      .status {
        margin-top: 12px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(232, 199, 111, 0.09);
        color: var(--gold-soft);
        font-size: 13px;
        line-height: 1.55;
      }

      .report-shell {
        padding-bottom: 34px;
      }

      .report-head {
        margin: 18px 0 12px;
      }

      .report-head h2 {
        margin: 6px 0;
        font-size: 26px;
        line-height: 1.25;
      }

      .toc-card {
        text-align: left;
        color: var(--text);
      }

      .toc-card span {
        display: block;
        margin-bottom: 4px;
        color: var(--gold);
        font-size: 12px;
        font-weight: 900;
      }

      .chapter-list {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }

      .chapter-card {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 12px;
        text-align: left;
        color: var(--text);
      }

      .chapter-card b {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(232, 199, 111, 0.15);
        color: var(--gold-soft);
      }

      .reading {
        margin-top: 16px;
      }

      .reading img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        border-radius: 14px;
        border: 1px solid rgba(232, 199, 111, 0.24);
      }

      .reading h3 {
        margin: 18px 0 10px;
        font-size: 22px;
        line-height: 1.25;
      }

      .reading-hook {
        margin: 0 0 12px;
        color: #e8c76f;
        font-size: 14px;
        line-height: 1.5;
      }

      .reading pre {
        white-space: pre-wrap;
        margin: 0;
        color: rgba(255, 247, 223, 0.86);
        font: inherit;
        line-height: 1.72;
      }

      .pager {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <main class="stage" data-umsh-chrome data-service="집 풍수" data-price="19,900원">
      <header class="appbar">
        <button class="back" type="button" data-back aria-label="뒤로">‹</button>
        <div class="brand">
          <strong>운명상회</strong>
          <span>집 풍수</span>
        </div>
        <span class="small">19,900원</span>
      </header>

      <div class="scroll">
        <section class="hero">
          <span class="eyebrow">PLACE · 집 풍수</span>
          <h1>지금 사는 집,<br />나랑 잘 맞을까?</h1>
          <p>주소와 생활 동선, 내 사주를 함께 놓고 이 집에서 어떤 흐름이 살아나는지 봅니다.</p>
        </section>

        <section class="panel" data-screen="auth">
          <span class="eyebrow">UMSH · 운명상회</span>
          <h2>공통 로그인으로 연결 중</h2>
          <p>운명상회 로그인 페이지에서 인증한 뒤 집 풍수를 이어갑니다.</p>
          <div class="status hidden" data-auth-status></div>
        </section>

        <section class="panel hidden" data-screen="profile">
          <span class="eyebrow">PROFILE</span>
          <h2>사주 프로필 등록</h2>
          <p>집과 내 명리를 같이 보려면 기본 사주 정보가 필요합니다.</p>
          <form data-profile-form>
            <div class="field">
              <label for="name">이름</label>
              <input id="name" name="name" autocomplete="name" placeholder="홍길동" />
              <div class="error" data-error-for="name"></div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="gender">성별</label>
                <select id="gender" name="gender">
                  <option value="male">남자</option>
                  <option value="female">여자</option>
                </select>
              </div>
              <div class="field">
                <label for="calendar">달력</label>
                <select id="calendar" name="calendar">
                  <option value="solar">양력</option>
                  <option value="lunar">음력</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="birth">생년월일</label>
              <input id="birth" name="birth" inputmode="numeric" maxlength="8" placeholder="YYYYMMDD" />
              <div class="error" data-error-for="birth"></div>
            </div>
            <div class="actions">
              <button class="btn" type="button" data-logout>로그아웃</button>
              <button class="btn primary" type="submit">등록하기</button>
            </div>
          </form>
        </section>

        <section class="panel hidden" data-screen="form">
          <span class="eyebrow">ADDRESS</span>
          <h2>집 정보를 알려주세요</h2>
          <p data-profile-summary></p>
          <form data-place-form>
            <div class="field">
              <label for="address">주소</label>
              <input id="address" name="address" autocomplete="street-address" placeholder="예: 서울특별시 강남구 도산대로 12길" />
              <div class="error" data-error-for="address"></div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="homeType">주거 형태</label>
                <select id="homeType" name="homeType">
                  <option value="아파트">아파트</option>
                  <option value="빌라">빌라</option>
                  <option value="단독주택">단독주택</option>
                  <option value="오피스텔">오피스텔</option>
                </select>
              </div>
              <div class="field">
                <label for="purpose">가장 보고 싶은 것</label>
                <select id="purpose" name="purpose">
                  <option value="휴식과 안정">휴식과 안정</option>
                  <option value="돈과 일">돈과 일</option>
                  <option value="가족과 관계">가족과 관계</option>
                  <option value="이사 판단">이사 판단</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="concern">지금 마음에 걸리는 점</label>
              <textarea id="concern" name="concern" placeholder="예: 잠을 자도 피곤하고 집에 있으면 집중이 잘 안 돼요."></textarea>
            </div>

            <div class="survey-grid" data-survey></div>

            <div class="actions">
              <button class="btn" type="button" data-reset-form>초기화</button>
              <button class="btn primary" type="submit">이 운명 확인하기</button>
            </div>
          </form>
        </section>

        <section class="report-shell hidden" data-screen="report">
          <div class="report-head">
            <span class="eyebrow">PLACE REPORT</span>
            <h2 data-report-title>집 풍수 해석문</h2>
            <p data-report-subtitle></p>
          </div>
          <div class="toc-grid" data-category-list></div>
          <div class="chapter-list" data-chapter-list></div>
          <article class="panel reading" data-reading></article>
        </section>
      </div>
    </main>

    <script src="/js/umsh-chrome.js"></script>
    <script src="/js/umsh-auth-session.js"></script>
    <script src="/js/umsh-loading.js"></script>
    <script>
      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
      const state = {
        supabase: null,
        session: null,
        authConfig: null,
        profile: null,
        report: null,
        category: '',
        sectionId: '',
        paidResumeStarted: false,
        survey: {},
      };

      const screens = {
        auth: $('[data-screen="auth"]'),
        profile: $('[data-screen="profile"]'),
        form: $('[data-screen="form"]'),
        report: $('[data-screen="report"]'),
      };

      const surveyQuestions = [
        {
          id: 'entry_front',
          title: '현관 문을 열면 정면 세 걸음 안에 무엇이 있습니까?',
          options: [
            ['wall', '막힌 벽'],
            ['open', '거실이나 통로로 트여 있음'],
            ['window', '창이나 발코니'],
            ['mirror', '거울'],
            ['unknown', '잘 모르겠습니다'],
          ],
        },
        {
          id: 'bed_wall',
          title: '침대 머리가 닿는 벽은 어느 쪽입니까?',
          options: ['북', '북동', '동', '남동', '남', '남서', '서', '북서', 'unknown'].map((value) => [value, value === 'unknown' ? '잘 모르겠습니다' : value]),
        },
        {
          id: 'kitchen_line',
          title: '조리대와 현관이 일직선으로 마주 보고 있습니까?',
          options: [
            ['yes', '일직선'],
            ['no', '아닙니다'],
            ['none', '부엌 없음'],
            ['unknown', '잘 모르겠습니다'],
          ],
        },
        {
          id: 'windows',
          title: '가장 큰 창은 어느 쪽입니까?',
          options: ['북', '북동', '동', '남동', '남', '남서', '서', '북서', 'unknown'].map((value) => [value, value === 'unknown' ? '잘 모르겠습니다' : value]),
        },
        {
          id: 'corridor',
          title: '통로에서 두 사람이 비껴갈 수 있습니까?',
          options: [
            ['wide', '넉넉합니다'],
            ['one', '한 사람씩'],
            ['tight', '물건이 쌓여 좁음'],
            ['unknown', '잘 모르겠습니다'],
          ],
        },
      ];

      function showScreen(name) {
        Object.entries(screens).forEach(([key, node]) => node.classList.toggle('hidden', key !== name));
      }
      function setLoading(on, copy) {
        if (on) {
          window.UMSHLoading.show(copy || { title: '집의 흐름을 정리하고 있습니다', subtitle: '집과 생활의 흐름을 살피는 중입니다.' });
        } else {
          window.UMSHLoading.hide();
        }
      }

      function setStatus(message) {
        const node = $('[data-auth-status]');
        node.textContent = message;
        node.classList.toggle('hidden', !message);
      }

      function authHeaders() {
        return state.session?.access_token ? { Authorization: `Bearer ${state.session.access_token}` } : {};
      }

      function openCommonLogin() {
        const returnTo = window.UMSHCommonAuth?.currentPageReturnTo() || `${location.pathname}${location.search}${location.hash}`;
        const url = window.UMSHCommonAuth?.commonLoginUrl('place-home', returnTo) || `/signup?entry=place-home&returnTo=${encodeURIComponent(returnTo)}#login`;
        location.replace(url);
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...authHeaders(),
            ...(options.headers || {}),
          },
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          const error = new Error(payload.error || '요청을 처리하지 못했습니다.');
          error.code = payload.code;
          error.paymentUrl = payload.paymentUrl;
          throw error;
        }
        return payload;
      }

      async function initAuth() {
        state.authConfig = await fetch('/api/auth/config').then((res) => res.json());
        if (!state.authConfig.enabled || !window.supabase || !window.UMSHAuthSession) {
          openCommonLogin();
          return;
        }
        state.supabase = window.UMSHAuthSession.createClient(window.supabase, state.authConfig.url, state.authConfig.publishableKey);
        const { data } = await state.supabase.auth.getSession();
        state.session = await window.UMSHAuthSession.enforceDeviceAuthSession(data.session, state.supabase);
        state.supabase.auth.onAuthStateChange((_event, session) => {
          window.UMSHAuthSession.enforceDeviceAuthSession(session, state.supabase)
            .then((nextSession) => {
              state.session = nextSession;
              routeAfterAuth();
            })
            .catch(() => {
              state.session = session || null;
              routeAfterAuth();
            });
        });
        routeAfterAuth();
      }

      async function routeAfterAuth() {
        if (!state.session) {
          openCommonLogin();
          return;
        }
        setLoading(true);
        try {
          const payload = await api('/api/user/profile');
          state.profile = payload.profile;
          if (payload.complete || window.UMSHAuthSession?.isSharedProfileComplete(payload.profile)) {
            $('[data-profile-summary]').textContent = `${state.profile.name}님의 기본 사주 프로필과 집의 흐름을 함께 봅니다.`;
            showScreen('form');
            resumePaidRequest();
          } else {
            showScreen('profile');
          }
        } catch (err) {
          showScreen('profile');
        } finally {
          setLoading(false);
        }
      }

      function validateProfile(form) {
        const name = form.name.value.trim();
        const birth = form.birth.value.trim();
        const errors = {};
        if (!/^[가-힣]{2,5}$/.test(name)) errors.name = '이름은 한글 2자 이상 5자 이하로 입력해 주세요.';
        if (!/^\d{8}$/.test(birth)) {
          errors.birth = '생년월일은 숫자 8자리 YYYYMMDD로 입력해 주세요.';
        } else {
          const year = Number(birth.slice(0, 4));
          const month = Number(birth.slice(4, 6));
          const day = Number(birth.slice(6, 8));
          const date = new Date(year, month - 1, day);
          if (year < 1900 || year > new Date().getFullYear() || date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
            errors.birth = '존재하는 날짜와 정상 연도를 입력해 주세요.';
          }
        }
        ['name', 'birth'].forEach((key) => {
          const input = $(`[name="${key}"]`, form);
          const error = $(`[data-error-for="${key}"]`);
          input.classList.toggle('is-error', Boolean(errors[key]));
          error.textContent = errors[key] || '';
        });
        return Object.keys(errors).length === 0;
      }

      function validatePlace(form) {
        const address = form.address.value.trim();
        const error = $('[data-error-for="address"]');
        if (address.length < 5) {
          form.address.classList.add('is-error');
          error.textContent = '주소는 시·군·구 이상으로 입력해 주세요.';
          return false;
        }
        form.address.classList.remove('is-error');
        error.textContent = '';
        return true;
      }

      function renderSurvey() {
        const root = $('[data-survey]');
        root.innerHTML = surveyQuestions.map((question) => `
          <div class="survey-card" data-question="${question.id}">
            <span class="small">문답 ${question.id === 'windows' ? '· 창 방향' : ''}</span>
            <strong>${question.title}</strong>
            ${question.id === 'windows' ? '<div class="field"><input type="number" min="0" max="12" inputmode="numeric" placeholder="창 개수" data-window-count /></div>' : ''}
            <div class="option-grid">
              ${question.options.map(([value, label]) => `<button class="option" type="button" data-question-option="${question.id}" data-value="${value}">${label}</button>`).join('')}
            </div>
          </div>
        `).join('');
      }

      function selectSurvey(button) {
        const id = button.dataset.questionOption;
        const value = button.dataset.value;
        state.survey[id] = id === 'windows'
          ? { value, count: Number($('[data-window-count]')?.value || 0) }
          : value;
        $$(`[data-question-option="${id}"]`).forEach((node) => node.classList.toggle('is-active', node === button));
      }

      async function saveProfile(event) {
        event.preventDefault();
        const form = event.currentTarget;
        if (!validateProfile(form)) return;
        const birthText = form.birth.value.trim();
        setLoading(true);
        try {
          const payload = await api('/api/user/profile', {
            method: 'POST',
            body: JSON.stringify({
              name: form.name.value.trim(),
              birthTimeKnown: false,
              birth: {
                year: Number(birthText.slice(0, 4)),
                month: Number(birthText.slice(4, 6)),
                day: Number(birthText.slice(6, 8)),
                hour: 12,
                minute: 0,
                gender: form.gender.value,
                calendar: form.calendar.value,
              },
            }),
          });
          state.profile = payload.profile;
          $('[data-profile-summary]').textContent = `${state.profile.name}님의 기본 사주 프로필과 집의 흐름을 함께 봅니다.`;
          showScreen('form');
        } catch (err) {
          setStatus(err.message);
        } finally {
          setLoading(false);
        }
      }

      async function generateReport(event) {
        event.preventDefault();
        const form = event.currentTarget;
        if (!validatePlace(form)) return;
        const requestBody = {
          address: form.address.value.trim(),
          homeType: form.homeType.value,
          purpose: form.purpose.value,
          concern: form.concern.value.trim(),
          survey: state.survey,
        };
        setLoading(true);
        try {
          const payload = await api('/api/place/home/analyze', {
            method: 'POST',
            body: JSON.stringify(requestBody),
          });
          state.report = payload.report;
          state.category = state.report.sections[0].category;
          state.sectionId = state.report.sections[0].id;
          renderReport();
          showScreen('report');
        } catch (err) {
          if (err.code === 'PAYMENT_REQUIRED') {
            window.UMSHPaymentBridge?.save('home_pungsu', requestBody, location.pathname);
            location.assign(err.paymentUrl || `/payment?product=home_pungsu&returnTo=${encodeURIComponent(location.pathname)}`);
            return;
          }
          if (err.code === 'PROFILE_REQUIRED') showScreen('profile');
          setStatus(err.message);
        } finally {
          setLoading(false);
        }
      }

      async function resumePaidRequest() {
        if (state.paidResumeStarted || new URLSearchParams(location.search).get('paid') !== '1') return;
        const orderId = new URLSearchParams(location.search).get('orderId');
        const pending = window.UMSHPaymentBridge?.load('home_pungsu');
        if (!orderId || !pending) return;
        state.paidResumeStarted = true;
        setLoading(true);
        try {
          const payload = await api('/api/place/home/analyze', { method: 'POST', body: JSON.stringify({ ...pending.payload, orderId }) });
          state.report = payload.report;
          state.category = state.report.sections[0].category;
          state.sectionId = state.report.sections[0].id;
          renderReport();
          showScreen('report');
          window.UMSHPaymentBridge?.clear();
          await api(`/api/payment/orders/${encodeURIComponent(orderId)}/viewed`, { method: 'POST' }).catch(() => {});
          history.replaceState(null, '', location.pathname);
        } catch (err) {
          setStatus(err.message);
        } finally {
          setLoading(false);
        }
      }

      function sectionsByCategory(category) {
        return state.report.sections.filter((section) => section.category === category);
      }

      function renderReport() {
        $('[data-report-title]').textContent = state.report.title;
        $('[data-report-subtitle]').textContent = state.report.subtitle;
        const categories = Array.from(new Map(state.report.sections.map((section) => [section.category, section.categoryEn])).entries());
        $('[data-category-list]').innerHTML = categories.map(([category, categoryEn]) => `
          <button class="toc-card ${category === state.category ? 'is-active' : ''}" type="button" data-category="${category}">
            <span>${categoryEn}</span>
            <strong>${category}</strong>
          </button>
        `).join('');
        renderChapters();
        renderReading();
      }

      function renderChapters() {
        const chapters = sectionsByCategory(state.category);
        $('[data-chapter-list]').innerHTML = chapters.map((section, index) => `
          <button class="chapter-card ${section.id === state.sectionId ? 'is-active' : ''}" type="button" data-section-id="${section.id}">
            <b>${String(index + 1).padStart(2, '0')}</b>
            <strong>${section.classification}</strong>
          </button>
        `).join('');
      }

      function currentSection() {
        return state.report.sections.find((section) => section.id === state.sectionId) || state.report.sections[0];
      }

      function renderReading() {
        const section = currentSection();
        const index = state.report.sections.findIndex((item) => item.id === section.id);
        $('[data-reading]').innerHTML = `
          <img src="${section.imageSrc}" alt="${section.imageAlt}" />
          <span class="eyebrow">${section.categoryEn} · ${index + 1}/${state.report.sections.length}</span>
          <h3>${section.classification}</h3>
          <p class="reading-hook">${escapeHtml(section.hook)}</p>
          <pre>${section.interpretation}</pre>
          <div class="pager">
            <button class="btn" type="button" data-prev ${index <= 0 ? 'disabled' : ''}>이전</button>
            <button class="btn primary" type="button" data-next ${index >= state.report.sections.length - 1 ? 'disabled' : ''}>다음</button>
          </div>
        `;
      }

      function moveSection(delta) {
        const index = state.report.sections.findIndex((section) => section.id === state.sectionId);
        const next = state.report.sections[index + delta];
        if (!next) return;
        state.category = next.category;
        state.sectionId = next.id;
        renderReport();
      }

      document.addEventListener('click', async (event) => {
        const surveyOption = event.target.closest('[data-question-option]');
        if (surveyOption) selectSurvey(surveyOption);
        const category = event.target.closest('[data-category]');
        if (category && state.report) {
          state.category = category.dataset.category;
          state.sectionId = sectionsByCategory(state.category)[0].id;
          renderReport();
        }
        const sectionButton = event.target.closest('[data-section-id]');
        if (sectionButton) {
          state.sectionId = sectionButton.dataset.sectionId;
          renderChapters();
          renderReading();
        }
        if (event.target.closest('[data-prev]')) moveSection(-1);
        if (event.target.closest('[data-next]')) moveSection(1);
        if (event.target.closest('[data-back]')) history.length > 1 ? history.back() : location.assign('/');
        if (event.target.closest('[data-logout]') && state.supabase) {
          await state.supabase.auth.signOut();
          state.session = null;
          openCommonLogin();
        }
        if (event.target.closest('[data-reset-form]')) {
          $('[data-place-form]').reset();
          state.survey = {};
          $$('.option').forEach((node) => node.classList.remove('is-active'));
        }
      });

      $('[data-profile-form]').addEventListener('submit', saveProfile);
      $('[data-place-form]').addEventListener('submit', generateReport);
      document.addEventListener('input', (event) => {
        if (event.target.matches('[data-window-count]')) {
          const current = state.survey.windows;
          if (current && typeof current === 'object') current.count = Number(event.target.value || 0);
        }
      });

      renderSurvey();
      initAuth().catch((err) => {
        setStatus(err.message);
        openCommonLogin();
      });
    </script>
  </body>
</html>

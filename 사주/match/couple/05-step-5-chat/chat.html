<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>우리 둘, 진짜 잘 맞아? | 전체 목차</title>
  <meta name="description" content="두 사람의 관계 흐름을 관계 총평, 띠/지지, 오행, 소통, 갈등, 오늘 행동으로 이어서 확인합니다." />
  <meta name="application-name" content="운명상회" />
  <meta name="apple-mobile-web-app-title" content="우리 둘, 진짜 잘 맞아?" />
  <meta property="og:title" content="우리 둘, 진짜 잘 맞아? | 커플궁합" />
  <meta property="og:description" content="관계 총평부터 오늘의 관계 액션까지, 두 사람의 궁합 목차를 열어봅니다." />
  <meta property="og:site_name" content="운명상회" />
  <meta property="og:url" content="https://match.umsh.kr/couple" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #071214;
      --panel: rgba(11, 31, 34, 0.88);
      --panel-strong: rgba(8, 22, 25, 0.96);
      --line: rgba(194, 255, 255, 0.16);
      --text: #f7fffb;
      --muted: #a8bec0;
      --soft: #d7f8f7;
      --cyan: #51e1df;
      --cyan-deep: #0c8d93;
      --coral: #ff806e;
      --gold: #ecc66a;
      --violet: #9d9af6;
      --shadow: 0 24px 90px rgba(0, 0, 0, 0.4);
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      letter-spacing: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 8%, rgba(81, 225, 223, 0.16), transparent 30%),
        linear-gradient(145deg, #071214 0%, #10262a 46%, #151d23 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      width: min(100%, 1120px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(0, 1fr);
      gap: 18px;
      padding: 18px;
    }

    .phone {
      min-height: calc(100vh - 36px);
      max-height: 980px;
      border: 1px solid rgba(215, 248, 247, 0.18);
      border-radius: 28px;
      overflow: hidden;
      background: rgba(5, 17, 19, 0.92);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      position: sticky;
      top: 18px;
    }

    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 17, 19, 0.78);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(81, 225, 223, 0.94), rgba(255, 128, 110, 0.78));
      color: #031416;
      font-weight: 900;
      font-size: 17px;
      flex: 0 0 auto;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-kicker {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.1;
    }

    .brand-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--soft);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(215, 248, 247, 0.12);
    }

    .icon-button:focus-visible,
    .tab-button:focus-visible,
    .detail-button:focus-visible,
    .send-button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .contextbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px 16px;
      background: rgba(12, 141, 147, 0.12);
      border-bottom: 1px solid var(--line);
    }

    .context-label {
      min-width: 0;
    }

    .context-label strong {
      display: block;
      font-size: 13px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context-label span {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      line-height: 1.25;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pdf-button {
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      color: #071214;
      background: var(--soft);
      font-size: 12px;
      font-weight: 800;
    }

    .chat-log {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bubble {
      width: fit-content;
      max-width: 92%;
      border-radius: 18px;
      padding: 12px 13px;
      line-height: 1.55;
      font-size: 14px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(215, 248, 247, 0.11);
    }

    .bubble.user {
      align-self: flex-end;
      color: #031416;
      background: linear-gradient(135deg, var(--cyan), #e8fffc);
      font-weight: 700;
    }

    .hub-card {
      width: 100%;
      align-self: stretch;
      border-radius: 18px;
      padding: 14px;
      border: 1px solid rgba(215, 248, 247, 0.16);
      background: rgba(9, 27, 30, 0.82);
    }

    .hub-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .hub-title {
      margin: 0 0 5px;
      font-size: 18px;
      line-height: 1.24;
      letter-spacing: 0;
    }

    .hub-desc {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .status-chip {
      min-width: 76px;
      border-radius: 999px;
      padding: 7px 9px;
      color: #071214;
      background: var(--gold);
      text-align: center;
      font-size: 11px;
      font-weight: 900;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .mini-metric {
      min-height: 64px;
      padding: 9px;
      border-radius: var(--radius);
      border: 1px solid rgba(215, 248, 247, 0.13);
      background: rgba(255, 255, 255, 0.055);
    }

    .mini-metric b {
      display: block;
      margin-bottom: 4px;
      font-size: 17px;
      line-height: 1;
    }

    .mini-metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .state-panel {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: 1px solid rgba(255, 128, 110, 0.28);
      background: rgba(255, 128, 110, 0.1);
    }

    .state-panel h2 {
      margin: 0 0 6px;
      font-size: 16px;
      line-height: 1.3;
    }

    .state-panel p {
      margin: 0 0 12px;
      color: var(--soft);
      font-size: 13px;
      line-height: 1.55;
    }

    .state-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .state-link,
    .ghost-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 850;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(215, 248, 247, 0.16);
      color: var(--text);
    }

    .state-link.primary {
      background: var(--soft);
      color: #071214;
    }

    .tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 1px 0 3px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-button {
      min-height: 34px;
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 0 12px;
      color: var(--soft);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(215, 248, 247, 0.11);
      font-size: 12px;
      font-weight: 800;
    }

    .tab-button.is-active {
      color: #061113;
      background: var(--cyan);
      border-color: transparent;
    }

    .group-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .group-card {
      min-height: 118px;
      width: 100%;
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
      padding: 9px;
      border-radius: 16px;
      border: 1px solid rgba(215, 248, 247, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      text-align: left;
    }

    .group-card.text-only {
      grid-template-columns: 1fr;
      min-height: 106px;
    }

    .group-card.is-active {
      border-color: rgba(81, 225, 223, 0.72);
      background: rgba(81, 225, 223, 0.1);
    }

    .thumb {
      min-height: 98px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(81, 225, 223, 0.14), rgba(255, 128, 110, 0.1));
    }

    .thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .group-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .group-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }

    .group-copy h3 {
      margin: 0;
      font-size: 15px;
      line-height: 1.25;
    }

    .group-count {
      flex: 0 0 auto;
      padding: 4px 7px;
      border-radius: 999px;
      color: var(--gold);
      background: rgba(236, 198, 106, 0.1);
      font-size: 11px;
      font-weight: 850;
    }

    .group-copy p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      word-break: keep-all;
    }

    .group-tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .group-tags span {
      border-radius: 999px;
      padding: 4px 7px;
      color: var(--soft);
      background: rgba(255, 255, 255, 0.07);
      font-size: 10px;
      line-height: 1.1;
    }

    .detail-panel {
      min-height: calc(100vh - 36px);
      max-height: 980px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border: 1px solid rgba(215, 248, 247, 0.16);
      border-radius: 24px;
      background: rgba(5, 17, 19, 0.72);
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.25);
    }

    .detail-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 24, 27, 0.72);
    }

    .detail-header-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }

    .detail-eyebrow {
      margin: 0 0 8px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 900;
    }

    .detail-header h2 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.14;
      letter-spacing: 0;
    }

    .detail-header p {
      max-width: 660px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      word-break: keep-all;
    }

    .group-nav {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .group-nav button {
      min-height: 34px;
      border-radius: 999px;
      padding: 0 12px;
      color: var(--soft);
      background: rgba(255, 255, 255, 0.075);
      border: 1px solid rgba(215, 248, 247, 0.1);
      font-size: 12px;
      font-weight: 800;
    }

    .group-nav button.is-active {
      color: #061113;
      background: var(--cyan);
      border-color: transparent;
    }

    .item-list {
      overflow-y: auto;
      padding: 18px 20px 22px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .item-card {
      border-radius: 16px;
      border: 1px solid rgba(215, 248, 247, 0.13);
      background: rgba(255, 255, 255, 0.065);
      padding: 15px;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .item-card h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .item-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      word-break: keep-all;
    }

    .why-box {
      margin-top: 10px;
      padding: 10px 11px;
      border-radius: var(--radius);
      color: var(--soft);
      background: rgba(81, 225, 223, 0.08);
      border: 1px solid rgba(81, 225, 223, 0.14);
      font-size: 12px;
      line-height: 1.55;
    }

    .item-foot {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .evidence-pill {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
    }

    .detail-button {
      min-height: 38px;
      border-radius: 999px;
      padding: 0 13px;
      color: #061113;
      background: var(--soft);
      font-size: 12px;
      font-weight: 900;
    }

    .chat-input {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 12px 14px 16px;
      border-top: 1px solid var(--line);
      background: rgba(5, 17, 19, 0.86);
    }

    .chat-input textarea {
      width: 100%;
      min-height: 46px;
      max-height: 120px;
      resize: none;
      border-radius: 16px;
      padding: 12px 13px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(215, 248, 247, 0.14);
      outline: 0;
      line-height: 1.45;
    }

    .chat-input textarea::placeholder {
      color: rgba(215, 248, 247, 0.5);
    }

    .send-button {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #061113;
      background: var(--cyan);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(18px);
      max-width: min(92vw, 420px);
      padding: 12px 14px;
      border-radius: 999px;
      color: #061113;
      background: var(--soft);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.38);
      font-size: 13px;
      font-weight: 850;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      z-index: 20;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 860px) {
      .app-shell {
        display: block;
        padding: 0;
      }

      .phone {
        min-height: 100vh;
        max-height: none;
        border-radius: 0;
        border: 0;
        position: relative;
        top: auto;
      }

      .detail-panel {
        min-height: auto;
        max-height: none;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        display: block;
      }

      .detail-header {
        padding: 18px 16px 14px;
      }

      .item-list {
        overflow: visible;
        padding: 14px 16px 22px;
      }

      .chat-log {
        max-height: none;
      }
    }

    @media (max-width: 420px) {
      .mini-grid {
        grid-template-columns: 1fr;
      }

      .group-card {
        grid-template-columns: 78px minmax(0, 1fr);
      }

      .thumb {
        min-height: 86px;
      }

      .item-top {
        display: block;
      }

      .detail-button {
        width: 100%;
      }
    }
  
      /* Shared UMSH chrome: keep the fixed bottom nav clear of the page's own CTA.
         The shell publishes its measured height, but that measurement can land before
         layout settles, so the floor keeps the reserve honest either way. */
      body.umsh-has-chrome { padding-bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      body.umsh-has-chrome .sticky-cta { bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      .couple-saved-profile { display: grid; gap: 6px; border: 1px solid rgba(22, 181, 188, 0.45); border-radius: 10px; background: rgba(22, 181, 188, 0.08); padding: 14px; margin-bottom: 14px; }
      .couple-saved-profile b { color: #80f1dc; font-size: 14px; }
      .couple-saved-profile span { color: rgba(248, 255, 251, 0.76); font-size: 13px; line-height: 1.55; }
      .couple-saved-profile button { justify-self: start; margin-top: 4px; min-height: 38px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; background: rgba(255, 255, 255, 0.06); color: inherit; padding: 0 12px; font: inherit; font-weight: 800; cursor: pointer; }
</style>

{

  <script>
    const REPORT_INDEX = JSON.parse(document.getElementById("REPORT_INDEX").textContent);
    const IMAGE_MANIFEST = JSON.parse(document.getElementById("IMAGE_MANIFEST").textContent);

    const ROUTES = {
      back: "../04-step-4-report/index.html#step-4-report",
      input: "../02-step-2-saju-input/index.html#step-2-saju-input",
      vault: "../index.html",
      detailBase: "../06-step-6_1-report-detail/index.html"
    };

    const CLUSTERS = [
      { id: "all", label: "전체" },
      { id: "initial", label: "초기 6" },
      { id: "relationship", label: "관계" },
      { id: "saju", label: "사주 코드" },
      { id: "timing", label: "타이밍" },
      { id: "care", label: "돌봄" }
    ];

    const dom = {
      chatLog: document.getElementById("chat-log"),
      itemList: document.getElementById("item-list"),
      groupNav: document.getElementById("group-nav"),
      activeEyebrow: document.getElementById("active-eyebrow"),
      activeTitle: document.getElementById("active-title"),
      activeSummary: document.getElementById("active-summary"),
      contextTitle: document.getElementById("context-title"),
      contextSubtitle: document.getElementById("context-subtitle"),
      form: document.getElementById("chat-form"),
      message: document.getElementById("chat-message"),
      toast: document.getElementById("toast"),
      firstButton: document.getElementById("btn-open-first")
    };

    const params = new URLSearchParams(window.location.search);
    const assetByKey = Object.fromEntries(IMAGE_MANIFEST.map((asset) => [asset.asset_key, asset]));
    let activeCluster = "initial";
    let activeGroupId = "relationship_overview";
    let toastTimer = 0;

    function readJson(key) {
      try {
        const value = sessionStorage.getItem(key);
        return value ? JSON.parse(value) : null;
      } catch (error) {
        return null;
      }
    }

    function getContext() {
      const reportContext = readJson("umsh:couple-match:report-context");
      const inputPayload = readJson("umsh:couple-match:input");
      const teaser = readJson("umsh:couple-match:free-teaser");
      return { reportContext, inputPayload, teaser };
    }

    function getPairLabel(inputPayload) {
      const selfName = inputPayload?.subjects?.self?.display_name?.trim() || "나";
      const partnerName = inputPayload?.subjects?.partner?.display_name?.trim() || "상대";
      return `${selfName} × ${partnerName}`;
    }

    function getFocusLabel(inputPayload) {
      const focus = inputPayload?.context?.focus || inputPayload?.context?.target_question || "";
      const temperature = inputPayload?.context?.relationship_temperature || "";
      return [focus, temperature].filter(Boolean).join(" · ") || "현재 관계 흐름";
    }

    function readServerEntitlement(context) {
      const injected = window.__UMSH_SERVER_ENTITLEMENT__;
      const reportId = context.reportContext?.report_id || context.reportContext?.reportId || "";
      const serviceKey = context.reportContext?.service_key || "couple_match";
      if (!injected || typeof injected !== "object") {
        return false;
      }
      return Boolean(
        injected.verified === true &&
        injected.signature_valid === true &&
        injected.owner_verified === true &&
        injected.entitled === true &&
        injected.service_key === serviceKey &&
        (!reportId || injected.report_id === reportId)
      );
    }

    function isLocalReview() {
      return window.location.protocol === "file:";
    }

    function canOpenDetail(context) {
      return isLocalReview() || readServerEntitlement(context);
    }

    function getScreenState(context) {
      if (params.get("status") === "generating") {
        return "generating";
      }
      if (params.get("status") === "network-error") {
        return "network_error";
      }
      if (!context.reportContext && !context.inputPayload) {
        return "missing";
      }
      const requestedReportId = params.get("reportId");
      const currentReportId = context.reportContext?.report_id || context.reportContext?.reportId || "";
      if (requestedReportId && currentReportId && requestedReportId !== currentReportId) {
        return "wrong_report";
      }
      if (!canOpenDetail(context)) {
        return "no_entitlement";
      }
      return "entitled";
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      dom.toast.textContent = message;
      dom.toast.classList.add("is-visible");
      toastTimer = window.setTimeout(() => dom.toast.classList.remove("is-visible"), 2400);
    }

    function makeBubble(text, variant = "assistant") {
      const node = document.createElement("div");
      node.className = `bubble ${variant}`;
      node.textContent = text;
      dom.chatLog.appendChild(node);
      dom.chatLog.scrollTop = dom.chatLog.scrollHeight;
      return node;
    }

    function filteredGroups() {
      if (activeCluster === "all") {
        return REPORT_INDEX;
      }
      return REPORT_INDEX.filter((group) => group.cluster === activeCluster);
    }

    function findGroup(groupId) {
      return REPORT_INDEX.find((group) => group.id === groupId) || REPORT_INDEX[0];
    }

    function findGroupBySection(sectionId) {
      return REPORT_INDEX.find((group) => group.items.some((item) => item.section_id === sectionId)) || null;
    }

    function itemCount(groups = REPORT_INDEX) {
      return groups.reduce((sum, group) => sum + group.items.length, 0);
    }

    function renderStatePanel(state) {
      const copy = {
        missing: {
          title: "열 수 있는 리포트가 없어요",
          body: "두 사람 정보를 먼저 입력하면 이 화면에서 전체 목차를 이어서 볼 수 있어요.",
          primary: "두 사람 정보 입력",
          secondary: "무료 요약 보기",
          primaryHref: ROUTES.input,
          secondaryHref: ROUTES.back
        },
        generating: {
          title: "목차를 정리하는 중이에요",
          body: "잠시 뒤 새로고침하면 항목별 리포트가 이어서 열립니다. 이전 요약은 그대로 유지했어요.",
          primary: "다시 확인",
          secondary: "무료 요약",
          primaryHref: window.location.pathname + "#step-5-chat",
          secondaryHref: ROUTES.back
        },
        no_entitlement: {
          title: "전체 항목 확인이 필요해요",
          body: "무료 요약 이후의 상세 항목은 이용 상태 확인이 끝난 뒤 열 수 있어요.",
          primary: "전체 목차 열기",
          secondary: "무료 요약",
          primaryHref: ROUTES.back,
          secondaryHref: ROUTES.back
        },
        wrong_report: {
          title: "이 리포트로는 열 수 없어요",
          body: "현재 보관된 관계 리포트와 요청한 리포트가 달라요. 보관함이나 무료 요약에서 다시 들어와 주세요.",
          primary: "보관함",
          secondary: "새 분석",
          primaryHref: ROUTES.vault,
          secondaryHref: ROUTES.input
        },
        network_error: {
          title: "연결이 잠깐 불안정해요",
          body: "마지막으로 정리된 목차를 보여드릴게요. 상세 열기는 상태 확인 뒤 이어집니다.",
          primary: "무료 요약",
          secondary: "새 분석",
          primaryHref: ROUTES.back,
          secondaryHref: ROUTES.input
        }
      }[state];

      if (!copy) {
        return "";
      }

      return `
        <section class="state-panel">
          <h2>${copy.title}</h2>
          <p>${copy.body}</p>
          <div class="state-actions">
            <a class="state-link primary" href="${copy.primaryHref}">${copy.primary}</a>
            <a class="state-link" href="${copy.secondaryHref}">${copy.secondary}</a>
          </div>
        </section>
      `;
    }

    function renderHub(context, state) {
      const groups = filteredGroups();
      const statePanel = state === "entitled" ? "" : renderStatePanel(state);
      const groupCards = groups.map((group) => renderGroupCard(group)).join("");
      const tabButtons = CLUSTERS.map((cluster) => `
        <button class="tab-button ${cluster.id === activeCluster ? "is-active" : ""}" type="button" data-cluster="${cluster.id}">
          ${cluster.label}
        </button>
      `).join("");

      const wrapper = document.createElement("section");
      wrapper.className = "hub-card";
      wrapper.innerHTML = `
        <div class="hub-top">
          <div>
            <h1 class="hub-title">전체 목차가 열렸어요</h1>
            <p class="hub-desc">먼저 6개 핵심 카드로 관계의 큰 그림을 보고, 필요한 항목만 골라 깊게 들어가세요.</p>
          </div>
          <span class="status-chip">${state === "entitled" ? "열람 가능" : "확인 필요"}</span>
        </div>
        <div class="mini-grid" aria-label="리포트 요약">
          <div class="mini-metric"><b>${REPORT_INDEX.length}</b><span>대분류</span></div>
          <div class="mini-metric"><b>${itemCount()}</b><span>세부 항목</span></div>
          <div class="mini-metric"><b>6</b><span>먼저 볼 카드</span></div>
        </div>
        ${statePanel}
        <div class="tabs" aria-label="목차 필터">${tabButtons}</div>
        <div class="group-list">${groupCards}</div>
      `;

      dom.chatLog.appendChild(wrapper);
      wrapper.querySelectorAll("[data-cluster]").forEach((button) => {
        button.addEventListener("click", () => {
          activeCluster = button.dataset.cluster;
          const nextGroups = filteredGroups();
          activeGroupId = nextGroups.some((group) => group.id === activeGroupId) ? activeGroupId : nextGroups[0]?.id || REPORT_INDEX[0].id;
          rerender(context, state);
        });
      });
      wrapper.querySelectorAll("[data-group-id]").forEach((button) => {
        button.addEventListener("click", () => {
          activeGroupId = button.dataset.groupId;
          renderDetail(context, state);
          document.querySelector(".detail-panel")?.scrollIntoView({ block: "start", behavior: "smooth" });
        });
      });
    }

    function renderGroupCard(group) {
      const asset = group.asset_key ? assetByKey[group.asset_key] : null;
      const thumb = asset ? `
        <figure class="thumb" data-asset-key="${asset.asset_key}">
          <img src="${asset.relative_src}" alt="${asset.alt}" loading="lazy" />
        </figure>
      ` : "";
      const previewTags = group.items.slice(0, 3).map((item) => `<span>${item.title}</span>`).join("");
      return `
        <button class="group-card ${asset ? "" : "text-only"} ${group.id === activeGroupId ? "is-active" : ""}" type="button" data-group-id="${group.id}">
          ${thumb}
          <span class="group-copy">
            <span>
              <span class="group-head">
                <h3>${group.title}</h3>
                <span class="group-count">${group.items.length}개</span>
              </span>
              <p>${group.subtitle}</p>
            </span>
            <span class="group-tags">${previewTags}</span>
          </span>
        </button>
      `;
    }

    function renderGroupNav() {
      dom.groupNav.innerHTML = REPORT_INDEX.map((group) => `
        <button type="button" class="${group.id === activeGroupId ? "is-active" : ""}" data-nav-group="${group.id}">
          ${group.title}
        </button>
      `).join("");
      dom.groupNav.querySelectorAll("[data-nav-group]").forEach((button) => {
        button.addEventListener("click", () => {
          activeGroupId = button.dataset.navGroup;
          renderDetail(getContext(), getScreenState(getContext()));
        });
      });
    }

    function renderDetail(context, state) {
      const group = findGroup(activeGroupId);
      dom.activeEyebrow.textContent = group.cluster === "initial" ? "초기 추천" : "확장 항목";
      dom.activeTitle.textContent = group.title;
      dom.activeSummary.textContent = group.subtitle;
      dom.itemList.innerHTML = group.items.map((item) => `
        <article class="item-card">
          <div class="item-top">
            <h3>${item.title}</h3>
            <button class="detail-button" type="button" data-detail-route="${item.route}" data-section-id="${item.section_id}">
              자세히 보기
            </button>
          </div>
          <p>${item.preview}</p>
          <div class="why-box">${item.why_needed}</div>
          <div class="item-foot">
            <span class="evidence-pill">
              <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 7L10 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              근거 연결됨
            </span>
          </div>
        </article>
      `).join("");
      renderGroupNav();
      dom.firstButton.onclick = () => openDetail(group.items[0], context, state);
      dom.itemList.querySelectorAll("[data-detail-route]").forEach((button) => {
        button.addEventListener("click", () => {
          const item = group.items.find((entry) => entry.section_id === button.dataset.sectionId);
          openDetail(item, context, state);
        });
      });
    }

    function openDetail(item, context, state) {
      if (!item) {
        return;
      }
      if (state === "wrong_report") {
        showToast("현재 리포트와 맞지 않아 보관함에서 다시 열어주세요.");
        return;
      }
      if (state === "missing") {
        window.location.href = ROUTES.input;
        return;
      }
      if (!canOpenDetail(context)) {
        showToast("전체 항목 확인 뒤 상세 풀이가 열립니다.");
        return;
      }
      try {
        const group = findGroupBySection(item.section_id);
        sessionStorage.setItem("umsh:couple-match:return-section", item.section_id);
        sessionStorage.setItem("umsh:couple-match:return-group", group?.id || activeGroupId);
        sessionStorage.setItem("umsh:couple-match:return-scroll", String(dom.chatLog.scrollTop));
      } catch (error) {
        /* keep detail navigation working even when storage is unavailable */
      }
      window.location.href = item.route;
    }

    function rerender(context, state) {
      dom.chatLog.innerHTML = "";
      makeBubble(`${getPairLabel(context.inputPayload)} 리포트 목차를 정리했어요. 처음엔 관계 총평, 띠/지지, 오행, 소통, 갈등, 오늘 행동부터 보면 흐름이 깔끔해요.`);
      renderHub(context, state);
      renderDetail(context, state);
    }

    function boot() {
      const context = getContext();
      const state = getScreenState(context);
      const returnSection = sessionStorage.getItem("umsh:couple-match:return-section");
      const returnGroup = returnSection ? findGroupBySection(returnSection) : null;
      if (returnGroup) {
        activeGroupId = returnGroup.id;
        activeCluster = returnGroup.cluster || activeCluster;
      }
      dom.contextTitle.textContent = getPairLabel(context.inputPayload);
      dom.contextSubtitle.textContent = getFocusLabel(context.inputPayload);

      if (state === "network_error") {
        showToast("연결이 불안정해 마지막 목차를 유지했어요.");
      }
      if (state === "generating") {
        showToast("리포트 정리 중이에요. 잠시 뒤 다시 확인해 주세요.");
      }

      rerender(context, state);
      const returnScroll = Number(sessionStorage.getItem("umsh:couple-match:return-scroll") || "0");
      if (returnScroll > 0) {
        window.setTimeout(() => {
          dom.chatLog.scrollTop = returnScroll;
          sessionStorage.removeItem("umsh:couple-match:return-scroll");
        }, 0);
      }
    }

    document.getElementById("btn-back").addEventListener("click", () => {
      window.location.href = ROUTES.back;
    });

    document.getElementById("btn-vault").addEventListener("click", () => {
      showToast("보관함 연결은 운영 계정 확인 뒤 이어집니다.");
    });

    document.getElementById("btn-pdf").addEventListener("click", () => {
      showToast("상세 리포트가 열린 뒤 저장할 수 있어요.");
    });

    dom.form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = dom.message.value.trim();
      if (!text) {
        return;
      }
      makeBubble(text, "user");
      dom.message.value = "";
      window.setTimeout(() => {
        makeBubble("좋아요. 지금 질문은 상세 항목에서 더 정확해져요. 먼저 가까운 목차를 하나 열고, 그 흐름에 맞춰 질문을 이어가면 좋아요.");
      }, 180);
    });

    boot();
  </script>

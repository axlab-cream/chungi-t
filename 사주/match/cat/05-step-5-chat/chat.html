    <style>
    @font-face {
      font-family: "Pretendard";
      src: url("/assets/fonts/Pretendard-Medium.woff2") format("woff2");
      font-weight: 500 900;
      font-display: swap;
    }

    @font-face {
      font-family: "MaruBuri";
      src: url("/assets/fonts/MaruBuri-SemiBold.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --bg: #030402;
      --panel: #0c0e09;
      --panel-strong: #12150e;
      --ink: #fff9ec;
      --muted: rgba(245, 231, 204, 0.7);
      --soft: rgba(245, 231, 204, 0.52);
      --line: rgba(239, 196, 111, 0.22);
      --gold: #efc46f;
      --gold-strong: #ffdc8b;
      --green: #a8ff18;
      --green-soft: rgba(168, 255, 24, 0.16);
      --red: #e24d35;
      --shadow: rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% -10%, rgba(168, 255, 24, 0.16), transparent 28rem),
        radial-gradient(circle at 0% 35%, rgba(239, 196, 111, 0.12), transparent 22rem),
        #000;
      font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: start center;
      overflow: hidden;
      color: var(--ink);
    }

    button,
    textarea,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .phone {
      width: min(100vw, 440px);
      height: 100svh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(168, 255, 24, 0.06), transparent 18rem),
        var(--bg);
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.5);
    }

    .topbar {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 70px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(4, 5, 3, 0.96);
      backdrop-filter: blur(18px);
    }

    .brand {
      min-width: 0;
      display: grid;
      gap: 3px;
      text-decoration: none;
      color: var(--ink);
    }

    .brand span {
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
    }

    .brand strong {
      overflow: hidden;
      color: var(--ink);
      font-size: 15px;
      font-weight: 950;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(239, 196, 111, 0.32);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      color: var(--gold-strong);
      cursor: pointer;
    }

    .contextbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 18px;
      border-bottom: 1px solid rgba(239, 196, 111, 0.12);
      background: rgba(3, 4, 2, 0.92);
    }

    .contextbar p {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .small-action {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(239, 196, 111, 0.28);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--gold-strong);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .chat-log {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding: 12px 14px 14px;
      scrollbar-width: none;
    }

    .chat-log::-webkit-scrollbar {
      display: none;
    }

    .report-basic,
    .state-panel,
    .group-panel,
    .section-panel,
    .bubble {
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 0%, rgba(239, 196, 111, 0.11), transparent 52%),
        rgba(255, 255, 255, 0.045);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.16);
    }

    .report-basic {
      display: grid;
      gap: 14px;
      padding: 16px;
      background:
        linear-gradient(145deg, rgba(168, 255, 24, 0.12), rgba(239, 196, 111, 0.08) 52%, rgba(255, 255, 255, 0.04)),
        var(--panel);
    }

    .report-basic h1 {
      margin: 0;
      font-family: MaruBuri, Pretendard, serif;
      font-size: 25px;
      line-height: 1.22;
      letter-spacing: 0;
      word-break: keep-all;
    }

    .report-basic p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 750;
      line-height: 1.58;
      word-break: keep-all;
    }

    .spec-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .spec-grid div {
      min-width: 0;
      display: grid;
      gap: 4px;
      padding: 10px;
      border: 1px solid rgba(239, 196, 111, 0.16);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.22);
    }

    .spec-grid span {
      color: var(--soft);
      font-size: 12px;
      font-weight: 850;
    }

    .spec-grid strong {
      color: var(--ink);
      font-size: 13px;
      font-weight: 950;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .state-panel {
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .state-panel h2 {
      margin: 0;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .state-panel p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
      line-height: 1.55;
      word-break: keep-all;
    }

    .state-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .state-pill {
      flex: 0 0 auto;
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      padding: 0 10px;
      border: 1px solid rgba(168, 255, 24, 0.28);
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 12px;
      font-weight: 950;
    }

    .state-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .state-actions a,
    .state-actions button {
      min-height: 40px;
      display: grid;
      place-items: center;
      padding: 0 10px;
      border: 1px solid rgba(239, 196, 111, 0.28);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .state-actions .primary-link {
      border-color: rgba(168, 255, 24, 0.38);
      background: linear-gradient(180deg, rgba(168, 255, 24, 0.26), rgba(42, 70, 12, 0.82));
      color: #fbffe8;
    }

    .group-panel,
    .section-panel {
      overflow: hidden;
    }

    .panel-head {
      display: grid;
      gap: 7px;
      padding: 16px 16px 10px;
    }

    .panel-head span {
      color: var(--gold);
      font-size: 12px;
      font-weight: 950;
    }

    .panel-head h2 {
      margin: 0;
      color: var(--ink);
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: 0;
      word-break: keep-all;
    }

    .panel-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
      line-height: 1.55;
      word-break: keep-all;
    }

    .group-grid {
      display: grid;
      gap: 10px;
      padding: 10px 14px 16px;
    }

    .group-card {
      position: relative;
      min-height: 156px;
      overflow: hidden;
      display: grid;
      align-content: end;
      gap: 5px;
      padding: 14px;
      border: 1px solid rgba(239, 196, 111, 0.18);
      border-radius: 8px;
      background: #050602;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      isolation: isolate;
    }

    .group-card.is-active {
      border-color: rgba(168, 255, 24, 0.68);
      box-shadow: 0 0 0 1px rgba(168, 255, 24, 0.12), 0 18px 38px rgba(0, 0, 0, 0.24);
    }

    .group-card img {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: 50% 50%;
      opacity: 0.74;
    }

    .group-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.04), rgba(0, 0, 0, 0.84)),
        linear-gradient(90deg, rgba(0, 0, 0, 0.64), transparent 66%);
    }

    .group-card span {
      color: var(--green);
      font-size: 12px;
      font-weight: 950;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
    }

    .group-card strong {
      color: var(--ink);
      font-size: 22px;
      font-weight: 950;
      line-height: 1.15;
      letter-spacing: 0;
      word-break: keep-all;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.72);
    }

    .group-card em {
      width: min(100%, 290px);
      color: rgba(255, 249, 236, 0.86);
      font-size: 13px;
      font-style: normal;
      font-weight: 850;
      line-height: 1.45;
      word-break: keep-all;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .group-card small {
      color: rgba(239, 196, 111, 0.88);
      font-size: 12px;
      font-weight: 900;
    }

    .section-cover {
      position: relative;
      min-height: 222px;
      display: grid;
      align-content: end;
      overflow: hidden;
      padding: 16px;
      background: #050602;
    }

    .section-cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 50%;
      opacity: 0.74;
    }

    .section-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.86)),
        linear-gradient(90deg, rgba(0, 0, 0, 0.62), transparent 52%);
    }

    .section-cover div {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 7px;
    }

    .section-cover span {
      color: var(--green);
      font-size: 12px;
      font-weight: 950;
    }

    .section-cover h2 {
      margin: 0;
      color: var(--ink);
      font-size: 27px;
      line-height: 1.18;
      letter-spacing: 0;
      word-break: keep-all;
    }

    .section-cover p {
      width: min(100%, 300px);
      margin: 0;
      color: rgba(255, 249, 236, 0.82);
      font-size: 13px;
      font-weight: 830;
      line-height: 1.5;
      word-break: keep-all;
    }

    .group-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 14px 3px;
      scrollbar-width: none;
    }

    .group-tabs::-webkit-scrollbar {
      display: none;
    }

    .group-tabs button {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid rgba(239, 196, 111, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 249, 236, 0.72);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .group-tabs button.is-active {
      border-color: rgba(168, 255, 24, 0.46);
      background: linear-gradient(180deg, rgba(168, 255, 24, 0.22), rgba(32, 56, 10, 0.78));
      color: var(--ink);
    }

    .section-list {
      display: grid;
      gap: 9px;
      padding: 12px 14px 16px;
    }

    .section-button {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 13px 12px;
      border: 1px solid rgba(239, 196, 111, 0.16);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(168, 255, 24, 0.1), transparent 62%),
        rgba(255, 255, 255, 0.045);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .section-button.is-active {
      border-color: rgba(168, 255, 24, 0.56);
      background:
        linear-gradient(90deg, rgba(168, 255, 24, 0.18), transparent 68%),
        rgba(255, 255, 255, 0.06);
    }

    .section-button.is-locked {
      opacity: 0.82;
    }

    .section-no {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(239, 196, 111, 0.13);
      color: var(--gold);
      font-size: 12px;
      font-weight: 950;
    }

    .section-body {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .section-body strong {
      color: var(--ink);
      font-size: 15px;
      font-weight: 950;
      line-height: 1.42;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .section-body em,
    .section-body small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-style: normal;
      font-weight: 780;
      line-height: 1.45;
      word-break: keep-all;
    }

    .section-body small {
      color: rgba(239, 196, 111, 0.78);
      font-weight: 900;
    }

    .section-arrow {
      padding-top: 8px;
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
    }

    .empty-panel {
      display: grid;
      gap: 10px;
      margin: 0 14px 16px;
      padding: 14px;
      border: 1px solid rgba(239, 196, 111, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--muted);
      font-size: 13px;
      font-weight: 780;
      line-height: 1.55;
    }

    .bubble {
      max-width: 92%;
      padding: 12px 13px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 760;
      line-height: 1.55;
      word-break: keep-all;
    }

    .bubble.user {
      align-self: flex-end;
      border-color: rgba(168, 255, 24, 0.28);
      background: rgba(168, 255, 24, 0.1);
    }

    .bubble.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.055);
    }

    .bubble.system {
      align-self: center;
      border: 0;
      background: transparent;
      color: var(--soft);
      font-size: 12px;
      text-align: center;
    }

    .chat-input {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 12px 14px max(16px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(4, 5, 3, 0.98);
    }

    textarea {
      width: 100%;
      min-height: 46px;
      max-height: 130px;
      padding: 11px 12px;
      border: 1px solid rgba(239, 196, 111, 0.22);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      line-height: 1.45;
      resize: vertical;
    }

    textarea::placeholder {
      color: rgba(245, 231, 204, 0.42);
    }

    .send-btn {
      min-width: 64px;
      min-height: 46px;
      border: 1px solid rgba(168, 255, 24, 0.38);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(168, 255, 24, 0.84), rgba(78, 122, 12, 0.96));
      color: #111806;
      font-weight: 950;
      cursor: pointer;
    }

    .send-btn:disabled {
      opacity: 0.48;
      cursor: default;
    }

    img[data-broken="true"] {
      opacity: 0;
    }

    @media (min-width: 720px) {
      body {
        padding: 0;
      }

      .phone {
        border-left: 1px solid rgba(239, 196, 111, 0.12);
        border-right: 1px solid rgba(239, 196, 111, 0.12);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }
    }
  
      /* Shared UMSH chrome. The design frames the whole page as a fixed 430x900 phone
         that scrolls inside itself; on the real site the document scrolls and the bottom
         nav is fixed to the viewport, so the frame is unwrapped here. */
      body.umsh-has-chrome .page-shell { min-height: 0; display: block; padding: 0; }
      body.umsh-has-chrome .phone {
        width: 100%;
        height: auto;
        min-height: 100svh;
        overflow: visible;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      /* Keep the fixed bottom nav clear of the page's last section. The shell publishes
         its measured height, but that can land before layout settles, so the floor keeps
         the reserve honest either way. */
      body.umsh-has-chrome { padding-bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      body.umsh-has-chrome .bottom-actions {
        bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px));
        margin-bottom: 0;
      }
      body.umsh-has-chrome .nav-footer { bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      /* UMSHChrome renders the shared bar as header.umsh-chrome-appbar inside its own
         shell, and that header still carries the page's .topbar class. Hand the box back
         so the design's own positioning cannot drag the shared bar around. */
      body.umsh-has-chrome .umsh-chrome-appbar {
        left: auto;
        right: auto;
        width: auto;
        transform: none;
        pointer-events: auto;
      }

      };

      const els = {
        context: document.querySelector("#context-label"),
        statePanel: document.querySelector("#state-panel"),
        statePill: document.querySelector("#state-pill"),
        stateTitle: document.querySelector("#state-title"),
        stateCopy: document.querySelector("#state-copy"),
        stateActions: document.querySelector("#state-actions"),
        groupGrid: document.querySelector("#group-grid"),
        sectionPanel: document.querySelector("#section-panel"),
        chatLog: document.querySelector("#chat-log"),
        form: document.querySelector("#chat-form"),
        message: document.querySelector("#chat-message"),
        send: document.querySelector("#btn-send")
      };

      const ACCESS_COPY = {
        entitled: {
          pill: "열람 가능",
          title: "전체 목차를 열 수 있어요",
          copy: "원하는 항목을 누르면 상세 풀이로 바로 이동합니다.",
          actions: [["목록 새로 보기", "refresh", false], ["무료 티저", "step04", true]]
        },
        locked: {
          pill: "확인 필요",
          title: "목록은 보이고, 상세는 결제 확인 뒤 열립니다",
          copy: "대분류와 항목명은 확인할 수 있고, 상세 이동은 열람 권한이 확인된 뒤 가능합니다.",
          actions: [["9,900원 결제 확인", "payment", true], ["입력 수정", "input", false]]
        },
        no_report: {
          pill: "입력 필요",
          title: "연결된 리포트를 찾지 못했어요",
          copy: "새 분석을 시작하거나 보관함에서 기존 결과를 다시 열어주세요.",
          actions: [["새 분석", "input", true], ["보관함", "vault", false]]
        },
        generating: {
          pill: "생성 중",
          title: "목록을 만들고 있어요",
          copy: "분석이 끝나면 이 화면에서 바로 대분류와 중분류가 열립니다.",
          actions: [["상태 다시 확인", "refresh", true], ["무료 티저", "step04", false]]
        },
        expired: {
          pill: "보관 만료",
          title: "보관 기간이 지난 결과예요",
          copy: "개인 입력을 주소창에 싣지 않고 새 분석이나 보관함으로 이동합니다.",
          actions: [["새 분석", "input", true], ["보관함", "vault", false]]
        },
        failed: {
          pill: "재시도",
          title: "분석이 끝까지 만들어지지 않았어요",
          copy: "멈춘 상태로 두지 않고 다시 시작할 수 있게 안내합니다.",
          actions: [["다시 시도", "input", true], ["무료 티저", "step04", false]]
        },
        forbidden: {
          pill: "권한 없음",
          title: "이 리포트의 열람 권한을 확인할 수 없어요",
          copy: "다른 계정의 결과일 수 있어 상세 목록을 열지 않습니다.",
          actions: [["보관함", "vault", true], ["새 분석", "input", false]]
        },
        network: {
          pill: "연결 확인",
          title: "연결이 잠시 불안정해요",
          copy: "마지막으로 준비된 목록은 유지하고, 상세 이동 전 상태를 다시 확인합니다.",
          actions: [["상태 다시 확인", "refresh", true], ["무료 티저", "step04", false]]
        }
      };

      function readAccessState() {
        const status = (params.get("status") || "").toLowerCase();
        if (status === "forbidden" || status === "owner_mismatch") return "forbidden";
        if (status === "expired") return "expired";
        if (status === "failed" || status === "analysis_failed") return "failed";
        if (status === "generating" || status === "loading") return "generating";
        if (status === "network_error") return "network";
        if (!hasReportReference) return "no_report";
        if (params.get("entitlement") === "verified") return "entitled";
        return "locked";
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function findGroup(groupId) {
        return GROUPS.find((group) => group.id === groupId) || GROUPS[0];
      }

      function findSection(sectionId) {
        for (const group of GROUPS) {
          const item = group.items.find((entry) => entry[0] === sectionId);
          if (item) return { group, item };
        }
        return null;
      }

      function compactReportId(value) {
        if (!value || value === SERVICE.defaultReportId) return "리포트 연결 전";
        return value.length > 18 ? `${value.slice(0, 9)}...${value.slice(-5)}` : value;
      }

      function detailUrl(sectionId) {
        const url = new URL("../06-step-6_1-report-detail/index.html", location.href);
        url.searchParams.set("section", sectionId);
        url.searchParams.set("service_key", SERVICE.key);
        url.searchParams.set("report_id", reportId);
        url.searchParams.set("profile_id", profileId);
        if (params.get("entitlement") === "verified") url.searchParams.set("entitlement", "verified");
        url.searchParams.set("analysis_period", params.get("analysis_period") || SERVICE.analysisPeriod);
        url.searchParams.set("report_version", params.get("report_version") || SERVICE.reportVersion);
        url.hash = "step-6_1-report";
        return url.toString();
      }

      function step04Url(hash = "step-4-report") {
        const url = new URL("../04-step-4-report/index.html", location.href);
        url.searchParams.set("service_key", SERVICE.key);
        if (reportId !== SERVICE.defaultReportId) url.searchParams.set("report_id", reportId);
        if (profileId !== SERVICE.defaultProfileId) url.searchParams.set("profile_id", profileId);
        url.searchParams.set("analysis_period", params.get("analysis_period") || SERVICE.analysisPeriod);
        url.searchParams.set("report_version", params.get("report_version") || SERVICE.reportVersion);
        url.hash = hash;
        return url.toString();
      }

      function inputUrl() {
        const url = new URL("../02-step-2-saju-input/index.html", location.href);
        url.hash = "step-2-saju-input";
        return url.toString();
      }

      function renderState(accessKey = state.access) {
        const copy = ACCESS_COPY[accessKey] || ACCESS_COPY.no_report;
        els.statePill.textContent = copy.pill;
        els.stateTitle.textContent = copy.title;
        els.stateCopy.textContent = copy.copy;
        els.context.textContent = `반려묘 생활 궁합 · ${compactReportId(reportId)}`;
        els.stateActions.innerHTML = copy.actions.map(([label, action, primary]) => {
          const className = primary ? "primary-link" : "";
          if (action === "input") return `<a class="${className}" href="${escapeHtml(inputUrl())}">${escapeHtml(label)}</a>`;
          if (action === "step04" || action === "payment") return `<a class="${className}" href="${escapeHtml(step04Url())}">${escapeHtml(label)}</a>`;
          if (action === "vault") return `<a class="${className}" href="${escapeHtml(step04Url("vault"))}">${escapeHtml(label)}</a>`;
          return `<button class="${className}" type="button" data-action="${escapeHtml(action)}">${escapeHtml(label)}</button>`;
        }).join("");
      }

      function renderGroups() {
        els.groupGrid.innerHTML = GROUPS.map((group) => {
          const active = group.id === state.activeGroupId ? " is-active" : "";
          return `
            <button class="group-card${active}" type="button" data-group-id="${escapeHtml(group.id)}">
              <img src="${escapeHtml(group.image)}" alt="${escapeHtml(group.alt)}" loading="lazy" />
              <span>${escapeHtml(group.gate)} · ${escapeHtml(group.items.length)}개 항목</span>
              <strong>${escapeHtml(group.title)}</strong>
              <em>${escapeHtml(group.subtitle)}</em>
              <small>눌러서 중분류 보기</small>
            </button>
          `;
        }).join("");
      }

      function renderSections() {
        const group = findGroup(state.activeGroupId);
        const access = ACCESS_COPY[state.access] ? state.access : "no_report";
        const isOpen = access === "entitled";
        const isBlocked = access === "forbidden" || access === "expired" || access === "failed";
        const shouldShowItems = !isBlocked;

        if (!shouldShowItems) {
          els.sectionPanel.innerHTML = `
            <div class="panel-head">
              <span>상세 접근 제한</span>
              <h2>이 상태에서는 항목을 열지 않아요</h2>
              <p>계정과 리포트 상태를 다시 확인한 뒤 목록을 이어갈 수 있습니다.</p>
            </div>
          `;
          return;
        }

        els.sectionPanel.innerHTML = `
          <div class="section-cover">
            <img src="${escapeHtml(group.image)}" alt="${escapeHtml(group.alt)}" loading="eager" />
            <div>
              <span>${escapeHtml(group.gate)} · ${escapeHtml(group.title)}</span>
              <h2>${escapeHtml(group.title)}</h2>
              <p>${escapeHtml(group.subtitle)}</p>
            </div>
          </div>
          <div class="group-tabs" role="list" aria-label="대분류 이동">
            ${GROUPS.map((entry) => `
              <button type="button" class="${entry.id === group.id ? "is-active" : ""}" data-group-id="${escapeHtml(entry.id)}" role="listitem">
                ${escapeHtml(entry.title)}
              </button>
            `).join("")}
          </div>
          <div class="section-list">
            ${group.items.map((item, index) => {
              const [sectionId, title, preview, label] = item;
              const active = sectionId === state.activeSectionId ? " is-active" : "";
              const locked = isOpen ? "" : " is-locked";
              const description = isOpen ? preview : "상세 풀이와 상담 문장은 결제 확인 후 열립니다.";
              const actionLabel = isOpen ? label : "열람 상태 확인";
              return `
                <button class="section-button${active}${locked}" type="button" data-section-id="${escapeHtml(sectionId)}">
                  <span class="section-no">${String(index + 1).padStart(2, "0")}</span>
                  <span class="section-body">
                    <strong>${escapeHtml(title)}</strong>
                    <em>${escapeHtml(description)}</em>
                    <small>${escapeHtml(actionLabel)}</small>
                  </span>
                  <span class="section-arrow" aria-hidden="true">›</span>
                </button>
              `;
            }).join("")}
          </div>
        `;
      }

      function renderAll() {
        renderState();
        renderGroups();
        renderSections();
      }

      function setActiveGroup(groupId) {
        state.activeGroupId = findGroup(groupId).id;
        state.activeSectionId = "";
        renderGroups();
        renderSections();
        document.querySelector("#section-panel")?.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function openSection(sectionId) {
        const found = findSection(sectionId);
        if (!found) {
          appendBubble("system", "선택한 항목을 찾지 못했어요. 대분류를 다시 골라주세요.");
          return;
        }
        state.activeGroupId = found.group.id;
        state.activeSectionId = sectionId;
        renderGroups();
        renderSections();

        if (state.access !== "entitled") {
          const message = state.access === "locked"
            ? "상세 풀이는 결제 확인 뒤 열립니다. 지금은 목차와 항목명만 확인할 수 있어요."
            : "현재 상태에서는 상세 항목으로 이동하지 않습니다. 위의 상태 안내를 먼저 확인해주세요.";
          appendBubble("assistant", message);
          document.querySelector("#state-panel")?.scrollIntoView({ behavior: "smooth", block: "start" });
          return;
        }

        location.href = detailUrl(sectionId);
      }

      function appendBubble(role, text) {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${role}`;
        bubble.textContent = text;
        els.chatLog.appendChild(bubble);
        bubble.scrollIntoView({ behavior: "smooth", block: "end" });
      }

      function answerForMessage(message) {
        const group = findGroup(state.activeGroupId);
        const base = state.access === "entitled"
          ? `${group.title} 안에서 먼저 볼 항목을 하나 골라보세요. 상세 화면에서는 결론보다 근거, 생활에서 보이는 모습, 오늘 조절할 행동 순서로 이어집니다.`
          : "지금은 상세 풀이 대신 목차만 볼 수 있어요. 결제 확인 뒤 항목을 누르면 바로 상세로 이동합니다.";
        if (/입양|합사|병원|미용|이사/.test(message)) {
          state.activeGroupId = "adoption-intro-timing";
          renderGroups();
          renderSections();
          return "입양·합사 타이밍 쪽으로 맞춰둘게요. 날짜를 맞히는 방식보다 적응 순서와 쉬어갈 시간을 먼저 봅니다.";
        }
        if (/우다다|물|긁|질투|낯/.test(message)) {
          state.activeGroupId = "trouble-pattern";
          renderGroups();
          renderSections();
          return "트러블 패턴 해석 쪽이 맞습니다. 혼내기 전에 반복되는 신호와 리셋 순서를 먼저 확인해보세요.";
        }
        if (/밥|간식|잠|수면|재택|외출/.test(message)) {
          state.activeGroupId = "routine-sync";
          renderGroups();
          renderSections();
          return "생활 루틴 싱크로 옮겨둘게요. 밥·잠·외출 리듬이 어긋나는 지점을 먼저 보면 해석이 빨라집니다.";
        }
        return base;
      }

      document.querySelector("#btn-back").addEventListener("click", () => {
        location.href = step04Url();
      });

      document.querySelector("#btn-vault").addEventListener("click", () => {
        location.href = step04Url("vault");
      });

      document.querySelector("#btn-pdf").addEventListener("click", () => {
        appendBubble("system", state.access === "entitled"
          ? "PDF는 상세 리포트가 열린 뒤 보관함에서 받을 수 있어요."
          : "PDF는 결제와 리포트 상태가 확인된 뒤 준비됩니다.");
      });

      document.querySelector("#btn-refresh").addEventListener("click", () => {
        appendBubble("system", "현재 화면 기준으로 열람 상태를 다시 표시했어요.");
        renderState();
      });

      els.stateActions.addEventListener("click", (event) => {
        const refresh = event.target.closest("[data-action='refresh']");
        if (refresh) {
          appendBubble("system", "현재 화면 기준으로 열람 상태를 다시 표시했어요.");
          renderState();
        }
      });

      document.addEventListener("click", (event) => {
        const groupButton = event.target.closest("[data-group-id]");
        if (groupButton) {
          setActiveGroup(groupButton.dataset.groupId);
          return;
        }

        const sectionButton = event.target.closest("[data-section-id]");
        if (sectionButton) openSection(sectionButton.dataset.sectionId);
      });

      document.addEventListener("error", (event) => {
        if (event.target instanceof HTMLImageElement) {
          event.target.dataset.broken = "true";
          event.target.alt = event.target.alt || "이미지를 불러오지 못했지만 목차는 계속 볼 수 있습니다.";
        }
      }, true);

      els.form.addEventListener("submit", (event) => {
        event.preventDefault();
        const message = els.message.value.trim();
        if (!message) return;
        appendBubble("user", message);
        els.message.value = "";
        els.send.disabled = true;
        window.setTimeout(() => {
          appendBubble("assistant", answerForMessage(message));
          els.send.disabled = false;
          els.message.focus();
        }, 280);
      });

      renderAll();

      if (initialSection) {
        window.setTimeout(() => {
          document.querySelector(`[data-section-id="${CSS.escape(initialSection)}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 120);
      }
    })();
  </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/js/common-auth-return.js"></script>
    <script src="/js/umsh-auth-session.js"></script>
    <script src="/js/payment-bridge.js"></script>
    <script src="/js/umsh-chrome.js"></script>
    <script src="/js/cat-service.js" defer></script>
  </body>
</html>

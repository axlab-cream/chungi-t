<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />

  <meta name="application-name" content="운명상회" />
  <meta name="apple-mobile-web-app-title" content="운명상회" />
  <meta property="og:title" content="고양이랑 나 진짜 궁합 맞아 | 상세 풀이" />

  <link rel="stylesheet" href="/css/umsh-chrome.css" />
    <style>
    @font-face {
      font-family: "Pretendard";
      src: url("/assets/fonts/Pretendard-Medium.woff2") format("woff2");
      font-weight: 500 900;
      font-display: swap;
    }

    @font-face {
      font-family: "MaruBuri";
      src: url("/assets/fonts/MaruBuri-SemiBold.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --bg: #030402;
      --panel: #0b0d08;
      --panel-strong: #12150d;
      --ink: #fff9ec;
      --muted: rgba(245, 231, 204, 0.72);
      --soft: rgba(245, 231, 204, 0.54);
      --line: rgba(239, 196, 111, 0.22);
      --gold: #efc46f;
      --gold-strong: #ffdd8f;
      --green: #a8ff18;
      --green-soft: rgba(168, 255, 24, 0.16);
      --red: #e2573d;
      --shadow: rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% -12%, rgba(168, 255, 24, 0.15), transparent 28rem),
        radial-gradient(circle at 0% 32%, rgba(239, 196, 111, 0.12), transparent 22rem),
        #000;
      color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: start center;
      overflow: hidden;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
      font: inherit;
    }

    .phone {
      width: min(100vw, 440px);
      height: 100svh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(168, 255, 24, 0.055), transparent 18rem),
        var(--bg);
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.5);
    }

    .topbar {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 70px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(4, 5, 3, 0.96);
      backdrop-filter: blur(18px);
    }

    .brand {
      min-width: 0;
      display: grid;
      gap: 3px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand span {
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
    }

    .brand strong {
      overflow: hidden;
      color: var(--ink);
      font-size: 15px;
      font-weight: 950;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar-actions,
    .nav-row {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(239, 196, 111, 0.32);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      color: var(--gold-strong);
      cursor: pointer;
    }

    .contextbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 18px;
      border-bottom: 1px solid rgba(239, 196, 111, 0.12);
      background: rgba(3, 4, 2, 0.92);
    }

    .contextbar p {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .small-action,
    .text-button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(239, 196, 111, 0.28);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--gold-strong);
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
    }

    .content {
      overflow-y: auto;
      padding: 12px 14px 16px;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    .detail-hero,
    .state-panel,
    .block,
    .related-panel,
    .nav-footer {
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 0%, rgba(239, 196, 111, 0.1), transparent 52%),
        rgba(255, 255, 255, 0.045);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.16);
    }

    .detail-hero {
      overflow: hidden;
      background: var(--panel);
    }

    .hero-media {
      position: relative;
      min-height: 268px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(168, 255, 24, 0.18), transparent 14rem),
        #050602;
    }

    .hero-media img {
      width: 100%;
      height: 100%;
      min-height: 268px;
      display: block;
      object-fit: cover;
      object-position: 50% 50%;
      opacity: 0.86;
    }

    .hero-media::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.88)),
        linear-gradient(90deg, rgba(0, 0, 0, 0.62), transparent 58%);
    }

    .hero-copy {
      display: grid;
      gap: 12px;
      padding: 16px;
    }

    .eyebrow,
    .block-kicker,
    .state-pill {
      color: var(--green);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-family: MaruBuri, Pretendard, serif;
      font-size: 30px;
      line-height: 1.17;
      letter-spacing: 0;
      word-break: keep-all;
    }

    .lead {
      color: var(--muted);
      font-size: 15px;
      font-weight: 780;
      line-height: 1.62;
      word-break: keep-all;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .meta-grid div {
      min-width: 0;
      display: grid;
      gap: 4px;
      padding: 10px;
      border: 1px solid rgba(239, 196, 111, 0.16);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.22);
    }

    .meta-grid span {
      color: var(--soft);
      font-size: 12px;
      font-weight: 850;
    }

    .meta-grid strong {
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 13px;
      font-weight: 950;
      line-height: 1.35;
    }

    .block-stack {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .block {
      display: grid;
      gap: 13px;
      padding: 15px;
    }

    .block h2,
    .state-panel h2,
    .related-panel h2 {
      color: var(--ink);
      font-size: 21px;
      line-height: 1.25;
      letter-spacing: 0;
      word-break: keep-all;
    }

    .block p,
    .state-panel p,
    .related-panel p {
      color: var(--muted);
      font-size: 14px;
      font-weight: 760;
      line-height: 1.62;
      word-break: keep-all;
    }

    .basis-list,
    .step-list,
    .action-list,
    .caution-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .basis-list li,
    .step-list li,
    .action-list li,
    .caution-list li {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 10px;
      border: 1px solid rgba(239, 196, 111, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 13px;
      font-weight: 790;
      line-height: 1.5;
      word-break: keep-all;
    }

    .marker {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--green-soft);
      color: var(--green);
      font-size: 12px;
      font-weight: 950;
    }

    .caution-list .marker {
      background: rgba(226, 87, 61, 0.14);
      color: #ff9b86;
    }

    .related-panel {
      display: grid;
      gap: 12px;
      margin-top: 12px;
      padding: 15px;
    }

    .related-list {
      display: grid;
      gap: 8px;
    }

    .related-link {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 52px;
      padding: 10px 12px;
      border: 1px solid rgba(239, 196, 111, 0.18);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(168, 255, 24, 0.1), transparent 62%),
        rgba(255, 255, 255, 0.045);
      color: var(--ink);
      text-decoration: none;
    }

    .related-link span {
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
    }

    .related-link strong {
      display: block;
      margin-top: 2px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 950;
      line-height: 1.35;
      word-break: keep-all;
    }

    .state-panel {
      display: grid;
      gap: 13px;
      padding: 16px;
      margin-top: 0;
    }

    .state-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .state-actions a,
    .state-actions button,
    .nav-footer a {
      min-height: 42px;
      display: grid;
      place-items: center;
      padding: 0 11px;
      border: 1px solid rgba(239, 196, 111, 0.28);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .state-actions .primary,
    .nav-footer .primary {
      border-color: rgba(168, 255, 24, 0.38);
      background: linear-gradient(180deg, rgba(168, 255, 24, 0.26), rgba(42, 70, 12, 0.82));
      color: #fbffe8;
    }

    .nav-footer {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 10px;
      border-radius: 0;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      background: rgba(4, 5, 3, 0.98);
    }

    .hidden {
      display: none !important;
    }

    img[data-broken="true"] {
      opacity: 0;
    }

    @media (min-width: 720px) {
      .phone {
        border-left: 1px solid rgba(239, 196, 111, 0.12);
        border-right: 1px solid rgba(239, 196, 111, 0.12);
      }
    }

    @media (max-width: 360px) {
      .meta-grid,
      .state-actions,
      .nav-footer {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 27px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }
    }
  
      /* Shared UMSH chrome. The design frames the whole page as a fixed 430x900 phone
         that scrolls inside itself; on the real site the document scrolls and the bottom
         nav is fixed to the viewport, so the frame is unwrapped here. */
      body.umsh-has-chrome .page-shell { min-height: 0; display: block; padding: 0; }
      body.umsh-has-chrome .phone {
        width: 100%;
        height: auto;
        min-height: 100svh;
        overflow: visible;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      /* Keep the fixed bottom nav clear of the page's last section. The shell publishes
         its measured height, but that can land before layout settles, so the floor keeps
         the reserve honest either way. */
      body.umsh-has-chrome { padding-bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      body.umsh-has-chrome .bottom-actions {
        bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px));
        margin-bottom: 0;
      }
      body.umsh-has-chrome .nav-footer { bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      /* UMSHChrome renders the shared bar as header.umsh-chrome-appbar inside its own
         shell, and that header still carries the page's .topbar class. Hand the box back
         so the design's own positioning cannot drag the shared bar around. */
      body.umsh-has-chrome .umsh-chrome-appbar {
        left: auto;
        right: auto;
        width: auto;
        transform: none;
        pointer-events: auto;
      }
      /* The saved 사주 profile the account already holds, shown instead of re-asking. */
      .cat-saved-profile { display: grid; gap: 6px; border: 1px solid rgba(255, 224, 150, 0.42); border-radius: 10px; background: rgba(255, 224, 150, 0.1); padding: 14px; margin-bottom: 14px; }
      .cat-saved-profile b { color: #ffe9b5; font-size: 14px; }
      .cat-saved-profile span { color: rgba(255, 248, 232, 0.78); font-size: 13px; line-height: 1.55; }
      .cat-saved-profile button { justify-self: start; margin-top: 4px; min-height: 38px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; background: rgba(255, 255, 255, 0.06); color: inherit; padding: 0 12px; font: inherit; font-weight: 800; cursor: pointer; }
</style>
</head>
<body>
  <main class="phone" data-umsh-chrome data-service="고양이 궁합" data-price="9,900원" data-active="home" id="step-6_1-report" aria-label="고양이랑 나 진짜 궁합 맞아 상세 풀이">
    <header class="appbar topbar">
      <a class="brand" id="brand-link" href="../05-step-5-chat/chat.html#step-5-chat" aria-label="결과 목록으로 돌아가기">
        <span>운명상회 · 상세 풀이</span>
        <strong>고양이랑 나 진짜 궁합 맞아</strong>
      </a>
      <div class="topbar-actions">
        <button class="icon-button" type="button" id="btn-back" aria-label="결과 목록으로">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button class="icon-button" type="button" id="btn-vault" aria-label="보관함">
          <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <div class="contextbar">
      <p id="context-label">반려묘 생활 궁합 · 상세 풀이</p>
      <button class="small-action" type="button" id="btn-pdf">PDF</button>
    </div>

    <section class="content" id="content" aria-live="polite">
      <section class="state-panel" id="loading-panel">
        <span class="state-pill">준비 중</span>
        <h2>상세 풀이를 불러오고 있어요</h2>
        <p>선택한 항목을 확인한 뒤 리포트 기준에 맞춰 보여드립니다.</p>
      </section>
    </section>

    <nav class="nav-footer hidden" id="nav-footer" aria-label="상세 항목 이동">
      <a href="../05-step-5-chat/chat.html#step-5-chat" id="nav-list">목록</a>
      <a href="#" id="nav-prev">이전</a>
      <a href="#" class="primary" id="nav-next">다음</a>
    </nav>
  </main>

  <script src="/js/cat-report-store.js"></script>
    <script>
    (() => {
      "use strict";

      const SERVICE = {
        key: "cat_compatibility",
        reportVersion: "cat-compatibility-v1",
        defaultSection: "guardian-dna",
        analysisPeriod: "current-12m"
      };

      const params = new URLSearchParams(location.search);
      const reportId = params.get("report_id") || params.get("reportId") || "";
      const profileId = params.get("profile_id") || params.get("profileId") || "";
      const sectionId = params.get("section") || SERVICE.defaultSection;
      const hasReportReference = Boolean(reportId || profileId);

      const els = {
        content: document.querySelector("#content"),
        context: document.querySelector("#context-label"),
        nav: document.querySelector("#nav-footer"),
        navList: document.querySelector("#nav-list"),
        navPrev: document.querySelector("#nav-prev"),
        navNext: document.querySelector("#nav-next"),
        brand: document.querySelector("#brand-link")
      };

      const ACCESS_COPY = {
        locked: {
          pill: "확인 필요",
          title: "상세 풀이는 결제 확인 뒤 열립니다",
          copy: "목록은 볼 수 있지만, 선택한 항목의 본문은 열람 권한이 확인된 뒤 보여드립니다.",
          actions: [["9,900원 결제 확인", "payment", true], ["목록으로", "list", false]]
        },
        no_report: {
          pill: "입력 필요",
          title: "연결된 리포트를 찾지 못했어요",
          copy: "새 분석을 시작하거나 보관함에서 기존 결과를 다시 열어주세요.",
          actions: [["새 분석", "input", true], ["보관함", "vault", false]]
        },
        generating: {
          pill: "생성 중",
          title: "아직 상세 풀이를 준비하고 있어요",
          copy: "분석이 끝나면 같은 주소에서 선택한 항목을 이어서 볼 수 있습니다.",
          actions: [["목록으로", "list", true], ["무료 티저", "step04", false]]
        },
        expired: {
          pill: "보관 만료",
          title: "보관 기간이 지난 결과예요",
          copy: "개인 입력을 주소창에 싣지 않고 새 분석이나 보관함으로 이동합니다.",
          actions: [["새 분석", "input", true], ["보관함", "vault", false]]
        },
        failed: {
          pill: "재시도",
          title: "상세 결과가 끝까지 만들어지지 않았어요",
          copy: "멈춘 화면으로 두지 않고 다시 시작할 수 있게 안내합니다.",
          actions: [["다시 시도", "input", true], ["무료 티저", "step04", false]]
        },
        forbidden: {
          pill: "권한 없음",
          title: "이 리포트의 열람 권한을 확인할 수 없어요",
          copy: "다른 계정의 결과일 수 있어 상세 본문을 열지 않습니다.",
          actions: [["보관함", "vault", true], ["새 분석", "input", false]]
        },
        network: {
          pill: "연결 확인",
          title: "연결이 잠시 불안정해요",
          copy: "상세 본문을 열기 전에 상태를 다시 확인해주세요.",
          actions: [["목록으로", "list", true], ["무료 티저", "step04", false]]
        }
      };

      function readAccessState() {
        const status = (params.get("status") || "").toLowerCase();
        if (status === "forbidden" || status === "owner_mismatch") return "forbidden";
        if (status === "expired") return "expired";
        if (status === "failed" || status === "analysis_failed") return "failed";
        if (status === "generating" || status === "loading") return "generating";
        if (status === "network_error") return "network";
        if (!hasReportReference) return "no_report";
        if (params.get("entitlement") === "verified") return "entitled";
        return "locked";
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function compact(value) {
        if (!value) return "연결 전";
        return value.length > 18 ? `${value.slice(0, 9)}...${value.slice(-5)}` : value;
      }

      function withCommonParams(url, targetSection = sectionId) {
        url.searchParams.set("section", targetSection);
        url.searchParams.set("service_key", SERVICE.key);
        if (reportId) url.searchParams.set("report_id", reportId);
        if (profileId) url.searchParams.set("profile_id", profileId);
        if (params.get("entitlement") === "verified") url.searchParams.set("entitlement", "verified");
        url.searchParams.set("analysis_period", params.get("analysis_period") || SERVICE.analysisPeriod);
        url.searchParams.set("report_version", params.get("report_version") || SERVICE.reportVersion);
        return url;
      }

      function listUrl() {
        const url = withCommonParams(new URL("../05-step-5-chat/chat.html", location.href), sectionId);
        url.hash = "step-5-chat";
        return url.toString();
      }

      function step04Url(hash = "step-4-report") {
        const url = new URL("../04-step-4-report/index.html", location.href);
        url.searchParams.set("service_key", SERVICE.key);
        if (reportId) url.searchParams.set("report_id", reportId);
        if (profileId) url.searchParams.set("profile_id", profileId);
        url.searchParams.set("analysis_period", params.get("analysis_period") || SERVICE.analysisPeriod);
        url.searchParams.set("report_version", params.get("report_version") || SERVICE.reportVersion);
        url.hash = hash;
        return url.toString();
      }

      function inputUrl() {
        const url = new URL("../02-step-2-saju-input/index.html", location.href);
        url.hash = "step-2-saju-input";
        return url.toString();
      }

      function detailUrl(targetSection) {
        const url = withCommonParams(new URL("index.html", location.href), targetSection);
        url.hash = "step-6_1-report";
        return url.toString();
      }

      function actionUrl(action) {
        if (action === "input") return inputUrl();
        if (action === "vault") return step04Url("vault");
        if (action === "payment" || action === "step04") return step04Url();
        return listUrl();
      }

      function renderState(accessKey) {
        const copy = ACCESS_COPY[accessKey] || ACCESS_COPY.locked;
        els.nav.classList.add("hidden");
        els.content.innerHTML = `
          <section class="state-panel">
            <span class="state-pill">${escapeHtml(copy.pill)}</span>
            <h2>${escapeHtml(copy.title)}</h2>
            <p>${escapeHtml(copy.copy)}</p>
            <div class="state-actions">
              ${copy.actions.map(([label, action, primary]) => `
                <a class="${primary ? "primary" : ""}" href="${escapeHtml(actionUrl(action))}">${escapeHtml(label)}</a>
              `).join("")}
            </div>
          </section>
        `;
      }

      function renderNotFound(data) {
        els.nav.classList.add("hidden");
        els.content.innerHTML = `
          <section class="state-panel">
            <span class="state-pill">항목 확인</span>
            <h2>목록에 없는 항목이에요</h2>
            <p>결과 목록에서 다시 항목을 선택해주세요. 새 항목을 임의로 만들어 보여주지는 않습니다.</p>
            <div class="state-actions">
              <a class="primary" href="${escapeHtml(listUrl())}">목록으로 돌아가기</a>
              <a href="${escapeHtml(detailUrl(data.default_section_id || SERVICE.defaultSection))}">첫 항목 보기</a>
            </div>
          </section>
        `;
      }

      function listMarkup(items, className, markerPrefix = "") {
        return `
          <ul class="${className}">
            ${items.map((item, index) => `
              <li><span class="marker">${markerPrefix === "!" ? "!" : `${markerPrefix}${index + 1}`}</span><span>${escapeHtml(item)}</span></li>
            `).join("")}
          </ul>
        `;
      }

      function blockMarkup(block) {
        if (block.type === "flow") {
          return `
            <section class="block">
              <span class="block-kicker">시기와 조건</span>
              <h2>${escapeHtml(block.title)}</h2>
              <p>${escapeHtml(block.content)}</p>
              ${listMarkup(block.steps || [], "step-list")}
            </section>
          `;
        }
        if (block.type === "action") {
          return `
            <section class="block">
              <span class="block-kicker">오늘 할 일</span>
              <h2>${escapeHtml(block.title)}</h2>
              <p>${escapeHtml(block.content)}</p>
              ${listMarkup(block.actions || [], "action-list")}
            </section>
          `;
        }
        if (block.type === "caution") {
          return `
            <section class="block">
              <span class="block-kicker">주의</span>
              <h2>${escapeHtml(block.title)}</h2>
              <p>${escapeHtml(block.content)}</p>
              ${listMarkup(block.cautions || [], "caution-list", "!")}
            </section>
          `;
        }
        return `
          <section class="block">
            <span class="block-kicker">해석</span>
            <h2>${escapeHtml(block.title)}</h2>
            <p>${escapeHtml(block.content)}</p>
          </section>
        `;
      }

      function renderDetail(data, detail) {
        document.title = `${detail.title} | 고양이랑 나 진짜 궁합 맞아 | 운명상회`;
        els.context.textContent = `${detail.group_title} · ${compact(reportId)}`;
        els.brand.href = listUrl();
        const related = detail.related_sections || [];
        const previous = related.find((item) => item.relation === "이전 항목") || related[0];
        const next = related.find((item) => item.relation === "다음 항목") || related[1] || related[0];
        els.navList.href = listUrl();
        els.navPrev.href = previous ? detailUrl(previous.section_id) : listUrl();
        els.navNext.href = next ? detailUrl(next.section_id) : listUrl();
        els.nav.classList.remove("hidden");

        els.content.innerHTML = `
          <article class="detail-hero">
            <div class="hero-media">
              <img src="${escapeHtml(detail.image.filename)}" alt="${escapeHtml(detail.image.alt)}" loading="eager" />
            </div>
            <div class="hero-copy">
              <span class="eyebrow">${escapeHtml(detail.gate)} · ${escapeHtml(detail.group_title)}</span>
              <h1>${escapeHtml(detail.title)}</h1>
              <p class="lead">${escapeHtml(detail.conclusion)}</p>
              <div class="meta-grid" aria-label="상세 기준">
                <div><span>분류</span><strong>${escapeHtml(data.service.category)}</strong></div>
                <div><span>흐름</span><strong>현재~12개월</strong></div>
                <div><span>기준</span><strong>${escapeHtml(detail.lens)}</strong></div>
              </div>
            </div>
          </article>

          <div class="block-stack">
            <section class="block">
              <span class="block-kicker">풀이 기준</span>
              <h2>무엇을 보고 읽었나</h2>
              <p>고양이 생년월일시가 없거나 불명확한 경우까지 고려해, 보호자 사주와 고양이 행동 프로필, 생활 루틴, 공간 조건을 함께 봅니다.</p>
              ${listMarkup(detail.basis_summary.basis || [], "basis-list")}
            </section>
            ${detail.interpretation_blocks.map(blockMarkup).join("")}
          </div>

          <section class="related-panel">
            <span class="block-kicker">연관 항목</span>
            <h2>이어 보면 좋은 장</h2>
            <p>같은 리포트 안에서 흐름이 이어지는 항목입니다.</p>
            <div class="related-list">
              ${related.map((item) => `
                <a class="related-link" href="${escapeHtml(detailUrl(item.section_id))}">
                  <span><span>${escapeHtml(item.relation)}</span><strong>${escapeHtml(item.title)}</strong></span>
                  <span aria-hidden="true">›</span>
                </a>
              `).join("")}
            </div>
          </section>
        `;
      }

      async function loadDetail() {
        const access = readAccessState();
        if (access !== "entitled") {
          renderState(access);
          return;
        }

        try {
          const response = await fetch("detail-data.json", { cache: "no-store" });
          if (!response.ok) throw new Error("detail data missing");
          const data = await response.json();
          const detail = data.details.find((entry) => entry.section_id === sectionId);
          if (!detail) {
            renderNotFound(data);
            return;
          }
          renderDetail(data, detail);
        } catch (error) {
          renderState("network");
        }
      }

      document.querySelector("#btn-back").addEventListener("click", () => {
        location.href = listUrl();
      });

      document.querySelector("#btn-vault").addEventListener("click", () => {
        location.href = step04Url("vault");
      });

      document.querySelector("#btn-pdf").addEventListener("click", () => {
        if (window.UMSHReportPdf && window.UMSHReportPdf.openFromStorage()) return;
        window.print();
      });

      document.addEventListener("error", (event) => {
        if (event.target instanceof HTMLImageElement) {
          event.target.dataset.broken = "true";
          event.target.alt = event.target.alt || "이미지를 불러오지 못했지만 상세 풀이를 계속 볼 수 있습니다.";
        }
      }, true);

      loadDetail();
    })();
  </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/js/common-auth-return.js"></script>
    <script src="/js/umsh-auth-session.js"></script>
    <script src="/js/payment-bridge.js"></script>
    <script src="/js/umsh-chrome.js"></script>
    <script src="/js/cat-service.js" defer></script>
  </body>
</html>

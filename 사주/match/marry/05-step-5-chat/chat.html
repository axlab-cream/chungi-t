<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>연애 말고 결혼까지 가능? | 결과 목차</title>
  <meta name="description" content="운명상회 결혼궁합 리포트의 대분류와 중분류를 확인하고 원하는 상세 풀이로 이어갑니다." />
  <meta name="application-name" content="운명상회" />
  <meta property="og:title" content="연애 말고 결혼까지 가능?" />
  <meta property="og:description" content="배우자궁, 대운, 합충 흐름을 바탕으로 결혼까지 볼 관계인지 현실적으로 살펴봅니다." />
  <meta property="og:site_name" content="운명상회" />
  <meta property="og:url" content="https://match.umsh.kr/marry" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #100b10;
      --panel: #191116;
      --panel-2: #21171d;
      --line: rgba(246, 213, 169, 0.18);
      --line-strong: rgba(246, 213, 169, 0.34);
      --text: #fff8ef;
      --muted: #d3b7a1;
      --soft: #a98f81;
      --gold: #f0c176;
      --rose: #f19192;
      --wine: #742d3e;
      --mint: #7ec7ad;
      --ink: #090609;
      --shadow: 0 18px 58px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 5%, rgba(241, 145, 146, 0.18), transparent 28%),
        radial-gradient(circle at 86% 22%, rgba(126, 199, 173, 0.12), transparent 26%),
        linear-gradient(180deg, #21121b 0%, #100b10 44%, #070507 100%);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: center;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .phone {
      position: relative;
      width: min(100vw, 444px);
      min-height: 100svh;
      background:
        linear-gradient(180deg, rgba(36, 22, 30, 0.94), rgba(13, 9, 12, 0.98)),
        var(--bg);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(246, 213, 169, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(246, 213, 169, 0.05) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.5), transparent 58%);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 10px;
      background: rgba(16, 11, 16, 0.86);
      border-bottom: 1px solid rgba(246, 213, 169, 0.12);
      backdrop-filter: blur(16px);
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(246, 213, 169, 0.18);
      border-radius: 8px;
      background: rgba(255, 248, 239, 0.06);
      color: var(--text);
      cursor: pointer;
    }

    .brand {
      min-width: 0;
      text-align: center;
    }

    .brand strong {
      display: block;
      font-size: 15px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .contextbar {
      position: sticky;
      top: 61px;
      z-index: 15;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 16px;
      background: rgba(16, 11, 16, 0.78);
      border-bottom: 1px solid rgba(246, 213, 169, 0.1);
      scrollbar-width: none;
      backdrop-filter: blur(12px);
    }

    .contextbar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(246, 213, 169, 0.18);
      border-radius: 7px;
      background: rgba(255, 248, 239, 0.06);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .chip.is-strong {
      color: #18100c;
      background: linear-gradient(135deg, var(--gold), #f6e1ad);
      border-color: rgba(255, 236, 184, 0.8);
    }

    .chat-log {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 14px;
      padding: 16px 16px 112px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 188px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(116, 45, 62, 0.55), rgba(16, 11, 16, 0.94)),
        var(--panel);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -42px;
      top: -52px;
      width: 160px;
      height: 160px;
      border: 1px solid rgba(240, 193, 118, 0.26);
      border-radius: 50%;
      background:
        conic-gradient(from 110deg, rgba(240, 193, 118, 0.16), transparent, rgba(126, 199, 173, 0.12), transparent);
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 14px;
      padding: 18px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 18px rgba(126, 199, 173, 0.82);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      max-width: 320px;
      font-size: 28px;
      line-height: 1.14;
      font-weight: 950;
    }

    .hero p {
      max-width: 340px;
      color: #ead4bd;
      font-size: 14px;
      line-height: 1.62;
    }

    .mini-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .mini-stat {
      min-width: 0;
      min-height: 62px;
      padding: 10px;
      border: 1px solid rgba(246, 213, 169, 0.16);
      border-radius: 8px;
      background: rgba(9, 6, 9, 0.34);
    }

    .mini-stat span {
      display: block;
      color: var(--soft);
      font-size: 10px;
      font-weight: 800;
    }

    .mini-stat strong {
      display: block;
      margin-top: 5px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.26;
    }

    .notice {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--gold);
      border-radius: 8px;
      background: rgba(255, 248, 239, 0.06);
    }

    .notice[data-state="entitled"] {
      border-left-color: var(--mint);
    }

    .notice[data-state="locked"],
    .notice[data-state="missing"] {
      border-left-color: var(--rose);
    }

    .notice strong {
      font-size: 15px;
    }

    .notice p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .notice-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(246, 213, 169, 0.22);
      border-radius: 7px;
      background: rgba(255, 248, 239, 0.07);
      color: var(--text);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .action-button.primary {
      background: linear-gradient(135deg, var(--gold), #f5e0ad);
      color: #160d08;
      border-color: transparent;
    }

    .toolbar {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(246, 213, 169, 0.14);
      border-radius: 8px;
      background: rgba(9, 6, 9, 0.28);
    }

    .search {
      display: grid;
      grid-template-columns: 18px 1fr;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 10px;
      border: 1px solid rgba(246, 213, 169, 0.18);
      border-radius: 7px;
      background: rgba(255, 248, 239, 0.06);
      color: var(--muted);
    }

    .search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }

    .search input::placeholder {
      color: #9e8274;
    }

    .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 0 11px;
      border: 1px solid rgba(246, 213, 169, 0.16);
      border-radius: 7px;
      background: rgba(255, 248, 239, 0.04);
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .filter.is-active {
      color: #150d08;
      background: var(--gold);
      border-color: transparent;
    }

    .list-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      padding: 2px 2px 0;
    }

    .list-head h2 {
      font-size: 17px;
      line-height: 1.25;
    }

    .list-head span {
      color: var(--soft);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .group-list {
      display: grid;
      gap: 12px;
    }

    .result-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 248, 239, 0.055);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
    }

    .card-cover {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #1a1016;
    }

    .card-cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.01);
    }

    .card-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(8, 5, 7, 0) 42%, rgba(8, 5, 7, 0.88) 100%),
        linear-gradient(90deg, rgba(8, 5, 7, 0.56), transparent 52%);
    }

    .cover-copy {
      position: absolute;
      z-index: 1;
      left: 14px;
      right: 14px;
      bottom: 13px;
      display: grid;
      gap: 5px;
    }

    .cover-copy span {
      color: var(--gold);
      font-size: 11px;
      font-weight: 950;
    }

    .cover-copy h3 {
      font-size: 22px;
      line-height: 1.18;
      font-weight: 950;
    }

    .card-body {
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .group-summary {
      color: #dfc8b3;
      font-size: 13px;
      line-height: 1.55;
    }

    .why {
      display: grid;
      gap: 4px;
      padding: 10px;
      border: 1px solid rgba(126, 199, 173, 0.22);
      border-radius: 7px;
      background: rgba(126, 199, 173, 0.08);
    }

    .why span {
      color: var(--mint);
      font-size: 10px;
      font-weight: 950;
    }

    .why p {
      color: #d7c9b8;
      font-size: 12px;
      line-height: 1.48;
    }

    .section-list {
      display: grid;
      gap: 7px;
    }

    .section-link {
      display: grid;
      grid-template-columns: 34px 1fr 20px;
      align-items: center;
      gap: 9px;
      min-height: 58px;
      padding: 9px;
      border: 1px solid rgba(246, 213, 169, 0.13);
      border-radius: 8px;
      background: rgba(9, 6, 9, 0.28);
    }

    .section-link.is-active {
      border-color: rgba(240, 193, 118, 0.62);
      background: rgba(240, 193, 118, 0.1);
    }

    .section-link.is-locked {
      opacity: 0.78;
    }

    .section-no {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      color: #170f0a;
      background: linear-gradient(135deg, #f1c883, #f5e3b9);
      font-size: 11px;
      font-weight: 950;
    }

    .section-copy {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .section-copy strong {
      display: block;
      color: #fff8ef;
      font-size: 13px;
      line-height: 1.32;
    }

    .section-copy span {
      display: block;
      color: var(--soft);
      font-size: 11px;
      line-height: 1.42;
    }

    .section-arrow {
      color: var(--gold);
    }

    .empty {
      padding: 18px;
      border: 1px dashed rgba(246, 213, 169, 0.24);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .composer {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      width: min(100vw, 444px);
      padding: 12px 14px max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: rgba(16, 11, 16, 0.94);
      border-top: 1px solid rgba(246, 213, 169, 0.16);
      backdrop-filter: blur(18px);
    }

    .composer textarea {
      width: 100%;
      min-height: 46px;
      max-height: 92px;
      resize: none;
      border: 1px solid rgba(246, 213, 169, 0.18);
      border-radius: 8px;
      outline: 0;
      padding: 11px 12px;
      color: var(--text);
      background: rgba(255, 248, 239, 0.07);
      line-height: 1.35;
    }

    .composer textarea::placeholder {
      color: #9f8779;
    }

    .send-btn {
      width: 72px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--gold), #f6e0aa);
      color: #180f09;
      font-size: 13px;
      font-weight: 950;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 82px;
      z-index: 40;
      width: min(calc(100vw - 32px), 412px);
      padding: 11px 12px;
      border: 1px solid rgba(246, 213, 169, 0.26);
      border-radius: 8px;
      background: rgba(25, 17, 22, 0.96);
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      box-shadow: var(--shadow);
    }

    .toast.is-open {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .skeleton {
      overflow: hidden;
      position: relative;
    }

    .skeleton::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    @media (min-width: 720px) {
      body {
        padding: 24px;
      }

      .phone {
        border: 1px solid rgba(246, 213, 169, 0.2);
        border-radius: 22px;
        min-height: min(920px, calc(100svh - 48px));
        max-height: calc(100svh - 48px);
        overflow-y: auto;
      }

      .composer {
        position: sticky;
        transform: none;
        left: auto;
        width: 100%;
      }
    }
  
      /* Shared UMSH chrome: keep the fixed bottom nav from covering the page tail.
         The shell publishes its measured height in --umsh-chrome-bottom-h, but that
         measurement can land before layout settles and report far less than the nav's
         real 74px, so the floor keeps the reserve honest either way. */
      body.umsh-has-chrome .phone { padding-bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      /* The story hero filled the viewport minus the design's own 64px bar. It now shares the
         screen with a taller app bar and the bottom nav; a fixed share keeps both CTAs above
         the fold without depending on a chrome height that may not be measured yet. */
      body.umsh-has-chrome #step-1-story .hero { min-height: 62svh; }
      body.umsh-has-chrome .composer { bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      body.umsh-has-chrome .chat-log, body.umsh-has-chrome .screen { padding-bottom: calc(112px + max(74px, var(--umsh-chrome-bottom-h, 74px))); }
      body.umsh-has-chrome .footer { padding-bottom: 18px; }
      /* The teaser cards were sized for one short sample sentence. Real readings run longer,
         and three columns inside a 375px phone wrapped them to two or three words per line. */
      .teaser-grid { grid-template-columns: 1fr; }
      .teaser-grid .mini-card { min-height: 0; gap: 4px; padding: 12px 14px; }
      .marry-saved-profile { display: grid; gap: 6px; border: 1px solid rgba(240, 192, 111, 0.45); border-radius: 10px; background: rgba(240, 192, 111, 0.08); padding: 14px; margin-bottom: 14px; }
      .marry-saved-profile b { color: var(--gold, #f0c06f); font-size: 14px; }
      .marry-saved-profile span { color: var(--muted, rgba(255,239,220,.74)); font-size: 13px; line-height: 1.55; }
      .marry-saved-profile button { justify-self: start; margin-top: 4px; min-height: 38px; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; background: rgba(255,255,255,.06); color: inherit; padding: 0 12px; font: inherit; font-weight: 800; cursor: pointer; }
</style>
    <link rel="stylesheet" href="/css/umsh-chrome.css" />
  </head>
<body>
  <main class="phone" data-umsh-chrome data-service="결혼궁합" data-price="24,900원" data-active="home" id="step-5-chat" aria-label="결혼궁합 결과 목차">
    <header class="appbar topbar">
      <button class="icon-button" type="button" id="btn-back" aria-label="이전 결과로">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div class="brand">
        <strong>운명상회</strong>
        <span>결혼궁합 리포트</span>
      </div>
      <button class="icon-button" type="button" id="btn-vault" aria-label="보관함">
        <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 5h14v14H5zM8 9h8M8 13h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </header>

    <div class="contextbar" aria-label="리포트 상태">
      <span class="chip is-strong">결혼궁합</span>
      <span class="chip" id="report-chip">10개 대분류</span>
      <span class="chip" id="person-chip">두 사람 기준 확인</span>
      <span class="chip">24,900원 리포트</span>
    </div>

    <section class="chat-log" id="chat-log" aria-live="polite">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-inner">
          <div class="eyebrow">05 결과 목차</div>
          <h1 id="hero-title">연애 말고 결혼까지 가능?</h1>
          <p id="hero-copy">결혼 여부를 단정하지 않고, 지금 관계를 결혼각 있음·속도 조절각·현실 합의 필요·대화 먼저 각으로 나눠 읽습니다.</p>
          <div class="mini-stats" aria-label="리포트 요약">
            <div class="mini-stat">
              <span>목차</span>
              <strong>10개 대분류</strong>
            </div>
            <div class="mini-stat">
              <span>세부</span>
              <strong>70개 항목</strong>
            </div>
            <div class="mini-stat">
              <span>기준</span>
              <strong>배우자궁·대운·합충</strong>
            </div>
          </div>
        </div>
      </section>

      <section class="notice" id="access-notice" data-state="missing">
        <strong id="notice-title">리포트 상태 확인 중</strong>
        <p id="notice-copy">이전 단계에서 만든 리포트와 결제 권한을 확인하고 있어요.</p>
        <div class="notice-actions" id="notice-actions"></div>
      </section>

      <section class="toolbar" aria-label="목차 탐색">

          ["marry-10-04", "현생 궁합", "일, 돈, 시간, 가족 현실에서 맞춰갈 수 있는지 봅니다."],

          ["marry-10-07", "안정감 레벨", "상대와 함께 있을 때 마음이 놓이는 정도를 봅니다."],
          ["marry-10-08", "속도조절 알림", "지금 더 밀기보다 속도를 맞춰야 하는 신호를 확인합니다."],

    const elements = {
      reportChip: document.querySelector("#report-chip"),
      personChip: document.querySelector("#person-chip"),
      notice: document.querySelector("#access-notice"),
      noticeTitle: document.querySelector("#notice-title"),
      noticeCopy: document.querySelector("#notice-copy"),
      noticeActions: document.querySelector("#notice-actions"),
      list: document.querySelector("#group-list"),
      visibleCount: document.querySelector("#visible-count"),
      search: document.querySelector("#index-search"),
      filters: document.querySelectorAll(".filter"),
      form: document.querySelector("#chat-form"),
      message: document.querySelector("#chat-message"),
      toast: document.querySelector("#toast"),
    };

    const state = {
      filter: "all",
      query: "",
      selectedSectionId: "",
      access: "missing",
      toastTimer: 0,
    };

    function routeFor(sectionId) {
      return `../06-step-6_1-report-detail/index.html?section=${encodeURIComponent(sectionId)}#step-6_1-report`;
    }

    function readJson(key, fallback = null) {
      try {
        const value = sessionStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function writeJson(key, value) {
      sessionStorage.setItem(key, JSON.stringify(value));
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function enrichedGroups() {
      return baseGroups.map((group, groupIndex) => ({
        ...group,
        order: groupIndex + 1,
        items: group.items.map(([sectionId, title, preview], itemIndex) => ({
          section_id: sectionId,
          title,
          preview,
          why_needed: group.why,
          evidence_ids: group.evidence_ids,
          asset_key: group.asset_key,
          route: routeFor(sectionId),
          order: itemIndex + 1,
        })),
      }));
    }

    function buildReportIndex() {
      const context = readJson(storageKeys.reportContext, {});
      const stored = readJson(storageKeys.reportIndex, {});
      return {
        report_id: context.report_id || stored.report_id || "preview-only",
        source: "user_seed",
        service_key: service.service_key,
        service_slug: service.service_slug,
        groups: enrichedGroups(),
      };
    }

    function resolveAccess() {
      const input = readJson(storageKeys.input, null);
      const context = readJson(storageKeys.reportContext, null);
      const query = new URLSearchParams(location.search);
      const queryReportId = query.get("reportId") || "";
      const accessState = sessionStorage.getItem(storageKeys.accessState) || "guest";
      const paymentState = sessionStorage.getItem(storageKeys.paymentState) || "";
      const networkState = sessionStorage.getItem(storageKeys.networkState) || "";
      const generationState = sessionStorage.getItem(storageKeys.generationState) || "";

      if (!input && !context) return "expired";
      if (!context || !context.report_id) return "missing";
      if (context.service_key && context.service_key !== service.service_key) return "wrong";
      if (queryReportId && queryReportId !== context.report_id) return "wrong";
      if (networkState === "error") return "network_error";
      if (generationState === "generating") return "generating";
      if (accessState === "entitled" || paymentState === "paid") return "entitled";
      return "locked";
    }

    function selectedPayload(section) {
      return {
        service_key: service.service_key,
        service_slug: service.service_slug,
        report_id: buildReportIndex().report_id,
        section_id: section.section_id,
        section_title: section.title,
        route: section.route,
        selected_at: new Date().toISOString(),
      };
    }

    function showToast(message) {
      clearTimeout(state.toastTimer);
      elements.toast.textContent = message;
      elements.toast.classList.add("is-open");
      state.toastTimer = setTimeout(() => {
        elements.toast.classList.remove("is-open");
      }, 2600);
    }

    function actionButton(label, action, primary = false) {
      return `<button class="action-button${primary ? " primary" : ""}" type="button" data-notice-action="${escapeHtml(action)}">${escapeHtml(label)}</button>`;
    }

    function renderNotice() {
      const copy = {
        entitled: {
          title: "전체 리포트 목차가 열렸어요",
          text: "보고 싶은 중분류를 누르면 해당 상세 풀이로 바로 이어집니다. 상세 화면에서도 이 목차 기준을 그대로 사용합니다.",
          actions: [actionButton("첫 항목 보기", "first", true), actionButton("04 결과로", "back")],
        },
        locked: {
          title: "상세 풀이는 결제 권한 확인 후 열려요",
          text: "목차와 예고는 볼 수 있지만, 각 항목의 개인화 상세 풀이는 24,900원 결제와 주문 확인 뒤 열립니다.",
          actions: [actionButton("결제 화면으로", "pay", true), actionButton("입력 수정", "edit")],
        },
        missing: {
          title: "연결된 리포트를 찾지 못했어요",
          text: "이전 단계에서 만든 결과가 없거나 아직 저장되지 않았습니다. 새 분석으로 다시 연결하거나 04 결과 화면에서 이어가 주세요.",
          actions: [actionButton("04 결과로", "back", true), actionButton("새 분석", "edit"), actionButton("재시도", "retry")],
        },
        expired: {
          title: "입력 정보가 만료됐어요",
          text: "두 사람 기준을 다시 입력하면 무료 티저와 결제 전 목차를 복구할 수 있습니다.",
          actions: [actionButton("새 분석", "edit", true), actionButton("04 결과로", "back")],
        },
        generating: {
          title: "리포트 목차를 정리하는 중이에요",
          text: "이미 만든 목차는 유지하고, 생성이 끝나면 상세 항목을 열 수 있게 바뀝니다.",
          actions: [actionButton("새로 확인", "retry", true), actionButton("04 결과로", "back")],
        },
        network_error: {
          title: "연결이 잠시 불안정해요",
          text: "마지막 정상 목차는 유지했습니다. 다시 확인하면 상세 접근 상태를 새로 맞춥니다.",
          actions: [actionButton("다시 확인", "retry", true), actionButton("04 결과로", "back")],
        },
        wrong: {
          title: "이 리포트는 현재 사용자 권한과 맞지 않아요",
          text: "다른 사용자의 리포트이거나 주문 확인이 맞지 않는 경우 상세 접근을 막습니다.",
          actions: [actionButton("04 결과로", "back", true), actionButton("새 분석", "edit")],
        },
      }[state.access];

      elements.notice.dataset.state = state.access;
      elements.noticeTitle.textContent = copy.title;
      elements.noticeCopy.textContent = copy.text;
      elements.noticeActions.innerHTML = copy.actions.join("");
      if (state.access === "generating") elements.notice.classList.add("skeleton");
      else elements.notice.classList.remove("skeleton");
    }

    function groupMatches(group) {
      const filterOk = state.filter === "all" || group.filter === state.filter;
      if (!filterOk) return false;
      if (!state.query) return true;
      const haystack = [
        group.title,
        group.subtitle,
        group.preview,
        ...group.items.map((item) => `${item.title} ${item.preview}`),
      ].join(" ").toLowerCase();
      return haystack.includes(state.query);
    }

    function itemHtml(group, item) {
      const isActive = item.section_id === state.selectedSectionId;
      const locked = state.access !== "entitled";
      return `
        <a
          class="section-link${isActive ? " is-active" : ""}${locked ? " is-locked" : ""}"
          href="${escapeHtml(item.route)}"
          data-section-id="${escapeHtml(item.section_id)}"
          data-group-id="${escapeHtml(group.id)}"
          data-section-title="${escapeHtml(item.title)}"
          aria-disabled="${locked ? "true" : "false"}"
        >
          <span class="section-no">${String(group.order).padStart(2, "0")}-${String(item.order).padStart(2, "0")}</span>
          <span class="section-copy">
            <strong>${escapeHtml(item.title)}</strong>
            <span>${escapeHtml(item.preview)}</span>
          </span>
          <svg class="section-arrow" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
      `;
    }

    function groupHtml(group) {
      return `
        <article class="result-card" data-group-id="${escapeHtml(group.id)}" data-asset-key="${escapeHtml(group.asset_key)}">
          <div class="card-cover">
            <img src="${escapeHtml(group.image)}" alt="${escapeHtml(group.image_alt)}" loading="lazy" />
            <div class="cover-copy">
              <span>${String(group.order).padStart(2, "0")} · ${escapeHtml(group.subtitle)}</span>
              <h3>${escapeHtml(group.title)}</h3>
            </div>
          </div>
          <div class="card-body">
            <p class="group-summary">${escapeHtml(group.preview)}</p>
            <div class="why">
              <span>필요한 이유</span>
              <p>${escapeHtml(group.why)}</p>
            </div>
            <div class="section-list">
              ${group.items.map((item) => itemHtml(group, item)).join("")}
            </div>
          </div>
        </article>
      `;
    }

    function renderGroups() {
      const groups = buildReportIndex().groups.filter(groupMatches);
      const count = groups.reduce((sum, group) => sum + group.items.length, 0);
      elements.visibleCount.textContent = `${count}개 항목`;
      elements.list.innerHTML = groups.length
        ? groups.map(groupHtml).join("")
        : '<div class="empty">검색 조건에 맞는 항목이 없습니다.</div>';
      elements.list.querySelectorAll("img").forEach((img) => {
        img.addEventListener("error", () => {
          img.closest(".card-cover")?.classList.add("image-missing");
          img.alt = "이미지를 불러오지 못한 목차 카드";
        }, { once: true });
      });
    }

    function updateContextChips() {
      const input = readJson(storageKeys.input, null);
      const context = readJson(storageKeys.reportContext, null);
      const reportIndex = buildReportIndex();
      const itemCount = reportIndex.groups.reduce((sum, group) => sum + group.items.length, 0);
      elements.reportChip.textContent = `${reportIndex.groups.length}개 대분류 · ${itemCount}개 항목`;
      if (input?.partner?.known) {
        const selfName = input.self?.name || "나";
        const partnerName = input.partner?.name || "상대";
        elements.personChip.textContent = `${selfName} × ${partnerName}`;
        return;
      }
      if (context?.profile_id) {
        elements.personChip.textContent = "저장된 리포트 기준";
        return;
      }
      elements.personChip.textContent = "두 사람 기준 확인";
    }

    function findSection(sectionId) {
      for (const group of buildReportIndex().groups) {
        const found = group.items.find((item) => item.section_id === sectionId);
        if (found) return { group, section: found };
      }
      return null;
    }

    function firstVisibleSection() {
      const groups = buildReportIndex().groups.filter(groupMatches);
      return groups[0]?.items[0] || buildReportIndex().groups[0]?.items[0] || null;
    }

    function canOpenDetail() {
      return state.access === "entitled";
    }

    function selectAndMaybeOpen(sectionId, route, openDetail) {
      const found = findSection(sectionId);
      if (!found) {
        showToast("선택한 항목을 찾지 못했어요.");
        return;
      }
      state.selectedSectionId = sectionId;
      writeJson(storageKeys.reportIndex, buildReportIndex());
      writeJson(storageKeys.selectedSection, selectedPayload(found.section));
      renderGroups();

      if (!openDetail) return;
      if (!canOpenDetail()) {
        const message = state.access === "generating"
          ? "생성이 끝나면 이 항목을 열 수 있어요."
          : "상세 풀이는 결제 권한 확인 후 열립니다.";
        showToast(message);
        return;
      }
      window.location.href = route || found.section.route;
    }

    function handleNoticeAction(action) {
      if (action === "first") {
        const section = firstVisibleSection();
        if (section) selectAndMaybeOpen(section.section_id, section.route, true);
        return;
      }
      if (action === "pay" || action === "back") {
        window.location.href = "../04-step-4-report/index.html#step-4-report";
        return;
      }
      if (action === "edit") {
        window.location.href = "../02-step-2-saju-input/index.html#step-2-saju-input";
        return;
      }
      if (action === "retry") {
        sessionStorage.removeItem(storageKeys.networkState);
        state.access = resolveAccess();
        renderNotice();
        renderGroups();
        showToast("상태를 다시 확인했습니다.");
      }
    }

    function init() {
      state.access = resolveAccess();
      const storedSelection = readJson(storageKeys.selectedSection, null);
      state.selectedSectionId = storedSelection?.section_id || "";
      writeJson(storageKeys.reportIndex, buildReportIndex());
      updateContextChips();
      renderNotice();
      renderGroups();
    }

    document.querySelector("#btn-back").addEventListener("click", () => {
      window.location.href = "../04-step-4-report/index.html#step-4-report";
    });

    document.querySelector("#btn-vault").addEventListener("click", () => {
      sessionStorage.setItem(storageKeys.requestedVault, "true");
      showToast("보관함은 로그인된 리포트 기준으로 연결됩니다.");
    });

    elements.noticeActions.addEventListener("click", (event) => {
      const button = event.target.closest("[data-notice-action]");
      if (!button) return;
      handleNoticeAction(button.dataset.noticeAction);
    });

    elements.list.addEventListener("click", (event) => {
      const link = event.target.closest("[data-section-id]");
      if (!link) return;
      event.preventDefault();
      selectAndMaybeOpen(link.dataset.sectionId, link.getAttribute("href"), true);
    });

    elements.search.addEventListener("input", () => {
      state.query = elements.search.value.trim().toLowerCase();
      renderGroups();
    });

    elements.filters.forEach((button) => {
      button.addEventListener("click", () => {
        elements.filters.forEach((item) => item.classList.remove("is-active"));
        button.classList.add("is-active");
        state.filter = button.dataset.filter;
        renderGroups();
      });
    });

    elements.form.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = elements.message.value.trim();
      const selected = state.selectedSectionId ? findSection(state.selectedSectionId)?.section : firstVisibleSection();
      if (!selected) {
        showToast("먼저 상담할 항목을 선택해 주세요.");
        return;
      }
      writeJson(storageKeys.chatSeed, {
        service_key: service.service_key,
        report_id: buildReportIndex().report_id,
        section_id: selected.section_id,
        section_title: selected.title,
        message,
        created_at: new Date().toISOString(),
      });
      elements.message.value = "";
      selectAndMaybeOpen(selected.section_id, selected.route, true);
    });

    init();
  </script>

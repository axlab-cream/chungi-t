<html lang="ko">
<head>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0a0f;
      --panel: #191116;
      --panel-2: #21171d;
      --line: rgba(246, 213, 169, 0.18);
      --line-strong: rgba(246, 213, 169, 0.32);
      --text: #fff8ef;
      --muted: #d7bba5;
      --soft: #a99183;
      --gold: #f0c176;
      --rose: #f19192;
      --wine: #742d3e;
      --mint: #7ec7ad;
      --blue: #88b8df;
      --ink: #090609;
      --shadow: 0 18px 58px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 12% 4%, rgba(241, 145, 146, 0.16), transparent 26%),
        radial-gradient(circle at 86% 14%, rgba(126, 199, 173, 0.11), transparent 25%),
        linear-gradient(180deg, #21121b 0%, #0f0a0f 48%, #070507 100%);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: center;
    }

    button,
    textarea {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .phone {
      position: relative;
      width: min(100vw, 444px);
      min-height: 100svh;
      background:
        linear-gradient(180deg, rgba(35, 22, 30, 0.94), rgba(13, 9, 12, 0.99)),
        var(--bg);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(246, 213, 169, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(246, 213, 169, 0.045) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.52), transparent 58%);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 10px;
      background: rgba(15, 10, 15, 0.88);
      border-bottom: 1px solid rgba(246, 213, 169, 0.12);
      backdrop-filter: blur(16px);
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(246, 213, 169, 0.18);
      border-radius: 8px;
      background: rgba(255, 248, 239, 0.06);
      color: var(--text);
      cursor: pointer;
    }

    .brand {
      min-width: 0;
      text-align: center;
    }

    .brand strong {
      display: block;
      font-size: 15px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .contextbar {
      position: sticky;
      top: 61px;
      z-index: 25;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 16px;
      background: rgba(15, 10, 15, 0.78);
      border-bottom: 1px solid rgba(246, 213, 169, 0.1);
      scrollbar-width: none;
      backdrop-filter: blur(12px);
    }

    .contextbar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(246, 213, 169, 0.18);
      border-radius: 7px;
      background: rgba(255, 248, 239, 0.06);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .chip.is-strong {
      color: #18100c;
      background: linear-gradient(135deg, var(--gold), #f6e1ad);
      border-color: rgba(255, 236, 184, 0.8);
    }

    .screen {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 14px;
      padding: 16px 16px 112px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .hero {
      position: relative;
      min-height: 480px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1b1118;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transform: scale(1.01);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(8, 5, 8, 0.12) 0%, rgba(8, 5, 8, 0.16) 42%, rgba(8, 5, 8, 0.95) 100%),
        linear-gradient(90deg, rgba(8, 5, 8, 0.54), transparent 58%);
    }

    .hero-copy {
      position: absolute;
      z-index: 1;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: grid;
      gap: 10px;
    }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 7px;
      min-height: 27px;
      padding: 0 9px;
      border: 1px solid rgba(240, 193, 118, 0.36);
      border-radius: 7px;
      background: rgba(9, 6, 9, 0.54);
      color: var(--gold);
      font-size: 11px;
      font-weight: 950;
    }

    h1 {
      max-width: 360px;
      font-size: 28px;
      line-height: 1.14;
      font-weight: 950;
    }

    .hero-copy p {
      color: #ead4bd;
      font-size: 14px;
      line-height: 1.58;
    }

    .panel {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 248, 239, 0.055);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
    }

    .panel-head h2 {
      font-size: 17px;
      line-height: 1.28;
    }

    .panel-head span {
      flex: 0 0 auto;
      color: var(--gold);
      font-size: 11px;
      font-weight: 950;
    }

    .body-copy {
      display: grid;
      gap: 9px;
      color: #dec6b1;
      font-size: 14px;
      line-height: 1.62;
    }

    .basis-grid {
      display: grid;
      gap: 8px;
    }

    .basis-row {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 10px;
      padding: 10px;
      border: 1px solid rgba(246, 213, 169, 0.13);
      border-radius: 8px;
      background: rgba(9, 6, 9, 0.28);
    }

    .basis-row strong {
      color: var(--gold);
      font-size: 12px;
      line-height: 1.35;
    }

    .basis-row span {
      color: #dac5b3;
      font-size: 12px;
      line-height: 1.48;
    }

    .signal-list {
      display: grid;
      gap: 9px;
    }

    .signal-card {
      display: grid;
      gap: 7px;
      padding: 12px;
      border: 1px solid rgba(126, 199, 173, 0.22);
      border-radius: 8px;
      background: rgba(126, 199, 173, 0.075);
    }

    .signal-card strong {
      color: var(--mint);
      font-size: 13px;
    }

    .signal-card p {
      color: #ddcbb9;
      font-size: 13px;
      line-height: 1.55;
    }

    .condition-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .condition {
      min-width: 0;
      min-height: 86px;
      display: grid;
      align-content: start;
      gap: 6px;
      padding: 10px;
      border: 1px solid rgba(246, 213, 169, 0.16);
      border-radius: 8px;
      background: rgba(9, 6, 9, 0.28);
    }

    .condition i {
      display: block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 18px rgba(240, 193, 118, 0.48);
    }

    .condition:nth-child(2) i {
      background: var(--mint);
    }

    .condition:nth-child(3) i {
      background: var(--rose);
    }

    .condition strong {
      font-size: 12px;
      line-height: 1.25;
    }

    .condition span {
      color: var(--soft);
      font-size: 11px;
      line-height: 1.35;
    }

    .action-list,
    .caution-list {
      display: grid;
      gap: 8px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .action-list li,
    .caution-list li {
      position: relative;
      padding: 11px 11px 11px 34px;
      border: 1px solid rgba(246, 213, 169, 0.14);
      border-radius: 8px;
      background: rgba(9, 6, 9, 0.28);
      color: #ddcbb9;
      font-size: 13px;
      line-height: 1.52;
    }

    .action-list li::before,
    .caution-list li::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 15px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold);
    }

    .caution-list li::before {
      background: var(--rose);
    }

    .related-grid {
      display: grid;
      gap: 8px;
    }

    .related-link {
      display: grid;
      grid-template-columns: 1fr 20px;
      align-items: center;
      gap: 8px;
      min-height: 54px;
      padding: 10px;
      border: 1px solid rgba(246, 213, 169, 0.13);
      border-radius: 8px;
      background: rgba(9, 6, 9, 0.28);
    }

    .related-link strong {
      display: block;
      font-size: 13px;
      line-height: 1.3;
    }

    .related-link span {
      display: block;
      margin-top: 3px;
      color: var(--soft);
      font-size: 11px;
      line-height: 1.4;
    }

    .nav-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .nav-button,
    .primary-button,
    .secondary-button {
      display: inline-grid;
      place-items: center;
      min-height: 42px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 950;
      cursor: pointer;
    }

    .nav-button,
    .secondary-button {
      border: 1px solid rgba(246, 213, 169, 0.18);
      background: rgba(255, 248, 239, 0.06);
      color: var(--text);
    }

    .primary-button {
      border: 0;
      background: linear-gradient(135deg, var(--gold), #f5e0ad);
      color: #180f09;
    }

    .nav-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .locked {
      min-height: 320px;
      align-content: center;
      text-align: left;
      border-left: 3px solid var(--rose);
    }

    .locked h1 {
      font-size: 23px;
      line-height: 1.22;
    }

    .locked p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .locked-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .composer {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      width: min(100vw, 444px);
      padding: 12px 14px max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: rgba(15, 10, 15, 0.94);
      border-top: 1px solid rgba(246, 213, 169, 0.16);
      backdrop-filter: blur(18px);
    }

    .composer textarea {
      width: 100%;
      min-height: 46px;
      max-height: 92px;
      resize: none;
      border: 1px solid rgba(246, 213, 169, 0.18);
      border-radius: 8px;
      outline: 0;
      padding: 11px 12px;
      color: var(--text);
      background: rgba(255, 248, 239, 0.07);
      line-height: 1.35;
    }

    .composer textarea::placeholder {
      color: #9f8779;
    }

    .send-btn {
      width: 72px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--gold), #f6e0aa);
      color: #180f09;
      font-size: 13px;
      font-weight: 950;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 82px;
      z-index: 50;
      width: min(calc(100vw - 32px), 412px);
      padding: 11px 12px;
      border: 1px solid rgba(246, 213, 169, 0.26);
      border-radius: 8px;
      background: rgba(25, 17, 22, 0.96);
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      box-shadow: var(--shadow);
    }

    .toast.is-open {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 720px) {
      body {
        padding: 24px;
      }

      .phone {
        border: 1px solid rgba(246, 213, 169, 0.2);
        border-radius: 22px;
        min-height: min(920px, calc(100svh - 48px));
        max-height: calc(100svh - 48px);
        overflow-y: auto;
      }

      .composer {
        position: sticky;
        left: auto;
        width: 100%;
        transform: none;
      }
    }
  
      /* Shared UMSH chrome: keep the fixed bottom nav from covering the page tail.
         The shell publishes its measured height in --umsh-chrome-bottom-h, but that
         measurement can land before layout settles and report far less than the nav's
         real 74px, so the floor keeps the reserve honest either way. */
      body.umsh-has-chrome .phone { padding-bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      /* The story hero filled the viewport minus the design's own 64px bar. It now shares the
         screen with a taller app bar and the bottom nav; a fixed share keeps both CTAs above
         the fold without depending on a chrome height that may not be measured yet. */
      body.umsh-has-chrome #step-1-story .hero { min-height: 62svh; }
      body.umsh-has-chrome .composer { bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      body.umsh-has-chrome .chat-log, body.umsh-has-chrome .screen { padding-bottom: calc(112px + max(74px, var(--umsh-chrome-bottom-h, 74px))); }
      body.umsh-has-chrome .footer { padding-bottom: 18px; }
      /* The teaser cards were sized for one short sample sentence. Real readings run longer,
         and three columns inside a 375px phone wrapped them to two or three words per line. */
      .teaser-grid { grid-template-columns: 1fr; }
      .teaser-grid .mini-card { min-height: 0; gap: 4px; padding: 12px 14px; }
      .marry-saved-profile { display: grid; gap: 6px; border: 1px solid rgba(240, 192, 111, 0.45); border-radius: 10px; background: rgba(240, 192, 111, 0.08); padding: 14px; margin-bottom: 14px; }
      .marry-saved-profile b { color: var(--gold, #f0c06f); font-size: 14px; }
      .marry-saved-profile span { color: var(--muted, rgba(255,239,220,.74)); font-size: 13px; line-height: 1.55; }
      .marry-saved-profile button { justify-self: start; margin-top: 4px; min-height: 38px; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; background: rgba(255,255,255,.06); color: inherit; padding: 0 12px; font: inherit; font-weight: 800; cursor: pointer; }
</style>
    <link rel="stylesheet" href="/css/umsh-chrome.css" />
  </head>
<body>
  <main class="phone" data-umsh-chrome data-service="결혼궁합" data-price="24,900원" data-active="home" id="step-6_1-report" aria-label="결혼궁합 상세 풀이">
    <header class="appbar topbar">
      <button class="icon-button" type="button" id="btn-back" aria-label="목록으로 돌아가기">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div class="brand">
        <strong>연애 말고 결혼까지 가능?</strong>
        <span>상세 풀이</span>
      </div>
      <button class="icon-button" type="button" id="btn-list" aria-label="전체 목차">
        <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <div class="contextbar" aria-label="선택 항목">
      <span class="chip is-strong">결혼궁합</span>
      <span class="chip" id="group-chip">대분류 확인</span>
      <span class="chip" id="section-chip">중분류 확인</span>
      <span class="chip" id="access-chip">권한 확인</span>
    </div>

    <section class="screen" id="detail-root" aria-live="polite"></section>

    <form class="composer" id="detail-form">

      <button class="send-btn" type="submit">상담</button>
    </form>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const service = {
      service_key: "marriage_compatibility",
      service_slug: "marry",
      title: "연애 말고 결혼까지 가능?",
      category: "결혼궁합",
      analysis_basis: ["배우자궁", "대운", "합충"],
      domain: "match.umsh.kr/marry",
      price_krw: 24900,
      report_version: "marry-report-v1",
      analysis_period: "2026 relationship flow",
    };

    const storageKeys = {
      input: "umsh_marry_input_payload",
      accessState: "umsh_marry_access_state",
      paymentState: "umsh_marry_payment_state",
      reportContext: "umsh_marry_report_context",
      reportIndex: "umsh_marry_report_index",
      selectedSection: "umsh_marry_selected_section",
      detailHistory: "umsh_marry_detail_history",
      followup: "umsh_marry_detail_followup",
      networkState: "umsh_marry_network_state",
      generationState: "umsh_marry_generation_state",
    };

    const groups = [
      {
        id: "marry-section-01",
        title: "내 연애 기본값",
        subtitle: "내가 사랑할 때 켜지는 기본 모드",
        hero: "../assets/marry/06-marry-section-01-hero.webp",
        hero_alt: "도시 야경 앞에서 휴대폰과 거울을 바라보는 여성 만화풍 상세 이미지",
        evidence_ids: ["item-10-p1-0004", "item-19-p1-0003"],
        fact_labels: ["내 일간", "연애 속도", "표현 온도", "관계에서 반복되는 선"],
        base_conclusion: "결론부터 말하면, 내 연애 기본값은 상대를 바꾸기 전에 내가 어떤 속도와 거리에서 편해지는지 보는 파트예요.",

      if (record.group.id === "marry-section-04") return `결론부터 말하면, ${title}은 마음의 크기보다 현실 대화를 어디까지 열 수 있는지 보는 항목이에요. 지금은 답을 몰아가기보다 조건을 작게 꺼내 반응을 확인하는 쪽이 더 잘 맞습니다.`;
      if (record.group.id === "marry-section-05") return `결론부터 말하면, ${title}은 좋은 날을 찍는 문제가 아니라 관계가 부담 없이 공식화될 수 있는 구간을 찾는 항목이에요. 말 꺼낼 때와 기다릴 때를 나누는 게 핵심입니다.`;
      if (record.group.id === "marry-section-06") return `결론부터 말하면, ${title}은 위험 판정이 아니라 반복되기 전에 대화해야 할 신호를 확인하는 항목이에요. 감정 탓으로 몰기보다 행동 기준을 세우는 쪽이 좋습니다.`;
      if (record.group.id === "marry-section-09") return `결론부터 말하면, ${title}은 상대를 시험하는 말보다 관계를 다음 대화로 연결하는 문장을 찾는 항목이에요. 오늘 바로 쓰되 압박은 줄이는 방향이 맞습니다.`;
      return `${record.group.base_conclusion} 이번 항목인 ${title}은 그중에서도 지금 관계에서 바로 확인할 신호를 좁혀 읽습니다.`;
    }

    function timingCopy(record) {
      if (record.group.id === "marry-section-05") return "타이밍은 올해 흐름, 대운 구간, 양가 일정처럼 실제 조건이 함께 맞을 때 의미가 커집니다.";
      if (record.group.id === "marry-section-04") return "결혼 이야기는 분위기가 좋을 때보다 현실 조건을 꺼내도 관계가 덜 흔들리는 때에 시작하는 편이 좋습니다.";
      if (record.group.id === "marry-section-06") return "같은 문제가 두 번 이상 반복되면 참고 넘길 일이 아니라 대화 방식과 기준을 다시 잡을 구간입니다.";
      if (record.group.id === "marry-section-08") return "불안이 올라오는 날에는 바로 결론을 내리기보다 감정과 사실을 분리한 뒤 대화 시간을 잡는 편이 안정적입니다.";
      return "현재 자료만으로 날짜나 강도를 단정하기보다, 이번 주에 확인할 행동과 한 달 동안 반복되는 신호를 나눠 보는 것이 좋습니다.";
    }

    function renderGate(record) {
      const stateCopy = {
        locked: ["상세 풀이는 결제 권한 확인 후 열려요", "목차와 항목명은 볼 수 있지만, 개인화된 본문과 시각 자료는 주문 확인 뒤 열립니다."],
        missing: ["연결된 리포트를 찾지 못했어요", "이전 단계에서 만든 결과를 먼저 연결해야 이 항목의 상세 풀이가 열립니다."],
        expired: ["입력 정보가 만료됐어요", "새 분석으로 두 사람 기준을 다시 연결하면 상세 풀이를 이어볼 수 있습니다."],
        generating: ["상세 풀이를 준비하는 중이에요", "중복 결제 없이 생성 상태를 복원합니다. 잠시 뒤 다시 확인해 주세요."],
        network_error: ["연결이 잠시 불안정해요", "목록으로 돌아가도 선택 항목은 유지됩니다. 다시 확인하면 접근 상태를 새로 맞춥니다."],
        wrong: ["현재 사용자 권한과 맞지 않는 리포트예요", "다른 리포트 식별자로 들어온 경우 상세 내용을 열지 않습니다."],
        invalid: ["목록에 없는 항목이에요", "05 결과 목록에 있는 중분류를 선택하면 상세 풀이가 열립니다."],
      }[state.access] || ["상세 풀이를 열 수 없어요", "목록에서 항목을 다시 선택해 주세요."];

      return `
        <section class="panel locked">
          <span class="eyebrow">${escapeHtml(record?.group?.title || "상세 상태")}</span>
          <h1>${escapeHtml(stateCopy[0])}</h1>
          <p>${escapeHtml(stateCopy[1])}</p>
          ${record ? `<p>선택 항목: ${escapeHtml(record.title)}</p>` : ""}
          <div class="locked-actions">
            <a class="primary-button" href="../04-step-4-report/index.html#step-4-report">결제 화면으로</a>
            <a class="secondary-button" href="${listRoute()}">목록으로</a>
          </div>
        </section>
      `;
    }

    function renderBasis(record) {
      const rows = [
        ["선택 항목", `${record.group.title} > ${record.title}`],
        ["입력 기준", inputSummary()],
        ["풀이 기준", record.group.fact_labels.join(", ")],
        ["해석 방식", "단정 대신 가능성, 조건, 지금 할 행동 순서로 읽습니다."],
      ];
      return `
        <section class="panel">
          <div class="panel-head">
            <h2>확인한 기준</h2>
            <span>근거 연결</span>
          </div>
          <div class="basis-grid">
            ${rows.map(([label, value]) => `
              <div class="basis-row">
                <strong>${escapeHtml(label)}</strong>
                <span>${escapeHtml(value)}</span>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderReality(record) {
      return `
        <section class="panel">
          <div class="panel-head">
            <h2>현실에서 보이는 모습</h2>
            <span>관찰 포인트</span>
          </div>
          <div class="signal-list">
            ${record.group.reality.map((text, index) => `
              <article class="signal-card">
                <strong>${["먼저 보이는 신호", "반복되기 쉬운 장면", "결혼 전 확인할 지점"][index] || "확인할 지점"}</strong>
                <p>${escapeHtml(text)}</p>
              </article>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderConditions(record) {
      return `
        <section class="panel">
          <div class="panel-head">
            <h2>시기·강약·조건</h2>
            <span>점수 아님</span>
          </div>
          <p class="body-copy">${escapeHtml(timingCopy(record))}</p>
          <div class="condition-grid">
            ${record.group.conditions.map((label, index) => `
              <div class="condition">
                <i aria-hidden="true"></i>
                <strong>${escapeHtml(label)}</strong>
                <span>${escapeHtml(["지금 확인", "대화로 조정", "반복 관찰"][index] || "관찰")}</span>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderActions(record) {
      return `
        <section class="panel">
          <div class="panel-head">
            <h2>오늘 또는 이번 주 액션</h2>
            <span>실행 기준</span>
          </div>
          <ul class="action-list">
            ${record.group.actions.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
          </ul>
        </section>
      `;
    }

    function renderCautions(record) {
      return `
        <section class="panel">
          <div class="panel-head">
            <h2>주의할 선택</h2>
            <span>속도 조절</span>
          </div>
          <ul class="caution-list">
            ${record.group.cautions.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
          </ul>
        </section>
      `;
    }

    function renderRelated(record) {
      const nav = neighbors(record);
      const relatedItems = related(record);
      return `
        <section class="panel">
          <div class="panel-head">
            <h2>연관 항목</h2>
            <span>${record.absolute_order} / ${flattenSections().length}</span>
          </div>
          <div class="related-grid">
            ${relatedItems.map((item) => `
              <a class="related-link" href="${routeFor(item.section_id)}" data-related-section="${escapeHtml(item.section_id)}">
                <span>
                  <strong>${escapeHtml(item.title)}</strong>
                  <span>${escapeHtml(item.preview)}</span>
                </span>
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </a>
            `).join("")}
          </div>
          <div class="nav-controls">
            <button class="nav-button" type="button" data-nav-section="${nav.previous ? escapeHtml(nav.previous.section_id) : ""}" ${nav.previous ? "" : "disabled"}>이전 항목</button>
            <button class="nav-button" type="button" data-nav-section="${nav.next ? escapeHtml(nav.next.section_id) : ""}" ${nav.next ? "" : "disabled"}>다음 항목</button>
          </div>
        </section>
      `;
    }

    function renderDetail(record) {
      const conclusion = conclusionFor(record);
      return `
        <section class="hero">
          <img src="${escapeHtml(record.group.hero)}" alt="${escapeHtml(record.group.hero_alt)}" />
          <div class="hero-copy">
            <span class="eyebrow">${String(record.group_index + 1).padStart(2, "0")} · ${escapeHtml(record.group.title)}</span>
            <h1>${escapeHtml(record.title)}</h1>
            <p>${escapeHtml(conclusion)}</p>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <h2>한 줄 결론</h2>
            <span>먼저 답변</span>
          </div>
          <div class="body-copy">
            <p>${escapeHtml(conclusion)}</p>
            <p>${escapeHtml(record.preview)}</p>
          </div>
        </section>
        ${renderBasis(record)}
        ${renderReality(record)}
        ${renderConditions(record)}
        ${renderActions(record)}
        ${renderCautions(record)}
        ${renderRelated(record)}
      `;
    }

    function updateChips(record) {
      elements.groupChip.textContent = record ? record.group.title : "대분류 확인";
      elements.sectionChip.textContent = record ? `${record.absolute_order}번 항목` : "중분류 확인";
      const labels = {
        entitled: "상세 열림",
        locked: "결제 필요",
        missing: "리포트 없음",
        expired: "입력 만료",
        generating: "준비 중",
        network_error: "재시도 필요",
        wrong: "권한 불일치",
        invalid: "항목 없음",
      };
      elements.accessChip.textContent = labels[state.access] || "권한 확인";
    }

    function persistSelection(record) {
      if (!record) return;
      writeJson(storageKeys.selectedSection, {
        service_key: service.service_key,
        service_slug: service.service_slug,
        section_id: record.section_id,
        section_title: record.title,
        group_id: record.group.id,
        group_title: record.group.title,
        selected_at: new Date().toISOString(),
      });
      const history = readJson(storageKeys.detailHistory, []);
      const next = [{ section_id: record.section_id, title: record.title, visited_at: new Date().toISOString() }, ...history.filter((item) => item.section_id !== record.section_id)].slice(0, 12);
      writeJson(storageKeys.detailHistory, next);
    }

    function navigateTo(sectionId) {
      if (!sectionId) return;
      state.sectionId = sectionId;
      const record = currentRecord();
      state.access = resolveAccess();
      persistSelection(record);
      history.replaceState(null, "", routeFor(sectionId));
      render();
      document.querySelector("#step-6_1-report")?.scrollIntoView({ block: "start" });
    }

    function render() {
      const record = currentRecord();
      updateChips(record);
      if (state.access !== "entitled") {
        elements.root.innerHTML = renderGate(record);
        return;
      }
      persistSelection(record);
      elements.root.innerHTML = renderDetail(record);
      elements.root.querySelectorAll("img").forEach((img) => {
        img.addEventListener("error", () => {
          img.alt = "상세 이미지를 불러오지 못했습니다";
          img.style.opacity = "0.12";
        }, { once: true });
      });
    }

    document.querySelector("#btn-back").addEventListener("click", () => {
      window.location.href = listRoute();
    });

    document.querySelector("#btn-list").addEventListener("click", () => {
      window.location.href = listRoute();
    });

    elements.root.addEventListener("click", (event) => {
      const nav = event.target.closest("[data-nav-section], [data-related-section]");
      if (!nav) return;
      event.preventDefault();
      navigateTo(nav.dataset.navSection || nav.dataset.relatedSection);
    });

    elements.form.addEventListener("submit", (event) => {
      event.preventDefault();
      const record = currentRecord();
      const message = elements.message.value.trim();
      if (!record) {
        showToast("목록에서 항목을 먼저 선택해 주세요.");
        return;
      }
      writeJson(storageKeys.followup, {
        service_key: service.service_key,
        service_slug: service.service_slug,
        section_id: record.section_id,
        section_title: record.title,
        message,
        created_at: new Date().toISOString(),
      });
      elements.message.value = "";
      if (state.access !== "entitled") {
        showToast("상세 상담은 권한 확인 후 이어집니다.");
        return;
      }
      showToast("선택 항목 기준으로 상담 질문을 저장했습니다.");
    });

    state.sectionId = resolveSection();
    state.access = resolveAccess();
    render();
  </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/js/common-auth-return.js"></script>
    <script src="/js/umsh-auth-session.js"></script>
    <script src="/js/payment-bridge.js"></script>
    <script src="/js/umsh-chrome.js"></script>
    <script src="/js/marry-service.js" defer></script>
  </body>
</html>

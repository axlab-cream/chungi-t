<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>직장 핏 결과 목록과 상담 허브 | 운명상회</title>
    <!-- umsh-share-card: 주소를 공유하면 항상 같은 배너와 문구가 함께 나간다. 카카오톡은
         og:* 를 읽고 이미지를 URL 단위로 캐시하므로, 배너를 바꿀 때는 ?v= 를 올린다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="운명상회" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="운명상회 - 운명을 팝니다." />
    <meta property="og:description" content="지금 뭐가 걸리는지, 사주가 먼저 말해줍니다. 연애·돈·직장·궁합까지 궁금한 운을 한 칸씩 꺼내보세요." />
    <meta property="og:image" content="https://umsh.kr/assets/umsh-kakao-share.jpg?v=20260904-wide" />
    <meta property="og:image:secure_url" content="https://umsh.kr/assets/umsh-kakao-share.jpg?v=20260904-wide" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="나경을 든 운명상회 상담자와 운명상회 로고" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="운명상회 - 운명을 팝니다." />
    <meta name="twitter:description" content="지금 뭐가 걸리는지, 사주가 먼저 말해줍니다. 연애·돈·직장·궁합까지 궁금한 운을 한 칸씩 꺼내보세요." />
    <meta name="twitter:image" content="https://umsh.kr/assets/umsh-kakao-share.jpg?v=20260904-wide" />
    <meta
      name="description"
      content="결제 후 직장 선택 리포트의 10개 대분류와 중분류를 훑고, 필요한 상세 풀이로 들어가는 상담 허브입니다."
    />
    <link rel="stylesheet" href="/css/umsh-chrome.css" />
    <link rel="stylesheet" href="../shared/job-choice.css" />
    <script src="../shared/job-choice-data.js"></script>
  </head>
  <body>
    <main class="phone" data-umsh-chrome data-service="직장 선택" data-price="9,900원" data-active="home" id="step-5-chat" aria-label="직장 선택 결과 목록">
      <header class="appbar topbar">
        <a class="brand" href="../04-step-4-report/index.html#step-4-report" aria-label="무료 결과로 이동">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3l7 4v5c0 4.8-3 8.1-7 9-4-0.9-7-4.2-7-9V7l7-4z" stroke="currentColor" stroke-width="1.7" />
              <path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
          </span>
          운명상회
        </a>
        <button class="icon-button" type="button" aria-label="무료 결과로 이동" data-back>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </header>

      <section class="chat-shell">
        <div class="chat-scroll" id="chatScroll"></div>
        <form class="chat-composer" id="chatForm">
          <input id="chatInput" aria-label="궁금한 항목 입력" placeholder="예: 상사 케미, 연봉, 첫 90일" />
          <button class="send-button" type="submit" aria-label="질문 보내기">↗</button>
        </form>
      </section>
    </main>

    <script type="application/json" id="PROMPT_INPUT">{}</script>
    <script type="application/json" id="INTERPRETATION_INDEX">[]</script>
    <script type="application/json" id="RAG_EVIDENCE">[]</script>
    <script type="application/json" id="IMAGE_MANIFEST">[]</script>
    <script type="application/json" id="QA_RESULT">{}</script>

    <script src="/js/jobchoice-report-store.js"></script>
    <script>
      const chatScroll = document.getElementById("chatScroll");
      const chatForm = document.getElementById("chatForm");
      const chatInput = document.getElementById("chatInput");
      const loaded = JobChoice.loadJobInput();
      const report = JobChoice.buildReport(loaded.input);
      const esc = JobChoice.escapeHtml;

      JobChoice.hydrateContracts("05-step-5-chat", [
        { item: "10개 대분류 접근", status: "pass", detail: "report_index.groups 기준으로 10개 대분류를 모두 렌더링합니다." },
        { item: "section_id 상세 연결", status: "pass", detail: "모든 중분류는 06_1의 section query와 연결됩니다." },
        { item: "권한 없는 직접 진입", status: "pass", detail: "정적 미리보기에서는 세션 권한이 없으면 상세 목록 대신 04 복귀 화면을 보여줍니다." },
      ]);

      function lockedMarkup() {
        return `
          <div class="lock-panel">
            <span class="eyebrow">권한 확인 필요</span>
            <h1>무료 맛보기에서<br />전체 열기를 먼저 눌러주세요.</h1>
            <p>무료 맛보기에서 전체 열기를 완료하면 결과 목록을 이어서 볼 수 있습니다.</p>
            <a class="link-button" href="../04-step-4-report/index.html#step-4-report">무료 결과로 돌아가기</a>
          </div>
        `;
      }

      function renderGroups() {
        return report.report_index.groups
          .map(
            (group, groupIndex) => `
              <section class="group-block" data-group-id="${esc(group.id)}">
                <div class="group-head">
                  <strong>${esc(group.title)}</strong>
                  <span>${String(groupIndex + 1).padStart(2, "0")}</span>
                </div>
                <p>${esc(group.preview)}</p>
                <div class="item-list">
                  ${group.sections
                    .map(
                      (section) => `
                        <a class="item-link" href="${esc(section.route)}" data-section-id="${esc(section.section_id)}">
                          <strong>${esc(section.title)}</strong>
                          <span>${esc(section.preview)}</span>
                        </a>
                      `,
                    )
                    .join("")}
                </div>
              </section>
            `,
          )
          .join("");
      }

      function renderPaidList() {
        const teaser = report.teaser;
        chatScroll.innerHTML = `
          <div class="hero-panel">
            <span class="kicker">05 · 결과 목록</span>
            <h1>${esc(loaded.input.offer.companyName || "선택한 회사")}<br />전체 풀이 목차</h1>
            <p>${esc(teaser.summary)} 아래에서 궁금한 중분류를 누르면 상세 풀이로 이동합니다.</p>
            <div class="meta-grid">
              <div class="meta-row"><span>현재 방향</span><strong>${esc(teaser.signal.direction)}</strong></div>
              <div class="meta-row"><span>먼저 볼 축</span><strong>${esc(teaser.signal.primaryTitle)}</strong></div>
              <div class="meta-row"><span>리포트 기준</span><strong>10개 대분류 · ${JobChoice.allSections().length}개 중분류</strong></div>
            </div>
          </div>
          <div class="notice-card" id="chatAnswer" aria-live="polite">
            <span class="eyebrow">상담 허브</span>
            <h2>목록에서 먼저 고르세요</h2>
            <p>하단에 키워드를 입력하면 가장 가까운 항목을 찾아드립니다.</p>
          </div>
          ${renderGroups()}
        `;
      }

      function findClosestSection(query) {
        const text = String(query || "").toLowerCase();
        const sections = JobChoice.allSections();
        let best = sections[0];
        let bestScore = -1;
        for (const section of sections) {
          const haystack = `${section.group_title} ${section.title}`.toLowerCase();
          let score = 0;
          for (const token of text.split(/\s+/).filter(Boolean)) {
            if (haystack.includes(token)) score += 3;
          }
          const rule = JobChoice.GROUP_RULES[section.group_id];
          for (const keyword of rule.keywords) {
            if (text.includes(keyword.toLowerCase())) score += 2;
          }
          if (score > bestScore) {
            bestScore = score;
            best = section;
          }
        }
        return best;
      }

      function showChatSuggestion(query) {
        const target = findClosestSection(query);
        const answer = document.getElementById("chatAnswer");
        answer.innerHTML = `
          <span class="eyebrow">추천 상세 항목</span>
          <h2>${esc(target.title)}</h2>
          <p>${esc(query)} 질문은 ${esc(target.group_title)} 안에서 먼저 보는 편이 자연스럽습니다.</p>
          <a class="link-button" href="${esc(target.route)}">이 항목 자세히 보기</a>
        `;
        answer.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      if (JobChoice.hasEntitlement()) {
        renderPaidList();
      } else {
        chatScroll.innerHTML = lockedMarkup();
      }

      chatForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!JobChoice.hasEntitlement()) {
          window.location.href = "../04-step-4-report/index.html#step-4-report";
          return;
        }
        const query = chatInput.value.trim();
        if (!query) return;
        showChatSuggestion(query);
        chatInput.value = "";
      });

      document.querySelector("[data-back]").addEventListener("click", () => {
        window.location.href = "../04-step-4-report/index.html#step-4-report";
      });

      if (!window.location.hash) {
        window.history.replaceState(null, "", "#step-5-chat");
      }
    </script>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/js/common-auth-return.js"></script>
    <script src="/js/umsh-auth-session.js"></script>
    <script src="/js/payment-bridge.js"></script>
    <script src="/js/umsh-chrome.js"></script>
    <script src="/js/jobchoice-service.js" defer></script>
  </body>
</html>

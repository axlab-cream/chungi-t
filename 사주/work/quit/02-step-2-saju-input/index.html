  <body class="umsh-fields">
    <main class="app" data-umsh-chrome="" data-service="퇴사운" data-price="14,900원" data-active="home" id="step-2-saju-input">
      <header class="appbar topbar">
        <a class="brand" href="/"><strong>운명상회</strong><span>퇴사운</span></a>
        <span class="chip">입력</span>
      </header>
      <section class="hero">
        <img src="../assets/quit/02-input.png" alt="퇴사운 분석을 위한 기본 정보를 확인하는 사주 전략가">
        <div class="copy">
          <span class="eyebrow">퇴사 흐름</span>
          <h1>나가도 되는 흐름인지부터 가릅니다</h1>
          <p>저장된 사주가 있으면 생년월일은 다시 묻지 않습니다. 지금 막힌 이유만 고르면 충동과 결단을 나눕니다.</p>
        </div>
      </section>
      <section class="section">
        <form id="quitInputForm" action="../04-step-4-report/index.html#step-4-report" method="get">
          <div id="profileFields" aria-label="사주 프로필">
            <div class="field">
              <label for="name">이름</label>
              <input id="name" name="name" autocomplete="name" placeholder="예: 리원" maxlength="20">
            </div>
            <div class="field">
              <label for="birth">생년월일</label>
              <input id="birth" name="birth" type="date">
            </div>
            <div class="field">
              <span>태어난 시</span>
              <div class="field-row">
                <input id="time" name="time" type="time">
                <label class="time-unknown" for="birthTimeUnknown">
                  <input id="birthTimeUnknown" name="birthTimeUnknown" type="checkbox" value="1">모름
                </label>
              </div>
            </div>
            <div class="field">
              <span>성별</span>
              <div class="radio-row" role="radiogroup" aria-label="성별">
                <label class="radio-panel">
                  <input type="radio" name="gender" value="female">
                  <span class="label">여성</span>
                </label>
                <label class="radio-panel">
                  <input type="radio" name="gender" value="male">
                  <span class="label">남성</span>
                </label>
              </div>
            </div>
            <input id="calendar" name="calendar" type="hidden" value="solar">
          </div>
          <div class="field">
            <span>지금 나가려는 이유</span>
            <div class="radio-row" role="radiogroup" aria-label="퇴사 고민 이유">
              <label class="radio-panel">
                <input type="radio" name="reason" value="사람" checked>
                <span class="label">사람</span>
                <small>관계·팀·상사</small>
              </label>
              <label class="radio-panel">
                <input type="radio" name="reason" value="업무">
                <span class="label">업무</span>
                <small>일 자체·강도</small>
              </label>
              <label class="radio-panel">
                <input type="radio" name="reason" value="보상">
                <span class="label">보상</span>
                <small>돈·인정</small>
              </label>
              <label class="radio-panel">
                <input type="radio" name="reason" value="건강">
                <span class="label">건강</span>
                <small>몸·회복</small>
              </label>
              <label class="radio-panel">
                <input type="radio" name="reason" value="비전">
                <span class="label">비전</span>
                <small>다음 길</small>
              </label>
              <label class="radio-panel">
                <input type="radio" name="reason" value="복합">
                <span class="label">복합</span>
                <small>여러 이유가 겹침</small>
              </label>
            </div>
          </div>
          <p class="error" id="quit-input-error" role="alert"></p>
          <button class="button" type="submit">나가도 되는지 보기</button>
        </form>
      </section>

<!doctype html>

  <meta charset="utf-8" />

  <title>직업운 | 상세 풀이</title>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="운명상회" />
  <meta property="og:title" content="운명상회 - 운명을 팝니다." />
  <meta property="og:description" content="지금 뭐가 걸리는지, 사주가 먼저 말해줍니다." />

  <link rel="stylesheet" href="/css/umsh-chrome.css" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090d;
      --panel: #11131a;
      --ink: #fff7f2;
      --muted: rgba(255, 247, 242, .7);
      --line: rgba(255,255,255,.14);
      --accent: #54c5d6;
      --gold: #f4c96b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #07080c; color: var(--ink); font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif; }
    body { display: grid; place-items: start center; }
    .phone { width: min(100%, 430px); min-height: 100svh; background: var(--bg); overflow: clip; }
    .topbar { position: sticky; top: 0; z-index: 8; display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 12px 16px; background: rgba(9,9,13,.92); border-bottom: 1px solid var(--line); }
    .brand { text-decoration: none; color: inherit; }
    .brand span { display: block; color: var(--muted); font-size: 11px; font-weight: 800; }
    .brand strong { display: block; font-size: 16px; }
    .chip { border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); color: var(--accent); border-radius: 999px; padding: 8px 10px; font-size: 12px; font-weight: 900; }
    .hero { position: relative; min-height: 420px; }
    .hero img { width: 100%; height: 420px; object-fit: cover; display: block; }
    .hero:after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 20%, var(--bg) 96%); }
    .copy { position: relative; margin-top: -88px; padding: 0 18px 18px; }
    .eyebrow { display: inline-block; margin-bottom: 8px; color: var(--accent); font-size: 11px; font-weight: 900; letter-spacing: .08em; }
    h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.15; word-break: keep-all; }
    .lead { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; word-break: keep-all; }
    .reading { padding: 8px 16px 28px; }
    .back { display: flex; align-items: center; justify-content: center; min-height: 48px; margin: 16px 16px 28px; border-radius: 8px; border: 1px solid var(--line); color: inherit; text-decoration: none; font-weight: 800; }
    body.umsh-has-chrome .phone { padding-bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
  </style>
</head>
<body>
  <main class="phone" data-umsh-chrome data-service="직업운" data-price="9,900원" data-active="home" id="step-6_1-report" aria-label="직업운 상세 풀이">
    <header class="appbar topbar"><link id="umsh-inplace-css" rel="stylesheet" href="/css/umsh-verified-inplace.css?v=20260922-reader-actions-row-v1">
      <a class="brand" href="/work/job"><span>운명상회</span><strong>직업운</strong></a>
      <span class="chip">상세</span>
    </header>
    <section class="hero">
      <img src="/assets/umsh-work-card-bg.png" alt="직업운 상세 풀이">
    </section>
    <div class="copy">
      <span class="eyebrow">WORK · 직업운</span>
      <h1>지금 이 일이 나와 맞을까?</h1>
      <p class="lead">관성, 식상, 적성의 흐름으로 버티기와 움직이기를 나눕니다.</p>
    </div>
    <section class="reading" data-umsh-slot="sections" aria-label="전체 풀이"></section>
    <div class="umsh-pdf-dock"><button class="pdf-button" type="button" data-umsh-pdf="">PDF 저장</button></div>
    <a class="back" href="/work/job">서비스로 돌아가기</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/common-auth-return.js"></script>
  <script src="/js/umsh-auth-session.js?v=live-20260916t"></script>
  <script src="/js/payment-bridge.js"></script>
</body>
</html>

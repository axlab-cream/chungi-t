<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>개인정보 수정 · 운명상회</title>
    <link rel="icon" href="/favicon.ico?v=20260904" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260904" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260904" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260904" />
    <link rel="stylesheet" href="/css/payment.css?v=20260901-myhub" />
    <link rel="stylesheet" href="/css/umsh-chrome.css?v=20260901-myhub" />
    <link rel="stylesheet" href="/css/myhub.css?v=20260901-myhub" /><link rel="stylesheet" href="/css/umsh-field.css?v=20260904" />
  </head>
  <body class="umsh-fields">
    <main class="payment-page" data-umsh-chrome data-service="MY" data-active="account">
      <header class="payment-header"><a class="payment-brand" href="/">운명상회</a><a class="payment-back" href="/my">마이페이지</a></header>
      <section class="payment-shell" aria-labelledby="page-title">
        <p class="payment-eyebrow">MY · PROFILE</p>
        <h1 id="page-title">개인정보 수정</h1>
        <p class="payment-intro">오늘운·운명록·보관함에 쓰는 사주 프로필을 수정합니다.</p>
        <form class="payment-form profile-form" id="profile-form">
          <label class="payment-label">이름<input name="name" type="text" required maxlength="20" autocomplete="name" /></label>
          <div class="profile-row">
            <label class="payment-label">성별
              <select name="gender" required>
                <option value="female">여자</option>
                <option value="male">남자</option>
              </select>
            </label>
            <label class="payment-label">달력
              <select name="calendar" required>
                <option value="solar">양력</option>
                <option value="lunar">음력</option>
              </select>
            </label>
          </div>
          <div class="profile-row profile-row-3">
            <label class="payment-label">년<input name="year" type="number" min="1900" max="2100" required /></label>
            <label class="payment-label">월<input name="month" type="number" min="1" max="12" required /></label>
            <label class="payment-label">일<input name="day" type="number" min="1" max="31" required /></label>
          </div>
          <div>
            <span class="payment-label">태어난 시간</span>
            <div class="profile-toggle" role="group" aria-label="시간 알고 여부">
              <button type="button" data-time-known="1" class="is-selected">시간을 알아요</button>
              <button type="button" data-time-known="0">시간 모름</button>
            </div>
          </div>
          <div class="profile-row" data-time-fields>
            <label class="payment-label">시<input name="hour" type="number" min="0" max="23" value="12" /></label>
            <label class="payment-label">분<input name="minute" type="number" min="0" max="59" value="0" /></label>
          </div>
          <button class="payment-submit" type="submit">프로필 저장</button>
          <p class="payment-status" data-profile-status role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/js/common-auth-return.js"></script>
    <script src="/js/umsh-auth-session.js"></script>
    <script src="/js/umsh-chrome.js"></script>
    <script src="/js/umsh-account-pages.js?v=20260901-myhub"></script>
    <script src="/js/profile.js?v=20260901-myhub"></script>
  </body>
</html>

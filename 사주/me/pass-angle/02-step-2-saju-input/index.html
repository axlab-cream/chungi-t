    <style>

      h1,h2,p{margin-top:0;word-break:keep-all} h1{font-size:46px;line-height:1;margin-bottom:12px;font-weight:950} h2{font-size:28px;line-height:1.1;margin-bottom:10px;font-weight:950} p{color:var(--muted);font-size:15px;line-height:1.65}.section{position:relative;margin-top:-1px;padding:30px 20px;background:var(--surface)}.section:before{content:"";position:absolute;left:0;right:0;top:-84px;height:84px;background:linear-gradient(to bottom,rgba(7,18,14,0),var(--surface))}
      form{display:grid;gap:14px}.field{display:grid;gap:8px}.field label{font-size:13px;font-weight:900;color:var(--ink)} input,select{width:100%;min-height:52px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.055);color:var(--ink);padding:0 14px;font:inherit} input::placeholder{color:rgba(255,253,242,.4)} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .button{min-height:56px;border:1px solid rgba(78,255,202,.75);border-radius:8px;background:linear-gradient(135deg,var(--mint),var(--yellow));color:#03120c;font-weight:950;text-decoration:none;display:flex;align-items:center;justify-content:center}.ghost{min-height:52px;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:rgba(255,255,255,.055);color:var(--ink);text-decoration:none;display:flex;align-items:center;justify-content:center;font-weight:900}.note{font-size:12px;color:rgba(255,253,242,.55)} .footer{padding:22px 20px 34px;color:rgba(255,253,242,.52);font-size:11px;line-height:1.7}

      .saved-profile{display:grid;gap:6px;border:1px solid rgba(78,255,202,.45);border-radius:8px;background:rgba(78,255,202,.07);padding:14px}
      .saved-profile b{color:var(--mint);font-size:14px}
      .saved-profile span{color:var(--muted);font-size:13px;line-height:1.5}
      .saved-profile button{justify-self:start;margin-top:4px;min-height:38px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(255,255,255,.06);color:var(--ink);padding:0 12px;font:inherit;font-weight:850;cursor:pointer}
      [hidden]{display:none!important}

      body.umsh-has-chrome .app{padding-bottom:calc(var(--umsh-chrome-bottom-h, 74px) + env(safe-area-inset-bottom, 0px))}
      body.umsh-has-chrome .footer{padding-bottom:18px}

      /* Native dropdowns ignore the translucent field background and fall back to the
         OS light palette, so the popup list needs an explicit opaque dark surface. */
      select{color-scheme:dark}
      select option{background:#07120e;color:#fffdf2}
      select option:checked{background:#0d1f19}

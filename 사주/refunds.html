<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>환불 신청 · 운명상회</title>
    <link rel="icon" href="/favicon.ico?v=20260904" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260904" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260904" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260904" />
    <link rel="stylesheet" href="/css/payment.css?v=20260901-myhub" />
    <link rel="stylesheet" href="/css/umsh-chrome.css?v=20260901-myhub" />
    <link rel="stylesheet" href="/css/myhub.css?v=20260901-myhub" />
  </head>
  <body>
    <main class="payment-page" data-umsh-chrome data-service="MY" data-active="account">
      <header class="payment-header"><a class="payment-brand" href="/">운명상회</a><a class="payment-back" href="/my">마이페이지</a></header>
      <section class="payment-shell" aria-labelledby="page-title">
        <p class="payment-eyebrow">MY · REFUNDS</p>
        <h1 id="page-title">환불 신청 · 내역</h1>
        <p class="payment-intro">결제 건을 확인하고 환불 문의를 접수합니다.</p>
        <div class="refund-note">결제 완료·열람 전 건은 고객센터로 환불을 요청할 수 있습니다. 자세한 기준은 <a href="/refund">환불·취소 정책</a>을 확인해 주세요. 아직 전용 환불 API는 없어 문의 메일/고객센터로 연결합니다.</div>
        <p class="payment-status" data-refunds-status role="status" aria-live="polite"></p>
        <div class="order-list" data-refund-list></div>
        <p class="myhub-links" style="margin-top:18px"><a href="/orders">결제 내역 보기</a> · <a href="/support#inquiry">고객센터 문의</a></p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/js/common-auth-return.js"></script>
    <script src="/js/umsh-auth-session.js"></script>
    <script src="/js/umsh-chrome.js"></script>
    <script src="/js/umsh-account-pages.js?v=20260901-myhub"></script>
    <script src="/js/refunds.js?v=20260901-myhub"></script>
  </body>
</html>

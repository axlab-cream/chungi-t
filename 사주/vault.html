<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보관함 | 운명상회</title>
    <!-- umsh-share-card: 주소를 공유하면 항상 같은 배너와 문구가 함께 나간다. 카카오톡은
         og:* 를 읽고 이미지를 URL 단위로 캐시하므로, 배너를 바꿀 때는 ?v= 를 올린다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="운명상회" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="운명상회 - 사주 포탈" />
    <meta property="og:description" content="지금 뭐가 걸리는지, 사주가 먼저 말해줍니다. 연애·돈·직장·궁합까지 궁금한 운을 한 칸씩 꺼내보세요." />
    <meta property="og:image" content="https://umsh.kr/assets/umsh-kakao-share.jpg?v=20260904" />
    <meta property="og:image:secure_url" content="https://umsh.kr/assets/umsh-kakao-share.jpg?v=20260904" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="나경을 든 운명상회 상담자와 운명상회 로고" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="운명상회 - 사주 포탈" />
    <meta name="twitter:description" content="지금 뭐가 걸리는지, 사주가 먼저 말해줍니다. 연애·돈·직장·궁합까지 궁금한 운을 한 칸씩 꺼내보세요." />
    <meta name="twitter:image" content="https://umsh.kr/assets/umsh-kakao-share.jpg?v=20260904" />
    <meta name="description" content="구매한 운세 리포트를 모아 두는 보관함입니다. 로그인하면 저장된 풀이를 다시 열 수 있습니다." />
    <link rel="icon" href="/favicon.ico?v=20260904" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260904" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260904" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260904" />
    <link rel="stylesheet" href="/css/umsh-chrome.css" />
    <style>
      :root {
        --bg: #050504;
        --ink: #f7f2e9;
        --muted: rgba(247, 242, 233, 0.62);
        --line: rgba(216, 186, 114, 0.22);
        --gold: #e8d49a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      }

      .phone {
        width: min(100%, 430px);
        margin: 0 auto;
        min-height: 100svh;
        padding: 0 18px 24px;
      }

      .page-head {
        padding: 18px 0 12px;
      }

      .page-head h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.4px;
      }

      .page-head p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .panel {
        display: grid;
        gap: 10px;
        margin-top: 14px;
        padding: 18px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
      }

      .panel strong {
        font-size: 15px;
        font-weight: 900;
      }

      .panel p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .panel a.button {
        justify-self: start;
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        padding: 0 16px;
        border: 1px solid var(--gold);
        border-radius: 10px;
        background: rgba(232, 212, 154, 0.14);
        color: var(--gold);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .list {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
        color: inherit;
        text-decoration: none;
      }

      .row .body {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .row b {
        font-size: 14px;
        font-weight: 900;
        line-height: 1.35;
      }

      .row span {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .row em {
        color: var(--gold);
        font-size: 12px;
        font-style: normal;
        font-weight: 800;
        white-space: nowrap;
      }

      body.umsh-has-chrome {
        padding-bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px));
      }
    </style>
  </head>
  <body>
    <main class="phone" data-umsh-chrome data-service="보관함" data-active="vault">
      <header class="appbar topbar"></header>

      <section class="page-head">
        <h1>보관함</h1>
        <p>구매해서 열어 본 풀이가 여기에 남습니다. 눌러서 다시 볼 수 있어요.</p>
      </section>

      <section id="state"></section>
      <section class="list" id="list" aria-label="보관된 풀이"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/js/common-auth-return.js"></script>
    <script src="/js/umsh-auth-session.js"></script>
    <script src="/js/umsh-chrome.js"></script>
    <script>
      (() => {
        const state = document.querySelector('#state');
        const list = document.querySelector('#list');

        function escapeHtml(value) {
          return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;');
        }

        function panel(title, copy, action) {
          state.innerHTML = `
            <div class="panel">
              <strong>${escapeHtml(title)}</strong>
              <p>${escapeHtml(copy)}</p>
              ${action ? `<a class="button" href="${escapeHtml(action.href)}">${escapeHtml(action.label)}</a>` : ''}
            </div>
          `;
        }

        function loginUrl() {
          const returnTo = '/vault';
          return window.UMSHCommonAuth?.commonLoginUrl('vault', returnTo)
            || `/signup?entry=vault&returnTo=${encodeURIComponent(returnTo)}#login`;
        }

        function savedAt(value) {
          const date = value ? new Date(value) : null;
          if (!date || Number.isNaN(date.getTime())) return '';
          return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
        }

        async function session() {
          try {
            const config = await fetch('/api/auth/config').then((response) => response.json());
            if (!config?.enabled || !window.supabase || !window.UMSHAuthSession) return null;
            const client = window.UMSHAuthSession.createClient(window.supabase, config.url, config.publishableKey);
            const { data } = await client.auth.getSession();
            return await window.UMSHAuthSession.enforceDeviceAuthSession(data.session, client);
          } catch {
            return null;
          }
        }

        async function load() {
          const auth = await session();
          if (!auth) {
            // 보관함은 비로그인도 들어올 수 있지만, 목록은 계정에 묶여 있다.
            panel(
              '로그인하면 보관된 풀이가 보여요',
              '결제해서 열어 본 리포트는 계정에 저장됩니다. 로그인하면 이 자리에서 다시 열 수 있어요.',
              { href: loginUrl(), label: '로그인하고 보관함 열기' },
            );
            return;
          }

          try {
            const payload = await fetch('/api/user/reports?limit=30', {
              headers: { Authorization: `Bearer ${auth.access_token}` },
            }).then((response) => response.json());
            const reports = Array.isArray(payload.reports) ? payload.reports : [];
            if (!reports.length) {
              panel(
                '아직 보관된 풀이가 없어요',
                '운세를 하나 열어 보면 여기에 쌓입니다. 검색에서 원하는 운을 골라 보세요.',
                { href: '/search', label: '운세 둘러보기' },
              );
              return;
            }

            const titles = {
              cmdg: '천명사주',
              love_this_year: '올해 연애운',
              job_choice: '직장 선택',
              cat_compatibility: '고양이 궁합',
              lucky_color: '색과 물건',
              match_couple: '커플궁합',
              marry_match: '결혼궁합',
              couple_signal: '관계 신호',
              quit_fortune: '퇴사운',
              pass_angle: '나, 붙을 각이야?',
              money_save: '소비성향',
              work_move: '이직운',
              work_job: '직업운',
              love_mind: '상대방 마음',
              love_again: '재회운',
              love_spouse: '배우자운',
              home_fit: '집 풍수',
              home_pungsu: '집 풍수',
            };
            state.innerHTML = '';
            list.innerHTML = reports
              .map((report) => {
                const key = report.serviceKey || report.context?.serviceKey || '';
                const service = titles[key] || report.context?.target || report.context?.serviceTitle || '천명사주';
                const href = report.serviceHref || (key === 'cmdg' || !key ? '/cmdg/' : '/search');
                const openable = Boolean(href && href !== '/search');
                const body = `
                  <span class="body">
                    <b>${escapeHtml(service)}</b>
                    <span>${escapeHtml(report.title || '')}</span>
                  </span>
                  <em>${escapeHtml(savedAt(report.savedAt))}</em>
                `;
                return openable
                  ? `<a class="row" href="${escapeHtml(href)}">${body}</a>`
                  : `<div class="row">${body}</div>`;
              })
              .join('');
          } catch {
            panel('보관함을 불러오지 못했어요', '잠시 뒤 다시 시도해 주세요.', { href: '/vault', label: '다시 시도' });
          }
        }

        load();
      })();
    </script>
  </body>
</html>

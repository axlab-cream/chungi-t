<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>천기 선생님 · 사주</title>
    <meta name="description" content="천기 선생님 몰입형 사주 상담" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #fff8ef;
        --muted: #e0c7ad;
        --dim: rgba(255, 248, 239, 0.62);
        --red: #8b1e16;
        --red-deep: #360706;
        --gold: #f2bf6b;
        --line: rgba(255, 229, 188, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        min-height: 100%;
        background: #eef1f5;
        font-family:
          Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        overflow: hidden;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .phone {
        position: relative;
        width: min(100vw, 440px);
        height: 100svh;
        max-height: 920px;
        overflow: hidden;
        background: #080302;
        color: var(--ink);
        box-shadow: 0 24px 80px rgba(13, 21, 35, 0.24);
      }

      .hero {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.02) 0%,
            rgba(0, 0, 0, 0.04) 40%,
            rgba(0, 0, 0, 0.5) 70%,
            rgba(0, 0, 0, 0.92) 100%
          ),
          url("assets/hero-mystic.png") center top / cover no-repeat;
        transform: scale(1);
        transition:
          transform 560ms ease,
          filter 560ms ease,
          opacity 560ms ease;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 18%, transparent 0 24%, rgba(0, 0, 0, 0.18) 58%),
          linear-gradient(to right, rgba(0, 0, 0, 0.26), transparent 18% 82%, rgba(0, 0, 0, 0.26));
      }

      .phone[data-scene="immersion"] .hero,
      .phone[data-scene="input"] .hero,
      .phone[data-scene="loading"] .hero,
      .phone[data-scene="result"] .hero {
        filter: saturate(0.92) brightness(0.54);
        transform: scale(1.08);
      }

      .phone[data-scene="result"] .hero {
        opacity: 0;
      }

      .topbar {
        position: relative;
        z-index: 3;
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        align-items: center;
        height: 58px;
        padding: 0 18px;
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.26);
        color: var(--ink);
        backdrop-filter: blur(8px);
      }

      .brand {
        text-align: center;
        font-size: 21px;
        font-weight: 950;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .stage {
        position: relative;
        z-index: 2;
        height: calc(100% - 58px);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 22px max(24px, env(safe-area-inset-bottom));
      }

      .phone[data-scene="result"] .stage {
        position: absolute;
        inset: 0;
        height: auto;
        justify-content: flex-start;
        overflow: auto;
        padding: 0 0 max(24px, env(safe-area-inset-bottom));
        background: #050202;
      }

      .phone[data-scene="landing"] .hero,
      .phone[data-scene="result"] .hero {
        opacity: 0;
      }

      .phone[data-scene="landing"] .topbar,
      .phone[data-scene="result"] .topbar,
      .phone[data-scene="landing"] .sound,
      .phone[data-scene="result"] .sound {
        display: none;
      }

      .phone[data-scene="landing"] .stage {
        position: absolute;
        inset: 0;
        height: auto;
        justify-content: flex-start;
        overflow: auto;
        padding: 0 0 max(24px, env(safe-area-inset-bottom));
        background: #000;
      }

      .phone[data-scene="result"] .topbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 72px;
        padding-top: 12px;
        background: linear-gradient(to bottom, rgba(5, 2, 2, 0.96), rgba(5, 2, 2, 0.64) 62%, transparent);
      }

      .phone[data-scene="result"] .brand {
        text-shadow:
          0 2px 12px rgba(0, 0, 0, 0.92),
          0 0 18px rgba(0, 0, 0, 0.8);
      }

      .sound {
        position: absolute;
        top: 70px;
        left: 50%;
        z-index: 3;
        display: inline-flex;
        transform: translateX(-50%);
        min-height: 40px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 16px;
        border: 1px solid rgba(255, 235, 203, 0.24);
        border-radius: 999px;
        background: rgba(12, 5, 4, 0.56);
        color: #fff0d8;
        font-size: 13px;
        font-weight: 850;
        backdrop-filter: blur(10px);
      }

      .line-pill {
        align-self: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        max-width: 100%;
        padding: 9px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(12, 4, 4, 0.68);
        color: #ffe7c0;
        font-size: 13px;
        font-weight: 850;
        line-height: 1.25;
        text-align: center;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
      }

      .cta-frame {
        position: relative;
        margin-top: 12px;
        padding: 7px;
        border: 1px solid rgba(255, 209, 137, 0.25);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 218, 154, 0.2), transparent 28%),
          linear-gradient(315deg, rgba(255, 218, 154, 0.14), transparent 26%),
          rgba(47, 9, 7, 0.9);
        box-shadow:
          0 18px 36px rgba(0, 0, 0, 0.44),
          inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .cta-frame::before,
      .cta-frame::after {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 222, 169, 0.82), transparent);
      }

      .cta-frame::before {
        top: 7px;
      }

      .cta-frame::after {
        bottom: 7px;
      }

      .primary-cta {
        width: 100%;
        min-height: 76px;
        border-radius: 6px;
        border: 1px solid rgba(255, 225, 168, 0.34);
        background: linear-gradient(180deg, #a22b20, #65120e);
        color: #fff8e8;
        font-size: clamp(21px, 6.5vw, 30px);
        font-weight: 950;
        letter-spacing: 0;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
      }

      .skip {
        align-self: center;
        margin-top: 14px;
        background: transparent;
        color: rgba(255, 248, 239, 0.84);
        font-size: 13px;
        font-weight: 800;
      }

      .panel {
        width: 100%;
        max-height: calc(100svh - 92px);
        overflow: auto;
        padding: 22px;
        border: 1px solid rgba(255, 227, 184, 0.18);
        border-radius: 18px;
        background: #100a0a;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
        animation: rise 260ms ease both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.22;
        letter-spacing: 0;
      }

      .panel p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .choices.single {
        grid-template-columns: 1fr;
      }

      .choice,
      .ghost,
      .next-cta {
        min-height: 54px;
        border-radius: 8px;
        font-weight: 850;
      }

      .choice {
        border: 1px solid rgba(255, 226, 175, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        transition:
          border-color 180ms ease,
          background 180ms ease,
          transform 180ms ease;
      }

      .choice:active {
        transform: translateY(1px);
      }

      .choice.is-selected {
        border-color: rgba(242, 191, 107, 0.72);
        background: rgba(184, 50, 36, 0.34);
        transform: translateY(-2px);
      }

      .field-grid {
        display: grid;
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field label {
        color: rgba(255, 247, 236, 0.72);
        font-size: 12px;
        font-weight: 850;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 50px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--ink);
        padding: 0 14px;
        outline: none;
      }

      .field input:focus,
      .field select:focus {
        border-color: rgba(242, 191, 107, 0.78);
        box-shadow: 0 0 0 3px rgba(242, 191, 107, 0.12);
      }

      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }

      .segmented button {
        min-height: 42px;
        border-radius: 999px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: var(--dim);
        font-weight: 850;
      }

      .segmented button[aria-pressed="true"] {
        border-color: rgba(242, 191, 107, 0.7);
        background: rgba(242, 191, 107, 0.16);
        color: var(--ink);
      }

      .actions {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      .ghost {
        border: 1px solid rgba(255, 226, 175, 0.16);
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
      }

      .next-cta {
        border: 1px solid rgba(255, 225, 168, 0.34);
        background: linear-gradient(180deg, #b83224, #73140f);
        color: #fff8e8;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        margin-bottom: 12px;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(242, 191, 107, 0.12);
        color: #ffd894;
        font-size: 12px;
        font-weight: 850;
      }

      .loader {
        display: grid;
        place-items: center;
        gap: 18px;
        text-align: center;
        padding-bottom: 22vh;
      }

      .ring {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        border: 2px solid rgba(242, 191, 107, 0.18);
        border-top-color: var(--gold);
        animation: spin 950ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .result-list {
        display: grid;
        gap: 10px;
        margin: 14px 0;
      }

      .result-item {
        padding: 14px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
      }

      .result-item strong {
        display: block;
        margin-bottom: 5px;
        color: #ffe0a8;
        font-size: 14px;
      }

      .result-item span {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .teaser-panel {
        padding: 18px;
      }

      .teaser-kicker {
        color: var(--gold);
        font-size: 13px;
        font-weight: 900;
      }

      .teaser-title {
        margin: 8px 0 10px;
        font-size: 28px;
        line-height: 1.18;
        letter-spacing: 0;
      }

      .teaser-copy {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .teaser-block {
        margin-top: 16px;
        padding: 16px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.025)),
          rgba(24, 13, 12, 0.9);
      }

      .chapter {
        display: inline-flex;
        margin-bottom: 10px;
        padding: 6px 9px;
        border-radius: 999px;
        background: rgba(139, 30, 22, 0.42);
        color: #ffd894;
        font-size: 12px;
        font-weight: 900;
      }

      .teaser-block h2 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .quote {
        margin: 12px 0 0;
        padding-left: 12px;
        border-left: 2px solid rgba(242, 191, 107, 0.68);
        color: #fff0d8;
        font-size: 15px;
        font-weight: 850;
        line-height: 1.6;
      }

      .saju-table {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
        margin-top: 12px;
      }

      .pillar {
        min-height: 74px;
        display: grid;
        place-items: center;
        gap: 4px;
        padding: 10px 6px;
        border-radius: 8px;
        border: 1px solid rgba(255, 226, 175, 0.16);
        background: rgba(0, 0, 0, 0.26);
        text-align: center;
      }

      .pillar b {
        color: #ffe0a8;
        font-size: 22px;
      }

      .pillar span {
        color: var(--dim);
        font-size: 11px;
      }

      .timeline {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .timeline-row {
        display: grid;
        grid-template-columns: 58px 1fr;
        gap: 10px;
        align-items: start;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .timeline-row strong {
        color: #ffe0a8;
      }

      .story-list {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .story-list-item {
        padding: 15px 15px 15px 17px;
        border-left: 2px solid rgba(242, 191, 107, 0.72);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.055);
        color: #f2dac2;
        font-size: 14px;
        font-weight: 780;
        line-height: 1.58;
      }

      .wealth-chart {
        display: grid;
        gap: 13px;
        margin-top: 20px;
        padding: 18px;
        border: 1px solid rgba(255, 226, 175, 0.17);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.28);
      }

      .chart-row {
        display: grid;
        grid-template-columns: 54px 1fr 44px;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .chart-track {
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .chart-fill {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #8b1e16, #f2bf6b);
        box-shadow: 0 0 18px rgba(242, 191, 107, 0.28);
      }

      .feature-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      .feature {
        padding: 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .feature strong {
        display: block;
        margin-bottom: 4px;
        color: #ffe0a8;
        font-size: 13px;
      }

      .story {
        width: 100%;
        color: var(--ink);
      }

      .sample-story {
        width: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
      }

      .sample-video-shell {
        width: 100%;
        height: 132px;
        overflow: hidden;
        background: #101010;
      }

      .sample-video {
        display: block;
        width: 100%;
        height: 100%;
        background: #101010;
        object-fit: cover;
      }

      .sample-intro-top {
        position: relative;
        height: 604px;
        overflow: hidden;
        background: #000;
      }

      .sample-intro-bg {
        position: absolute;
        top: 246px;
        left: 50%;
        width: 150%;
        max-width: none;
        transform: translateX(-50%);
      }

      .sample-intro-top::before,
      .sample-intro-top::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      .sample-intro-top::before {
        background:
          linear-gradient(rgba(0, 0, 0, 0) 82.692%, #000 100%),
          linear-gradient(0deg, rgba(0, 0, 0, 0) 82.692%, #000 100%);
      }

      .sample-intro-top::after {
        display: none;
      }

      .sample-intro-title {
        position: absolute;
        top: 108px;
        left: 0;
        right: 0;
        z-index: 2;
        margin: 0;
        color: #fff;
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Pretendard, sans-serif;
        font-size: 35px;
        font-weight: 850;
        line-height: 1.4;
        text-align: center;
        letter-spacing: 0;
        text-shadow: 0 0 16px rgba(0, 0, 0, 0.72);
      }

      .sample-intro-title span {
        display: inline-block;
        background: linear-gradient(to bottom, #fff 0%, #ff554c 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .sample-sfx {
        position: absolute;
        top: 258px;
        right: 33px;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 69px;
        height: 112px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 25px;
        font-weight: 800;
        line-height: 1.4;
      }

      .sample-enter {
        display: grid;
        gap: 12px;
        padding: 34px 24px 48px;
        background: #000;
      }

      .source-section {
        position: relative;
        min-height: 560px;
        overflow: hidden;
        background: #000;
      }

      .source-section.short {
        min-height: 459px;
      }

      .source-section.tall {
        min-height: 760px;
      }

      .source-section.book {
        min-height: 1070px;
      }

      .source-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        object-fit: cover;
      }

      .source-img.contain {
        object-fit: contain;
      }

      .source-img.center-wide {
        left: 50%;
        width: 142%;
        transform: translateX(-50%);
      }

      .source-fade {
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0) 16%, rgba(0, 0, 0, 0) 78%, #000 100%),
          radial-gradient(circle at 50% 30%, transparent 0 24%, rgba(0, 0, 0, 0.26) 74%);
        pointer-events: none;
      }

      .source-copy {
        position: absolute;
        left: 24px;
        right: 24px;
        z-index: 2;
        text-align: center;
        word-break: keep-all;
      }

      .source-copy.top {
        top: 46px;
      }

      .source-copy.mid {
        top: 45%;
        transform: translateY(-50%);
      }

      .source-copy.bottom {
        bottom: 42px;
      }

      .source-copy p,
      .source-copy h2 {
        margin: 0;
        text-shadow: 0 0 20px rgba(0, 0, 0, 0.82);
      }

      .source-copy p {
        color: #fff;
        font-size: 25px;
        font-weight: 800;
        line-height: 1.6;
      }

      .source-copy h2 {
        color: #fff;
        font-size: 30px;
        font-weight: 900;
        line-height: 1.35;
      }

      .source-copy .red {
        color: #ff3b35;
        text-shadow:
          0 0 7px rgba(255, 0, 0, 0.8),
          0 0 22px rgba(255, 0, 0, 0.36);
      }

      .source-bubble {
        position: absolute;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 132px;
        min-height: 132px;
        padding: 20px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.72);
        color: #000;
        font-size: 22px;
        font-weight: 900;
        line-height: 1.35;
        text-align: center;
        box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.24);
      }

      .source-bubble.left {
        top: 24px;
        left: 44px;
      }

      .source-bubble.right {
        right: 24px;
        bottom: 120px;
      }

      .source-asset {
        position: absolute;
        z-index: 2;
        max-width: none;
      }

      .source-asset.intro-card {
        right: 0;
        bottom: 110px;
        width: 240px;
        transform: rotate(180deg);
      }

      .source-asset.bubble-img {
        right: 22px;
        bottom: 120px;
        width: 170px;
      }

      .source-asset.bubble-one {
        left: 28px;
        bottom: 92px;
        width: 150px;
      }

      .source-asset.divider-line {
        left: 50%;
        bottom: 98px;
        width: 1px;
        height: 72px;
        transform: translateX(-50%);
      }

      .source-asset.chart {
        left: 50%;
        bottom: 72px;
        width: 82%;
        transform: translateX(-50%);
      }

      .source-full-img {
        display: block;
        width: 100%;
        height: auto;
      }

      .source-chapters {
        position: relative;
        display: grid;
        gap: 78px;
        padding: 70px 0 96px;
        overflow: hidden;
        background: #000;
      }

      .source-chapters::before {
        content: "";
        position: absolute;
        inset: 0;

      stage.addEventListener("click", (event) => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        const valueButton = event.target.closest("[data-value]");

        if (valueButton) {
          handleValue(valueButton.dataset.key, valueButton.dataset.value, valueButton);
        }

        if (action === "enter") go("immersion");
        if (action === "look") go("target");
        if (action === "skip") go("target");
        if (action === "prev") {
          const previous = historyStack.pop();
          go(previous || "landing", false);
        }
        if (action === "target-next") {
          if (!state.target) return showNudge("누구의 운세인지 먼저 골라주세요.");
          go("birth");

        if (action === "birth-next") {
          state.birth = document.querySelector("#birth")?.value.trim() || "";
          go("time");
        }
        if (action === "time-next") {
          state.time = document.querySelector("#birthtime")?.value.trim() || "모름";

        if (action === "gender-next") {

          go("name");
        }
        if (action === "name-next") {

          go("orientation");

        if (action === "concern-next") {

              go("concern");
            });

        if (action === "open-chat") {
          location.href = "/chat.html";
        }
        if (action === "open-purchase") location.href = "/chat.html";
        if (action === "toggle-agree") {
          const key = event.target.closest("[data-agree]")?.dataset.agree;

      function handleValue(key, value, button) {
        state[key] = value;
        button.parentElement
          ?.querySelectorAll("[data-value]")
          .forEach((item) => item.classList.toggle("is-selected", item === button));
        button.parentElement
          ?.querySelectorAll("[aria-pressed]")
          .forEach((item) => item.setAttribute("aria-pressed", String(item === button)));

        const next = button.dataset.next;
        if (next) {
          setTimeout(() => go(next), 170);
        }
      }

      function showNudge(message) {
        const existing = document.querySelector(".nudge");
        if (existing) existing.remove();
        const nudge = document.createElement("div");
        nudge.className = "fineprint nudge";

        stage.querySelector(".panel")?.append(nudge);
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;",
        })[char]);
      }

      function formatBirthLabel(value) {
        const raw = String(value || "").trim();
        const digits = raw.replace(/\D/g, "");
        if (digits.length === 8) return `${digits.slice(0, 4)}.${digits.slice(4, 6)}.${digits.slice(6, 8)}`;
        return raw || "생년월일 미입력";
      }

      function parseBirthInput() {
        const birthSource = state.birth || "2000.01.01";
        const birthDigits = birthSource.replace(/\D/g, "");
        const raw =
          birthDigits.length === 8
            ? [birthDigits.slice(0, 4), birthDigits.slice(4, 6), birthDigits.slice(6, 8)]
            : birthSource.replace(/[./-]/g, ".").split(".");
        const year = Number(raw[0] || 2000);
        const month = Number(raw[1] || 1);
        const day = Number(raw[2] || 1);
        let hour = 12;
        let minute = 0;
        if (state.time && state.time !== "모름") {
          const m = state.time.match(/(\d{1,2}):(\d{2})/);
          if (m) {
            hour = Number(m[1]);
            minute = Number(m[2]);
          }
        }
        return {
          name: state.name,
          year,
          month,
          day,
          hour,
          minute,
          gender: state.gender === "여자" ? "female" : "male",
          calendar: state.calendar === "음력" ? "lunar" : "solar",
        };
      }

      async function analyzeBirth() {
        const birth = parseBirthInput();
        const res = await fetch("/api/saju/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(birth),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "분석 실패");
        state.analysis = json;
        sessionStorage.setItem("cheongi_birth", JSON.stringify({ ...birth, target: state.target, concern: state.concern, relationship: state.relationship, work: state.work, orientation: state.orientation }));
        sessionStorage.setItem("cheongi_analysis", JSON.stringify(json));
        if (state.concern) sessionStorage.setItem("cheongi_initial_concern", state.concern);
      }

      function syncSceneUrl(scene) {

          history.replaceState(null, "", nextUrl);
        }
      }

      function go(scene, remember = true) {
        if (remember && state.scene !== scene) historyStack.push(state.scene);
        state.scene = scene;
        syncSceneUrl(scene);
        phone.dataset.scene =
          scene === "landing"
            ? "landing"
            : scene === "immersion"
              ? "immersion"
              : scene === "loading"
                ? "loading"
                : scene === "result"
                  ? "result"
                  : "input";
        soundButton.style.display = "none";
        steps[scene]();
        phone.scrollTop = 0;
        if (scene === "result") stage.scrollTop = 0;
        requestAnimationFrame(() => {
          phone.scrollTop = 0;
          if (scene === "result") stage.scrollTop = 0;
        });
      }

              <p>${targetLabel}의 생년월일과 지금 고민을 기준으로, 성격의 결부터 돈길과 인연의 흐름까지 이어서 봅니다.</p>
            </section>

            <section class="story-section" data-sample-section="package">
              <span class="chapter">천기 선생님 상담</span>
              <h2>정통사주 깊은 풀이</h2>
              <div class="package-card">
                <h3>${displayName}님 사주 기반 상담 구성</h3>
                <ul class="package-list">
                  <li>나의 사주팔자 상세 분석</li>
                  <li>일간, 오행, 십신, 대운의 흐름 풀이</li>
                  <li>재물운과 일 흐름의 새는 지점 확인</li>
                  <li>연애운과 오래 남을 인연의 패턴</li>
                  <li>${concernText}에 맞춘 맞춤 상담</li>
                </ul>
                <div class="price-slate" aria-label="복채 안내">
                  <div class="price-line"><span>기본 복채</span><span>63,000원</span></div>
                  <div class="price-line"><span>천기 상담 연결</span><span>-13,200원</span></div>
                  <div class="price-line final"><span>지금 열기</span><span>49,800원</span></div>
                </div>
              </div>
            </section>

            <section class="story-visual statement visual-fan" data-sample-section="hesitation">
              <div class="story-caption">
                <p>잠깐</p>
                <h2>지금 무슨 생각을<br />하고 있죠?</h2>
              </div>
            </section>

            <section class="story-section center tall" data-sample-section="comparison">
              <span class="chapter">얄팍한 풀이와 다릅니다</span>
              <h2 class="hero-line">한 해 운세만 보고<br />끝낼 생각입니까?</h2>
              <p>천기 선생님 풀이는 태어난 순간의 결, 지금의 질문, 앞으로의 흐름을 한 줄로 엮어 봅니다.</p>
              <div class="story-list">
                <div class="story-list-item">사주팔자를 먼저 펼치고, 지금 고민이 왜 반복되는지 연결합니다.</div>
                <div class="story-list-item">좋은 말만 늘어놓지 않고, 조심해야 할 방향도 같이 말합니다.</div>
                <div class="story-list-item">상담 버튼을 누르면 LLM이 같은 말투로 이어서 묻고 답합니다.</div>
              </div>
            </section>

            <section class="story-section deep" data-sample-section="report-preview">
              <span class="chapter">리포트 미리보기</span>
              <h2>너를 가감없이 설명하는<br />긴 풀이가 이어집니다</h2>
              <p>실제 상담에서는 질문을 더 던질수록 사주의 결이 더 선명해집니다.</p>
              <div class="report-preview">
                <div class="report-page">성격의 결: 겉으로 보이는 태도와 속에서 반복되는 불안의 방향을 함께 봅니다.</div>
                <div class="report-page">재물의 결: 돈이 모이는 자리와 새는 자리를 나눠서 봅니다.</div>
                <div class="report-page">인연의 결: 끌리는 사람과 오래 남는 사람이 왜 다른지 풀이합니다.</div>
              </div>
            </section>

            <section class="story-visual statement visual-saju" data-sample-section="last-saju-book">
              <div class="story-caption">
                <p>실제 결과 리포트 예시</p>
                <h2>읽는데 2시간은<br />족히 넘게 걸릴 겁니다</h2>
              </div>
            </section>

            <section class="story-section center" data-sample-section="book-volume">
              <span class="chapter">책 한 권 분량</span>
              <h2 class="hero-line">5만 자의 풀이가<br />상담으로 이어집니다</h2>
              <p>하지만 여기서는 길게 늘어놓기보다, 먼저 ${displayName}님이 묻고 싶은 것부터 바로 파고들겠습니다.</p>
              <div class="story-callout">말투도, 흐름도, 방금 본 천기 선생님 그대로 이어집니다.</div>
            </section>

            <section class="story-section" data-sample-section="contents-list">
              <span class="chapter">더 이어질 풀이</span>
              <h2>착한 척은 그만해도 됩니다<br />네 속이 다 보이니까</h2>
              <div class="story-list">
                <div class="story-list-item">남들에게 들키기 싫은 진짜 성격과 숨겨진 열등감</div>
                <div class="story-list-item">평생 돈이 한 번 크게 움직이는 시점과 막아야 할 돈구멍</div>
                <div class="story-list-item">내 곁에 붙어 있어야 할 귀인과 멀리해야 할 인연 구별법</div>
                <div class="story-list-item">지금 버틸지, 옮길지, 방향을 바꿀지 보는 맞춤 처방</div>
              </div>
            </section>

            <section class="story-visual statement visual-outro" data-sample-section="final-proof">
              <div class="story-caption">
                <p>내가 지금까지 점사를 봐준 사람은 많습니다</p>
                <h2>압도적인 몰입감으로<br />이어가겠습니다</h2>
              </div>
            </section>

            <section class="story-section deep" data-sample-section="reviews">
              <span class="chapter">실제 상담 흐름</span>
              <h2>혼자 읽고 끝나는 풀이가 아닙니다</h2>
              <p>결과를 읽다가 걸리는 문장이 생기면 바로 묻습니다. 천기 선생님이 같은 사주표를 붙잡고 이어서 봅니다.</p>
              <div class="stats" aria-label="상담 지표">
                <div class="stat"><strong>1:1</strong><span>맞춤 상담</span></div>
                <div class="stat"><strong>24</strong><span>오행 흐름</span></div>
                <div class="stat"><strong>100</strong><span>페이지급 밀도</span></div>
              </div>
              <div class="reviews">
                <div class="review">“직장 운 때문에 들어왔는데, 그냥 위로가 아니라 왜 같은 고민이 반복되는지부터 짚어줘서 몰입됐습니다.”</div>
                <div class="review">“처음 결과 화면 말투 그대로 상담이 이어져서 한 사람이 보고 있는 느낌이 납니다.”</div>
              </div>
            </section>

            <section class="story-section flush-bottom" data-sample-section="proof-and-chat">
              <span class="chapter">마지막 확인</span>
              <h2>이제 상담으로 들어갑니다</h2>
              <p>방금 펼친 사주를 바탕으로 더 깊은 상담에 들어갑니다. 묻고 싶은 걸 던지면 천기 선생님이 같은 말투로 이어서 풀어드립니다.</p>
              <div class="proof-stack">
                <div class="proof-row"><span>분석 기준</span><strong>${birthLabel}</strong></div>
                <div class="proof-row"><span>먼저 보이는 기운</span><strong>${dayMasterElement}</strong></div>
                <div class="proof-row"><span>지금 고민</span><strong>${concernText}</strong></div>
              </div>
            </section>

            <div class="sticky-story-cta">
              <button class="primary-cta" type="button" data-action="open-chat">사주 풀이 · 천기 선생님 상담</button>
            </div>
          </article>
        `;
      }

      function renderPurchase() {
        const plans = [
          { id: "single", title: "운명신당 정통사주", badge: "기본", discount: "21%", origin: "63,000원", price: "49,800원" },
          { id: "solo", title: "솔로탈출 패키지", badge: "추천", discount: "44%", origin: "108,000원", price: "60,000원" },
          { id: "deep", title: "MZ 운세 패키지", badge: "인기", discount: "30%", origin: "96,000원", price: "67,000원" },
        ];
        const selected = plans.find((plan) => plan.id === state.plan) || plans[0];

        stage.innerHTML = `
          <section class="panel teaser-panel">
            <div class="status">결제 안내 데모</div>
            <h1>전체 풀이를 열어볼까요?</h1>
            <p>${state.name || "당신"}님의 입력값으로 만든 전체 리포트 선택 화면입니다. 실제 결제는 연결하지 않은 데모입니다.</p>

            <div class="result-list">
              ${plans
                .map(
                  (plan) => `
                    <button class="result-item choice ${state.plan === plan.id ? "is-selected" : ""}" type="button" data-key="plan" data-value="${plan.id}">
                      <strong>${plan.badge} · ${plan.title}</strong>
                      <span>${plan.discount} 할인 · <s>${plan.origin}</s> → ${plan.price}</span>
                    </button>
                  `,
                )
                .join("")}
            </div>

            <div class="teaser-block">
              <span class="chapter">결제 요약</span>
              <div class="timeline">
                <div class="timeline-row"><strong>상품</strong><span>${selected.title}</span></div>
                <div class="timeline-row"><strong>판매가</strong><span>${selected.origin}</span></div>
                <div class="timeline-row"><strong>할인</strong><span>${selected.discount} 적용</span></div>
                <div class="timeline-row"><strong>결제금액</strong><span>${selected.price}</span></div>
              </div>
              <button class="ghost" type="button" style="width: 100%; margin-top: 12px;">쿠폰 적용</button>
            </div>

            <div class="teaser-block">
              <span class="chapter">동의</span>
              <div class="choices single">
                <button class="choice ${state.privacyAgree ? "is-selected" : ""}" type="button" data-action="toggle-agree" data-agree="privacyAgree">개인정보 처리방침 동의</button>
                <button class="choice ${state.paymentAgree ? "is-selected" : ""}" type="button" data-action="toggle-agree" data-agree="paymentAgree">결제 진행 필수 동의</button>
                <button class="choice ${state.marketingAgree ? "is-selected" : ""}" type="button" data-action="toggle-agree" data-agree="marketingAgree">마케팅 수신 동의 (선택)</button>
              </div>
            </div>

            <div class="actions">
              <button class="ghost" type="button" data-action="prev">이전</button>
              <button class="next-cta" type="button" data-action="pay-demo">결제하기</button>
            </div>
          </section>
        `;
      }

      function renderPaymentReady() {
        stage.innerHTML = `
          <section class="panel">
            <div class="status">여기서 실제 결제 모듈로 연결</div>
            <h1>결제 직전 단계입니다</h1>
            <p>원본 흐름에서는 이 다음에 외부 결제/주문 진행이 이어집니다. 이 데모는 안전하게 화면 전환까지만 구현했습니다.</p>
            <div class="result-list">
              <div class="result-item"><strong>선택 상품</strong><span>${state.plan === "single" ? "운명신당 정통사주" : state.plan === "solo" ? "솔로탈출 패키지" : "MZ 운세 패키지"}</span></div>
              <div class="result-item"><strong>필수 동의</strong><span>개인정보 처리방침, 결제 진행 필수 동의 완료</span></div>
            </div>
            <button class="next-cta" type="button" data-action="restart" style="width: 100%">처음부터 다시 보기</button>
          </section>
        `;
      }

      const initialScene = location.hash.slice(1);
      if (urlScenes.has(initialScene)) {
        go(initialScene, false);
      } else {
        syncSceneUrl("landing");
        renderLanding();
      }
    </script>
  </body>
</html>

      function readReportHistory() {
        try {
          const parsed = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
          return Array.isArray(parsed) ? parsed.filter((item) => item?.reportId && item?.analysis) : [];
        } catch (err) {
          return [];
        }
      }

      function writeReportHistory(items) {
        const seen = new Set();
        const next = items.filter((item) => {
          if (!item?.reportId || seen.has(item.reportId)) return false;
          seen.add(item.reportId);
          return true;
        });
        next.sort((a, b) => historyTimestamp(b.savedAt) - historyTimestamp(a.savedAt));
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(next));
        } catch (err) {
          console.warn("풀이 보관함 저장 공간이 부족합니다. 기존 저장 데이터는 유지됩니다.", err);
        }
      }

      function historyTimestamp(value) {
        const time = new Date(value || 0).getTime();
        return Number.isFinite(time) ? time : 0;
      }

      function mergeReportHistory(remoteItems = []) {
        const usableRemoteItems = remoteItems.filter((item) => item?.reportId && item?.analysis);
        if (!usableRemoteItems.length) return readReportHistory();
        const localItems = readReportHistory();
        const byReportId = new Map();
        [...localItems, ...usableRemoteItems].forEach((item) => {
          const existing = byReportId.get(item.reportId);
          if (!existing || historyTimestamp(item.savedAt) >= historyTimestamp(existing.savedAt)) {
            byReportId.set(item.reportId, {
              ...existing,
              ...item,
              chatHistory: Array.isArray(item.chatHistory) && item.chatHistory.length
                ? item.chatHistory
                : (existing?.chatHistory || []),
              initialConcern: item.initialConcern || existing?.initialConcern || "",
            });
          }
        });
        writeReportHistory(Array.from(byReportId.values()));
        return readReportHistory();
      }

      async function syncRemoteReportHistory(force = false) {
        if (reportHistorySyncPromise && !force) return reportHistorySyncPromise;
        reportHistorySyncPromise = (async () => {
          const headers = await authHeaders();
          if (!headers.Authorization) return readReportHistory();
          const res = await fetch(`/api/user/reports?limit=${REMOTE_HISTORY_SYNC_LIMIT}`, { headers });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || "원격 풀이 보관함을 불러오지 못했습니다.");
          return mergeReportHistory(Array.isArray(json.reports) ? json.reports : []);
        })();
        try {
          return await reportHistorySyncPromise;
        } finally {
          reportHistorySyncPromise = null;
        }
      }

      async function deleteRemoteReport(reportId) {
        const headers = await authHeaders();
        if (!headers.Authorization) return false;
        const res = await fetch(`/api/user/reports/${encodeURIComponent(reportId)}`, {
          method: "DELETE",
          headers,
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(json.error || "원격 풀이 삭제에 실패했습니다.");
        return Boolean(json.deleted);
      }

      function setActiveReportId(reportId) {
        if (!reportId) return;
        sessionStorage.setItem(ACTIVE_REPORT_KEY, reportId);
        localStorage.setItem(ACTIVE_REPORT_KEY, reportId);
      }

      function clearActiveReportId(reportId) {
        if (sessionStorage.getItem(ACTIVE_REPORT_KEY) === reportId) {
          sessionStorage.removeItem(ACTIVE_REPORT_KEY);
          sessionStorage.removeItem("cheongi_chat_history");
        }
        if (localStorage.getItem(ACTIVE_REPORT_KEY) === reportId) {
          localStorage.removeItem(ACTIVE_REPORT_KEY);
        }
      }

      function readPaidReportIds() {
        try {
          const parsed = JSON.parse(localStorage.getItem(PAID_REPORTS_KEY) || "[]");
          return Array.isArray(parsed) ? parsed.map(String) : [];
        } catch (err) {
          return [];
        }
      }

      function isCurrentReportPaid() {
        const report = state.analysis?.report || {};
        const reportId = report.reportId || "";
        const paidIds = readPaidReportIds();
        return Boolean(
          report.isPaid
          || report.paid
          || report.paymentStatus === "paid"
          || report.entitlement === "paid"
          || (reportId && paidIds.includes(reportId))
        );
      }

      function formatSavedAt(value) {
        const date = new Date(value || Date.now());
        if (Number.isNaN(date.getTime())) return "방금 전";
        return date.toLocaleString("ko-KR", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function formatReportId(reportId) {
        const raw = String(reportId || "").trim();
        if (!raw) return "ID 없음";
        return raw.length > 16 ? `${raw.slice(0, 8)}...${raw.slice(-6)}` : raw;
      }

      function buildReportLink(reportId) {
        const url = new URL(location.href);
        url.searchParams.set("reportId", reportId);
        url.hash = "result";
        return url.href;
      }

      function syncFullReportResultUrl(reportId) {
        if (!reportId) return;
        const url = new URL("/cmdg/", location.origin);
        url.searchParams.set("authReturn", "1");
        url.searchParams.set("reportId", reportId);
        url.hash = "result";
        history.replaceState(null, "", url.toString());
      }

      function syncReportIdInUrl(reportId) {
        const url = new URL(location.href);
        if (reportId) {
          url.searchParams.set("reportId", reportId);
        } else {
          url.searchParams.delete("reportId");
        }
        const hash = state.scene === "landing" ? "" : `#${state.scene}`;
        const nextUrl = `${url.pathname}${url.search}${hash}`;
        if (`${location.pathname}${location.search}${location.hash}` !== nextUrl) {
          history.replaceState(null, "", nextUrl);
        }
      }

      function pad2(value) {
        return String(Number(value || 0)).padStart(2, "0");
      }

      function applyReadingPayload(payload) {
        const analysis = payload?.analysis;
        if (!analysis) return false;

        const saved = payload.birthState || {};
        const birth = payload.birth || analysis.birth || {};
        const context = payload.context || {};
        const partner = saved.partner || context.partner || {};
        state.serviceKey = normalizeServiceKey(saved.serviceKey || context.serviceKey) || state.serviceKey;
        state.target = saved.target || context.target || "본인";
        state.calendar = saved.calendar || (birth.calendar === "lunar" ? "음력" : "양력");
        state.birth = saved.birth || (birth.year ? `${birth.year}.${pad2(birth.month || 1)}.${pad2(birth.day || 1)}` : "");
        state.gender = saved.gender || (birth.gender ? (birth.gender === "female" ? "여자" : "남자") : "");
        state.time = saved.time || (Number.isFinite(Number(birth.hour)) ? `${pad2(birth.hour)}:${pad2(birth.minute || 0)}` : "모름");
        state.birthTimeKnown = saved.birthTimeKnown ?? state.time !== "모름";
        state.name = saved.name || context.name || "";
        state.orientation = saved.orientation || context.orientation || "";
        state.relationship = saved.relationship || context.relationship || "";
        state.work = saved.work || context.work || "";
        state.concern = saved.concern || context.concern || "";
        state.partnerMode = partner.mode || "none";
        state.partnerName = partner.name || "";
        state.partnerRelationship = partner.relationship || "썸/관심 상대";
        state.partnerCalendar = partner.birth?.calendar === "lunar" ? "음력" : "양력";
        state.partnerBirth = partner.birth?.year ? `${partner.birth.year}${pad2(partner.birth.month || 1)}${pad2(partner.birth.day || 1)}` : "";
        state.partnerGender = partner.birth?.gender === "female" ? "여자" : partner.birth?.gender === "male" ? "남자" : "";
        state.partnerBirthTimeKnown = partner.birthTimeKnown === true;
        state.partnerTime = state.partnerBirthTimeKnown && Number.isFinite(Number(partner.birth?.hour))
          ? `${pad2(partner.birth.hour)}:${pad2(partner.birth.minute || 0)}`
          : "모름";
        applyServiceDefaults({ preserveConcern: true });
        state.analysis = analysis;
        state.reportPageIndex = 0;
        state.reportSectionCache = {};
        state.reportRequestToken += 1;
        stopReportTyping();

        const birthForSession = parseBirthInput();
        const reportId = analysis.report?.reportId || payload.reportId || "";
        const chatHistory = Array.isArray(payload.chatHistory) ? payload.chatHistory : [];
        setActiveReportId(reportId);
        sessionStorage.setItem("cheongi_analysis", JSON.stringify(analysis));
        sessionStorage.setItem("cheongi_birth", JSON.stringify({
          ...birthForSession,
          birthTimeKnown: state.birthTimeKnown,
          serviceKey: state.serviceKey,
          target: state.target,
          concern: state.concern,
          relationship: state.relationship,
          work: state.work,
          orientation: state.orientation,
          partner: getPartnerContext(),
        }));
        sessionStorage.setItem("cheongi_chat_history", JSON.stringify(chatHistory));
        if (state.concern) sessionStorage.setItem("cheongi_initial_concern", state.concern);
        return true;
      }

      function historySubtitle(entry) {
        const bits = [
          entry.birthState?.relationship,
          entry.birthState?.work,
          entry.birthState?.concern,
        ].filter(Boolean);
        const progress = entry.progress?.total
          ? `${entry.progress.complete || 0}/${entry.progress.total}`
          : "저장됨";
        return `${bits.join(" · ") || "풀이 저장"} · ${progress} · ${formatSavedAt(entry.savedAt)}`;
      }

      function buildHistoryEntry() {
        const report = state.analysis?.report;
        if (!report?.reportId) return null;
        const birth = parseBirthInput();
        let chatHistory = [];
        try {
          chatHistory = JSON.parse(sessionStorage.getItem("cheongi_chat_history") || "[]");
        } catch (err) {
          chatHistory = [];
        }
        const birthState = {
          serviceKey: state.serviceKey,
          target: state.target,
          calendar: state.calendar,
          birth: state.birth,
          gender: state.gender,
          time: state.time,
          birthTimeKnown: state.birthTimeKnown,
          name: state.name,
          orientation: state.orientation,
          relationship: state.relationship,
          work: state.work,
          concern: state.concern,
          partner: getPartnerContext(),
        };
        const titleName = state.name || state.target || "자네";
        return {
          reportId: report.reportId,
          savedAt: new Date().toISOString(),
          title: `${titleName} · ${state.calendar} ${formatBirthLabel(state.birth)}`,
          birth,
          birthState,
          context: getReportContext(),
          analysis: state.analysis,
          progress: report.progress,
          storage: report.storage,
          corpusFingerprint: report.corpus?.fingerprint,
          chatHistory: Array.isArray(chatHistory) ? chatHistory : [],
          initialConcern: state.concern || "",
        };
      }

      function saveCurrentReading() {
        const entry = buildHistoryEntry();
        if (!entry) return;
        setActiveReportId(entry.reportId);
        const items = readReportHistory();
        const existing = items.find((item) => item.reportId === entry.reportId);
        const merged = {
          ...existing,
          ...entry,
          chatHistory: entry.chatHistory.length ? entry.chatHistory : (existing?.chatHistory || []),
          initialConcern: entry.initialConcern || existing?.initialConcern || "",
        };
        writeReportHistory([merged, ...items.filter((item) => item.reportId !== entry.reportId)]);
      }

      function renderSettingsPanel() {
        const items = readReportHistory();
        const listMarkup = items.length
          ? items.map((entry) => `
              <div class="history-row">
                <button class="history-item" type="button" data-history-open="${escapeHtml(entry.reportId)}">
                  <strong>${escapeHtml(entry.title || "저장된 풀이")}</strong>
                  <span>${escapeHtml(historySubtitle(entry))}</span>
                  <span class="history-id">ID ${escapeHtml(formatReportId(entry.reportId))}</span>
                </button>
                <button class="history-remove" type="button" aria-label="${escapeHtml(entry.title || "저장된 풀이")} 삭제" data-history-delete="${escapeHtml(entry.reportId)}">×</button>
              </div>
            `).join("")
          : `
              <div class="history-empty">
                <strong>저장된 풀이가 없습니다</strong>
                <span>한 번 풀이를 열면 이곳에 남습니다.</span>
              </div>
            `;

        settingsPanel.innerHTML = `
          <div class="settings-sheet" role="dialog" aria-modal="true" aria-label="설정">
            <div class="settings-head">
              <div>
                <strong>천명대공(天命大公)</strong>
                <span>풀이 보관함</span>
              </div>
              <button class="icon-button" type="button" aria-label="설정 닫기" data-settings-close>
                <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
                </svg>
              </button>
            </div>
            <div class="settings-list">${listMarkup}</div>
            <div class="history-actions">
              <button type="button" data-history-new>새 사주 입력</button>
            </div>
          </div>
        `;
      }

      function confirmPermanentDelete(entry) {
        const title = entry?.title || "저장된 상담";
        return window.confirm(`${title}\n\n이 상담 내용과 저장된 풀이를 삭제합니다.\n삭제하면 되돌릴 수 없습니다.\n정말 삭제할까요?`);
      }

      async function ensureVaultAccess() {
        let session = null;
        try {
          session = await currentAuthSession();
        } catch (err) {
          console.warn("보관함 로그인 확인 실패", err);
        }
        if (!session?.access_token) {
          location.href = "/signup?entry=vault";
          return false;
        }

        try {
          const profile = await fetchUserProfile();
          if (profile?.name && applyUserProfile(profile)) return true;
        } catch (err) {
          console.warn("보관함 사주 프로필 확인 실패", err);
        }

        location.href = "/signup?entry=vault";
        return false;
      }

      async function openSettings() {
        if (!(await ensureVaultAccess())) return;
        renderSettingsPanel();
        settingsPanel.classList.add("is-open");
        settingsPanel.setAttribute("aria-hidden", "false");
        syncRemoteReportHistory(true)
          .then(() => {
            if (settingsPanel.classList.contains("is-open")) renderSettingsPanel();
          })
          .catch((err) => console.warn("원격 풀이 보관함 동기화에 실패했습니다.", err));
      }

      function closeSettings() {
        settingsPanel.classList.remove("is-open");
        settingsPanel.setAttribute("aria-hidden", "true");
      }

      function resetReadingState() {
        const preservedServiceKey = state.serviceKey;
        state.target = "본인";
        state.calendar = "양력";
        state.birth = "";
        state.gender = "";
        state.time = "모름";
        state.birthTimeKnown = false;
        state.name = "";
        state.orientation = "";
        state.relationship = "";
        state.work = "";
        state.concern = "";
        state.serviceKey = preservedServiceKey;
        state.partnerMode = "none";
        state.partnerName = "";
        state.partnerRelationship = "썸/관심 상대";
        state.partnerCalendar = "양력";
        state.partnerBirth = "";
        state.partnerGender = "";
        state.partnerTime = "모름";
        state.partnerBirthTimeKnown = false;
        applyServiceDefaults();
        state.analysis = null;
        state.todayFortune = null;
        state.reportPageIndex = 0;
        state.reportSectionCache = {};
        state.reportRequestToken += 1;
        stopReportTyping();
        syncReportIdInUrl("");
      }

      function restoreHistoryEntry(reportId) {
        const entry = readReportHistory().find((item) => item.reportId === reportId);
        if (!entry?.analysis || !applyReadingPayload(entry)) return;
        closeSettings();
        historyStack.length = 0;
        go("result", false);
      }

      async function loadReportById(reportId) {
        const trimmed = String(reportId || "").trim();
        if (!trimmed) throw new Error("풀이 ID가 비어 있습니다.");

        const cached = readReportHistory().find((item) => item.reportId === trimmed);
        if (cached?.analysis && applyReadingPayload(cached)) {
          historyStack.length = 0;
          go("result", false);
          return;
        }

        const res = await fetch(`/api/report/${encodeURIComponent(trimmed)}`, {
          headers: await authHeaders(),
        });
        const json = await res.json();
        if (!res.ok || !json.analysis) {
          throw new Error(json.error || "저장된 풀이를 찾지 못했습니다.");
        }
        if (!applyReadingPayload(json)) {
          throw new Error("저장된 풀이를 화면에 복원하지 못했습니다.");
        }
        saveCurrentReading();
        historyStack.length = 0;
        go("result", false);
      }

      const steps = {
        landing: renderLanding,
        immersion: renderImmersion,
        birth: renderBirth,
        time: renderTime,
        name: renderName,
        concern: renderConcern,
        login: renderLogin,
        my: renderMy,
        loading: renderLoading,
        result: renderResult,
        todayResult: renderTodayResult,
        purchase: renderPurchase,
        paymentReady: renderPaymentReady,
      };

      soundButton.addEventListener("click", () => {
        soundButton.textContent = "몰입 모드가 준비됐어요";
      });

      settingsButton.addEventListener("click", openSettings);

      settingsPanel.addEventListener("click", (event) => {
        if (event.target === settingsPanel || event.target.closest("[data-settings-close]")) {
          closeSettings();
          return;
        }

        const openButton = event.target.closest("[data-history-open]");
        if (openButton) {
          restoreHistoryEntry(openButton.dataset.historyOpen);
          return;
        }

        const deleteButton = event.target.closest("[data-history-delete]");
        if (deleteButton) {
          const reportId = deleteButton.dataset.historyDelete;
          const items = readReportHistory();
          const entry = items.find((item) => item.reportId === reportId);
          if (!confirmPermanentDelete(entry)) return;
          writeReportHistory(items.filter((item) => item.reportId !== reportId));
          clearActiveReportId(reportId);
          renderSettingsPanel();
          deleteRemoteReport(reportId).catch((err) => console.warn("원격 풀이 삭제에 실패했습니다.", err));
          return;
        }

        if (event.target.closest("[data-history-new]")) {
          closeSettings();
          historyStack.length = 0;
          resetReadingState();
          go("name", false);
        }
      });

      backGlobal.addEventListener("click", () => {
        if (state.scene === "login" && isStandaloneSignupFlow()) {
          clearTodayEntryPending();
          location.href = "/";
          return;
        }
        if (historyStack.length === 0) {
          go("landing", false);
          return;
        }

        const previous = historyStack.pop();
        go(previous, false);
      });

      stage.addEventListener("click", (event) => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        const valueButton = event.target.closest("[data-value]");

        if (valueButton) {
          handleValue(valueButton.dataset.key, valueButton.dataset.value, valueButton);
        }

        if (action === "enter") {
          startStandardReading();
          return;
        }
        if (action === "look") {
          startStandardReading();
          return;
        }
        if (action === "skip") {
          startStandardReading();
          return;
        }
        if (action === "prev") {
          const previous = historyStack.pop();
          go(previous || "landing", false);
        }
        if (action === "birth-next") {
          state.birth = document.querySelector("#birth")?.value.trim() || "";
          const birthError = validateBirth(state.birth);
          if (birthError) {
            setFieldError("birth", birthError);
            return;
          }
          go("time");
        }
        if (action === "time-next") {
          const timeValue = document.querySelector("#birthtime")?.value.trim() || "";
          const timeError = validateTime(timeValue);
          if (timeError) {
            setFieldError("birthtime", timeError);
            return;
          }
          state.time = normalizeTime(timeValue);
          state.birthTimeKnown = true;
          if (wantsTodayEntry()) {
            completeTodayProfileFromInput();
            return;
          }
          if (wantsProtectedProfileEntry()) {
            completeProtectedProfileFromInput();
            return;
          }
          go("concern");
        }
        if (action === "time-unknown") {
          state.time = "모름";
          state.birthTimeKnown = false;
          if (wantsTodayEntry()) {
            completeTodayProfileFromInput();
            return;
          }
          if (wantsProtectedProfileEntry()) {
            completeProtectedProfileFromInput();
            return;
          }
          go("concern");
        }
        if (action === "name-next") {
          state.name = document.querySelector("#name")?.value.trim() || "";
          const nameError = validateName(state.name);
          if (nameError) {
            setFieldError("name", nameError);
            return;
          }
          if (!state.gender) return showNudge("성별을 먼저 선택해주세요.");
          go("birth");
        }
        if (action === "concern-next") {
          if (isLoveThisYearService() && !collectLoveConcernForm()) return;
          state.concern = document.querySelector("#concern")?.value.trim() || state.concern || "";
          persistAuthFormState();
          beginAnalysisAfterAuth();
        }
        if (action === "today-edit-profile") {
          setTodayEntryPending();
          state.todayFortune = null;
          go("name");
        }
        if (action === "today-full-report") {
          state.concern = TODAY_CONCERN;
          go("loading");
          analyzeBirth()
            .then(() => {
              go("result");
              syncFullReportResultUrl(state.analysis?.report?.reportId);
            })
            .catch((err) => {
              go("todayResult", false);
              showNudge(err.message || "전체 풀이를 불러오지 못했습니다.");
            });
        }
        if (action === "open-chat") {
          if (isCurrentReportPaid()) {
            location.href = "/chat.html";
            return;
          }
          go("purchase");
        }
        if (action === "open-settings") {
          openSettings();
        }
        if (action === "my-edit-profile") {
          go("name");
        }
        if (action === "my-open-destiny") {
          location.href = "/destiny";
        }
        if (action === "copy-report-link") {
          copyReportLink(event.target.closest("[data-action]"));
        }
        if (action === "report-prev") {
          loadReportPage((state.reportPageIndex || 0) - 1);
        }
        if (action === "report-next") {
          loadReportPage((state.reportPageIndex || 0) + 1);
        }

      function validateName(value) {
        const name = String(value || "").trim();
        if (!name) return "이름을 입력해주세요.";
        if (name.length < 2) return "이름은 한글 2자 이상 입력해주세요.";
        if (name.length > 5) return "이름은 한글 5자까지만 입력해주세요.";
        if (!/^[가-힣]+$/.test(name)) return "이름은 한글만 입력해주세요. 영어, 숫자, 특수기호는 사용할 수 없습니다.";
        return "";
      }

      function validateBirth(value) {
        const birth = String(value || "").trim();
        if (!birth) return "생년월일을 입력해주세요.";
        if (!/^\d{8}$/.test(birth)) return "생년월일은 숫자 8자리로 입력해주세요. 예: 19750926";

        const year = Number(birth.slice(0, 4));
        const month = Number(birth.slice(4, 6));
        const day = Number(birth.slice(6, 8));
        const date = new Date(year, month - 1, day);
        const isValidDate =
          date.getFullYear() === year &&
          date.getMonth() === month - 1 &&
          date.getDate() === day;

        if (!isValidDate) return "존재하지 않는 날짜입니다. 생년월일을 다시 확인해주세요.";
        if (year < 1900 || year > new Date().getFullYear()) return "생년월일의 연도를 다시 확인해주세요.";
        return "";
      }

      function normalizeTime(value) {
        const raw = String(value || "").trim();
        const match = raw.match(/^(\d{1,2})(?::?(\d{2}))?$/);
        if (!match) return raw;
        return `${pad2(match[1])}:${pad2(match[2] || 0)}`;
      }

      function validateTime(value) {
        const raw = String(value || "").trim();
        if (!raw) return "태어난 시간을 입력하거나 시간모름을 선택해주세요.";
        const match = raw.match(/^(\d{1,2})(?::?(\d{2}))?$/);
        if (!match) return "태어난 시간은 13:30처럼 입력해주세요.";
        const hour = Number(match[1]);
        const minute = Number(match[2] || 0);
        if (hour < 0 || hour > 23 || minute < 0 || minute > 59) {
          return "태어난 시간은 00:00부터 23:59 사이로 입력해주세요.";
        }
        return "";
      }

      function syncLoveConcernFieldsFromDom() {
        if (!isLoveThisYearService()) return;
        const read = (selector) => document.querySelector(selector)?.value.trim();
        state.concern = read("#concern") || state.concern || currentService()?.defaultConcern || "";
        state.partnerName = read("#partnerName") || state.partnerName;
        state.partnerRelationship = read("#partnerRelationship") || state.partnerRelationship;
        state.partnerBirth = read("#partnerBirth") || state.partnerBirth;
        if (state.partnerBirthTimeKnown) {
          const time = read("#partnerTime");
          state.partnerTime = time ? normalizeTime(time) : state.partnerTime;
        } else {
          state.partnerTime = "모름";
        }
      }

        if (!isLoveThisYearService()) return true;
        applyServiceDefaults({ preserveConcern: true });
        syncLoveConcernFieldsFromDom();
        if (!state.relationship) return showNudge("현재 관계 상태를 선택해주세요."), false;
        if (!state.orientation) return showNudge("관계 기준을 선택해주세요."), false;
        if (state.partnerMode !== "known") return true;

        const birthError = validateBirth(state.partnerBirth);
        if (birthError) {
          setFieldError("partnerBirth", `상대방 ${birthError}`);
          return false;
        }
        if (!state.partnerGender) {
          showNudge("상대방 성별을 선택해주세요.");
          return false;
        }
        if (state.partnerBirthTimeKnown) {
          const timeError = validateTime(state.partnerTime);
          if (timeError) {
            setFieldError("partnerTime", `상대방 ${timeError}`);

          }
          state.partnerTime = normalizeTime(state.partnerTime);
        } else {
          state.partnerTime = "모름";
        }
        return true;
      }

      function setFieldError(fieldId, message) {
        const input = document.querySelector(`#${fieldId}`);
        const error = document.querySelector(`#${fieldId}-error`);
        if (!input || !error) return showNudge(message);
        input.setAttribute("aria-invalid", "true");

        const input = document.querySelector(`#${fieldId}`);

        return String(value ?? "").replace(/[&<>"']/g, (char) => ({

          "\"": "&quot;",
          "'": "&#39;",

      function formatBirthLabel(value) {
        const raw = String(value || "").trim();
        const digits = raw.replace(/\D/g, "");
        if (digits.length === 8) return `${digits.slice(0, 4)}.${digits.slice(4, 6)}.${digits.slice(6, 8)}`;
        return raw || "생년월일 미입력";
      }

      function parseBirthInput() {
        const birthSource = state.birth || "2000.01.01";
        const birthDigits = birthSource.replace(/\D/g, "");
        const raw =
          birthDigits.length === 8
            ? [birthDigits.slice(0, 4), birthDigits.slice(4, 6), birthDigits.slice(6, 8)]
            : birthSource.replace(/[./-]/g, ".").split(".");
        const year = Number(raw[0] || 2000);
        const month = Number(raw[1] || 1);
        const day = Number(raw[2] || 1);
        let hour = 12;
        let minute = 0;
        if (state.time && state.time !== "모름") {
          const m = state.time.match(/(\d{1,2}):(\d{2})/);
          if (m) {
            hour = Number(m[1]);
            minute = Number(m[2]);
          }
        }
        return {
          name: state.name,
          year,
          month,
          day,
          hour,
          minute,
          gender: state.gender === "여자" ? "female" : "male",
          calendar: state.calendar === "음력" ? "lunar" : "solar",
        };
      }

      async function analyzeBirth() {
        const birth = parseBirthInput();
        const context = {
          serviceKey: state.serviceKey,
          name: state.name,
          target: state.target,
          concern: state.concern,
          relationship: state.relationship,
          orientation: state.orientation,
          work: state.work,
          partner: getPartnerContext(),
        };
        await saveCurrentUserProfile();
        state.reportPageIndex = 0;
        state.reportSectionCache = {};
        state.reportRequestToken += 1;
        if (state.reportTypingTimer) clearTimeout(state.reportTypingTimer);
        state.reportTypingTimer = null;
        const headers = await authHeaders({ "Content-Type": "application/json" });
        const res = await fetch("/api/saju/analyze", {
          method: "POST",
          headers,
          body: JSON.stringify({ ...birth, ...context, birthTimeKnown: state.birthTimeKnown, context }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "분석 실패");
        state.analysis = json;
        const reportId = json.report?.reportId || "";
        const stored = readReportHistory().find((item) => item.reportId === reportId);
        setActiveReportId(reportId);
        syncBirthSessionFromState();
        sessionStorage.setItem("cheongi_analysis", JSON.stringify(json));
        sessionStorage.setItem("cheongi_chat_history", JSON.stringify(stored?.chatHistory || []));
        if (state.concern) sessionStorage.setItem("cheongi_initial_concern", state.concern);
        saveCurrentReading();
      }

      function syncSceneUrl(scene) {
        const url = new URL(location.href);
        if (/^\/signup(?:\/|\.html)?$/i.test(url.pathname) && scene !== "login") {
          url.pathname = "/cmdg/";
        }
        if (scene === "result" && state.analysis?.report?.reportId) {
          url.searchParams.set("reportId", state.analysis.report.reportId);
        }
        if (scene === "todayResult") {
          url.searchParams.delete("authEntry");
          url.searchParams.delete("entry");
          url.searchParams.delete("signupReturn");
          url.searchParams.delete("reportId");
        }
        const hash = scene === "landing" ? "" : `#${scene}`;
        const nextUrl = `${url.pathname}${url.search}${hash}`;
        if (`${location.pathname}${location.search}${location.hash}` !== nextUrl) {
          history.replaceState(null, "", nextUrl);
        }
      }

      function seedReportCache() {
        for (const section of getReportSections()) {
          if (!state.reportSectionCache[section.id]) {
            state.reportSectionCache[section.id] = { ...section, generatedBy: "template" };
          }
        }

      function stopReportTyping() {
        if (state.reportTypingTimer) clearTimeout(state.reportTypingTimer);
        state.reportTypingTimer = null;
      }

      function updateReportToc() {
        const toc = document.querySelector("[data-report-toc]");
        const sections = getReportSections();
        if (toc && sections.length) {
          toc.innerHTML = renderReportTocMarkup(sections, state.reportPageIndex);
        }
      }

      function showReportPageFrame(section, status = "") {
        const reader = document.querySelector("[data-report-reader]");
        const sections = getReportSections();
        if (!reader || !section || !sections.length) return;
        reader.innerHTML = renderReportPageMarkup(section, state.reportPageIndex, sections.length, "", status);
        updateReportToc();
      }

      function typeReportText(section, token) {
        const body = document.querySelector("[data-report-body]");
        const status = document.querySelector(".report-status");
        if (!body || !section) return;
        const fullText = String(section.interpretation || "");
        let cursor = 0;
        const step = Math.max(2, Math.ceil(fullText.length / 260));
        body.classList.add("typing-cursor");
        if (status) status.remove();

        const tick = () => {
          if (token !== state.reportRequestToken) return;
          cursor = Math.min(fullText.length, cursor + step);
          body.innerHTML = formatInterpretationHtml(fullText.slice(0, cursor));
          if (cursor < fullText.length) {
            state.reportTypingTimer = setTimeout(tick, 18);
          } else {
            body.classList.remove("typing-cursor");
            state.reportTypingTimer = null;
          }
        };
        tick();
      }

      async function fetchReportSection(section) {
        const birth = parseBirthInput();
        const res = await fetch("/api/report/section", {
          method: "POST",
          headers: await authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({
            birth,
            reportId: state.analysis?.report?.reportId,
            sectionId: section.id,
            context: getReportContext(),
          }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "리포트 생성 실패");
        if (json.report && state.analysis) {
          state.analysis.report = json.report;
          seedReportCache();
          saveCurrentReading();
        }
        return { ...json.section, generatedBy: json.generatedBy, model: json.model };
      }

      async function prewarmReport() {
        const reportId = state.analysis?.report?.reportId;
        if (!reportId) return;
        const birth = parseBirthInput();
        try {
          const res = await fetch("/api/report/prewarm", {
            method: "POST",
            headers: await authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({
              birth,
              reportId,
              context: getReportContext(),
            }),
          });
          const json = await res.json();
          if (!res.ok || !json.report || !state.analysis) return;
          state.analysis.report = json.report;
          seedReportCache();
          saveCurrentReading();
        } catch (err) {
          // The section API still falls back to on-demand generation.
        }
      }

      async function copyReportLink(button) {
        const reportId = state.analysis?.report?.reportId;
        if (!reportId) return;
        const link = buildReportLink(reportId);
        syncReportIdInUrl(reportId);
        try {
          await navigator.clipboard.writeText(link);
          if (button) {
            const original = button.textContent;
            button.textContent = "복사됨";
            setTimeout(() => {
              button.textContent = original || "링크 복사";
            }, 1400);
          }
        } catch (err) {
          if (button) button.textContent = "ID 확인";
        }
      }

      async function loadReportPage(index, force = false) {
        const sections = getReportSections();
        if (!sections.length) return;
        const nextIndex = Math.min(Math.max(index, 0), sections.length - 1);
        state.reportPageIndex = nextIndex;
        const templateSection = sections[nextIndex];
        stopReportTyping();
        const token = state.reportRequestToken + 1;
        state.reportRequestToken = token;

        const cached = state.reportSectionCache[templateSection.id];
        if (cached && !force && (cached.generatedBy === "openai" || cached.status === "complete")) {
          showReportPageFrame(cached, "");
          typeReportText(cached, token);
          return;
        }

        showReportPageFrame(templateSection, "천명대공(天命大公)이 이 장의 기운을 펼치는 중입니다");
        try {
          const generated = await fetchReportSection(templateSection);
          if (token !== state.reportRequestToken) return;
          state.reportSectionCache[templateSection.id] = generated;
          showReportPageFrame(generated, "");
          typeReportText(generated, token);
        } catch (err) {
          if (token !== state.reportRequestToken) return;
          const fallback = cached || templateSection;
          state.reportSectionCache[templateSection.id] = fallback;
          showReportPageFrame(fallback, "");
          typeReportText(fallback, token);
        }
      }

      function setupReportReader() {
        if (!getReportSections().length) return;

          loadReportPage(state.reportPageIndex || 0);

      function renderAuthProviderButton(providerName, className, label, helper, mark) {
        const isLoading = !authConfigData;
        const isConfigured = Boolean(authConfigData?.providers?.[providerName]);
        const isSigningIn = authSignInProvider === providerName;
        const stateAttrs = isLoading
          ? `data-auth-loading="${providerName}" aria-disabled="true"`
          : isConfigured
            ? `data-auth-provider="${providerName}"`
            : `data-auth-unavailable="${providerName}" aria-disabled="true"`;
        const stateClass = [
          className,
          isConfigured ? "" : "is-unavailable",
          isSigningIn ? "is-loading" : "",
        ].filter(Boolean).join(" ");
        const statusText = isLoading ? "연결 확인 중" : helper;

        return `
          <button class="auth-provider ${stateClass}" type="button" ${stateAttrs}>
            <span class="auth-provider-mark" aria-hidden="true">${escapeHtml(mark)}</span>
            <span class="auth-provider-copy">
              <strong>${escapeHtml(label)}</strong>
              <small>${escapeHtml(statusText)}</small>
            </span>
          </button>
        `;
      }

                <div class="result-item"><strong>선택 상품</strong><span>${escapeHtml(service.title)}</span></div>
                <div class="result-item"><strong>결제금액</strong><span>${escapeHtml(service.price)}</span></div>
                <div class="result-item"><strong>상대방 사주</strong><span>${state.partnerMode === "known" ? "입력 포함" : "새 인연 기준"}</span></div>
              </div>
              <button class="next-cta" type="button" data-action="restart" style="width: 100%">처음부터 다시 보기</button>
            </section>
          `;
          return;
        }
        stage.innerHTML = `
          <section class="panel">
            <div class="status">여기서 실제 결제 모듈로 연결</div>
            <h1>결제 직전 단계입니다</h1>
            <p>원본 흐름에서는 이 다음에 외부 결제/주문 진행이 이어집니다. 이 데모는 안전하게 화면 전환까지만 구현했습니다.</p>
            <div class="result-list">
              <div class="result-item"><strong>선택 상품</strong><span>${state.plan === "single" ? "운명신당 정통사주" : state.plan === "solo" ? "솔로탈출 패키지" : "MZ 운세 패키지"}</span></div>
              <div class="result-item"><strong>필수 동의</strong><span>개인정보 처리방침, 결제 진행 필수 동의 완료</span></div>
            </div>
            <button class="next-cta" type="button" data-action="restart" style="width: 100%">처음부터 다시 보기</button>
          </section>
        `;
      }

      function renderReportLookupError(message) {
        phone.dataset.scene = "input";
        stage.innerHTML = `
          <section class="panel">
            <div class="status">풀이 ID 조회 실패</div>
            <h1>저장된 풀이를 찾지 못했습니다</h1>
            <p>${escapeHtml(message || "이 ID의 저장 데이터가 아직 서버에 없거나, 보관함에서 삭제된 상태입니다.")}</p>
            <div class="actions">
              <button class="ghost" type="button" data-action="open-settings">보관함 보기</button>
              <button class="next-cta" type="button" data-action="restart">새 사주 입력</button>
            </div>
          </section>
        `;
      }

      const initialScene = isPortalSignupEntry && !location.hash.slice(1) ? "login" : location.hash.slice(1);
      const removedInputScenes = new Set(["immersion", "target", "gender", "orientation", "relationship", "work"]);
      const resolvedInitialScene = removedInputScenes.has(initialScene) ? "name" : initialScene;
      const freshInputScenes = new Set(["name", "birth", "time", "concern"]);
      const settingsEntryScenes = new Set(["vault", "settings", "history"]);
      const initialReportId = new URLSearchParams(location.search).get("reportId");
      if (isStandaloneSignupFlow() && !isAuthReturn) {
        sessionStorage.removeItem(AUTH_PENDING_KEY);
        sessionStorage.removeItem(AUTH_FORM_KEY);
      }
      if (isAuthReturn || sessionStorage.getItem(AUTH_PENDING_KEY) === "1") {
        restoreAuthFormState();
      }
      if (initialReportId && (!resolvedInitialScene || resolvedInitialScene === "result")) {
        go("loading", false);
        loadReportById(initialReportId).catch((err) => {
          renderReportLookupError(err.message);
        });
      } else if (urlScenes.has(resolvedInitialScene)) {
        if (freshInputScenes.has(resolvedInitialScene) && !isAuthReturn && sessionStorage.getItem(AUTH_PENDING_KEY) !== "1") {
          resetReadingState();
        }
        go(resolvedInitialScene, false);
      } else if (legacyPolicyPaths[resolvedInitialScene]) {
        location.replace(legacyPolicyPaths[resolvedInitialScene]);
      } else if (settingsEntryScenes.has(resolvedInitialScene)) {
        syncSceneUrl("landing");
        renderLanding();
        requestAnimationFrame(() => openSettings());
      } else {
        renderLanding();
        syncSceneUrl("landing");
      }
      if (isSignupReturn) {
        clearSignupQuery();
      }
      initAuth().then(() => {
        if (wantsProtectedProfileEntry() && authSession?.access_token) {
          beginProtectedEntryAfterAuth();
          return;
        }
        if (wantsTodayEntry() && authSession?.access_token) {
          beginTodayAfterAuth();
          return;
        }
        if (!initialReportId && (isAuthReturn || sessionStorage.getItem(AUTH_PENDING_KEY) === "1") && authSession?.access_token) {
          beginAnalysisAfterAuth();
        }
      }).catch((err) => {
        if (isAuthReturn || sessionStorage.getItem(AUTH_PENDING_KEY) === "1") {
          showAuthGate(err.message || "회원 인증을 확인하지 못했습니다.");
        }
      });
    </script>
  </body>
</html>

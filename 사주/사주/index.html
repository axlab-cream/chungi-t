<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>천명대공(天命大公) · 사주</title>
    <meta name="description" content="천명대공(天命大公) 몰입형 사주 상담" />
    <style>
      @font-face {
        font-family: "Maru Buri";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("assets/fonts/MaruBuri-SemiBold.woff2") format("woff2");
      }

      @font-face {
        font-family: "Maru Buri";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("assets/fonts/MaruBuri-Bold.woff2") format("woff2");
      }

      @font-face {
        font-family: "Noto Serif KR";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/NotoSerifKR-Regular.ttf") format("truetype");
      }

      @font-face {
        font-family: "Pretendard";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2");
      }

      :root {
        color-scheme: dark;
        --ink: #fff8ef;
        --muted: #e0c7ad;
        --dim: rgba(255, 248, 239, 0.62);
        --red: #8b1e16;
        --red-deep: #360706;
        --gold: #f2bf6b;
        --line: rgba(255, 229, 188, 0.22);
        --font-brand: "Maru Buri", "Noto Serif KR", serif;
        --font-saju-heading: "Maru Buri", "Noto Serif KR", serif;
        --font-reading-body: "Noto Serif KR", "Apple SD Gothic Neo", serif;
        --font-meta: "Pretendard", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --topbar-height: 72px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        min-height: 100%;
        background: #000;
        scrollbar-width: none;
        font-family:
          Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        place-items: start center;
        min-height: 100svh;
        overflow: hidden;
        scrollbar-width: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      .phone::-webkit-scrollbar,
      .stage::-webkit-scrollbar,
      .panel::-webkit-scrollbar,
      .settings-sheet::-webkit-scrollbar {
        display: none;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .phone {
        position: relative;
        width: min(100vw, 440px);
        height: 100svh;
        max-height: none;
        overflow: hidden;
        scrollbar-width: none;
        background: #080302;
        color: var(--ink);
        box-shadow: 0 24px 80px rgba(13, 21, 35, 0.24);
      }

      .hero {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.02) 0%,
            rgba(0, 0, 0, 0.04) 40%,
            rgba(0, 0, 0, 0.5) 70%,
            rgba(0, 0, 0, 0.92) 100%
          ),
          url("assets/hero-mystic.webp") center top / cover no-repeat;
        transform: scale(1);
        transition:
          transform 560ms ease,
          filter 560ms ease,
          opacity 560ms ease;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 18%, transparent 0 24%, rgba(0, 0, 0, 0.18) 58%),
          linear-gradient(to right, rgba(0, 0, 0, 0.26), transparent 18% 82%, rgba(0, 0, 0, 0.26));
      }

      .concern-video-bg,
      .concern-video-shade {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 260ms ease;
      }

      .concern-video-bg {
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.035);
        filter: saturate(0.94) brightness(0.68);
        background: #000;
      }

      .concern-video-shade {
        z-index: 1;
        background:
          linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.9) 0%,
            rgba(0, 0, 0, 0.46) 24%,
            rgba(0, 0, 0, 0.18) 48%,
            rgba(0, 0, 0, 0.66) 76%,
            rgba(0, 0, 0, 0.98) 100%
          ),
          linear-gradient(to right, rgba(0, 0, 0, 0.42), transparent 18% 82%, rgba(0, 0, 0, 0.42));
      }

      .phone[data-scene="immersion"] .hero,
      .phone[data-scene="input"] .hero,
      .phone[data-scene="loading"] .hero,
      .phone[data-scene="result"] .hero {
        filter: saturate(0.92) brightness(0.54);
        transform: scale(1.08);
      }

      .phone[data-scene="result"] .hero {
        opacity: 0;
      }

      .phone[data-scene="input"] .hero {
        opacity: 0;
      }

      .phone[data-scene="input"] .concern-video-bg,
      .phone[data-scene="input"] .concern-video-shade {
        opacity: 1;
      }

      .phone[data-scene="login"] .hero {
        opacity: 0;
      }

      .phone[data-scene="login"] .concern-video-bg,
      .phone[data-scene="login"] .concern-video-shade {
        opacity: 1;
      }

      .phone[data-scene="login"] .stage {
        justify-content: center;
        padding: 22px 18px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 74% 2%, rgba(242, 191, 107, 0.12), transparent 14rem),
          linear-gradient(180deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.64));
      }

      .topbar {
        position: relative;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        height: var(--topbar-height);
        padding: 12px 20px;
        border-bottom: 1px solid rgba(242, 191, 107, 0.18);
        background: rgba(8, 8, 7, 0.96);
        box-shadow: none;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid rgba(242, 191, 107, 0.22);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.26);
        color: var(--gold);
        backdrop-filter: blur(8px);
      }

      .brand {
        text-align: center;
        font-size: 18px;
        font-weight: 950;
        line-height: 1.2;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .topbar-brand-logo {
        display: inline-grid;
        place-items: start;
        min-width: 0;
        text-decoration: none;
      }

      .topbar-logo {
        display: block;
        width: min(100%, 220px);
        height: 78px;
        object-fit: contain;
      }

      .umsh-service-logo {
        display: inline-grid;
        gap: 1px;
        place-items: start;
        color: #f2bf6b;
        line-height: 1;
        text-align: left;
      }

      .umsh-service-logo img {
        display: block;
        width: 132px;
        height: 50px;
        object-fit: contain;
      }

      .umsh-service-logo span {
        background: linear-gradient(120deg, #846427 0%, #b99142 27%, #e0c47b 54%, #f1e3b1 72%, #9a7531 100%);
        background-clip: text;
        color: transparent;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.14em;
        line-height: 1.1;
      }

      .umsh-service-logo b {
        color: #f2bf6b;
        font-family: var(--font-meta);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.12em;
      }

      .topbar-vault-button {
        display: grid;
        width: 34px;
        min-height: 34px;
        place-items: center;
        padding: 0;
        border: 1px solid rgba(242, 191, 107, 0.22);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.26);
        color: var(--gold);
        font-family: var(--font-meta);
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0;
        box-shadow: none;
      }

      .settings-panel {
        position: absolute;
        inset: 0;
        z-index: 8;
        display: none;
        padding: calc(var(--topbar-height) + 12px) 16px 18px;
        background: rgba(2, 1, 1, 0.62);
        backdrop-filter: blur(12px);
      }

      .settings-panel.is-open {
        display: block;
      }

      .auth-gate {
        position: absolute;
        inset: 0;
        z-index: 12;
        display: none;
        place-items: end center;
        padding: 18px 18px max(22px, env(safe-area-inset-bottom));
        background:
          linear-gradient(to bottom, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.82)),
          rgba(0, 0, 0, 0.58);
        backdrop-filter: blur(10px);
      }

      .auth-gate.is-open {
        display: grid;
      }

      .auth-card {
        position: relative;
        width: 100%;
        display: grid;
        gap: 16px;
        overflow: hidden;
        padding: 22px;
        border: 1px solid rgba(242, 191, 107, 0.28);
        border-radius: 8px;
        background:
          radial-gradient(circle at 84% 0%, rgba(242, 191, 107, 0.18), transparent 11rem),
          linear-gradient(160deg, rgba(23, 21, 16, 0.98), rgba(8, 8, 7, 0.98) 72%);
        box-shadow:
          0 28px 70px rgba(0, 0, 0, 0.58),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .auth-card::after {
        content: "命";
        position: absolute;
        top: 6px;
        right: -12px;
        color: rgba(242, 191, 107, 0.06);
        font-family: var(--font-saju-heading);
        font-size: 124px;
        font-weight: 900;
        line-height: 1;
        pointer-events: none;
      }

      .auth-card-head,
      .auth-provider-list,
      .auth-benefits,
      .auth-message,
      .auth-cancel {
        position: relative;
        z-index: 1;
      }

      .auth-card-head {
        display: grid;
        gap: 8px;
      }

      .auth-card-kicker {
        color: #f2bf6b;
        font-size: 10px;
        font-weight: 950;
        letter-spacing: 0.12em;
      }

      .auth-card h2 {
        margin: 0;
        font-family: var(--font-saju-heading);
        font-size: 27px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .auth-card p {
        margin: 0;
        color: rgba(255, 248, 239, 0.72);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.62;
        word-break: keep-all;
      }

      .auth-benefits {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }

      .auth-benefits span {
        min-height: 38px;
        padding: 8px 6px;
        border: 1px solid rgba(242, 191, 107, 0.18);
        border-radius: 8px;
        background: rgba(255, 248, 239, 0.045);
        color: rgba(255, 235, 205, 0.78);
        font-size: 10px;
        font-weight: 850;
        line-height: 1.25;
        text-align: center;
      }

      .auth-provider-list {
        display: grid;
        gap: 9px;
      }

      .auth-provider {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        min-height: 52px;
        overflow: hidden;
        padding: 0 14px;
        border: 1px solid rgba(255, 226, 183, 0.18);
        border-radius: 8px;
        background: rgba(255, 248, 239, 0.07);
        color: #fff7ea;
        text-align: left;
        transform: translateY(0);
        transition:
          border-color 180ms ease,
          box-shadow 180ms ease,
          filter 180ms ease,
          transform 180ms ease;
      }

      .auth-provider::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
        opacity: 0;
        pointer-events: none;
        transform: translateX(-70%);
        transition:
          opacity 180ms ease,
          transform 360ms ease;
      }

      .auth-provider:hover,
      .auth-provider:focus-visible,
      .auth-provider.is-loading {
        border-color: rgba(242, 191, 107, 0.46);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
        filter: brightness(1.04);
        transform: translateY(-2px);
      }

      .auth-provider:hover::after,
      .auth-provider:focus-visible::after,
      .auth-provider.is-loading::after {
        opacity: 1;
        transform: translateX(70%);
      }

      .auth-provider-mark {
        display: grid;
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.28);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 14px;
        font-weight: 900;
      }

      .auth-provider-copy {
        display: grid;
        min-width: 0;
        gap: 2px;
      }

      .auth-provider-copy strong {
        font-size: 14px;
        font-weight: 950;
        line-height: 1.2;
      }

      .auth-provider-copy small {
        font-size: 10px;
        font-weight: 800;
        line-height: 1.2;
        opacity: 0.68;
      }

      .auth-provider.kakao {
        background: #fee500;
        color: #1b1200;
      }

      .auth-provider.naver {
        background: #03c75a;
        color: #fff;
      }

      .auth-provider.google {
        background: #fff;
        color: #211b18;
      }

      .auth-provider.is-unavailable {
        cursor: not-allowed;
        opacity: 0.62;
      }

      .auth-provider.is-unavailable:hover,
      .auth-provider.is-unavailable:focus-visible {
        box-shadow: none;
        filter: none;
        transform: none;
      }

      .auth-provider.naver.is-unavailable {
        border-color: rgba(3, 199, 90, 0.35);
        background: rgba(3, 199, 90, 0.16);
        color: rgba(255, 255, 255, 0.82);
      }

      .auth-message {
        min-height: 18px;
        color: #f2bf6b;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.45;
      }

      .auth-cancel {
        justify-self: center;
        min-height: 38px;
        padding: 0 12px;
        background: transparent;
        color: rgba(255, 236, 202, 0.76);
        font-size: 13px;
        font-weight: 850;
      }

      .auth-cancel:hover,
      .auth-cancel:focus-visible {
        color: #f2bf6b;
      }

      .settings-sheet {
        width: 100%;
        max-height: 100%;
        overflow: auto;
        scrollbar-width: none;
        border: 1px solid rgba(255, 226, 183, 0.2);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(39, 8, 6, 0.98), rgba(6, 2, 2, 0.98)),
          #100404;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.56);
      }

      .settings-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 18px 12px;
        border-bottom: 1px solid rgba(255, 226, 183, 0.14);
      }

      .settings-head strong {
        display: block;
        color: #fff7ea;
        font-size: 20px;
        font-weight: 950;
        line-height: 1.2;
      }

      .settings-head span {
        display: block;
        margin-top: 4px;
        color: rgba(255, 236, 202, 0.58);
        font-size: 12px;
        font-weight: 800;
      }

      .settings-list {
        display: grid;
        gap: 10px;
        padding: 14px;
      }

      .history-item {
        width: 100%;
        min-height: 88px;
        padding: 13px;
        border: 1px solid rgba(255, 226, 183, 0.18);
        border-radius: 8px;
        background: rgba(255, 248, 239, 0.055);
        color: #fff5e5;
        text-align: left;
      }

      .history-item strong,
      .history-empty strong {
        display: block;
        font-size: 15px;
        font-weight: 950;
        line-height: 1.35;
      }

      .history-item span,
      .history-empty span {
        display: block;
        margin-top: 6px;
        color: rgba(255, 231, 194, 0.65);
        font-size: 12px;
        font-weight: 750;
        line-height: 1.4;
      }

      .history-id {
        color: rgba(242, 191, 107, 0.72) !important;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px !important;
        letter-spacing: 0;
      }

      .history-actions {
        display: flex;
        gap: 8px;
        padding: 0 14px 14px;
      }

      .history-actions button,
      .history-remove {
        min-height: 40px;
        border-radius: 8px;
        border: 1px solid rgba(255, 226, 183, 0.18);
        background: rgba(255, 248, 239, 0.07);
        color: #ffe7c2;
        font-size: 13px;
        font-weight: 900;
      }

      .history-actions button {
        flex: 1;
      }

      .history-row {
        display: grid;
        grid-template-columns: 1fr 44px;
        gap: 8px;
      }

      .history-remove {
        width: 44px;
        min-height: 44px;
        align-self: start;
        border-color: rgba(255, 104, 78, 0.34);
        background: rgba(126, 20, 15, 0.18);
        color: #ffb3a4;
        font-size: 22px;
        line-height: 1;
      }

      .history-empty {
        min-height: 96px;
        padding: 18px;
        border: 1px dashed rgba(255, 226, 183, 0.22);
        border-radius: 8px;
        color: #fff5e5;
      }

      .stage {
        position: relative;
        z-index: 2;
        height: calc(100% - var(--topbar-height));
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 22px max(24px, env(safe-area-inset-bottom));
        scrollbar-width: none;
      }

      .phone[data-scene="result"] .stage {
        position: absolute;
        top: var(--topbar-height);
        right: 0;
        bottom: 0;
        left: 0;
        height: auto;
        display: block;
        justify-content: flex-start;
        overflow: auto;
        padding: 0 0 max(24px, env(safe-area-inset-bottom));
        background: #050202;
      }

      .phone[data-scene="landing"] .hero,
      .phone[data-scene="result"] .hero {
        opacity: 0;
      }

      .phone[data-scene="landing"] .sound,
      .phone[data-scene="result"] .sound {
        display: none;
      }

      .phone[data-scene="landing"] .stage {
        position: absolute;
        top: var(--topbar-height);
        right: 0;
        bottom: 0;
        left: 0;
        height: auto;
        display: block;
        justify-content: flex-start;
        overflow: auto;
        padding: 0 0 max(24px, env(safe-area-inset-bottom));
        background: #000;
      }

      .phone[data-scene="result"] .brand {
        text-shadow:
          0 2px 12px rgba(0, 0, 0, 0.92),
          0 0 18px rgba(0, 0, 0, 0.8);
      }

      .sound {
        position: absolute;
        top: calc(var(--topbar-height) + 12px);
        left: 50%;
        z-index: 3;
        display: inline-flex;
        transform: translateX(-50%);
        min-height: 40px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 16px;
        border: 1px solid rgba(255, 235, 203, 0.24);
        border-radius: 999px;
        background: rgba(12, 5, 4, 0.56);
        color: #fff0d8;
        font-size: 13px;
        font-weight: 850;
        backdrop-filter: blur(10px);
      }

      .line-pill {
        align-self: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        max-width: 100%;
        padding: 9px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(12, 4, 4, 0.68);
        color: #ffe7c0;
        font-size: 13px;
        font-weight: 850;
        line-height: 1.25;
        text-align: center;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
      }

      .cta-frame {
        position: relative;
        margin-top: 12px;
        padding: 7px;
        border: 1px solid rgba(255, 209, 137, 0.25);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 218, 154, 0.2), transparent 28%),
          linear-gradient(315deg, rgba(255, 218, 154, 0.14), transparent 26%),
          rgba(47, 9, 7, 0.9);
        box-shadow:
          0 18px 36px rgba(0, 0, 0, 0.44),
          inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .cta-frame::before,
      .cta-frame::after {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 222, 169, 0.82), transparent);
      }

      .cta-frame::before {
        top: 7px;
      }

      .cta-frame::after {
        bottom: 7px;
      }

      .primary-cta {
        width: 100%;
        min-height: 76px;
        border-radius: 6px;
        border: 1px solid rgba(255, 225, 168, 0.34);
        background: linear-gradient(180deg, #a22b20, #65120e);
        color: #fff8e8;
        font-size: clamp(21px, 6.5vw, 30px);
        font-weight: 950;
        letter-spacing: 0;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
      }

      .skip {
        align-self: center;
        margin-top: 14px;
        background: transparent;
        color: rgba(255, 248, 239, 0.84);
        font-size: 13px;
        font-weight: 800;
      }

      .panel {
        width: 100%;
        max-height: calc(100svh - 92px);
        overflow: auto;
        scrollbar-width: none;
        padding: 22px;
        border: 1px solid rgba(255, 227, 184, 0.18);
        border-radius: 18px;
        background: #100a0a;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
        animation: rise 260ms ease both;
      }

      .phone[data-scene="input"] .panel {
        border-color: rgba(255, 227, 184, 0.22);
        background:
          linear-gradient(180deg, rgba(16, 10, 10, 0.24), rgba(8, 4, 4, 0.12)),
          rgba(7, 4, 4, 0.08);
        box-shadow:
          0 18px 58px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(4px);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }

      .panel h1 {

        font-size: 24px;
        line-height: 1.22;
        letter-spacing: 0;
      }

      .panel p {

        font-size: 14px;
        line-height: 1.55;
      }

      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .choices.single {
        grid-template-columns: 1fr;
      }

      .choice,

      .next-cta {
        min-height: 54px;
        border-radius: 8px;
        font-weight: 850;
      }

      .choice {
        border: 1px solid rgba(255, 226, 175, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        transition:
          border-color 180ms ease,
          background 180ms ease,
          transform 180ms ease;
      }

      .choice:active {
        transform: translateY(1px);
      }

      .choice.is-selected {
        border-color: rgba(242, 191, 107, 0.72);
        background: rgba(184, 50, 36, 0.34);
        transform: translateY(-2px);
      }

      .field-grid {
        display: grid;
        gap: 10px;
      }

      .phone[data-step="name"] .field-grid {
        margin-bottom: 16px;

      .field {
        display: grid;
        gap: 7px;
      }

      .field label {
        color: rgba(255, 247, 236, 0.72);
        font-size: 12px;
        font-weight: 850;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 50px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--ink);
        padding: 0 14px;
        outline: none;
      }

      .phone[data-scene="input"] .field input,
      .phone[data-scene="input"] .field select {
        border-color: rgba(255, 226, 175, 0.28);
        background: rgba(15, 10, 10, 0.18);
        box-shadow: inset 0 1px 10px rgba(0, 0, 0, 0.2);
      }

      .field input:focus,
      .field select:focus {
        border-color: rgba(242, 191, 107, 0.78);
        box-shadow: 0 0 0 3px rgba(242, 191, 107, 0.12);
      }

      .field input[aria-invalid="true"],
      .field select[aria-invalid="true"] {
        border-color: rgba(255, 78, 64, 0.86);
        box-shadow:
          0 0 0 3px rgba(255, 78, 64, 0.14),
          inset 0 1px 10px rgba(0, 0, 0, 0.2);
      }

      .field-error {
        min-height: 18px;
        color: #ff5a4f;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.45;
      }

      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }

      .segmented button {
        min-height: 42px;
        border-radius: 999px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: var(--dim);
        font-weight: 850;
      }

      .segmented button[aria-pressed="true"] {
        border-color: rgba(242, 191, 107, 0.7);
        background: rgba(242, 191, 107, 0.16);
        color: var(--ink);
      }

      .actions {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      .ghost {
        border: 1px solid rgba(255, 226, 175, 0.16);
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
      }

      .phone[data-step="concern"] .ghost {
        border-color: rgba(255, 226, 175, 0.24);
        background: rgba(18, 12, 12, 0.24);
      }

      .next-cta {
        border: 1px solid rgba(255, 225, 168, 0.34);
        background: linear-gradient(180deg, #b83224, #73140f);
        color: #fff8e8;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        margin-bottom: 12px;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(242, 191, 107, 0.12);
        color: #ffd894;
        font-size: 12px;
        font-weight: 850;
      }

      .loader {
        display: grid;
        place-items: center;
        width: 100%;
        padding: 0 0 18vh;
      }

      .interpret-loader-card {
        width: min(100%, 340px);
        display: grid;
        gap: 16px;
        padding: 22px 18px 18px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 0%, rgba(170, 37, 27, 0.26), transparent 46%),
          linear-gradient(180deg, rgba(34, 8, 7, 0.88), rgba(5, 2, 2, 0.94));
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
        text-align: center;
      }

      .interpret-orb {
        position: relative;
        width: 74px;
        height: 74px;
        margin: 0 auto;
        border-radius: 50%;
        border: 1px solid rgba(242, 191, 107, 0.26);
        background:
          radial-gradient(circle at 50% 50%, rgba(242, 191, 107, 0.32), transparent 32%),
          radial-gradient(circle at 50% 50%, rgba(156, 25, 20, 0.46), transparent 58%),
          #080303;
      }

      .interpret-orb::before {
        content: "";
        position: absolute;
        inset: -5px;
        border-radius: inherit;
        border: 2px solid rgba(242, 191, 107, 0.14);
        border-top-color: #f2bf6b;
        border-right-color: rgba(203, 56, 38, 0.76);
        animation: spin 1.05s linear infinite;
      }

      .interpret-orb::after {
        content: "";
        position: absolute;
        inset: 24px;
        border-radius: inherit;
        background: #f2bf6b;
        box-shadow: 0 0 20px rgba(242, 191, 107, 0.86);
        animation: pulse-glow 1.4s ease-in-out infinite;
      }

      .interpret-loader-copy {
        display: grid;
        gap: 8px;
      }

      .interpret-loader-copy .line-pill {
        justify-self: center;
        margin: 0;
      }

      .interpret-loader-copy p {
        margin: 0;
        color: rgba(255, 239, 211, 0.72);
        font-size: 13px;
        font-weight: 800;
        line-height: 1.55;
      }

      .interpret-progress {
        position: relative;
        height: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 226, 175, 0.13);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
      }

      .interpret-progress::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 46%;
        border-radius: inherit;
        background:
          linear-gradient(90deg, transparent, rgba(255, 244, 214, 0.84), transparent),
          linear-gradient(90deg, #721812, #d44731 54%, #f2bf6b);
        box-shadow: 0 0 18px rgba(242, 191, 107, 0.42);
        animation: progress-scan 1.65s ease-in-out infinite;
      }

      .interpret-steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }

      .interpret-steps span {
        min-width: 0;
        padding: 7px 5px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.045);
        color: rgba(255, 232, 197, 0.74);
        font-size: 11px;
        font-weight: 900;
        line-height: 1.2;
      }

      .interpret-steps span:nth-child(2) {
        color: #ffe4af;
        animation: step-glow 1.65s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse-glow {
        50% {
          opacity: 0.55;
          transform: scale(0.78);
        }
      }

      @keyframes progress-scan {
        0% {
          transform: translateX(-105%);
        }
        52% {
          transform: translateX(92%);
        }
        100% {
          transform: translateX(190%);
        }
      }

      @keyframes step-glow {
        50% {
          border-color: rgba(242, 191, 107, 0.42);
          background: rgba(146, 31, 23, 0.26);
        }
      }

      .result-list {
        display: grid;
        gap: 10px;
        margin: 14px 0;
      }

      .result-item {
        padding: 14px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);

        display: block;
        margin-bottom: 5px;
        color: #ffe0a8;
        font-size: 14px;
      }

      .result-item span {

      }

        display: grid;
        gap: 14px;
      }

      }

      .today-score-card {

        gap: 6px 14px;

      .today-pillar-card small {

        font-weight: 750;

      }

      .today-reading-head {

        letter-spacing: 0;
      }

      .today-reading-head p {
        margin: 0;

      }

      .today-reading-list {
        margin: 0;

        gap: 12px;

        margin: 0;

      .today-detail-note {

      .today-action-box strong {

      .today-action-box span {
        color: rgba(255, 247, 236, 0.78);

        font-weight: 700;

      .teaser-panel {
        padding: 18px;

      .teaser-kicker {
        color: var(--gold);
        font-size: 13px;
        font-weight: 900;
      }

      .teaser-title {

        letter-spacing: 0;

      .teaser-block {
        margin-top: 16px;
        padding: 16px;
        border: 1px solid rgba(255, 226, 175, 0.14);

      .chapter {

      .ritual-word {
        color: #fff8ef;
        font-size: clamp(22px, 6.4vw, 30px);
        font-weight: 950;
        line-height: 1.18;
        text-shadow: 0 10px 28px rgba(0, 0, 0, 0.58);
      }

      .ritual-word .gold {
        color: var(--gold);
      }

      .big-kanji {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 22px 0;
        color: rgba(242, 191, 107, 0.28);
        font-size: 64px;
        font-weight: 950;
        line-height: 1;
        text-align: center;
      }

      .price-card {
        margin-top: 18px;
        padding: 18px;
        border-radius: 8px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        background: rgba(255, 255, 255, 0.055);
      }

      .price-row {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 8px 0;
        color: var(--muted);
        font-size: 14px;
      }

      .price-row strong {
        color: #fff1d6;
      }

      .reviews {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }

      .review {
        padding: 14px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.055);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-top: 18px;
      }

      .stat {
        padding: 14px 8px;
        border-radius: 8px;
        background: rgba(139, 30, 22, 0.22);
        text-align: center;
      }

      .stat strong {
        display: block;
        color: #fff1d6;
        font-size: 20px;
      }

      .stat span {
        color: var(--dim);
        font-size: 11px;
      }

      .destiny-card {
        display: grid;
        gap: 12px;
        margin-top: 18px;
        padding: 18px;
        border: 1px solid rgba(255, 226, 175, 0.2);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(118, 24, 20, 0.36), rgba(255, 255, 255, 0.035)),
          #110707;
      }

      .destiny-card h3 {
        margin: 0 0 4px;
        color: #fff2da;
        font-size: 20px;
        line-height: 1.25;
      }

      .destiny-row {
        display: grid;
        grid-template-columns: 74px 1fr;
        gap: 12px;
        color: #f2dac2;
        font-size: 14px;
        line-height: 1.5;
      }

      .destiny-row strong {
        color: var(--gold);
      }

      .package-card {
        margin-top: 20px;
        padding: 18px;
        border: 1px solid rgba(255, 226, 175, 0.22);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(90, 14, 12, 0.72), rgba(18, 5, 5, 0.96)),
          #100505;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .package-card h3 {
        margin: 0 0 14px;
        color: #fff4df;
        font-size: 19px;
        line-height: 1.32;
      }

      .package-list {
        display: grid;
        gap: 9px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .package-list li {
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.055);
        color: #ecd0b5;
        font-size: 13px;
        font-weight: 760;
        line-height: 1.48;
      }

      .price-slate {
        display: grid;
        gap: 8px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid rgba(255, 226, 175, 0.16);
      }

      .price-line {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        color: var(--muted);
        font-size: 14px;
      }

      .price-line.final {
        color: #fff5df;
        font-size: 25px;
        font-weight: 950;
      }

      .report-preview {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .report-page {
        min-height: 116px;
        padding: 16px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background: #120908;
        color: #e6c9ad;
        font-size: 13px;
        line-height: 1.62;
        box-shadow: 0 18px 34px rgba(0, 0, 0, 0.24);
      }

      .report-reader-section {
        padding-top: 54px;
      }

      .report-id-strip {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        margin: 18px 0 4px;
        padding: 10px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.052);
        color: #e9c9a7;
      }

      .report-id-strip span {
        color: var(--gold);
        font-size: 11px;
        font-weight: 950;
      }

      .report-id-strip code {
        min-width: 0;
        overflow: hidden;
        color: #fff5e5;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        font-weight: 850;
        letter-spacing: 0;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .report-id-strip button {
        min-height: 32px;
        padding: 0 10px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background: rgba(140, 31, 24, 0.44);
        color: #fff1d7;
        font: inherit;
        font-size: 12px;
        font-weight: 950;
      }

      .report-toc {
        display: flex;
        gap: 8px;
        margin: 20px -20px 24px;
        padding: 0 20px 2px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .report-toc::-webkit-scrollbar {
        display: none;
      }

      .report-toc-button {
        flex: 0 0 auto;
        min-width: 132px;
        padding: 11px 12px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.052);
        color: #e9c9a7;
        font: inherit;
        font-size: 12px;
        font-weight: 900;
        line-height: 1.35;
        text-align: left;
      }

      .report-toc-button.is-active {
        border-color: rgba(242, 191, 107, 0.68);
        background:
          linear-gradient(180deg, rgba(150, 33, 23, 0.48), rgba(58, 10, 9, 0.84)),
          #120707;
        color: #fff2d7;
      }

      .report-page-shell {
        display: grid;
        gap: 18px;
      }

      .report-figure {
        position: relative;
        min-height: 440px;
        overflow: hidden;
        border-radius: 8px;
        background: #050303;
      }

      .report-figure img {
        width: 100%;
        height: 440px;
        object-fit: cover;
        object-position: 50% 18%;
        opacity: 0.88;
        filter: saturate(1.05) contrast(1.02);
      }

      .report-figure::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.04), rgba(0, 0, 0, 0.68) 70%, #050303 100%),
          radial-gradient(circle at 50% 46%, rgba(154, 22, 18, 0.18), transparent 52%);
      }

      .report-bubble {
        position: absolute;
        right: 18px;
        top: 126px;
        z-index: 2;
        width: 128px;
        min-height: 128px;
        display: grid;
        place-items: center;
        padding: 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.84);
        color: #17110f;
        font-size: 16px;
        font-weight: 950;
        line-height: 1.28;
        text-align: center;
        box-shadow: 0 18px 38px rgba(0, 0, 0, 0.36);
      }

      .report-meta {
        display: grid;
        gap: 8px;
      }

      .report-meta h3 {
        margin: 0;
        color: #fff6e9;
        font-size: 26px;
        line-height: 1.22;
      }

      .report-meta p {
        margin: 0;
        color: var(--gold);
        font-size: 13px;
        font-weight: 900;
        line-height: 1.5;
      }

      .report-body {
        min-height: 440px;
        color: #e7d0b9;
        font-size: 14px;
        line-height: 1.86;
      }

      .report-body p + p {
        margin-top: 16px;
      }

      .typing-cursor::after {
        content: "";
        display: inline-block;
        width: 8px;
        height: 1.1em;
        margin-left: 3px;
        vertical-align: -0.14em;
        background: #f2bf6b;
        animation: cursor-blink 0.84s step-end infinite;
      }

      @keyframes cursor-blink {
        50% {
          opacity: 0;
        }
      }

      .report-status {
        display: grid;
        gap: 10px;
        padding: 13px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(44, 10, 8, 0.74), rgba(8, 3, 3, 0.86)),
          #100505;
        color: #d9c0a2;
        font-size: 13px;
        line-height: 1.6;
      }

      .report-status strong {
        color: #fff3de;
        font-size: 14px;
        font-weight: 950;
        line-height: 1.35;
      }

      .report-status span {
        color: rgba(255, 232, 197, 0.68);
        font-weight: 800;
      }

      .report-status .interpret-progress {
        height: 7px;
      }

      .report-pager {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 4px;
      }

      .report-pager button {
        min-height: 54px;
        border: 1px solid rgba(255, 226, 175, 0.2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.055);
        color: #fff1d7;
        font: inherit;
        font-size: 14px;
        font-weight: 950;
      }

      .report-pager button.primary {
        background:
          linear-gradient(180deg, #b83427 0%, #7f1b17 100%),
          #8e231b;
      }

      .report-pager button:disabled {
        color: rgba(255, 241, 215, 0.36);
        background: rgba(255, 255, 255, 0.035);
      }

      .proof-stack {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }

      .proof-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 14px 0;
        border-bottom: 1px solid rgba(255, 226, 175, 0.13);
      }

      .proof-row span {
        color: var(--gold);
        font-size: 13px;
        font-weight: 900;
      }

      .proof-row strong {
        color: #f2f0ec;
        font-size: clamp(26px, 8vw, 42px);
        line-height: 1;
      }

      .sticky-story-cta {
        position: relative;
        z-index: 4;
        padding: 28px 20px max(34px, env(safe-area-inset-bottom));
        background: #000;
      }

      .sample-enter .primary-cta,
      .sticky-story-cta .primary-cta {
        min-height: 90px;
        border: 0;
        background:
          url("https://cdn.sajutight.me/products-media/products/mzmudang/onboarding/mzmudang_cta_button_bg.png")
          center / 100% 100% no-repeat;
        box-shadow:
          0 0 40px rgba(139, 0, 0, 0.5),
          0 0 80px rgba(139, 0, 0, 0.25);
      }

      .fineprint {
        margin-top: 14px;
        color: rgba(255, 247, 236, 0.48);
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
      }

      .choice:hover,
      .choice:focus-visible,
      .ghost:hover,
      .ghost:focus-visible,
      .next-cta:hover,
      .next-cta:focus-visible,
      .primary-cta:hover,
      .primary-cta:focus-visible,
      .skip:hover,
      .skip:focus-visible,
      .icon-button:hover,
      .icon-button:focus-visible,
      .topbar-vault-button:hover,
      .topbar-vault-button:focus-visible {
        outline: 2px solid rgba(242, 191, 107, 0.75);

      }

      .brand,
      .story-local-title,
      .sample-intro-title span {
        font-family: var(--font-brand);
        font-weight: 700;
      }

      .sample-intro-title,
      .panel h1,
      .teaser-title,
      .teaser-block h2,
      .source-copy h2,
      .story-caption h2,
      .story-section h2,
      .report-meta h3,
      .ritual-word,
      .story-callout,
      .package-card h3,
      .destiny-card h3 {
        font-family: var(--font-saju-heading);
        font-weight: 600;
      }

      .panel p,
      .teaser-copy,
      .source-copy p,
      .story-section p,
      .story-list-item,
      .quote,
      .review,
      .report-page,
      .report-body,
      .report-body p {
        font-family: var(--font-reading-body);
        font-weight: 400;
      }

      .status,
      .field label,
      .field input,
      .field select,
      .segmented button,
      .choice,
      .ghost,
      .next-cta,
      .result-item,
      .chapter,
      .pillar,

      .history-item span,
      .history-id {

      }

      @media (min-width: 720px) {
        body {
          padding: 0;
        }

        .phone {
          height: 100svh;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="phone" data-scene="landing" data-step="landing" aria-label="운명의 문 랜딩 페이지">
      <div class="hero" aria-hidden="true"></div>
      <video class="concern-video-bg" aria-hidden="true" autoplay muted loop playsinline preload="auto">
        <source src="assets/chungi-concern-loop.mp4" type="video/mp4" />
      </video>
      <div class="concern-video-shade" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand topbar-brand-logo umsh-service-logo" href="/" aria-label="UMSH 운명상회 홈">
          <img src="/assets/umsh-brand-logo.png" alt="운명상회" />
        </a>
        <div class="topbar-actions">
          <button class="icon-button" type="button" aria-label="뒤로가기" data-back-global>
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M15 18l-6-6 6-6"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="topbar-vault-button" type="button" aria-label="보관함 열기" data-open-settings>
            <span aria-hidden="true">☰</span>
          </button>
        </div>
      </header>

      <button class="sound" type="button" id="soundButton">사운드를 켜려면 터치하세요</button>
      <section class="stage" id="stage" aria-live="polite"></section>
      <aside class="settings-panel" data-settings-panel aria-hidden="true"></aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
      const phone = document.querySelector(".phone");
      const stage = document.querySelector("#stage");
      const soundButton = document.querySelector("#soundButton");
      const backGlobal = document.querySelector("[data-back-global]");
      const settingsButton = document.querySelector("[data-open-settings]");
      const settingsPanel = document.querySelector("[data-settings-panel]");
      const HISTORY_KEY = "cheongi_report_history_v1";
      const ACTIVE_REPORT_KEY = "cheongi_active_report_id";
      const AUTH_PENDING_KEY = "cheongi_pending_analysis_after_auth";
      const AUTH_FORM_KEY = "cheongi_pending_analysis_form";
      const PAID_REPORTS_KEY = "cheongi_paid_report_ids_v1";
      const USER_PROFILE_CACHE_KEY = "cheongi_user_birth_profile_v1";
      const AUTH_DEVICE_SESSION_KEY = "cheongi_auth_device_session_started_at_v1";
      const AUTH_DEVICE_SESSION_MS = 30 * 24 * 60 * 60 * 1000;
      const REMOTE_HISTORY_SYNC_LIMIT = 50;
      const TODAY_ENTRY_KEY = "cheongi_today_entry_pending";
      const TODAY_CONCERN = "오늘 나한테 들어오는 운, 일진, 일운, 피해야 할 선택";
      let authConfigData = null;
      let authClient = null;
      let authSession = null;
      let authInitPromise = null;
      let authGateMessage = "";
      let authSignInProvider = "";
      let reportHistorySyncPromise = null;

      const initialAuthParams = new URLSearchParams(location.search);
      const initialAuthEntry = initialAuthParams.get("authEntry") || initialAuthParams.get("entry") || "";
      const LOVE_THIS_YEAR_SERVICE_KEY = "love_this_year";
      const pathServiceKey = /^\/love\/this-year(?:\/|\.html)?$/i.test(location.pathname)
        ? LOVE_THIS_YEAR_SERVICE_KEY
        : "";
      function normalizeServiceKey(value) {
        const raw = String(value || "").trim();
        return raw === LOVE_THIS_YEAR_SERVICE_KEY || raw === "love-this-year" || raw === "love" ? LOVE_THIS_YEAR_SERVICE_KEY : "";
      }
      const requestedServiceKey = normalizeServiceKey(initialAuthParams.get("service") || initialAuthEntry || pathServiceKey);
      const SERVICE_CATALOG = {
        [LOVE_THIS_YEAR_SERVICE_KEY]: {
          key: LOVE_THIS_YEAR_SERVICE_KEY,
          path: "/love/this-year",
          title: "나, 올해 연애 가능?",
          eyebrow: "LOVE · 연애운",
          price: "12,900원",
          cta: "운명상회 상담",
          plan: "love-this-year",
          defaultConcern: "올해 새로운 연애가 들어오는 시기와 놓치기 쉬운 타이밍이 궁금해요.",
          defaultRelationship: "솔로예요",
          defaultOrientation: "이성 관계 중심",
          defaultWork: "일상 흐름",
        },
      };
      const isSignupPath = /^\/signup(?:\/|\.html)?$/i.test(location.pathname);
      const protectedAuthEntries = new Set(["destiny", "vault", "my"]);
      const isPortalSignupEntry =
        isSignupPath ||
        initialAuthEntry === "today" ||
        initialAuthEntry === "signup" ||
        protectedAuthEntries.has(initialAuthEntry);
      const isSignupReturn = initialAuthParams.get("signupReturn") === "1";
      const isAuthReturn = initialAuthParams.get("authReturn") === "1";
      let todayEntryActive = initialAuthEntry === "today";
      if (todayEntryActive) {
        sessionStorage.setItem(TODAY_ENTRY_KEY, "1");
      }

      const state = {
        scene: "landing",
        serviceKey: requestedServiceKey,
        target: "본인",
        calendar: "양력",
        birth: "",
        gender: "",
        time: "모름",
        birthTimeKnown: false,
        name: "",
        orientation: "",
        relationship: "",
        work: "",
        concern: "",
        partnerMode: "none",
        partnerName: "",
        partnerRelationship: "썸/관심 상대",
        partnerCalendar: "양력",
        partnerBirth: "",
        partnerGender: "",
        partnerTime: "모름",
        partnerBirthTimeKnown: false,
        analysis: null,
        todayFortune: null,
        reportPageIndex: 0,
        reportSectionCache: {},
        reportRequestToken: 0,
        reportTypingTimer: null,
        plan: requestedServiceKey ? SERVICE_CATALOG[requestedServiceKey].plan : "single",
        privacyAgree: false,
        paymentAgree: false,
        marketingAgree: false,
      };

      const historyStack = [];
      const urlScenes = new Set([
        "birth",
        "time",
        "name",
        "concern",
        "login",
        "my",
        "loading",
        "result",
        "todayResult",
        "purchase",
        "paymentReady",
      ]);
      const legacyPolicyPaths = {
        terms: "/terms",
        privacy: "/privacy",
        refund: "/refund",
        support: "/support",
      };

      function authReturnUrl() {
        const url = new URL(location.href);
        url.hash = "concern";
        url.searchParams.set("authReturn", "1");
        url.searchParams.delete("authEntry");
        url.searchParams.delete("entry");
        url.searchParams.delete("signupReturn");
        url.searchParams.delete("reportId");
        return url.toString();
      }

      function signupReturnUrl() {
        const url = new URL("/cmdg/", location.origin);
        url.searchParams.set("signupReturn", "1");
        if (initialAuthEntry) {
          url.searchParams.set("entry", initialAuthEntry);
        }
        url.hash = initialAuthEntry === "today" ? "loading" : "name";
        return url.toString();
      }

      function isStandaloneSignupFlow() {
        return isPortalSignupEntry || isSignupReturn;
      }

      function clearSignupQuery() {
        const url = new URL(location.href);
        url.searchParams.delete("signupReturn");
        url.searchParams.delete("authEntry");
        url.searchParams.delete("entry");
        const nextUrl = `${url.pathname}${url.search}${url.hash}`;
        if (`${location.pathname}${location.search}${location.hash}` !== nextUrl) {
          history.replaceState(null, "", nextUrl);
        }
      }

      function persistAuthFormState() {
        sessionStorage.setItem(AUTH_FORM_KEY, JSON.stringify({
          scene: state.scene,
          serviceKey: state.serviceKey,
          target: state.target,
          calendar: state.calendar,
          birth: state.birth,
          gender: state.gender,
          time: state.time,
          birthTimeKnown: state.birthTimeKnown,
          name: state.name,
          orientation: state.orientation,
          relationship: state.relationship,
          work: state.work,
          concern: state.concern,
          partnerMode: state.partnerMode,
          partnerName: state.partnerName,
          partnerRelationship: state.partnerRelationship,
          partnerCalendar: state.partnerCalendar,
          partnerBirth: state.partnerBirth,
          partnerGender: state.partnerGender,
          partnerTime: state.partnerTime,
          partnerBirthTimeKnown: state.partnerBirthTimeKnown,
        }));
      }

      function restoreAuthFormState() {
        try {
          const saved = JSON.parse(sessionStorage.getItem(AUTH_FORM_KEY) || "null");
          if (!saved || typeof saved !== "object") return;
          Object.assign(state, {
            serviceKey: normalizeServiceKey(saved.serviceKey) || state.serviceKey,
            target: saved.target || state.target,
            calendar: saved.calendar || state.calendar,
            birth: saved.birth || state.birth,
            gender: saved.gender || state.gender,
            time: saved.time || state.time,
            birthTimeKnown: saved.birthTimeKnown ?? Boolean(saved.time && saved.time !== "모름"),
            name: saved.name || state.name,
            orientation: saved.orientation || state.orientation,
            relationship: saved.relationship || state.relationship,
            work: saved.work || state.work,
            concern: saved.concern || state.concern,
            partnerMode: saved.partnerMode || state.partnerMode,
            partnerName: saved.partnerName || state.partnerName,
            partnerRelationship: saved.partnerRelationship || state.partnerRelationship,
            partnerCalendar: saved.partnerCalendar || state.partnerCalendar,
            partnerBirth: saved.partnerBirth || state.partnerBirth,
            partnerGender: saved.partnerGender || state.partnerGender,
            partnerTime: saved.partnerTime || state.partnerTime,
            partnerBirthTimeKnown: saved.partnerBirthTimeKnown ?? state.partnerBirthTimeKnown,
          });
          applyServiceDefaults({ preserveConcern: true });
        } catch (err) {
          sessionStorage.removeItem(AUTH_FORM_KEY);
        }

      function clearDeviceAuthSession() {
        try {
          localStorage.removeItem(AUTH_DEVICE_SESSION_KEY);
        } catch (err) {
          // localStorage can be unavailable in restricted browser modes.
        }
      }

      function deviceSessionStartedAt() {
        try {
          const value = Number(localStorage.getItem(AUTH_DEVICE_SESSION_KEY));
          return Number.isFinite(value) && value > 0 ? value : 0;
        } catch (err) {
          return 0;
        }
      }

      function inferDeviceSessionStartedAt(session) {
        const lastSignIn = Date.parse(session?.user?.last_sign_in_at || "");
        return Number.isFinite(lastSignIn) ? lastSignIn : Date.now();
      }

      function rememberDeviceAuthSession(session) {
        if (!session?.access_token) {
          clearDeviceAuthSession();
          return 0;
        }
        const existing = deviceSessionStartedAt();
        if (existing) return existing;
        const startedAt = inferDeviceSessionStartedAt(session);
        try {
          localStorage.setItem(AUTH_DEVICE_SESSION_KEY, String(startedAt));
        } catch (err) {
          // Supabase still persists its own session when browser storage allows it.
        }
        return startedAt;
      }

      async function enforceDeviceAuthSession(session) {
        if (!session?.access_token) {
          clearDeviceAuthSession();
          return null;
        }
        const startedAt = deviceSessionStartedAt();
        if (!startedAt) {
          const inferredStartedAt = rememberDeviceAuthSession(session);
          if (Date.now() - inferredStartedAt <= AUTH_DEVICE_SESSION_MS) return session;
        } else if (Date.now() - startedAt <= AUTH_DEVICE_SESSION_MS) {
          return session;
        }

        clearDeviceAuthSession();
        authGateMessage = "30일 로그인 유지 기간이 지나 다시 로그인해 주세요.";
        if (authClient) {
          await authClient.auth.signOut({ scope: "local" }).catch(() => undefined);
        }
        return null;
      }

      async function initAuth() {
        if (authInitPromise) return authInitPromise;
        authInitPromise = (async () => {
          const configRes = await fetch("/api/auth/config");
          const config = await configRes.json();
          authConfigData = config;
          if (!config.enabled) return null;
          if (!window.supabase?.createClient) {
            throw new Error("회원가입 모듈을 불러오지 못했습니다.");
          }
          authClient = window.supabase.createClient(config.url, config.publishableKey, {
            auth: {
              persistSession: true,
              detectSessionInUrl: true,
              flowType: "pkce",
            },
          });
          const { data, error } = await authClient.auth.getSession();
          if (error) throw error;
          authSession = await enforceDeviceAuthSession(data.session || null);
          authClient.auth.onAuthStateChange((_event, session) => {
            enforceDeviceAuthSession(session || null)
              .then((nextSession) => {
                authSession = nextSession;
                if (nextSession?.access_token) {
                  setTimeout(() => {
                    syncRemoteReportHistory().catch((err) => console.warn("원격 풀이 보관함 동기화에 실패했습니다.", err));
                  }, 0);
                }
              })
              .catch(() => {
                authSession = session || null;
              });
          });
          if (authSession?.access_token) {
            setTimeout(() => {
              syncRemoteReportHistory().catch((err) => console.warn("원격 풀이 보관함 동기화에 실패했습니다.", err));
            }, 0);
          }
          return authSession;
        })();
        return authInitPromise;
      }

      async function currentAuthSession() {
        await initAuth();
        if (!authClient) return null;
        const { data, error } = await authClient.auth.getSession();
        if (error) throw error;
        authSession = await enforceDeviceAuthSession(data.session || null);
        return authSession;
      }

      async function authHeaders(base = {}) {
        const headers = { ...base };
        const session = authSession || await currentAuthSession().catch(() => null);
        if (session?.access_token) headers.Authorization = `Bearer ${session.access_token}`;
        return headers;
      }

        const service = currentService();
        if (!service) return;
        state.target = "본인";
        state.plan = service.plan;
        if (!options.preserveConcern && !state.concern) state.concern = service.defaultConcern;
        if (!state.relationship) state.relationship = service.defaultRelationship;
        if (!state.orientation) state.orientation = service.defaultOrientation;
        if (!state.work) state.work = service.defaultWork;
        if (!state.partnerMode) state.partnerMode = "none";
      }

      function parsePartnerBirthInput() {
        const digits = String(state.partnerBirth || "").replace(/\D/g, "");
        const year = Number(digits.slice(0, 4));
        const month = Number(digits.slice(4, 6));
        const day = Number(digits.slice(6, 8));
        let hour = 12;
        let minute = 0;
        if (state.partnerBirthTimeKnown && state.partnerTime && state.partnerTime !== "모름") {
          const m = state.partnerTime.match(/(\d{1,2}):(\d{2})/);
          if (m) {
            hour = Number(m[1]);
            minute = Number(m[2]);
          }
        }
        return {
          year,
          month,
          day,
          hour,
          minute,
          gender: state.partnerGender === "여자" ? "female" : "male",
          calendar: state.partnerCalendar === "음력" ? "lunar" : "solar",
        };
      }

      function getPartnerContext() {
        if (!isLoveThisYearService() || state.partnerMode !== "known") {
          return { mode: "none", relationship: state.partnerRelationship || "" };
        }
        return {
          mode: "known",
          name: state.partnerName,
          relationship: state.partnerRelationship,
          birthTimeKnown: state.partnerBirthTimeKnown,

      function readCachedUserProfile() {
        try {
          const parsed = JSON.parse(localStorage.getItem(USER_PROFILE_CACHE_KEY) || "null");
          return parsed && typeof parsed === "object" ? parsed : null;
        } catch (err) {
          localStorage.removeItem(USER_PROFILE_CACHE_KEY);
          return null;

      function writeCachedUserProfile(profile) {
        if (!profile) return;
        try {
          localStorage.setItem(USER_PROFILE_CACHE_KEY, JSON.stringify(profile));
        } catch (err) {
          console.warn("사주 프로필 로컬 캐시 저장에 실패했습니다.", err);
        }
      }

      function cachedProfileForSession(session) {
        const cached = readCachedUserProfile();
        if (!cached) return null;
        if (!session?.user?.id) return cached;
        return cached.userId === session.user.id ? cached : null;
      }

      function applyUserProfile(profile, options = {}) {
        if (!profile?.birth) return false;
        const birth = profile.birth;
        state.name = profile.name || state.name;
        state.target = profile.context?.target || state.target || "본인";
        state.relationship = profile.context?.relationship || state.relationship;
        state.orientation = profile.context?.orientation || state.orientation;
        state.work = profile.context?.work || state.work;
        state.calendar = birth.calendar === "lunar" ? "음력" : "양력";
        state.birth = profileDateValue(birth);
        state.gender = birth.gender === "female" ? "여자" : "남자";
        state.birthTimeKnown = profile.birthTimeKnown !== false;
        state.time = state.birthTimeKnown
          ? `${pad2(birth.hour)}:${pad2(birth.minute || 0)}`
          : "모름";
        if (!options.preserveConcern) state.concern = state.concern || "";
        syncBirthSessionFromState();
        return true;
      }

      function localUserProfileFromState() {
        const timestamp = new Date().toISOString();
        return {
          userId: "local",
          name: state.name,
          birth: parseBirthInput(),
          birthTimeKnown: state.birthTimeKnown,
          context: {
            target: state.target,
            relationship: state.relationship,
            orientation: state.orientation,
            work: state.work,
          },
          createdAt: timestamp,
          updatedAt: timestamp,
        };
      }

      function syncBirthSessionFromState() {
        const birth = parseBirthInput();
        sessionStorage.setItem("cheongi_birth", JSON.stringify({
          ...birth,
          birthTimeKnown: state.birthTimeKnown,
          serviceKey: state.serviceKey,
          target: state.target,
          concern: state.concern,
          relationship: state.relationship,
          work: state.work,
          orientation: state.orientation,
          partner: getPartnerContext(),

      async function fetchUserProfile(options = {}) {
        const headers = await authHeaders();
        if (!headers.Authorization) return null;
        const res = await fetch("/api/user/profile", { headers });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "저장된 사주 프로필을 불러오지 못했습니다.");
        if (json.profile) {
          writeCachedUserProfile(json.profile);
          if (options.apply !== false) applyUserProfile(json.profile, options);
        }
        return json.profile || null;
      }

      async function saveCurrentUserProfile() {
        const localProfile = localUserProfileFromState();
        writeCachedUserProfile(localProfile);
        const headers = await authHeaders({ "Content-Type": "application/json" });
        if (!headers.Authorization) return localProfile;
        const res = await fetch("/api/user/profile", {
          method: "PUT",
          headers,
          body: JSON.stringify({
            name: state.name,
            birth: localProfile.birth,
            birthTimeKnown: state.birthTimeKnown,
            context: localProfile.context,
          }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "사주 프로필 저장에 실패했습니다.");
        if (json.profile) {
          writeCachedUserProfile(json.profile);
          applyUserProfile(json.profile, { preserveConcern: true });
        }
        return json.profile || localProfile;
      }

      async function signInWithProvider(providerName) {
        let providerButton = null;
        try {
          authSignInProvider = providerName;
          providerButton = document.querySelector(`[data-auth-provider="${providerName}"]`);
          providerButton?.classList.add("is-loading");
          providerButton?.setAttribute("aria-busy", "true");
          setAuthMessage(`${authProviderLabel(providerName)} 회원가입으로 이동합니다.`);

          if (isStandaloneSignupFlow()) {
            if (initialAuthEntry === "today") {
              setTodayEntryPending();
            } else {
              clearTodayEntryPending();
            }
            sessionStorage.removeItem(AUTH_PENDING_KEY);
            sessionStorage.removeItem(AUTH_FORM_KEY);
          } else {
            persistAuthFormState();
            sessionStorage.setItem(AUTH_PENDING_KEY, "1");
          }

          await initAuth();
          if (!authConfigData?.enabled || !authClient) {
            throw new Error("Supabase 공개 URL과 publishable key 설정을 확인해 주세요.");
          }
          const provider = authConfigData.providers?.[providerName];
          if (!provider) {
            throw new Error(unavailableAuthMessage(providerName));
          }
          const options = {
            redirectTo: isStandaloneSignupFlow() ? signupReturnUrl() : authReturnUrl(),
          };
          if (providerName === "kakao") {
            options.scopes = "profile_nickname profile_image";
            options.queryParams = { scope: "profile_nickname profile_image" };
          }
          if (providerName === "google") {
            options.queryParams = { prompt: "select_account" };
          }
          const { error } = await authClient.auth.signInWithOAuth({ provider, options });
          if (error) throw error;
        } catch (err) {
          sessionStorage.removeItem(AUTH_PENDING_KEY);
          authSignInProvider = "";
          providerButton?.classList.remove("is-loading");
          providerButton?.removeAttribute("aria-busy");
          setAuthMessage(err.message || `${authProviderLabel(providerName)} 회원가입을 시작하지 못했습니다.`);
        }
      }

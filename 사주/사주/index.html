<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>남부대공 · 사주</title>
    <meta name="description" content="남부대공 몰입형 사주 상담" />
    <style>
      @font-face {
        font-family: "Maru Buri";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("assets/fonts/MaruBuri-SemiBold.woff2") format("woff2");
      }

      @font-face {
        font-family: "Maru Buri";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("assets/fonts/MaruBuri-Bold.woff2") format("woff2");
      }

      @font-face {
        font-family: "Noto Serif KR";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/NotoSerifKR-Regular.ttf") format("truetype");
      }

      @font-face {
        font-family: "Pretendard";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2");
      }

      :root {
        color-scheme: dark;
        --ink: #fff8ef;
        --muted: #e0c7ad;
        --dim: rgba(255, 248, 239, 0.62);
        --red: #8b1e16;
        --red-deep: #360706;
        --gold: #f2bf6b;
        --line: rgba(255, 229, 188, 0.22);
        --font-brand: "Maru Buri", "Noto Serif KR", serif;
        --font-saju-heading: "Maru Buri", "Noto Serif KR", serif;
        --font-reading-body: "Noto Serif KR", "Apple SD Gothic Neo", serif;
        --font-meta: "Pretendard", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        min-height: 100%;
        background: #eef1f5;
        font-family:
          Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        overflow: hidden;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .phone {
        position: relative;
        width: min(100vw, 440px);
        height: 100svh;
        max-height: 920px;
        overflow: hidden;
        background: #080302;
        color: var(--ink);
        box-shadow: 0 24px 80px rgba(13, 21, 35, 0.24);
      }

      .hero {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.02) 0%,
            rgba(0, 0, 0, 0.04) 40%,
            rgba(0, 0, 0, 0.5) 70%,
            rgba(0, 0, 0, 0.92) 100%
          ),
          url("assets/hero-mystic.png") center top / cover no-repeat;
        transform: scale(1);
        transition:
          transform 560ms ease,
          filter 560ms ease,
          opacity 560ms ease;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 18%, transparent 0 24%, rgba(0, 0, 0, 0.18) 58%),
          linear-gradient(to right, rgba(0, 0, 0, 0.26), transparent 18% 82%, rgba(0, 0, 0, 0.26));
      }

      .phone[data-scene="immersion"] .hero,
      .phone[data-scene="input"] .hero,
      .phone[data-scene="loading"] .hero,
      .phone[data-scene="result"] .hero {
        filter: saturate(0.92) brightness(0.54);
        transform: scale(1.08);
      }

      .phone[data-scene="result"] .hero {
        opacity: 0;
      }

      .topbar {
        position: relative;
        z-index: 3;
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        align-items: center;
        height: 58px;
        padding: 0 18px;
      }

      .topbar > .icon-button:last-child {
        justify-self: end;
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.26);
        color: var(--ink);
        backdrop-filter: blur(8px);
      }

      .brand {
        text-align: center;
        font-size: 21px;
        font-weight: 950;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .settings-panel {
        position: absolute;
        inset: 0;
        z-index: 8;
        display: none;
        padding: 70px 16px 18px;
        background: rgba(2, 1, 1, 0.62);
        backdrop-filter: blur(12px);
      }

      .settings-panel.is-open {
        display: block;
      }

      .settings-sheet {
        width: 100%;
        max-height: 100%;
        overflow: auto;
        border: 1px solid rgba(255, 226, 183, 0.2);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(39, 8, 6, 0.98), rgba(6, 2, 2, 0.98)),
          #100404;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.56);
      }

      .settings-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 18px 12px;
        border-bottom: 1px solid rgba(255, 226, 183, 0.14);
      }

      .settings-head strong {
        display: block;
        color: #fff7ea;
        font-size: 20px;
        font-weight: 950;
        line-height: 1.2;
      }

      .settings-head span {
        display: block;
        margin-top: 4px;
        color: rgba(255, 236, 202, 0.58);
        font-size: 12px;
        font-weight: 800;
      }

      .settings-list {
        display: grid;
        gap: 10px;
        padding: 14px;
      }

      .history-item {
        width: 100%;
        min-height: 88px;
        padding: 13px;
        border: 1px solid rgba(255, 226, 183, 0.18);
        border-radius: 8px;
        background: rgba(255, 248, 239, 0.055);
        color: #fff5e5;
        text-align: left;
      }

      .history-item strong,
      .history-empty strong {
        display: block;
        font-size: 15px;
        font-weight: 950;
        line-height: 1.35;
      }

      .history-item span,
      .history-empty span {
        display: block;
        margin-top: 6px;
        color: rgba(255, 231, 194, 0.65);
        font-size: 12px;
        font-weight: 750;
        line-height: 1.4;
      }

      .history-id {
        color: rgba(242, 191, 107, 0.72) !important;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px !important;
        letter-spacing: 0;
      }

      .history-actions {
        display: flex;
        gap: 8px;
        padding: 0 14px 14px;
      }

      .history-actions button,
      .history-remove {
        min-height: 40px;
        border-radius: 8px;
        border: 1px solid rgba(255, 226, 183, 0.18);
        background: rgba(255, 248, 239, 0.07);
        color: #ffe7c2;
        font-size: 13px;
        font-weight: 900;
      }

      .history-actions button {
        flex: 1;
      }

      .history-row {
        display: grid;
        grid-template-columns: 1fr 44px;
        gap: 8px;
      }

      .history-remove {
        width: 44px;
        min-height: 44px;
        align-self: start;
        border-color: rgba(255, 104, 78, 0.34);
        background: rgba(126, 20, 15, 0.18);
        color: #ffb3a4;
        font-size: 22px;
        line-height: 1;
      }

      .history-empty {
        min-height: 96px;
        padding: 18px;
        border: 1px dashed rgba(255, 226, 183, 0.22);
        border-radius: 8px;
        color: #fff5e5;
      }

      .stage {
        position: relative;
        z-index: 2;
        height: calc(100% - 58px);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 22px max(24px, env(safe-area-inset-bottom));
      }

      .phone[data-scene="result"] .stage {
        position: absolute;
        inset: 0;
        height: auto;
        display: block;
        justify-content: flex-start;
        overflow: auto;
        padding: 0 0 max(24px, env(safe-area-inset-bottom));
        background: #050202;
      }

      .phone[data-scene="landing"] .hero,
      .phone[data-scene="result"] .hero {
        opacity: 0;
      }

      .phone[data-scene="landing"] .sound,
      .phone[data-scene="result"] .sound {
        display: none;
      }

      .phone[data-scene="landing"] .stage {
        position: absolute;
        inset: 0;
        height: auto;
        display: block;
        justify-content: flex-start;
        overflow: auto;
        padding: 0 0 max(24px, env(safe-area-inset-bottom));
        background: #000;
      }

      .phone[data-scene="landing"] .topbar,
      .phone[data-scene="result"] .topbar {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 72px;
        padding-top: 12px;
        background: linear-gradient(to bottom, rgba(5, 2, 2, 0.96), rgba(5, 2, 2, 0.64) 62%, transparent);
      }

      .phone[data-scene="result"] .brand {
        text-shadow:
          0 2px 12px rgba(0, 0, 0, 0.92),
          0 0 18px rgba(0, 0, 0, 0.8);
      }

      .sound {
        position: absolute;
        top: 70px;
        left: 50%;
        z-index: 3;
        display: inline-flex;
        transform: translateX(-50%);
        min-height: 40px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 16px;
        border: 1px solid rgba(255, 235, 203, 0.24);
        border-radius: 999px;
        background: rgba(12, 5, 4, 0.56);
        color: #fff0d8;
        font-size: 13px;
        font-weight: 850;
        backdrop-filter: blur(10px);
      }

      .line-pill {
        align-self: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        max-width: 100%;
        padding: 9px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(12, 4, 4, 0.68);
        color: #ffe7c0;
        font-size: 13px;
        font-weight: 850;
        line-height: 1.25;
        text-align: center;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
      }

      .cta-frame {
        position: relative;
        margin-top: 12px;
        padding: 7px;
        border: 1px solid rgba(255, 209, 137, 0.25);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 218, 154, 0.2), transparent 28%),
          linear-gradient(315deg, rgba(255, 218, 154, 0.14), transparent 26%),
          rgba(47, 9, 7, 0.9);
        box-shadow:
          0 18px 36px rgba(0, 0, 0, 0.44),
          inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .cta-frame::before,
      .cta-frame::after {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 222, 169, 0.82), transparent);
      }

      .cta-frame::before {
        top: 7px;
      }

      .cta-frame::after {
        bottom: 7px;
      }

      .primary-cta {
        width: 100%;
        min-height: 76px;
        border-radius: 6px;
        border: 1px solid rgba(255, 225, 168, 0.34);
        background: linear-gradient(180deg, #a22b20, #65120e);
        color: #fff8e8;
        font-size: clamp(21px, 6.5vw, 30px);
        font-weight: 950;
        letter-spacing: 0;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
      }

      .skip {
        align-self: center;
        margin-top: 14px;
        background: transparent;
        color: rgba(255, 248, 239, 0.84);
        font-size: 13px;
        font-weight: 800;
      }

      .panel {
        width: 100%;
        max-height: calc(100svh - 92px);
        overflow: auto;
        padding: 22px;
        border: 1px solid rgba(255, 227, 184, 0.18);
        border-radius: 18px;
        background: #100a0a;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
        animation: rise 260ms ease both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.22;
        letter-spacing: 0;
      }

      .panel p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .choices.single {
        grid-template-columns: 1fr;
      }

      .choice,
      .ghost,
      .next-cta {
        min-height: 54px;
        border-radius: 8px;
        font-weight: 850;
      }

      .choice {
        border: 1px solid rgba(255, 226, 175, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        transition:
          border-color 180ms ease,
          background 180ms ease,
          transform 180ms ease;
      }

      .choice:active {
        transform: translateY(1px);
      }

      .choice.is-selected {
        border-color: rgba(242, 191, 107, 0.72);
        background: rgba(184, 50, 36, 0.34);
        transform: translateY(-2px);
      }

      .field-grid {
        display: grid;
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field label {
        color: rgba(255, 247, 236, 0.72);
        font-size: 12px;
        font-weight: 850;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 50px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--ink);
        padding: 0 14px;
        outline: none;
      }

      .field input:focus,
      .field select:focus {
        border-color: rgba(242, 191, 107, 0.78);
        box-shadow: 0 0 0 3px rgba(242, 191, 107, 0.12);
      }

      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }

      .segmented button {
        min-height: 42px;
        border-radius: 999px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: var(--dim);
        font-weight: 850;
      }

      .segmented button[aria-pressed="true"] {
        border-color: rgba(242, 191, 107, 0.7);
        background: rgba(242, 191, 107, 0.16);
        color: var(--ink);
      }

      .actions {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      .ghost {
        border: 1px solid rgba(255, 226, 175, 0.16);
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
      }

      .next-cta {
        border: 1px solid rgba(255, 225, 168, 0.34);
        background: linear-gradient(180deg, #b83224, #73140f);
        color: #fff8e8;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        margin-bottom: 12px;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(242, 191, 107, 0.12);
        color: #ffd894;
        font-size: 12px;
        font-weight: 850;
      }

      .loader {
        display: grid;
        place-items: center;
        width: 100%;
        padding: 0 0 18vh;
      }

      .interpret-loader-card {
        width: min(100%, 340px);
        display: grid;
        gap: 16px;
        padding: 22px 18px 18px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 0%, rgba(170, 37, 27, 0.26), transparent 46%),
          linear-gradient(180deg, rgba(34, 8, 7, 0.88), rgba(5, 2, 2, 0.94));
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
        text-align: center;
      }

      .interpret-orb {
        position: relative;
        width: 74px;
        height: 74px;
        margin: 0 auto;
        border-radius: 50%;
        border: 1px solid rgba(242, 191, 107, 0.26);
        background:
          radial-gradient(circle at 50% 50%, rgba(242, 191, 107, 0.32), transparent 32%),
          radial-gradient(circle at 50% 50%, rgba(156, 25, 20, 0.46), transparent 58%),
          #080303;
      }

      .interpret-orb::before {
        content: "";
        position: absolute;
        inset: -5px;
        border-radius: inherit;
        border: 2px solid rgba(242, 191, 107, 0.14);
        border-top-color: #f2bf6b;
        border-right-color: rgba(203, 56, 38, 0.76);
        animation: spin 1.05s linear infinite;
      }

      .interpret-orb::after {
        content: "";
        position: absolute;
        inset: 24px;
        border-radius: inherit;
        background: #f2bf6b;
        box-shadow: 0 0 20px rgba(242, 191, 107, 0.86);
        animation: pulse-glow 1.4s ease-in-out infinite;
      }

      .interpret-loader-copy {
        display: grid;
        gap: 8px;
      }

      .interpret-loader-copy .line-pill {
        justify-self: center;
        margin: 0;
      }

      .interpret-loader-copy p {
        margin: 0;
        color: rgba(255, 239, 211, 0.72);
        font-size: 13px;
        font-weight: 800;
        line-height: 1.55;
      }

      .interpret-progress {
        position: relative;
        height: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 226, 175, 0.13);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
      }

      .interpret-progress::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 46%;
        border-radius: inherit;
        background:
          linear-gradient(90deg, transparent, rgba(255, 244, 214, 0.84), transparent),
          linear-gradient(90deg, #721812, #d44731 54%, #f2bf6b);
        box-shadow: 0 0 18px rgba(242, 191, 107, 0.42);
        animation: progress-scan 1.65s ease-in-out infinite;
      }

      .interpret-steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }

      .interpret-steps span {
        min-width: 0;
        padding: 7px 5px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.045);
        color: rgba(255, 232, 197, 0.74);
        font-size: 11px;
        font-weight: 900;
        line-height: 1.2;
      }

      .interpret-steps span:nth-child(2) {
        color: #ffe4af;
        animation: step-glow 1.65s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse-glow {
        50% {
          opacity: 0.55;
          transform: scale(0.78);
        }
      }

      @keyframes progress-scan {
        0% {
          transform: translateX(-105%);
        }
        52% {
          transform: translateX(92%);
        }
        100% {
          transform: translateX(190%);
        }
      }

      @keyframes step-glow {
        50% {
          border-color: rgba(242, 191, 107, 0.42);
          background: rgba(146, 31, 23, 0.26);
        }
      }

      .result-list {
        display: grid;
        gap: 10px;
        margin: 14px 0;
      }

      .result-item {
        padding: 14px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
      }

      .result-item strong {
        display: block;
        margin-bottom: 5px;
        color: #ffe0a8;
        font-size: 14px;
      }

      .result-item span {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .teaser-panel {
        padding: 18px;
      }

      .teaser-kicker {
        color: var(--gold);
        font-size: 13px;
        font-weight: 900;
      }

      .teaser-title {
        margin: 8px 0 10px;
        font-size: 28px;
        line-height: 1.18;
        letter-spacing: 0;
      }

      .teaser-copy {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .teaser-block {
        margin-top: 16px;
        padding: 16px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.025)),
          rgba(24, 13, 12, 0.9);
      }

      .chapter {
        display: inline-flex;
        margin-bottom: 10px;
        padding: 6px 9px;
        border-radius: 999px;
        background: rgba(139, 30, 22, 0.42);
        color: #ffd894;
        font-size: 12px;
        font-weight: 900;
      }

      .teaser-block h2 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .quote {
        margin: 12px 0 0;
        padding-left: 12px;
        border-left: 2px solid rgba(242, 191, 107, 0.68);
        color: #fff0d8;
        font-size: 15px;
        font-weight: 850;
        line-height: 1.6;
      }

      .saju-table {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
        margin-top: 12px;
      }

      .pillar {
        min-height: 74px;
        display: grid;
        place-items: center;
        gap: 4px;
        padding: 10px 6px;
        border-radius: 8px;
        border: 1px solid rgba(255, 226, 175, 0.16);
        background: rgba(0, 0, 0, 0.26);
        text-align: center;
      }

      .pillar b {
        color: #ffe0a8;
        font-size: 22px;
      }

      .pillar span {
        color: var(--dim);
        font-size: 11px;
      }

      .timeline {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .timeline-row {
        display: grid;
        grid-template-columns: 58px 1fr;
        gap: 10px;
        align-items: start;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .timeline-row strong {

        speechBubbleTwo: "https://cdn.sajutight.me/products-media/products/mzmudang/teaser/speech_bubble_2.svg",
        speechBubbleThree: "https://cdn.sajutight.me/products-media/products/mzmudang/teaser/speech_bubble_3.svg",
        unionDecoration: "https://cdn.sajutight.me/products-media/products/mzmudang/teaser/union_decoration.svg",
        wealthChart: "https://cdn.sajutight.me/products-media/products/mzmudang/teaser/wealth_chart.png",
        soloLogo: "https://cdn.sajutight.me/common/solorun_x_tight.png",
        brandPrize: "https://cdn.sajutight.me/products-media/hyundai/brand_prize_v2.png",
      };

      function readReportHistory() {
        try {
          const parsed = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
          return Array.isArray(parsed) ? parsed.filter((item) => item?.reportId && item?.analysis) : [];
        } catch (err) {
          return [];
        }
      }

      function writeReportHistory(items) {
        const seen = new Set();
        const next = items.filter((item) => {
          if (!item?.reportId || seen.has(item.reportId)) return false;
          seen.add(item.reportId);
          return true;
        });
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(next));
        } catch (err) {
          console.warn("풀이 보관함 저장 공간이 부족합니다. 기존 저장 데이터는 유지됩니다.", err);
        }
      }

      function setActiveReportId(reportId) {
        if (!reportId) return;
        sessionStorage.setItem(ACTIVE_REPORT_KEY, reportId);
        localStorage.setItem(ACTIVE_REPORT_KEY, reportId);
      }

      function clearActiveReportId(reportId) {
        if (sessionStorage.getItem(ACTIVE_REPORT_KEY) === reportId) {
          sessionStorage.removeItem(ACTIVE_REPORT_KEY);
          sessionStorage.removeItem("cheongi_chat_history");
        }
        if (localStorage.getItem(ACTIVE_REPORT_KEY) === reportId) {
          localStorage.removeItem(ACTIVE_REPORT_KEY);
        }
      }

      function formatSavedAt(value) {
        const date = new Date(value || Date.now());
        if (Number.isNaN(date.getTime())) return "방금 전";
        return date.toLocaleString("ko-KR", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function formatReportId(reportId) {
        const raw = String(reportId || "").trim();
        if (!raw) return "ID 없음";
        return raw.length > 16 ? `${raw.slice(0, 8)}...${raw.slice(-6)}` : raw;
      }

      function buildReportLink(reportId) {
        const url = new URL(location.href);
        url.searchParams.set("reportId", reportId);
        url.hash = "result";
        return url.href;
      }

      function syncReportIdInUrl(reportId) {
        const url = new URL(location.href);
        if (reportId) {
          url.searchParams.set("reportId", reportId);
        } else {
          url.searchParams.delete("reportId");
        }
        const hash = state.scene === "landing" ? "" : `#${state.scene}`;
        const nextUrl = `${url.pathname}${url.search}${hash}`;
        if (`${location.pathname}${location.search}${location.hash}` !== nextUrl) {
          history.replaceState(null, "", nextUrl);
        }
      }

      function pad2(value) {
        return String(Number(value || 0)).padStart(2, "0");
      }

      function applyReadingPayload(payload) {
        const analysis = payload?.analysis;
        if (!analysis) return false;

        const saved = payload.birthState || {};
        const birth = payload.birth || analysis.birth || {};
        const context = payload.context || {};
        state.target = saved.target || context.target || "";
        state.calendar = saved.calendar || (birth.calendar === "lunar" ? "음력" : "양력");
        state.birth = saved.birth || (birth.year ? `${birth.year}.${pad2(birth.month || 1)}.${pad2(birth.day || 1)}` : "");
        state.gender = saved.gender || (birth.gender ? (birth.gender === "female" ? "여자" : "남자") : "");
        state.time = saved.time || (Number.isFinite(Number(birth.hour)) ? `${pad2(birth.hour)}:${pad2(birth.minute || 0)}` : "모름");
        state.name = saved.name || context.name || "";
        state.orientation = saved.orientation || context.orientation || "";
        state.relationship = saved.relationship || context.relationship || "";
        state.work = saved.work || context.work || "";
        state.concern = saved.concern || context.concern || "";
        state.analysis = analysis;
        state.reportPageIndex = 0;
        state.reportSectionCache = {};
        state.reportRequestToken += 1;
        stopReportTyping();

        const birthForSession = parseBirthInput();
        const reportId = analysis.report?.reportId || payload.reportId || "";
        const chatHistory = Array.isArray(payload.chatHistory) ? payload.chatHistory : [];
        setActiveReportId(reportId);
        sessionStorage.setItem("cheongi_analysis", JSON.stringify(analysis));
        sessionStorage.setItem("cheongi_birth", JSON.stringify({
          ...birthForSession,
          target: state.target,
          concern: state.concern,
          relationship: state.relationship,
          work: state.work,
          orientation: state.orientation,
        }));
        sessionStorage.setItem("cheongi_chat_history", JSON.stringify(chatHistory));
        if (state.concern) sessionStorage.setItem("cheongi_initial_concern", state.concern);
        return true;
      }

      function historySubtitle(entry) {
        const bits = [
          entry.birthState?.relationship,
          entry.birthState?.work,
          entry.birthState?.concern,
        ].filter(Boolean);
        const progress = entry.progress?.total
          ? `${entry.progress.complete || 0}/${entry.progress.total}`
          : "저장됨";
        return `${bits.join(" · ") || "풀이 저장"} · ${progress} · ${formatSavedAt(entry.savedAt)}`;
      }

      function buildHistoryEntry() {
        const report = state.analysis?.report;
        if (!report?.reportId) return null;
        const birth = parseBirthInput();
        let chatHistory = [];
        try {
          chatHistory = JSON.parse(sessionStorage.getItem("cheongi_chat_history") || "[]");
        } catch (err) {
          chatHistory = [];
        }
        const birthState = {
          target: state.target,
          calendar: state.calendar,
          birth: state.birth,
          gender: state.gender,
          time: state.time,
          name: state.name,
          orientation: state.orientation,
          relationship: state.relationship,
          work: state.work,
          concern: state.concern,
        };
        const titleName = state.name || state.target || "당신";
        return {
          reportId: report.reportId,
          savedAt: new Date().toISOString(),
          title: `${titleName} · ${state.calendar} ${formatBirthLabel(state.birth)}`,
          birth,
          birthState,
          context: getReportContext(),
          analysis: state.analysis,
          progress: report.progress,
          storage: report.storage,
          corpusFingerprint: report.corpus?.fingerprint,
          chatHistory: Array.isArray(chatHistory) ? chatHistory : [],
          initialConcern: state.concern || "",
        };
      }

      function saveCurrentReading() {
        const entry = buildHistoryEntry();
        if (!entry) return;
        setActiveReportId(entry.reportId);
        const items = readReportHistory();
        const existing = items.find((item) => item.reportId === entry.reportId);
        const merged = {
          ...existing,
          ...entry,
          chatHistory: entry.chatHistory.length ? entry.chatHistory : (existing?.chatHistory || []),
          initialConcern: entry.initialConcern || existing?.initialConcern || "",
        };
        writeReportHistory([merged, ...items.filter((item) => item.reportId !== entry.reportId)]);
      }

      function renderSettingsPanel() {
        const items = readReportHistory();
        const listMarkup = items.length
          ? items.map((entry) => `
              <div class="history-row">
                <button class="history-item" type="button" data-history-open="${escapeHtml(entry.reportId)}">
                  <strong>${escapeHtml(entry.title || "저장된 풀이")}</strong>
                  <span>${escapeHtml(historySubtitle(entry))}</span>
                  <span class="history-id">ID ${escapeHtml(formatReportId(entry.reportId))}</span>
                </button>
                <button class="history-remove" type="button" aria-label="${escapeHtml(entry.title || "저장된 풀이")} 삭제" data-history-delete="${escapeHtml(entry.reportId)}">×</button>
              </div>
            `).join("")
          : `
              <div class="history-empty">
                <strong>저장된 풀이가 없습니다</strong>
                <span>한 번 풀이를 열면 이곳에 남습니다.</span>
              </div>
            `;

        settingsPanel.innerHTML = `
          <div class="settings-sheet" role="dialog" aria-modal="true" aria-label="설정">
            <div class="settings-head">
              <div>
                <strong>남부대공</strong>
                <span>풀이 보관함</span>
              </div>
              <button class="icon-button" type="button" aria-label="설정 닫기" data-settings-close>
                <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
                </svg>
              </button>
            </div>
            <div class="settings-list">${listMarkup}</div>
            <div class="history-actions">
              <button type="button" data-history-new>새 사주 입력</button>
            </div>
          </div>
        `;
      }

      function confirmPermanentDelete(entry) {
        const title = entry?.title || "저장된 상담";
        return window.confirm(`${title}\n\n이 상담 내용과 저장된 풀이를 삭제합니다.\n삭제하면 되돌릴 수 없습니다.\n정말 삭제할까요?`);
      }

      function openSettings() {
        renderSettingsPanel();
        settingsPanel.classList.add("is-open");
        settingsPanel.setAttribute("aria-hidden", "false");
      }

      function closeSettings() {
        settingsPanel.classList.remove("is-open");
        settingsPanel.setAttribute("aria-hidden", "true");
      }

      function resetReadingState() {
        state.target = "";
        state.calendar = "양력";
        state.birth = "";
        state.gender = "";
        state.time = "모름";
        state.name = "";
        state.orientation = "";
        state.relationship = "";
        state.work = "";
        state.concern = "";
        state.analysis = null;
        state.reportPageIndex = 0;
        state.reportSectionCache = {};
        state.reportRequestToken += 1;
        stopReportTyping();
        syncReportIdInUrl("");
      }

      function restoreHistoryEntry(reportId) {
        const entry = readReportHistory().find((item) => item.reportId === reportId);
        if (!entry?.analysis || !applyReadingPayload(entry)) return;
        closeSettings();
        historyStack.length = 0;
        go("result", false);
      }

      async function loadReportById(reportId) {
        const trimmed = String(reportId || "").trim();
        if (!trimmed) throw new Error("풀이 ID가 비어 있습니다.");

        const cached = readReportHistory().find((item) => item.reportId === trimmed);
        if (cached?.analysis && applyReadingPayload(cached)) {
          historyStack.length = 0;
          go("result", false);
          return;
        }

        const res = await fetch(`/api/report/${encodeURIComponent(trimmed)}`);
        const json = await res.json();
        if (!res.ok || !json.analysis) {
          throw new Error(json.error || "저장된 풀이를 찾지 못했습니다.");
        }
        if (!applyReadingPayload(json)) {
          throw new Error("저장된 풀이를 화면에 복원하지 못했습니다.");
        }
        saveCurrentReading();
        historyStack.length = 0;
        go("result", false);
      }

      const steps = {
        landing: renderLanding,
        immersion: renderImmersion,
        target: renderTarget,
        birth: renderBirth,
        time: renderTime,
        gender: renderGender,
        name: renderName,
        orientation: renderOrientation,
        relationship: renderRelationship,
        work: renderWork,
        concern: renderConcern,
        loading: renderLoading,
        result: renderResult,
        purchase: renderPurchase,
        paymentReady: renderPaymentReady,
      };

      soundButton.addEventListener("click", () => {
        soundButton.textContent = "몰입 모드가 준비됐어요";
      });

      settingsButton.addEventListener("click", openSettings);

      settingsPanel.addEventListener("click", (event) => {
        if (event.target === settingsPanel || event.target.closest("[data-settings-close]")) {
          closeSettings();
          return;
        }

        const openButton = event.target.closest("[data-history-open]");
        if (openButton) {
          restoreHistoryEntry(openButton.dataset.historyOpen);
          return;
        }

        const deleteButton = event.target.closest("[data-history-delete]");
        if (deleteButton) {
          const reportId = deleteButton.dataset.historyDelete;
          const items = readReportHistory();
          const entry = items.find((item) => item.reportId === reportId);
          if (!confirmPermanentDelete(entry)) return;
          writeReportHistory(items.filter((item) => item.reportId !== reportId));
          clearActiveReportId(reportId);
          renderSettingsPanel();
          return;
        }

        if (event.target.closest("[data-history-new]")) {
          closeSettings();
          historyStack.length = 0;
          resetReadingState();
          go("target", false);
        }
      });

      backGlobal.addEventListener("click", () => {
        if (historyStack.length === 0) {
          go("landing", false);
          return;
        }

        const previous = historyStack.pop();
        go(previous, false);
      });

      stage.addEventListener("click", (event) => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        const valueButton = event.target.closest("[data-value]");

        if (valueButton) {
          handleValue(valueButton.dataset.key, valueButton.dataset.value, valueButton);
        }

        if (action === "enter") go("target");
        if (action === "look") go("target");
        if (action === "skip") go("target");
        if (action === "prev") {
          const previous = historyStack.pop();
          go(previous || "landing", false);
        }
        if (action === "target-next") {
          if (!state.target) return showNudge("누구의 운세인지 먼저 골라주세요.");
          go("birth");
        }
        if (action === "birth-next") {
          state.birth = document.querySelector("#birth")?.value.trim() || "";
          go("time");
        }
        if (action === "time-next") {
          state.time = document.querySelector("#birthtime")?.value.trim() || "모름";
          go("gender");
        }
        if (action === "gender-next") {
          if (!state.gender) return showNudge("성별을 먼저 선택해주세요.");
          go("name");
        }
        if (action === "name-next") {
          state.name = document.querySelector("#name")?.value.trim() || "";
          go("orientation");
        }
        if (action === "concern-next") {
          state.concern = document.querySelector("#concern")?.value.trim() || "";
          go("loading");
          analyzeBirth()
            .then(() => go("result"))
            .catch((err) => {
              showNudge(err.message || "사주 분석에 실패했습니다.");
              go("concern");
            });
        }
        if (action === "open-chat") {
          location.href = "/chat.html";
        }
        if (action === "open-settings") {
          openSettings();
        }
        if (action === "copy-report-link") {
          copyReportLink(event.target.closest("[data-action]"));
        }
        if (action === "report-prev") {
          loadReportPage((state.reportPageIndex || 0) - 1);
        }
        if (action === "report-next") {
          loadReportPage((state.reportPageIndex || 0) + 1);
        }
        if (action === "report-jump") {
          const index = Number(event.target.closest("[data-report-index]")?.dataset.reportIndex ?? 0);
          loadReportPage(index);
        }
        if (action === "open-purchase") location.href = "/chat.html";
        if (action === "toggle-agree") {
          const key = event.target.closest("[data-agree]")?.dataset.agree;
          if (key) {
            state[key] = !state[key];
            renderPurchase();
          }
        }
        if (action === "pay-demo") {
          if (!state.privacyAgree || !state.paymentAgree) return showNudge("필수 동의를 먼저 체크해주세요.");
          go("paymentReady");
        }
        if (action === "restart") {
          historyStack.length = 0;
          resetReadingState();
          state.plan = "single";
          state.privacyAgree = false;
          state.paymentAgree = false;
          state.marketingAgree = false;
          go("landing", false);
        }
      });

      function handleValue(key, value, button) {
        state[key] = value;
        button.parentElement
          ?.querySelectorAll("[data-value]")
          .forEach((item) => item.classList.toggle("is-selected", item === button));
        button.parentElement
          ?.querySelectorAll("[aria-pressed]")
          .forEach((item) => item.setAttribute("aria-pressed", String(item === button)));

        const next = button.dataset.next;
        if (next) {
          setTimeout(() => go(next), 170);
        }
      }

      function showNudge(message) {
        const existing = document.querySelector(".nudge");
        if (existing) existing.remove();
        const nudge = document.createElement("div");
        nudge.className = "fineprint nudge";
        nudge.textContent = message;
        stage.querySelector(".panel")?.append(nudge);
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;",
        })[char]);
      }

      function storyTopNavMarkup() {
        return `
          <nav class="story-local-nav" aria-label="남부대공 상단 메뉴">
            <button class="icon-button" type="button" aria-label="뒤로가기" data-action="prev">
              <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <div class="story-local-title">남부대공</div>
            <button class="story-vault-button" type="button" data-action="open-settings">보관함</button>
          </nav>
        `;
      }

      function formatBirthLabel(value) {
        const raw = String(value || "").trim();
        const digits = raw.replace(/\D/g, "");
        if (digits.length === 8) return `${digits.slice(0, 4)}.${digits.slice(4, 6)}.${digits.slice(6, 8)}`;
        return raw || "생년월일 미입력";
      }

      function parseBirthInput() {
        const birthSource = state.birth || "2000.01.01";
        const birthDigits = birthSource.replace(/\D/g, "");
        const raw =
          birthDigits.length === 8
            ? [birthDigits.slice(0, 4), birthDigits.slice(4, 6), birthDigits.slice(6, 8)]
            : birthSource.replace(/[./-]/g, ".").split(".");
        const year = Number(raw[0] || 2000);
        const month = Number(raw[1] || 1);
        const day = Number(raw[2] || 1);
        let hour = 12;
        let minute = 0;
        if (state.time && state.time !== "모름") {
          const m = state.time.match(/(\d{1,2}):(\d{2})/);
          if (m) {
            hour = Number(m[1]);
            minute = Number(m[2]);
          }
        }
        return {
          name: state.name,
          year,
          month,
          day,
          hour,
          minute,
          gender: state.gender === "여자" ? "female" : "male",
          calendar: state.calendar === "음력" ? "lunar" : "solar",
        };
      }

      async function analyzeBirth() {
        const birth = parseBirthInput();
        const context = {
          name: state.name,
          target: state.target,
          concern: state.concern,
          relationship: state.relationship,
          orientation: state.orientation,
          work: state.work,
        };
        state.reportPageIndex = 0;
        state.reportSectionCache = {};
        state.reportRequestToken += 1;
        if (state.reportTypingTimer) clearTimeout(state.reportTypingTimer);
        state.reportTypingTimer = null;
        const res = await fetch("/api/saju/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...birth, ...context, context }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "분석 실패");
        state.analysis = json;
        const reportId = json.report?.reportId || "";
        const stored = readReportHistory().find((item) => item.reportId === reportId);
        setActiveReportId(reportId);
        sessionStorage.setItem("cheongi_birth", JSON.stringify({ ...birth, target: state.target, concern: state.concern, relationship: state.relationship, work: state.work, orientation: state.orientation }));
        sessionStorage.setItem("cheongi_analysis", JSON.stringify(json));
        sessionStorage.setItem("cheongi_chat_history", JSON.stringify(stored?.chatHistory || []));
        if (state.concern) sessionStorage.setItem("cheongi_initial_concern", state.concern);
        saveCurrentReading();
      }

      function sampleSourceSections(displayName, concernHead, dominantElement, heroCharacter = sampleAssets.heroCharacter, showHeroDecor = true, heroCopy = `${displayName}<br />네 사주의 결이 보입니다`, showWorryBubble = true, worryBg = sampleAssets.worryBg, worryCopy = `<p><span class="red">${dominantElement}</span> 기운이 꽤 강하군요</p><p>보통 팔자가 아닌데?</p>`, palzaCopy = `<p>네가 어떤 사람인지,<br />네 고민이 뭔지,<br />난 다 보여</p>`, showPalzaBubbleTwo = true, showPalzaBubbleOne = true, palzaBg = sampleAssets.palzaBg, assetOne = sampleAssets.assetOne, showAssetOneTopCopy = true, assetOneBottomCopy = `<p>${concernHead} 때문에 여기까지 온 것이로군요.</p>`, previewTwoCopy = `<h2>사주의 결부터<br />차분히 풀어드리겠습니다</h2>`, previewTwo = sampleAssets.previewTwo, assetTwoTopCopy = `<p>${displayName}님의 사주<br />입력한 생년월일 기준</p>`) {
        return `
          <section class="source-section tall" data-sample-section="hero-character">
            <img data-source-asset="heroCharacter" alt="신당에 앉은 도령" class="source-img center-wide" src="${heroCharacter}" />

      function syncSceneUrl(scene) {
        const url = new URL(location.href);
        if (scene === "result" && state.analysis?.report?.reportId) {
          url.searchParams.set("reportId", state.analysis.report.reportId);
        }
        const hash = scene === "landing" ? "" : `#${scene}`;
        const nextUrl = `${url.pathname}${url.search}${hash}`;
        if (`${location.pathname}${location.search}${location.hash}` !== nextUrl) {
          history.replaceState(null, "", nextUrl);
        }
      }

      function getReportSections() {
        return state.analysis?.report?.sections || [];
      }

      function getReportContext() {
        return {
          name: state.name,
          target: state.target,
          concern: state.concern,
          relationship: state.relationship,
          orientation: state.orientation,
          work: state.work,
        };
      }

      function formatInterpretationHtml(text) {
        const clean = String(text || "").trim();
        if (!clean) return "";
        return clean
          .split(/\n{2,}/)
          .map((paragraph) => `<p>${escapeHtml(paragraph).replace(/\n/g, "<br />")}</p>`)
          .join("");
      }

      function renderReportTocMarkup(sections, activeIndex) {
        return sections
          .map((section, index) => `
            <button
              class="report-toc-button ${index === activeIndex ? "is-active" : ""}"
              type="button"
              data-action="report-jump"
              data-report-index="${index}"
              aria-pressed="${index === activeIndex}"
            >
              ${String(index + 1).padStart(2, "0")} · ${escapeHtml(section.category)}
            </button>
          `)
          .join("");
      }

      function renderReportPageMarkup(section, index, total, bodyHtml = "", status = "") {
        const hasPrev = index > 0;
        const hasNext = index < total - 1;
        const statusMarkup = status
          ? `
            <div class="report-status" role="status" aria-live="polite">
              <strong>${escapeHtml(status)}</strong>
              <div class="interpret-progress" aria-hidden="true"></div>
              <span>태어난 순간의 결에 지금 흐름을 맞춰 풀이를 여는 중입니다</span>
            </div>
          `
          : "";
        return `
          <div class="report-page-shell" data-report-page data-section-id="${escapeHtml(section.id)}">
            <div class="report-figure">
              <img src="${escapeHtml(section.imageSrc)}" alt="${escapeHtml(section.imageAlt)}" />
              <div class="report-bubble">${escapeHtml(section.hook)}</div>
            </div>
            <div class="report-meta">
              <p>${String(index + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")} · ${escapeHtml(section.categoryEn)}</p>
              <h3>${escapeHtml(section.category)}</h3>
              <p>${escapeHtml(section.classification)}</p>
            </div>
            ${statusMarkup}
            <div class="report-body ${status ? "typing-cursor" : ""}" data-report-body>${bodyHtml}</div>
            <div class="report-pager">
              <button type="button" data-action="report-prev" ${hasPrev ? "" : "disabled"}>이전 페이지</button>
              <button class="primary" type="button" data-action="report-next" ${hasNext ? "" : "disabled"}>${hasNext ? "다음 페이지" : "마지막 페이지"}</button>
            </div>
          </div>
        `;
      }

      function renderReportReaderMarkup(report) {
        const sections = report?.sections || [];
        if (!sections.length) return "";
        const activeIndex = Math.min(Math.max(state.reportPageIndex || 0, 0), sections.length - 1);
        const section = sections[activeIndex];
        const reportId = report?.reportId || "";
        const reportIdMarkup = reportId
          ? `
            <div class="report-id-strip">
              <span>풀이 ID</span>
              <code title="${escapeHtml(reportId)}">${escapeHtml(formatReportId(reportId))}</code>
              <button type="button" data-action="copy-report-link">링크 복사</button>
            </div>
          `
          : "";
        return `
          <section class="story-section deep report-reader-section" data-sample-section="generated-report">
            <span class="chapter">실제 풀이 목차</span>
            <h2>${escapeHtml(report.title || "사주 리포트")}</h2>
            <p>${escapeHtml(report.subtitle || "한 장씩 펼치며 사주의 패턴을 읽습니다.")}</p>
            ${reportIdMarkup}
            <div class="report-toc" data-report-toc>
              ${renderReportTocMarkup(sections, activeIndex)}
            </div>
            <div data-report-reader>
              ${renderReportPageMarkup(section, activeIndex, sections.length, "", "남부대공이 이 장의 기운을 펼치는 중입니다")}
            </div>
          </section>
        `;
      }

      function seedReportCache() {
        for (const section of getReportSections()) {
          if (!state.reportSectionCache[section.id]) {
            state.reportSectionCache[section.id] = { ...section, generatedBy: "template" };
          }
        }
      }

      function stopReportTyping() {
        if (state.reportTypingTimer) clearTimeout(state.reportTypingTimer);
        state.reportTypingTimer = null;
      }

      function updateReportToc() {
        const toc = document.querySelector("[data-report-toc]");
        const sections = getReportSections();
        if (toc && sections.length) {
          toc.innerHTML = renderReportTocMarkup(sections, state.reportPageIndex);
        }
      }

      function showReportPageFrame(section, status = "") {
        const reader = document.querySelector("[data-report-reader]");
        const sections = getReportSections();
        if (!reader || !section || !sections.length) return;
        reader.innerHTML = renderReportPageMarkup(section, state.reportPageIndex, sections.length, "", status);
        updateReportToc();
      }

      function typeReportText(section, token) {
        const body = document.querySelector("[data-report-body]");
        const status = document.querySelector(".report-status");
        if (!body || !section) return;
        const fullText = String(section.interpretation || "");
        let cursor = 0;
        const step = Math.max(2, Math.ceil(fullText.length / 260));
        body.classList.add("typing-cursor");
        if (status) status.remove();

        const tick = () => {
          if (token !== state.reportRequestToken) return;
          cursor = Math.min(fullText.length, cursor + step);
          body.innerHTML = formatInterpretationHtml(fullText.slice(0, cursor));
          if (cursor < fullText.length) {
            state.reportTypingTimer = setTimeout(tick, 18);
          } else {
            body.classList.remove("typing-cursor");
            state.reportTypingTimer = null;
          }
        };
        tick();
      }

      async function fetchReportSection(section) {
        const birth = parseBirthInput();
        const res = await fetch("/api/report/section", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            birth,
            reportId: state.analysis?.report?.reportId,
            sectionId: section.id,
            context: getReportContext(),
          }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "리포트 생성 실패");
        if (json.report && state.analysis) {
          state.analysis.report = json.report;
          seedReportCache();
          saveCurrentReading();
        }
        return { ...json.section, generatedBy: json.generatedBy, model: json.model };
      }

      async function prewarmReport() {
        const reportId = state.analysis?.report?.reportId;
        if (!reportId) return;
        const birth = parseBirthInput();
        try {
          const res = await fetch("/api/report/prewarm", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              birth,
              reportId,
              context: getReportContext(),
            }),
          });
          const json = await res.json();
          if (!res.ok || !json.report || !state.analysis) return;
          state.analysis.report = json.report;
          seedReportCache();
          saveCurrentReading();
        } catch (err) {
          // The section API still falls back to on-demand generation.
        }
      }

      async function copyReportLink(button) {
        const reportId = state.analysis?.report?.reportId;
        if (!reportId) return;
        const link = buildReportLink(reportId);
        syncReportIdInUrl(reportId);
        try {
          await navigator.clipboard.writeText(link);
          if (button) {
            const original = button.textContent;
            button.textContent = "복사됨";
            setTimeout(() => {
              button.textContent = original || "링크 복사";
            }, 1400);
          }
        } catch (err) {
          if (button) button.textContent = "ID 확인";
        }
      }

      async function loadReportPage(index, force = false) {
        const sections = getReportSections();
        if (!sections.length) return;
        const nextIndex = Math.min(Math.max(index, 0), sections.length - 1);
        state.reportPageIndex = nextIndex;
        const templateSection = sections[nextIndex];
        stopReportTyping();
        const token = state.reportRequestToken + 1;
        state.reportRequestToken = token;

        const cached = state.reportSectionCache[templateSection.id];
        if (cached && !force && (cached.generatedBy === "openai" || cached.status === "complete")) {
          showReportPageFrame(cached, "");
          typeReportText(cached, token);
          return;
        }

        showReportPageFrame(templateSection, "남부대공이 이 장의 기운을 펼치는 중입니다");
        try {
          const generated = await fetchReportSection(templateSection);
          if (token !== state.reportRequestToken) return;
          state.reportSectionCache[templateSection.id] = generated;
          showReportPageFrame(generated, "");
          typeReportText(generated, token);
        } catch (err) {
          if (token !== state.reportRequestToken) return;
          const fallback = cached || templateSection;
          state.reportSectionCache[templateSection.id] = fallback;
          showReportPageFrame(fallback, "");
          typeReportText(fallback, token);
        }
      }

      function setupReportReader() {
        if (!getReportSections().length) return;
        seedReportCache();
        requestAnimationFrame(() => {
          loadReportPage(state.reportPageIndex || 0);
          prewarmReport();
        });
      }

      function go(scene, remember = true) {
        if (remember && state.scene !== scene) historyStack.push(state.scene);
        state.scene = scene;
        syncSceneUrl(scene);
        phone.dataset.scene =
          scene === "landing"
            ? "landing"
            : scene === "immersion"
              ? "immersion"
              : scene === "loading"
                ? "loading"
                : scene === "result"
                  ? "result"
                  : "input";
        soundButton.style.display = "none";
        steps[scene]();
        phone.scrollTop = 0;
        if (scene === "result") stage.scrollTop = 0;
        requestAnimationFrame(() => {
          phone.scrollTop = 0;
          if (scene === "result") stage.scrollTop = 0;
        });
      }

      function renderLanding() {
        stage.innerHTML = `
          <article class="sample-story">
            ${storyTopNavMarkup()}

                <div class="chart-row"><span>${currentYear + 1}</span><div class="chart-track"><span class="chart-fill" style="width: 64%"></span></div><strong>확장</strong></div>
                <div class="chart-row"><span>${turningYear}</span><div class="chart-track"><span class="chart-fill" style="width: 88%"></span></div><strong>전환</strong></div>
                <div class="chart-row"><span>${turningYear + 1}</span><div class="chart-track"><span class="chart-fill" style="width: 73%"></span></div><strong>정리</strong></div>
              </div>
              <div class="quote">시기와 방법은 같이 봐야 합니다. 기회를 못 잡으면 흐름이 새어 나갑니다.</div>
            </section>

            <section class="story-visual compact visual-romance" data-sample-section="romance-teaser">
              <div class="bubble-layer">
                <div class="bubble-cluster right-top">
                  <div class="bubble right">네가 다음에 깊게 얽힐 인연도 보입니다.</div>
                  <div class="bubble accent right">잠깐, 화경으로 한 번 보겠습니다.</div>
                </div>
              </div>
              <div class="story-caption compact-title">
                <p>연애운</p>
                <h2>오래 남는 사람은<br />따로 보입니다</h2>
              </div>
            </section>

            <section class="story-section" data-sample-section="destiny-card">
              <span class="chapter">연애운</span>
              <h2>${relationLabel}</h2>
              <p>${loveText}</p>
              <div class="destiny-card" aria-label="운명의 상대">
                <h3>${displayName}님의 운명의 상대</h3>
                <div class="destiny-row"><strong>시기</strong><span>${romanceYear}.06.04 전후, 마음이 먼저 움직입니다.</span></div>
                <div class="destiny-row"><strong>직업</strong><span>기획, 전략, 서비스처럼 사람의 흐름을 읽는 일과 맞닿아 있습니다.</span></div>
                <div class="destiny-row"><strong>외모</strong><span>눈빛이 또렷하고 첫인상보다 오래 남는 쪽입니다.</span></div>
                <div class="destiny-row"><strong>장소</strong><span>모임, 일터, 소개처럼 관계가 겹쳐지는 자리입니다.</span></div>
              </div>
            </section>

            <section class="story-visual statement visual-outro" data-sample-section="outro">
              <div class="story-caption">
                <p>그래서...</p>
                <h2>복채는<br />준비해왔습니까?</h2>
                <p>이거 말고도 할 얘기가 산더미입니다.</p>
              </div>
            </section>

            <section class="story-section center deep" data-sample-section="value-prop">
              <span class="chapter">오직 ${displayName}님을 위한 이야기</span>
              <h2>방금 펼친 사주는<br />맛보기일 뿐입니다</h2>
              <p>${targetLabel}의 생년월일과 지금 고민을 기준으로, 성격의 결부터 돈길과 인연의 흐름까지 이어서 봅니다.</p>
            </section>

            <section class="story-section" data-sample-section="package">
              <span class="chapter">남부대공 상담</span>
              <h2>정통사주 깊은 풀이</h2>
              <div class="package-card">
                <h3>${displayName}님 사주 기반 상담 구성</h3>
                <ul class="package-list">
                  <li>나의 사주팔자 상세 분석</li>
                  <li>내 성향, 기운, 일과 돈, 관계 흐름 풀이</li>
                  <li>재물운과 일 흐름의 새는 지점 확인</li>
                  <li>연애운과 오래 남을 인연의 패턴</li>
                  <li>${concernText}에 맞춘 맞춤 상담</li>
                </ul>
                <div class="price-slate" aria-label="복채 안내">
                  <div class="price-line"><span>기본 복채</span><span>63,000원</span></div>
                  <div class="price-line"><span>남부대공 상담 연결</span><span>-13,200원</span></div>
                  <div class="price-line final"><span>지금 열기</span><span>49,800원</span></div>
                </div>
              </div>
            </section>

            <section class="story-visual statement visual-fan" data-sample-section="hesitation">
              <div class="story-caption">
                <p>잠깐</p>
                <h2>지금 무슨 생각을<br />하고 있죠?</h2>
              </div>
            </section>

            <section class="story-section center tall" data-sample-section="comparison">
              <span class="chapter">얄팍한 풀이와 다릅니다</span>
              <h2 class="hero-line">한 해 운세만 보고<br />끝낼 생각입니까?</h2>
              <p>남부대공 풀이는 태어난 순간의 결, 지금의 질문, 앞으로의 흐름을 한 줄로 엮어 봅니다.</p>
              <div class="story-list">
                <div class="story-list-item">사주팔자를 먼저 펼치고, 지금 고민이 왜 반복되는지 연결합니다.</div>
                <div class="story-list-item">좋은 말만 늘어놓지 않고, 조심해야 할 방향도 같이 말합니다.</div>
                <div class="story-list-item">상담 버튼을 누르면 남부대공이 같은 말투로 이어서 묻고 답합니다.</div>
              </div>
            </section>

            <section class="story-section deep" data-sample-section="report-preview">
              <span class="chapter">리포트 미리보기</span>
              <h2>너를 가감없이 설명하는<br />긴 풀이가 이어집니다</h2>
              <p>실제 상담에서는 질문을 더 던질수록 사주의 결이 더 선명해집니다.</p>
              <div class="report-preview">
                <div class="report-page">성격의 결: 겉으로 보이는 태도와 속에서 반복되는 불안의 방향을 함께 봅니다.</div>
                <div class="report-page">재물의 결: 돈이 모이는 자리와 새는 자리를 나눠서 봅니다.</div>
                <div class="report-page">인연의 결: 끌리는 사람과 오래 남는 사람이 왜 다른지 풀이합니다.</div>
              </div>
            </section>

            <section class="story-visual statement visual-saju" data-sample-section="last-saju-book">
              <div class="story-caption">
                <p>실제 결과 리포트 예시</p>
                <h2>읽는데 2시간은<br />족히 넘게 걸릴 겁니다</h2>
              </div>
            </section>

            <section class="story-section center" data-sample-section="book-volume">
              <span class="chapter">책 한 권 분량</span>
              <h2 class="hero-line">5만 자의 풀이가<br />상담으로 이어집니다</h2>
              <p>하지만 여기서는 길게 늘어놓기보다, 먼저 ${displayName}님이 묻고 싶은 것부터 바로 파고들겠습니다.</p>
              <div class="story-callout">말투도, 흐름도, 방금 본 남부대공 그대로 이어집니다.</div>
            </section>

            <section class="story-section" data-sample-section="contents-list">
              <span class="chapter">더 이어질 풀이</span>
              <h2>착한 척은 그만해도 됩니다<br />네 속이 다 보이니까</h2>
              <div class="story-list">
                <div class="story-list-item">남들에게 들키기 싫은 진짜 성격과 숨겨진 열등감</div>
                <div class="story-list-item">평생 돈이 한 번 크게 움직이는 시점과 막아야 할 돈구멍</div>
                <div class="story-list-item">내 곁에 붙어 있어야 할 귀인과 멀리해야 할 인연 구별법</div>
                <div class="story-list-item">지금 버틸지, 옮길지, 방향을 바꿀지 보는 맞춤 처방</div>
              </div>
            </section>

            <section class="story-visual statement visual-outro" data-sample-section="final-proof">
              <div class="story-caption">
                <p>내가 지금까지 점사를 봐준 사람은 많습니다</p>
                <h2>압도적인 몰입감으로<br />이어가겠습니다</h2>
              </div>
            </section>

            <section class="story-section deep" data-sample-section="reviews">
              <span class="chapter">실제 상담 흐름</span>
              <h2>혼자 읽고 끝나는 풀이가 아닙니다</h2>
              <p>결과를 읽다가 걸리는 문장이 생기면 바로 묻습니다. 남부대공이 같은 사주표를 붙잡고 이어서 봅니다.</p>
              <div class="stats" aria-label="상담 지표">
                <div class="stat"><strong>1:1</strong><span>맞춤 상담</span></div>
                <div class="stat"><strong>24</strong><span>오행 흐름</span></div>
                <div class="stat"><strong>100</strong><span>페이지급 밀도</span></div>
              </div>
              <div class="reviews">
                <div class="review">“직장 운 때문에 들어왔는데, 그냥 위로가 아니라 왜 같은 고민이 반복되는지부터 짚어줘서 몰입됐습니다.”</div>
                <div class="review">“처음 결과 화면 말투 그대로 상담이 이어져서 한 사람이 보고 있는 느낌이 납니다.”</div>
              </div>
            </section>

            <section class="story-section flush-bottom" data-sample-section="proof-and-chat">
              <span class="chapter">마지막 확인</span>
              <h2>이제 상담으로 들어갑니다</h2>
              <p>방금 펼친 사주를 바탕으로 더 깊은 상담에 들어갑니다. 묻고 싶은 걸 던지면 남부대공이 같은 말투로 이어서 풀어드립니다.</p>
              <div class="proof-stack">
                <div class="proof-row"><span>분석 기준</span><strong>${birthLabel}</strong></div>
                <div class="proof-row"><span>먼저 보이는 기운</span><strong>${dayMasterElement}</strong></div>
                <div class="proof-row"><span>지금 고민</span><strong>${concernText}</strong></div>
              </div>
            </section>

            <div class="sticky-story-cta">
              <button class="primary-cta" type="button" data-action="open-chat">사주 풀이 · 남부대공 상담</button>
            </div>
          </article>
        `;
      }

      function renderPurchase() {
        const plans = [
          { id: "single", title: "운명신당 정통사주", badge: "기본", discount: "21%", origin: "63,000원", price: "49,800원" },
          { id: "solo", title: "솔로탈출 패키지", badge: "추천", discount: "44%", origin: "108,000원", price: "60,000원" },
          { id: "deep", title: "MZ 운세 패키지", badge: "인기", discount: "30%", origin: "96,000원", price: "67,000원" },
        ];
        const selected = plans.find((plan) => plan.id === state.plan) || plans[0];

        stage.innerHTML = `
          <section class="panel teaser-panel">
            <div class="status">결제 안내 데모</div>
            <h1>전체 풀이를 열어볼까요?</h1>
            <p>${state.name || "당신"}님의 입력값으로 만든 전체 리포트 선택 화면입니다. 실제 결제는 연결하지 않은 데모입니다.</p>

            <div class="result-list">
              ${plans
                .map(
                  (plan) => `
                    <button class="result-item choice ${state.plan === plan.id ? "is-selected" : ""}" type="button" data-key="plan" data-value="${plan.id}">
                      <strong>${plan.badge} · ${plan.title}</strong>
                      <span>${plan.discount} 할인 · <s>${plan.origin}</s> → ${plan.price}</span>
                    </button>
                  `,
                )
                .join("")}
            </div>

            <div class="teaser-block">
              <span class="chapter">결제 요약</span>
              <div class="timeline">
                <div class="timeline-row"><strong>상품</strong><span>${selected.title}</span></div>
                <div class="timeline-row"><strong>판매가</strong><span>${selected.origin}</span></div>
                <div class="timeline-row"><strong>할인</strong><span>${selected.discount} 적용</span></div>
                <div class="timeline-row"><strong>결제금액</strong><span>${selected.price}</span></div>
              </div>
              <button class="ghost" type="button" style="width: 100%; margin-top: 12px;">쿠폰 적용</button>
            </div>

            <div class="teaser-block">
              <span class="chapter">동의</span>
              <div class="choices single">
                <button class="choice ${state.privacyAgree ? "is-selected" : ""}" type="button" data-action="toggle-agree" data-agree="privacyAgree">개인정보 처리방침 동의</button>
                <button class="choice ${state.paymentAgree ? "is-selected" : ""}" type="button" data-action="toggle-agree" data-agree="paymentAgree">결제 진행 필수 동의</button>
                <button class="choice ${state.marketingAgree ? "is-selected" : ""}" type="button" data-action="toggle-agree" data-agree="marketingAgree">마케팅 수신 동의 (선택)</button>
              </div>
            </div>

            <div class="actions">
              <button class="ghost" type="button" data-action="prev">이전</button>
              <button class="next-cta" type="button" data-action="pay-demo">결제하기</button>
            </div>
          </section>
        `;
      }

      function renderPaymentReady() {
        stage.innerHTML = `
          <section class="panel">
            <div class="status">여기서 실제 결제 모듈로 연결</div>
            <h1>결제 직전 단계입니다</h1>
            <p>원본 흐름에서는 이 다음에 외부 결제/주문 진행이 이어집니다. 이 데모는 안전하게 화면 전환까지만 구현했습니다.</p>
            <div class="result-list">
              <div class="result-item"><strong>선택 상품</strong><span>${state.plan === "single" ? "운명신당 정통사주" : state.plan === "solo" ? "솔로탈출 패키지" : "MZ 운세 패키지"}</span></div>
              <div class="result-item"><strong>필수 동의</strong><span>개인정보 처리방침, 결제 진행 필수 동의 완료</span></div>
            </div>
            <button class="next-cta" type="button" data-action="restart" style="width: 100%">처음부터 다시 보기</button>
          </section>
        `;
      }

      function renderReportLookupError(message) {
        phone.dataset.scene = "input";
        stage.innerHTML = `
          <section class="panel">
            <div class="status">풀이 ID 조회 실패</div>
            <h1>저장된 풀이를 찾지 못했습니다</h1>
            <p>${escapeHtml(message || "이 ID의 저장 데이터가 아직 서버에 없거나, 보관함에서 삭제된 상태입니다.")}</p>
            <div class="actions">
              <button class="ghost" type="button" data-action="open-settings">보관함 보기</button>
              <button class="next-cta" type="button" data-action="restart">새 사주 입력</button>
            </div>
          </section>
        `;
      }

      const initialScene = location.hash.slice(1);
      const resolvedInitialScene = initialScene === "immersion" ? "target" : initialScene;
      const initialReportId = new URLSearchParams(location.search).get("reportId");
      if (initialReportId) {
        go("loading", false);
        loadReportById(initialReportId).catch((err) => {
          renderReportLookupError(err.message);
        });
      } else if (urlScenes.has(resolvedInitialScene)) {
        go(resolvedInitialScene, false);
      } else {
        syncSceneUrl("landing");
        renderLanding();
      }
    </script>
  </body>
</html>

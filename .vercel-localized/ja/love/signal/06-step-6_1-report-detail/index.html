      const sectionAssets = {
        relationship_temperature_true_love: {
          hero: "../assets/signal/06-relationship_temperature_true_love-hero.webp",
          evidence: "../assets/signal/06-relationship_temperature_true_love-evidence.webp",
          hero_video: "../assets/signal/videos/22-true-love-hero.mp4",
          hero_poster: "../assets/signal/videos/22-true-love-hero-poster.webp",
          evidence_video: "../assets/signal/videos/21-true-love-evidence.mp4",
          evidence_poster: "../assets/signal/videos/21-true-love-evidence-poster.webp",
          hero_alt: "赤い服の相談者が、二枚の空白のカードと赤い糸で、関係の温度を探る場面",
          evidence_alt: "赤い服の相談者が五行の石と二つの関係盤を整理する場面"
        }
      };

      const root = document.getElementById("detail-root");
      const toast = document.getElementById("toast");
      const offline = document.getElementById("offline");
      const btnPrev = document.getElementById("btn-prev");
      const btnNext = document.getElementById("btn-next");

      function currentParams() {
        return new URLSearchParams(location.search);
      }

      function readJson(storage, key, fallback = null) {
        try {
          const raw = storage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (error) {
          return fallback;
        }
      }

      function writeJson(storage, key, value) {
        try {
          storage.setItem(key, JSON.stringify(value));
        } catch (error) {
          return false;
        }
        return true;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function allItems() {
        return groups.flatMap((group) => group.items.map((row, index) => ({
          section_id: row[0],
          title: row[1],
          preview: row[2],
          group,
          order: index + 1,
          evidence_ids: group.evidence_ids,
          calculated_fact_keys: group.fact_keys
        })));
      }

      function findItem(sectionId) {
        return allItems().find((item) => item.section_id === sectionId);
      }

      function selectedSectionId() {
        const stored = readJson(sessionStorage, keys.activeSection);
        const query = currentParams();
        const fromQuery = query.get("section") || query.get("section_id") || "";
        return fromQuery || stored?.item?.section_id || "relationship_temperature_true_love";
      }

      function reportId() {
        const query = currentParams();
        const preview = readJson(sessionStorage, keys.reportPreview);
        const active = readJson(sessionStorage, keys.activeReport);
        const stored = readJson(sessionStorage, keys.activeSection);
        return query.get("report_id") || query.get("reportId") || stored?.report_id || active?.report_id || preview?.report_id || "";
      }

      function isLocalReview() {
        return location.protocol === "file:";
      }

      function hasAccess() {
        if (isLocalReview()) return true;
        const query = currentParams();
        if (query.get("access") === "locked" || query.get("entitled") === "false") return false;
        if (window.UMSH_SERVER_ENTITLEMENT?.couple_signal === true) return true;
        if (window.UMSH_ENTITLEMENT?.couple_signal === true) return true;
        const active = readJson(sessionStorage, keys.activeReport);
        const preview = readJson(sessionStorage, keys.reportPreview);
        return Boolean(
          active?.entitlement === "verified"
          || active?.paid === true
          || active?.source === "step-4-report"
          || active?.entry === "step-5-chat"
          || preview?.entitlement === "verified"
          || preview?.paid === true
        );
      }

      function activeState() {
        const query = currentParams();
        if (query.get("state") === "generating") return "generating";
        if (!hasAccess()) return "locked";
        if (!isLocalReview() && !reportId()) return "missing";
        return "ready";
      }

      function valueAt(object, path) {
        return path.split(".").reduce((acc, key) => (acc && Object.prototype.hasOwnProperty.call(acc, key) ? acc[key] : undefined), object);
      }

      function inputStatus() {
        const reportInput = readJson(sessionStorage, keys.reportInput);
        const active = readJson(sessionStorage, keys.activeReport);
        const preview = readJson(sessionStorage, keys.reportPreview);
        return {
          reportInput,
          active,
          preview,
          merged: {
            input: reportInput?.input || reportInput || {},
            calculated_facts: active?.calculated_facts || preview?.calculated_facts || reportInput?.calculated_facts || {}
          }
        };
      }

      function factRows(item) {
        const status = inputStatus();
        const input = status.merged.input;
        const facts = status.merged.calculated_facts;
        const factObject = status.merged;
        const selfReady = Boolean(input?.self?.birth?.year || input?.self?.birth?.month || input?.self?.birth?.day || input?.self?.birth);
        const partnerReady = Boolean(input?.partner?.birth?.year || input?.partner?.birth?.month || input?.partner?.birth?.day || input?.partner?.birth);
        const computed = (item.calculated_fact_keys || [])
          .map((key) => [key, valueAt(factObject, key)])
          .filter((entry) => entry[1] !== undefined && entry[1] !== null && entry[1] !== "");

        return [
          ["命式情報を入力", selfReady ? "入力を接続済み" : "入力待ち"],
          ["相手の命式入力", partnerReady ? "入力を接続済み" : "入力待ち"],
          ["詳しい計算値", computed.length ? computed.map((entry) => String(entry[1])).slice(0, 2).join(" · ") : "詳細計算値を待機中"],
          ["解釈の基準", `${item.group.axis} · ${service.basis.join(" · ")}`]
        ];
      }

      function sectionAsset(item) {
        return sectionAssets[item.section_id] || {
          hero: item.group.image,
          evidence: "",
          hero_alt: `${item.group.title}の代表の場面`,
          evidence_alt: ""
        };
      }

      function relatedFor(item) {
        const list = allItems();
        const index = list.findIndex((entry) => entry.section_id === item.section_id);
        return {
          previous: index > 0 ? list[index - 1] : null,
          next: index >= 0 && index < list.length - 1 ? list[index + 1] : null,
          siblings: list.filter((entry) => entry.group.id === item.group.id && entry.section_id !== item.section_id).slice(0, 4)
        };
      }

      function detailCopy(item) {
        const profile = groupProfiles[item.group.id] || groupProfiles.relationship_temperature;
        return {
          conclusion: `${item.title}は相手を追い込む結論ではなく、${item.preview}`,
          answer: profile.answer,
          reality: profile.reality,
          condition: profile.condition,
          actions: profile.actions,
          caution: profile.caution,
          basis: `${item.group.title}では${item.group.axis}を中心に、古典用語と今の行動のサインを分けて見ます。`
        };
      }

      function renderStateCard(kind) {
        const states = {
          locked: {
            title: "全文レポートの閲覧後に見られる",
            text: "詳細解説は、支払いと本人のレポート確認後に開きます。無料の試し読みに戻るか、結果一覧から続けられる。",
            primary: "無料ティーザー",
            secondary: "一覧"
          },
          generating: {
            title: "詳しいレポートを開いています",
            text: "再決済は不要です。生成が終わると同じレポートで続けられます。",
            primary: "再確認",
            secondary: "一覧"
          },
          missing: {
            title: "レポートの接続が切れた",
            text: "結果一覧で項目を選び直すと、詳しい鑑定を続けて見られる。",
            primary: "一覧",
            secondary: "無料ティーザー"
          },
          invalid: {
            title: "一覧にない項目です",
            text: "05の結果一覧にある項目だけ詳細を開ける。見たい項目を一覧からもう一度選んでください。",
            primary: "一覧",
            secondary: "無料ティーザー"
          }
        };
        const state = states[kind] || states.missing;
        root.innerHTML = `
          \x3csection class="state-card">
            \x3cspan class="kicker">状態の確認\x3c/span>
            \x3ch1>${escapeHtml(state.title)}\x3c/h1>
            \x3cp>${escapeHtml(state.text)}\x3c/p>
            \x3cdiv class="state-actions">
              \x3cbutton class="primary-btn" type="button" data-state-primary>${escapeHtml(state.primary)}\x3c/button>
              \x3cbutton type="button" data-state-secondary>${escapeHtml(state.secondary)}\x3c/button>
            \x3c/div>
          \x3c/section>
        `;
        btnPrev.disabled = true;
        btnNext.disabled = true;
      }

      function renderEvidence(item, copy) {
        const rows = factRows(item);
        return `
          \x3csection class="section-card" data-evidence-ids="${escapeHtml(item.evidence_ids.join(" "))}" data-calculated-fact-keys="${escapeHtml(item.calculated_fact_keys.join(" "))}">
            \x3cdiv>
              \x3cspan class="block-kicker">確認された根拠\x3c/span>
              \x3ch2>古典の基準と入力値を分けて見ます\x3c/h2>
            \x3c/div>
            \x3cdiv class="evidence-grid">
              ${rows.map(([label, value]) => `
                <div class="evidence-row">
                  <span>${escapeHtml(label)}</span>
                  <strong>${escapeHtml(value)}</strong>
                </div>
              `).join("")}
            \x3c/div>
            \x3cp>${escapeHtml(copy.basis)} 計算値がまだつながっていない項目は、新しい数字や期間を作らず、確認できる関係の合図を中心にだけ読みます。\x3c/p>
          \x3c/section>
        `;
      }

      function renderVisualEvidence(item, asset) {
        if (!asset.evidence) return "";
        return `
          \x3cfigure class="visual-block" data-asset-key="couple-signal-06-${escapeHtml(item.section_id)}-evidence">
            ${asset.evidence_video
              ? `<video class="detail-video" poster="${escapeHtml(asset.evidence_poster)}" data-video-src="${escapeHtml(asset.evidence_video)}" muted loop playsinline preload="none" aria-label="${escapeHtml(asset.evidence_alt)}"></video>`
              : `<img src="${escapeHtml(asset.evidence)}" alt="${escapeHtml(asset.evidence_alt)}" loading="lazy" />`}
            \x3cfigcaption>詳細の根拠ブロックに使う場面だ。解説の文は画像ではなく、本文だけで示す。\x3c/figcaption>
          \x3c/figure>
        `;
      }

      function renderSignals(item, copy) {
        const rows = [
          ["現実で見える姿", copy.reality],
          ["時期・強弱・条件", copy.condition],
          ["注意する選択", copy.caution]
        ];
        return `
          \x3csection class="section-card" data-evidence-ids="${escapeHtml(item.evidence_ids.join(" "))}" data-calculated-fact-keys="${escapeHtml(item.calculated_fact_keys.join(" "))}">
            \x3cdiv>
              \x3cspan class="block-kicker">詳しい解釈\x3c/span>
              \x3ch2>関係のサインに置き換えるとこうなります\x3c/h2>
            \x3c/div>
            \x3cdiv class="reading">
              \x3cp>${escapeHtml(copy.answer)}\x3c/p>
              \x3cdiv class="quote">${escapeHtml(copy.conclusion)}\x3c/div>
            \x3c/div>
            \x3cdiv class="signal-grid">
              ${rows.map(([label, value], index) => `
                <div class="signal-row ${index === 2 ? "is-watch" : ""}">
                  <span>${escapeHtml(label)}</span>
                  <strong>${escapeHtml(value)}</strong>
                </div>
              `).join("")}
            \x3c/div>
          \x3c/section>
        `;
      }

      function renderActions(item, copy) {
        return `
          \x3csection class="section-card" data-evidence-ids="${escapeHtml(item.evidence_ids.join(" "))}" data-calculated-fact-keys="${escapeHtml(item.calculated_fact_keys.join(" "))}">
            \x3cdiv>
              \x3cspan class="block-kicker">今できる行動\x3c/span>
              \x3ch2>今日か今週にできること\x3c/h2>
            \x3c/div>
            \x3cdiv class="action-grid">
              ${copy.actions.map((action, index) => `
                <div class="action-row">
                  <span>${String(index + 1).padStart(2, "0")}</span>
                  <strong>${escapeHtml(action)}</strong>
                </div>
              `).join("")}
            \x3c/div>
          \x3c/section>
        `;
      }

      function renderRelated(item) {
        const related = relatedFor(item);
        const buttons = [
          related.previous ? { label: "前へ", item: related.previous } : null,
          related.next ? { label: "次へ", item: related.next } : null,
          ...related.siblings.map((sibling) => ({ label: item.group.title, item: sibling }))
        ].filter(Boolean).slice(0, 6);

        return `
          \x3csection class="related-card">
            \x3cdiv>
              \x3cspan class="block-kicker">関連項目\x3c/span>
              \x3ch2>一緒に見ると流れがはっきりします\x3c/h2>
            \x3c/div>
            \x3cdiv class="related-list">
              ${buttons.map((entry) => `
                <button type="button" data-related-section="${escapeHtml(entry.item.section_id)}">
                  <strong>${escapeHtml(entry.item.title)}</strong>
                  <span>${escapeHtml(entry.label)}</span>
                </button>
              `).join("")}
            \x3c/div>
          \x3c/section>
        `;
      }

      function renderDetail(item) {
        const asset = sectionAsset(item);
        const copy = detailCopy(item);
        const related = relatedFor(item);
        document.getElementById("context-label").textContent = `${item.group.title} · ${item.title}`;
        btnPrev.disabled = !related.previous;
        btnNext.disabled = !related.next;
        btnPrev.dataset.target = related.previous?.section_id || "";
        btnNext.dataset.target = related.next?.section_id || "";

        root.innerHTML = `
          \x3cdiv>
            \x3csection class="hero" data-asset-key="couple-signal-06-${escapeHtml(item.section_id)}-hero">
              \x3cdiv class="hero-visual">
                ${asset.hero_video
                  ? `<video class="detail-video" poster="${escapeHtml(asset.hero_poster)}" data-video-src="${escapeHtml(asset.hero_video)}" data-video-priority="high" muted loop playsinline preload="none" aria-label="${escapeHtml(asset.hero_alt)}"></video>`
                  : `<img src="${escapeHtml(asset.hero)}" alt="${escapeHtml(asset.hero_alt)}" />`}
              \x3c/div>
              \x3cdiv class="hero-copy">
                \x3cspan class="kicker">${escapeHtml(item.group.title)}\x3c/span>
                \x3ch1>${escapeHtml(item.title)}\x3c/h1>
                \x3cp>${escapeHtml(item.preview)}\x3c/p>
                \x3cdiv class="status-line" aria-label="分析の基準">
                  \x3cspan>${escapeHtml(service.category)}\x3c/span>
                  \x3cspan>${escapeHtml(service.basis.join(" · "))}\x3c/span>
                  \x3cspan>${escapeHtml(service.report_version)}\x3c/span>
                \x3c/div>
              \x3c/div>
            \x3c/section>
          \x3c/div>
          \x3cdiv>
            \x3csection class="section-card" data-evidence-ids="${escapeHtml(item.evidence_ids.join(" "))}" data-calculated-fact-keys="${escapeHtml(item.calculated_fact_keys.join(" "))}">
              \x3cspan class="block-kicker">結論を一言で\x3c/span>
              \x3cdiv class="headline-answer">
                \x3cstrong>${escapeHtml(copy.conclusion)}\x3c/strong>
              \x3c/div>
              \x3cp>この詳細ページは、「そうだった・違った」と断定せず、今の関係で確認できる親密さ、外部の要因、話し合うタイミングを順番に整理する。\x3c/p>
            \x3c/section>
            ${renderEvidence(item, copy)}
            ${renderVisualEvidence(item, asset)}
            ${renderSignals(item, copy)}
            ${renderActions(item, copy)}
            ${renderRelated(item)}
          \x3c/div>
        `;

        window.umshSignalVideos?.observe(root);

        writeJson(sessionStorage, keys.activeSection, {
          service,
          report_id: reportId(),
          group: {
            id: item.group.id,
            title: item.group.title,
            subtitle: item.group.subtitle,
            image: item.group.image,
            evidence_ids: item.group.evidence_ids
          },
          item: {
            section_id: item.section_id,
            title: item.title,
            preview: item.preview,
            evidence_ids: item.evidence_ids,
            calculated_fact_keys: item.calculated_fact_keys
          },
          siblings: groups.find((group) => group.id === item.group.id).items.map((row) => ({
            section_id: row[0],
            title: row[1],
            preview: row[2],
            route: `../06-step-6_1-report-detail/index.html?section=${encodeURIComponent(row[0])}#step-6_1-report`
          })),
          created_at: new Date().toISOString()
        });
      }

      function goList() {
        writeJson(sessionStorage, keys.scrollReturn, {
          section_id: selectedSectionId(),
          report_id: reportId(),
          created_at: new Date().toISOString()
        });
        if (document.referrer && document.referrer.includes("05-step-5-chat")) {
          history.back();
          return;
        }
        location.href = "../05-step-5-chat/chat.html#step-5-chat";
      }

      function navigateSection(sectionId, replace = false) {
        const item = findItem(sectionId);
        if (!item) {
          renderStateCard("invalid");
          return;
        }
        const nextUrl = `?service_key=${encodeURIComponent(service.service_key)}&report_id=${encodeURIComponent(reportId() || "local-review")}&report_version=${encodeURIComponent(service.report_version)}&group=${encodeURIComponent(item.group.id)}&section=${encodeURIComponent(item.section_id)}#step-6_1-report`;
        if (replace) {
          history.replaceState({ section_id: item.section_id }, "", nextUrl);
        } else {
          history.pushState({ section_id: item.section_id }, "", nextUrl);
        }
        renderDetail(item);
        document.getElementById("step-6_1-report").scrollIntoView({ block: "start" });
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove("is-visible"), 2300);
      }

      function boot() {
        const state = activeState();
        const item = findItem(selectedSectionId());
        if (state !== "ready") {
          renderStateCard(state);
          return;
        }
        if (!item) {
          renderStateCard("invalid");
          return;
        }
        navigateSection(item.section_id, true);
      }

      document.getElementById("btn-back").addEventListener("click", goList);
      document.getElementById("btn-list").addEventListener("click", goList);
      document.getElementById("btn-save").addEventListener("click", () => showToast("この詳細を保管庫につなげておきます。"));
      btnPrev.addEventListener("click", () => {
        if (btnPrev.dataset.target) navigateSection(btnPrev.dataset.target);
      });
      btnNext.addEventListener("click", () => {
        if (btnNext.dataset.target) navigateSection(btnNext.dataset.target);
      });
      root.addEventListener("click", (event) => {
        const related = event.target.closest("[data-related-section]");
        const primary = event.target.closest("[data-state-primary]");
        const secondary = event.target.closest("[data-state-secondary]");
        if (related) navigateSection(related.dataset.relatedSection);
        if (primary || secondary) {
          const label = (primary || secondary).textContent.trim();
          if (label === "무료 티저") location.href = "../04-step-4-report/index.html#step-4-report";
          else if (label === "다시 확인") location.reload();
          else goList();
        }
      });
      document.addEventListener("error", (event) => {
        if (event.target?.tagName === "IMG") {
          event.target.closest(".hero, .visual-block")?.classList.add("image-failed");
        }
      }, true);
      window.addEventListener("popstate", () => {
        const item = findItem(selectedSectionId());
        if (item) renderDetail(item);
      });
      function updateOffline() {
        offline.classList.toggle("is-visible", navigator.onLine === false);
      }
      window.addEventListener("online", updateOffline);
      window.addEventListener("offline", updateOffline);
      updateOffline();
      boot();
    })();
  </script>

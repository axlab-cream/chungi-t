    <style>
      :root {
        color-scheme: dark;
        --bg: #050403;
        --panel: rgba(20, 14, 12, 0.82);

        --gold: #e8c76f;
        --gold-soft: #f2dc9a;
        --text: #fff7df;

      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #000;
        color: var(--text);

      .stage {
        width: min(100%, 430px);

      }
      .appbar {

        backdrop-filter: blur(12px);
      }
      .back {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid rgba(232, 199, 111, 0.35);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        font-size: 22px;
      }
      .brand { display: grid; justify-items: center; gap: 2px; }
      .brand strong {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        color: var(--gold-soft);
      }
      .brand span, .eyebrow, label, .small {
        font-size: 11px;
        font-weight: 800;
        color: var(--gold);
      }
      .scroll { height: calc(100vh - 72px); overflow-y: auto; padding: 0 20px 32px; }
      .hero {
        min-height: 370px;
        margin: 0 -20px;

          linear-gradient(180deg, rgba(0, 0, 0, 0.08), rgba(5, 4, 3, 0.88) 78%, var(--bg)),

      .hero h1 { margin: 8px 0 10px; font-size: 32px; line-height: 1.15; }
      .hero p, .panel p, .report-head p { margin: 0; color: var(--muted); line-height: 1.65; font-size: 14px; }

      input, select, textarea {

  <body>
    <main class="stage" data-umsh-chrome data-service="相手の気持ち" data-price="9,900 KRW">
      <header class="appbar">
        <button class="back" type="button" data-back aria-label="戻る">‹</button>
        <div class="brand"><strong>運命商会</strong><span>相手の気持ち</span></div>
        <span class="small">9,900 KRW</span>
      </header>

      <div class="scroll">
        <section class="hero">
          <span class="eyebrow">LOVE · 相手の心</span>
          <h1>その人も<br />私を思うだろうか？</h1>
          <p>相性の結果と最近の連絡の流れを一緒に見よう。気持ちを推測せず、確認する基準から見ていく。</p>
        </section>
        <div class="public-detail" data-public-detail data-service-public-detail></div>

        <section class="panel" data-screen="auth">
          <span class="eyebrow">運命商会</span>
          <h2>共通ログインに接続中</h2>
          <p>運命商会のログイン画面で認証すると、相手の気持ちの解説を続ける。</p>
          <div class="status hidden" data-auth-status></div>
        </section>

        <section class="panel hidden" data-screen="profile">
          <span class="eyebrow">PROFILE</span>
          <h2>四柱推命プロフィールを登録</h2>
          <p>関係の流れを見るには、まず自分の基本の四柱情報が必要です。</p>
          <form data-profile-form>
            <div class="field">
              <label for="name">名前</label>
              <input id="name" name="name" autocomplete="name" placeholder="ホン・ギルドン" />
              <div class="error" data-error-for="name"></div>
            </div>
            <div class="field-row">
              <div class="field"><label for="gender">性別</label><select id="gender" name="gender"><option value="male">男性</option><option value="female">女性</option></select></div>
              <div class="field"><label for="calendar">カレンダー</label><select id="calendar" name="calendar"><option value="solar">陽暦</option><option value="lunar">陰暦</option></select></div>
            </div>
            <div class="field">
              <label for="birth">生年月日</label>
              <input id="birth" name="birth" inputmode="numeric" maxlength="8" placeholder="YYYYMMDD" />
              <div class="error" data-error-for="birth"></div>
            </div>
            <div class="actions"><button class="btn" type="button" data-logout>ログアウト</button><button class="btn primary" type="submit">登録</button></div>
          </form>
        </section>

        <section class="panel hidden" data-screen="form">
          <span class="eyebrow">LOVE · MIND</span>
          <h2>今の二人の流れはどう？</h2>
          <p data-profile-summary></p>
          <form data-mind-form>
            <div class="field"><label for="relationshipStage">今の関係</label><select id="relationshipStage" name="relationshipStage"><option value="썸·연락 중">曖昧な恋・連絡中</option><option value="호감은 있지만 애매함">好意はあるが曖昧</option><option value="연애 중">交際中</option><option value="이별 후 거리 둠">別れた後、距離を置く</option><option value="친구에서 悩み">友達との関係で悩む</option></select></div>
            <div class="field"><label for="contactPattern">最近の連絡の流れ</label><select id="contactPattern" name="contactPattern"><option value="최근 연락이 줄었어요">最近連絡が減った</option><option value="답장은 오지만 먼저 오지 않아요">返信は来ますが、先には来ません</option><option value="가끔 뜬금없이 연락해요">時々突然連絡してくる</option><option value="서로 눈치는 보지만 말하지 않아요">お互いに気にしているけれど、言わない</option><option value="최근에 다툼이나 정리가 있었어요">最近、けんかや関係に区切りをつけることがあった</option></select></div>
            <div class="field"><label for="recentSignal">最近気になった相手のサイン</label><select id="recentSignal" name="recentSignal"><option value="읽고 답이 늦어요">読んでも返事が遅い。</option><option value="만나자는 말은 있어요">会おうとは言う</option><option value="SNS나 주변 반응이 보여요">SNSや周囲の反応が見えます</option><option value="대화가 끊겼어요">会話が途切れました</option><option value="상대가 선을 그었어요">相手が線を引いた</option></select></div>
            <div class="field"><label for="partnerName">相手の名前 <span class="hint">選択</span></label><input id="partnerName" name="partnerName" autocomplete="off" placeholder="名前が分かっていれば入力してください" /></div>
            <div class="field"><label for="partnerBirth">相手の生年月日 <span class="hint">任意 · 入れると相性をさらに細かく見られる</span></label><input id="partnerBirth" name="partnerBirth" inputmode="numeric" maxlength="8" placeholder="YYYYMMDD" /><div class="error" data-error-for="partnerBirth"></div></div>
            <div class="field-row">
              <div class="field"><label for="partnerGender">相手の性別</label><select id="partnerGender" name="partnerGender"><option value="female">女性</option><option value="male">男性</option></select></div>
              <div class="field"><label for="partnerCalendar">相手の暦</label><select id="partnerCalendar" name="partnerCalendar"><option value="solar">陽暦</option><option value="lunar">陰暦</option></select></div>
            </div>
            <div class="field"><label for="concern">今一番気になる点 <span class="hint">選択</span></label><textarea id="concern" name="concern" maxlength="160" placeholder="例: 連絡は来るが、気持ちがあるか分からない。"></textarea></div>
            <div class="actions"><button class="btn" type="button" data-reset-form>初期化</button><button class="btn primary" type="submit">この気持ちを確認</button></div>
          </form>
        </section>

        <section class="report-shell hidden" data-screen="report">
          <div class="report-head"><span class="eyebrow">LOVE · MIND REPORT</span><h2 data-report-title>相手の気持ちの解釈文</h2><p data-report-subtitle></p></div>
          <div class="toc-grid" data-category-list></div>
          <div class="chapter-list" data-chapter-list></div>
          <article class="panel reading" data-reading></article>
        </section>
      </div>
    </main>

    <script src="/js/umsh-chrome.js?v=20261008-three-voice-v1"></script>
    <script src="/js/umsh-auth-session.js"></script>
    <script src="/js/umsh-loading.js?v=20261008-three-voice-v1"></script>
    <script src="/js/umsh-progressive-report.js?v=20261008-three-voice-v1"></script>
    <script src="/js/service-step-url.js"></script>
    <script src="/js/service-public-detail.js?v=20261008-three-voice-v1"></script>
    <script>
      const $ = (selector, root = document) => root.querySelector(selector);
      const state = { supabase: null, session: null, authConfig: null, profile: null, report: null, category: '', sectionId: '', paidResumeStarted: false };
      const screens = { auth: $('[data-screen="auth"]'), profile: $('[data-screen="profile"]'), form: $('[data-screen="form"]'), report: $('[data-screen="report"]') };

      function showScreen(name) { $('[data-public-detail]')?.classList.add('hidden'); window.UMSHServiceSteps?.markByScreen(name); Object.entries(screens).forEach(([key, node]) => node.classList.toggle('hidden', key !== name)); }
      function showPublicDetail() {
        window.UMSHServiceDetail?.render();
        $('[data-public-detail]')?.classList.remove('hidden'); window.UMSHServiceSteps?.markStory();
        Object.values(screens).forEach((node) => node?.classList.add('hidden'));
      }

      async function ensureSessionAndContinue() {
        window.UMSHServiceSteps?.markAuth();
        await initAuth().catch((error) => {
          setStatus(error.message);
        });
        if (!state.session) openCommonLogin();
      }
      function setLoading(on, copy) {
        if (on) {
          window.UMSHLoading.show(copy || { title: '関係のサインと流れを整理しています', subtitle: '少々お待ちください。' });
        } else {
          window.UMSHLoading.hide();
        }
      }
      function setStatus(message) { const node = $('[data-auth-status]'); node.textContent = message || ''; node.classList.toggle('hidden', !message); }
      function authHeaders() { return state.session?.access_token ? { Authorization: `Bearer ${state.session.access_token}` } : {}; }
      function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]); }
      function openCommonLogin() {
        const returnTo = window.UMSHCommonAuth?.currentPageReturnTo() || `${location.pathname}${location.search}${location.hash}`;
        const url = window.UMSHCommonAuth?.commonLoginUrl('love-mind', returnTo) || `/signup?entry=love-mind&returnTo=${encodeURIComponent(returnTo)}#login`;
        location.replace(url);
      }
      async function api(path, options = {}) {
        const response = await (window.UMSHReportAccess ? window.UMSHReportAccess.fetch : fetch)(path, { ...options, headers: { 'Content-Type': 'application/json', ...authHeaders(), ...(options.headers || {}) } });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) { const error = new Error(payload.error || '依頼を処理できなかった。'); error.code = payload.code; error.paymentUrl = payload.paymentUrl; throw error; }
        return payload;
      }
      async function initAuth() {
        state.authConfig = await fetch('/api/auth/config').then((res) => res.json());
        if (!state.authConfig.enabled || !window.supabase || !window.UMSHAuthSession) {
          showScreen('profile');
          return;
        }
        state.supabase = window.UMSHAuthSession.createClient(window.supabase, state.authConfig.url, state.authConfig.publishableKey);
        const { data } = await state.supabase.auth.getSession();
        state.session = await window.UMSHAuthSession.enforceDeviceAuthSession(data.session, state.supabase);
        state.supabase.auth.onAuthStateChange((_event, session) => {
          window.UMSHAuthSession.enforceDeviceAuthSession(session, state.supabase)
            .then((nextSession) => {
              state.session = nextSession;
              routeAfterAuth();
            })
            .catch(() => {
              state.session = session || null;
              routeAfterAuth();
            });
        });
        routeAfterAuth();
      }
      async function routeAfterAuth() {
        if (!state.session) { showScreen('profile'); return; }
        setLoading(true);
        try {
          const payload = await api('/api/user/profile');
          state.profile = payload.profile;
          if (payload.complete || window.UMSHAuthSession?.isSharedProfileComplete(payload.profile)) { $('[data-profile-summary]').textContent = `${state.profile.name}の四柱推命と、今の関係の流れをあわせて見る。`; showScreen('form'); resumePaidRequest(); } else showScreen('profile');
        } catch (_error) { showScreen('profile'); }
        finally { setLoading(false); }
      }
      function validBirthText(value) {
        if (!/^\d{8}$/.test(value)) return false;
        const year = Number(value.slice(0, 4)); const month = Number(value.slice(4, 6)); const day = Number(value.slice(6, 8));
        const date = new Date(year, month - 1, day);
        return year >= 1900 && year <= new Date().getFullYear() && date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
      }
      function validateProfile(form) {
        const errors = {};
        if (!/^[가-힣]{2,5}$/.test(form.name.value.trim())) errors.name = '名前はハングルで2文字以上5文字以下にしてください。';
        if (!validBirthText(form.birth.value.trim())) errors.birth = '存在する日付と正常な年を入力して。';
        ['name', 'birth'].forEach((key) => { const input = $(`[name="${key}"]`, form); const error = $(`[data-error-for="${key}"]`); input.classList.toggle('is-error', Boolean(errors[key])); error.textContent = errors[key] || ''; });
        return Object.keys(errors).length === 0;
      }
      function validateMind(form) {
        const value = form.partnerBirth.value.trim();
        const error = $('[data-error-for="partnerBirth"]');
        const message = value && !validBirthText(value) ? '相手の生年月日は実在する日付を8桁の数字、YYYYMMDDで入力してください。' : '';
        form.partnerBirth.classList.toggle('is-error', Boolean(message)); error.textContent = message; return !message;
      }
      async function saveProfile(event) {
        event.preventDefault(); const form = event.currentTarget; if (!validateProfile(form)) return; await initAuth().catch(() => undefined); if (!state.session) { openCommonLogin(); return; } const birthText = form.birth.value.trim(); setLoading(true);
        try {
          const payload = await api('/api/user/profile', { method: 'POST', body: JSON.stringify({ name: form.name.value.trim(), birthTimeKnown: false, birth: { year: Number(birthText.slice(0, 4)), month: Number(birthText.slice(4, 6)), day: Number(birthText.slice(6, 8)), hour: 12, minute: 0, gender: form.gender.value, calendar: form.calendar.value } }) });
          state.profile = payload.profile; $('[data-profile-summary]').textContent = `${state.profile.name}の四柱推命と、今の関係の流れをあわせて見る。`; showScreen('form');
        } catch (error) { setStatus(error.message); } finally { setLoading(false); }
      }

      async function openProgressiveReport(payload) {
        const apply = (next) => {
          if (!next || !next.report) return;
          state.report = next.report;
          state.publicId = next.publicId || next.report.publicId || state.publicId || '';
          const sections = state.report.sections || [];
          if (!sections.length) return;
          const still = sections.find((section) => section.id === state.sectionId);
          if (!still) {
            state.category = sections[0].category;
            state.sectionId = sections[0].id;
          } else {
            state.category = still.category;
          }
          renderReport();
          showScreen('report');
        };
        setLoading(false);
        await window.UMSHProgressiveReport.followProgress({
          payload,
          fetchReport: (reportId) => api('/api/report/' + encodeURIComponent(reportId)),
          onUpdate: apply,
        });
      }

      async function generateReport(event) {
        event.preventDefault(); const form = event.currentTarget; if (!validateMind(form)) return; await initAuth().catch(() => undefined); if (!state.session) { openCommonLogin(); return; } const partnerBirthText = form.partnerBirth.value.trim();
        const requestBody = { partnerName: form.partnerName.value.trim(), partnerBirthText, partnerBirth: { gender: form.partnerGender.value, calendar: form.partnerCalendar.value }, partnerBirthTimeKnown: false, relationshipStage: form.relationshipStage.value, contactPattern: form.contactPattern.value, recentSignal: form.recentSignal.value, concern: form.concern.value.trim() };
        setLoading(true);
        try {
          const payload = await api('/api/love/mind/analyze', { method: 'POST', body: JSON.stringify(requestBody) });
          await openProgressiveReport(payload);
        } catch (error) { if (error.code === 'PROFILE_REQUIRED') showScreen('profile'); if (error.code === 'PAYMENT_REQUIRED') { window.UMSHPaymentBridge?.save('love_mind', requestBody, location.pathname); location.assign(error.paymentUrl || `/payment?product=love_mind&returnTo=${encodeURIComponent(location.pathname)}`); return; } setStatus(error.message); } finally { setLoading(false); }
      }
      async function resumePaidRequest() {
        if (state.paidResumeStarted || new URLSearchParams(location.search).get('paid') !== '1') return;
        const orderId = new URLSearchParams(location.search).get('orderId'); const pending = window.UMSHPaymentBridge?.load('love_mind');
        if (!orderId || !pending) return;
        state.paidResumeStarted = true; setLoading(true);
        try { const payload = await api('/api/love/mind/analyze', { method: 'POST', body: JSON.stringify({ ...pending.payload, orderId }) }); await openProgressiveReport(payload); window.UMSHPaymentBridge?.clear(); await api(`/api/payment/orders/${encodeURIComponent(orderId)}/viewed`, { method: 'POST' }).catch(() => {}); history.replaceState(null, '', location.pathname); } catch (error) { setStatus(error.message); } finally { setLoading(false); }
      }
      function sectionsByCategory(category) { return state.report.sections.filter((section) => section.category === category); }
      function renderReport() {
        $('[data-report-title]').textContent = state.report.title; $('[data-report-subtitle]').textContent = state.report.subtitle;
        const categories = Array.from(new Map(state.report.sections.map((section) => [section.category, section.categoryEn])).entries());
        $('[data-category-list]').innerHTML = categories.map(([category, categoryEn]) => `<button class="toc-card ${category === state.category ? 'is-active' : ''}" type="button" data-category="${escapeHtml(category)}"><span>${escapeHtml(categoryEn)}</span><strong>${escapeHtml(category)}</strong></button>`).join('');
        renderChapters(); renderReading();
      }
      function renderChapters() {
        $('[data-chapter-list]').innerHTML = sectionsByCategory(state.category).map((section, index) => `<button class="chapter-card ${section.id === state.sectionId ? 'is-active' : ''} ${window.UMSHProgressiveReport.chapterStatusClass(section)}" type="button" data-section-id="${escapeHtml(section.id)}"><b>${String(index + 1).padStart(2, '0')}</b><strong>${escapeHtml(section.classification)}</strong></button>`).join('');
      }
      function renderReading() {
        const section = state.report.sections.find((item) => item.id === state.sectionId) || state.report.sections[0]; const index = state.report.sections.findIndex((item) => item.id === section.id);
        const body = window.UMSHProgressiveReport.sectionReady(section)
          ? `<p class="reading-hook">${escapeHtml(section.hook)}</p><pre>${escapeHtml(section.interpretation)}</pre>`
          : window.UMSHProgressiveReport.readingPlaceholder(section);
        $('[data-reading]').innerHTML = `\x3cimg src="${escapeHtml(section.imageSrc)}" alt="${escapeHtml(section.imageAlt)}" />\x3cspan class="eyebrow">${escapeHtml(section.categoryEn)} · ${index + 1}/${state.report.sections.length}\x3c/span>\x3ch3>${escapeHtml(section.classification)}\x3c/h3>${body}\x3cdiv class="pager">\x3cbutton class="btn" type="button" data-prev ${index <= 0 ? 'disabled' : ''}>前へ\x3c/button>\x3cbutton class="btn primary" type="button" data-next ${index >= state.report.sections.length - 1 ? 'disabled' : ''}>次へ\x3c/button>\x3c/div>`;
      }
      function moveSection(delta) { const index = state.report.sections.findIndex((section) => section.id === state.sectionId); const next = state.report.sections[index + delta]; if (!next) return; state.category = next.category; state.sectionId = next.id; renderReport(); }
      document.addEventListener('click', async (event) => {
        const category = event.target.closest('[data-category]');
        if (category && state.report) { state.category = category.dataset.category; state.sectionId = sectionsByCategory(state.category)[0].id; renderReport(); }
        const sectionButton = event.target.closest('[data-section-id]');
        if (sectionButton) { state.sectionId = sectionButton.dataset.sectionId; renderChapters(); renderReading(); }
        if (event.target.closest('[data-prev]')) moveSection(-1);
        if (event.target.closest('[data-next]')) moveSection(1);
        if (event.target.closest('[data-start-report]')) { event.preventDefault(); await ensureSessionAndContinue(); }
        if (event.target.closest('[data-back]')) history.length > 1 ? history.back() : location.assign('/');
        if (event.target.closest('[data-logout]') && state.supabase) { await state.supabase.auth.signOut(); state.session = null; openCommonLogin(); }
        if (event.target.closest('[data-reset-form]')) $('[data-mind-form]').reset();
      });
      $('[data-profile-form]').addEventListener('submit', saveProfile);
      $('[data-mind-form]').addEventListener('submit', generateReport);
      showPublicDetail(); if (window.UMSHServiceSteps?.isAuthStep()) ensureSessionAndContinue();
    </script>
  </body>
</html>

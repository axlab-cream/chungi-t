    @media (min-width: 720px) {

      /* Shared UMSH chrome: keep the fixed bottom nav from covering the page tail.
         The shell publishes its measured height in --umsh-chrome-bottom-h, but that
         measurement can land before layout settles and report far less than the nav's
         real 74px, so the floor keeps the reserve honest either way. */
      body.umsh-has-chrome .phone { padding-bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }
      /* The story hero filled the viewport minus the design's own 64px bar. It now shares the

      body.umsh-has-chrome #step-1-story .hero { min-height: 62svh; }
      body.umsh-has-chrome .composer { bottom: calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px)); }

        id: "marry-section-10",
        title: "MZ型の結果ラベル。",
        subtitle: "一目で見る関係指標",
        hero: "../assets/marry/06-marry-section-10-hero.webp",
        hero_alt: "抽象的な関係指標の光を一緒に見るカップルの、漫画調の詳細画像",
        evidence_ids: ["item-10-p1-0004", "item-19-p1-0003", "zip-궁합-qa-000369"],
        fact_labels: ["関係の温度", "公式化する余地", "現実生活の相性", "感情の消耗"],
        base_conclusion: "簡単に言うと、結果のラベルは、長い鑑定を読む前に、今の関係の状態を手早くつかむための要約だ。",
        reality: ["結婚の見込みの温度は、気持ちの大きさより現実の話ができるかに近い。", "長期恋愛の持続力は、繰り返す衝突から立て直す方法に表れる。", "感情の消耗の警告は、悪いという判定ではなく、今減らす疲れのポイントです。"],
        conditions: ["要約", "優先順位", "次の項目"],
        actions: ["ラベルを見て、最も低く感じる一項目から詳しく見て。", "相手にすぐ見せるより、自分の基準を先に整理せよ。", "速度調整の知らせが立つ感じなら、会話の主題を一つに減らせ。"],
        cautions: ["ラベルは楽しく読むためで、人や関係を一語で固定するものではありません。", "高いラベルが見えても、お金、家族、生活の会話は別に確認する必要がある。"],
        items: [
          ["marry-10-01", "結婚への温度", "今の関係が、現実的な話をどこまでできる準備が整っているかを見る。"],
          ["marry-10-02", "安心感のレベル", "相手と一緒にいるとき、心が落ち着く度合いを見る。"],
          ["marry-10-03", "速さを調整する通知", "今はさらに押すより、速度を合わせるべき信号を確認する。"],
        ],
      },
    ];

    const elements = {
      root: document.querySelector("#detail-root"),
      groupChip: document.querySelector("#group-chip"),
      sectionChip: document.querySelector("#section-chip"),
      accessChip: document.querySelector("#access-chip"),
      form: document.querySelector("#detail-form"),
      message: document.querySelector("#detail-message"),
      toast: document.querySelector("#toast"),
    };

    const state = {
      access: "missing",
      sectionId: "",
      toastTimer: 0,
    };

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function readJson(key, fallback = null) {
      try {
        const value = sessionStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function writeJson(key, value) {
      sessionStorage.setItem(key, JSON.stringify(value));
    }

    function flattenSections() {
      return groups.flatMap((group, groupIndex) => group.items.map(([section_id, title, preview], itemIndex) => ({
        group,
        group_index: groupIndex,
        section_id,
        title,
        preview,
        order: itemIndex + 1,
        absolute_order: groups.slice(0, groupIndex).reduce((sum, item) => sum + item.items.length, 0) + itemIndex + 1,
        evidence_ids: group.evidence_ids,
        calculated_fact_keys: group.fact_labels,
      })));
    }

    function routeFor(sectionId) {
      return `index.html?section=${encodeURIComponent(sectionId)}#step-6_1-report`;
    }

    function listRoute() {
      return "../05-step-5-chat/chat.html#step-5-chat";
    }

    function resolveSection() {
      const query = new URLSearchParams(location.search).get("section") || "";
      const stored = readJson(storageKeys.selectedSection, null);
      return query || stored?.section_id || "";
    }

    function currentRecord() {
      const sectionId = state.sectionId;
      return flattenSections().find((item) => item.section_id === sectionId) || null;
    }

    function neighbors(record) {
      const flat = flattenSections();
      const index = flat.findIndex((item) => item.section_id === record?.section_id);
      return {
        previous: index > 0 ? flat[index - 1] : null,
        next: index >= 0 && index < flat.length - 1 ? flat[index + 1] : null,
      };
    }

    function related(record) {
      const sameGroup = record.group.items
        .map(([section_id, title, preview]) => ({ section_id, title, preview }))
        .filter((item) => item.section_id !== record.section_id)
        .slice(0, 2);
      const nav = neighbors(record);
      return [nav.previous, nav.next, ...sameGroup].filter(Boolean).slice(0, 3);
    }

    function resolveAccess() {
      const record = currentRecord();
      const context = readJson(storageKeys.reportContext, null);
      const input = readJson(storageKeys.input, null);
      const queryReportId = new URLSearchParams(location.search).get("reportId") || "";
      const accessState = sessionStorage.getItem(storageKeys.accessState) || "";
      const paymentState = sessionStorage.getItem(storageKeys.paymentState) || "";
      const networkState = sessionStorage.getItem(storageKeys.networkState) || "";
      const generationState = sessionStorage.getItem(storageKeys.generationState) || "";

      if (!record) return "invalid";
      if (!context && !input) return "expired";
      if (!context?.report_id) return "missing";
      if (context.service_key && context.service_key !== service.service_key) return "wrong";
      if (queryReportId && queryReportId !== context.report_id) return "wrong";
      if (networkState === "error") return "network_error";
      if (generationState === "generating") return "generating";
      if (accessState === "entitled" || paymentState === "paid") return "entitled";
      return "locked";
    }

    function showToast(message) {
      clearTimeout(state.toastTimer);
      elements.toast.textContent = message;
      elements.toast.classList.add("is-open");
      state.toastTimer = setTimeout(() => {
        elements.toast.classList.remove("is-open");
      }, 2600);
    }

    function inputSummary() {
      const input = readJson(storageKeys.input, null);
      if (!input) return "入力をつなぎ直すと個別化の基準が埋まります。";
      const selfName = input.self?.name || "自分";
      const partnerName = input.partner?.known ? input.partner?.name || "相手" : "相手";
      const partnerMode = input.partner?.known ? `${partnerName} 정보 포함` : "상대 정보 없이 質問 중심";
      return `${selfName}を基準に · ${partnerMode}`;
    }

    function conclusionFor(record) {
      const title = record.title;
      if (record.group.id === "marry-section-04") return `簡単に言うと、${title}は、気持ちの大きさより、現実的な話をどこまでできるかを見る項目だ。今は答えを迫るより、小さな条件を話して反応を確認するほうが合う。`;
      if (record.group.id === "marry-section-05") return `結論から言うと、${title}は良い日を当てる問題ではなく、関係を負担なく正式にできる区間を探す項目だ。話すときと待つときを分けることが要点だ。`;
      if (record.group.id === "marry-section-06") return `結論から言うと、${title}は危険の判定ではなく、繰り返す前に話すべきサインを確認する項目。感情のせいにするより、行動基準を作るほうがいい。`;
      if (record.group.id === "marry-section-09") return `結論からいうと、${title}は相手を試す言葉より、関係を次の会話につなぐ一文を探す項目だ。今日そのまま使いつつ、圧力は減らす方向が合う。`;
      return `${record.group.base_conclusion} 今回の項目${title}は、その中でも今の関係ですぐ確かめる合図に絞って読む。`;
    }

    function timingCopy(record) {
      if (record.group.id === "marry-section-05") return "時期の見立ては、今年の流れ、大運の区間、両家の日程など、現実の条件もあわせて整うと意味が大きくなる。";
      if (record.group.id === "marry-section-04") return "結婚の話は、雰囲気が良いときより、現実の条件を出しても関係が揺れにくいときに始める方がいい。";
      if (record.group.id === "marry-section-06") return "同じ問題が二度以上繰り返すなら、流すより会話の仕方と基準を見直す時です。";
      if (record.group.id === "marry-section-08") return "不安が増す日は、すぐ決めず、感情と事実を分けて会話の時間を決めるほうが安定する。";
      return "今の資料だけで日付や強さを断定するより、今週確認する行動と、1か月を通して繰り返すサインを分けて見るとよい。";
    }

    function renderGate(record) {
      const stateCopy = {
        locked: ["상세 풀이는 결제 권한 확인 후 열려요", "목차와 항목명은 볼 수 있지만, 개인화된 본문과 시각 자료는 주문 확인 뒤 열립니다."],
        missing: ["연결된 리포트를 찾지 못했어요", "戻る 단계에서 만든 결과를 먼저 연결해야 이 항목의 상세 풀이가 열립니다."],
        expired: ["입력 정보가 만료됐어요", "새 분석으로 두 사람 기준을 다시 연결하면 상세 풀이를 이어볼 수 있습니다."],
        generating: ["상세 풀이를 준비하는 중이에요", "중복 결제 없이 생성 상태를 복원합니다. 잠시 뒤 다시 확인해 주세요."],
        network_error: ["연결이 잠시 불안정해요", "一覧へ 돌아가도 선택 항목은 유지됩니다. 다시 확인하면 접근 상태를 새로 맞춥니다."],
        wrong: ["현재 사용자 권한과 맞지 않는 리포트예요", "다른 리포트 식별자로 들어온 경우 상세 내용을 열지 않습니다."],
        invalid: ["목록에 없는 항목이에요", "05 결과 목록에 있는 중分類를 선택하면 상세 풀이가 열립니다."],
      }[state.access] || ["詳しい鑑定を開けない", "一覧から項目を選び直してください。"];

      return `
        <section class="panel locked">
          <span class="eyebrow">${escapeHtml(record?.group?.title || "詳細の状態")}</span>
          <h1>${escapeHtml(stateCopy[0])}</h1>
          <p>${escapeHtml(stateCopy[1])}</p>
          ${record ? `\x3cp>選んだ項目：${escapeHtml(record.title)}\x3c/p>` : ""}
          <div class="locked-actions">
            <a class="primary-button" href="../04-step-4-report/index.html#step-4-report">支払い画面へ</a>
            <a class="secondary-button" href="${listRoute()}">一覧へ</a>
          </div>
        </section>
      `;
    }

    function renderBasis(record) {
      const rows = [
        ["選択した項目", `${record.group.title} > ${record.title}`],
        ["入力の基準", inputSummary()],
        ["解説の基準", record.group.fact_labels.join(", ")],
        ["解釈の方法", "断定より可能性・条件・今する行動の順で読みます。"],
      ];
      return `
        \x3csection class="panel">
          \x3cdiv class="panel-head">
            \x3ch2>確認した基準\x3c/h2>
            \x3cspan>根拠のつながり\x3c/span>
          \x3c/div>
          \x3cdiv class="basis-grid">
            ${rows.map(([label, value]) => `
              <div class="basis-row">
                <strong>${escapeHtml(label)}</strong>
                <span>${escapeHtml(value)}</span>
              </div>
            `).join("")}
          \x3c/div>
        \x3c/section>
      `;
    }

    function renderReality(record) {
      return `
        <section class="panel">
          <div class="panel-head">
            <h2>現実で見える姿</h2>
            <span>見るポイント</span>
          </div>
          <div class="signal-list">
            ${record.group.reality.map((text, index) => `
              \x3carticle class="signal-card">
                \x3cstrong>${["먼저 보이는 신호", "반복되기 쉬운 장면", "결혼 전 확인할 지점"][index] || "確認する地点"}\x3c/strong>
                \x3cp>${escapeHtml(text)}\x3c/p>
              \x3c/article>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderConditions(record) {
      return `
        <section class="panel">
          <div class="panel-head">
            <h2>時期・強弱・条件</h2>
            <span>点数ではない</span>
          </div>
          <p class="body-copy">${escapeHtml(timingCopy(record))}</p>
          <div class="condition-grid">
            ${record.group.conditions.map((label, index) => `
              \x3cdiv class="condition">
                \x3ci aria-hidden="true">\x3c/i>
                \x3cstrong>${escapeHtml(label)}\x3c/strong>
                \x3cspan>${escapeHtml(["지금 확인", "대화로 조정", "반복 관찰"][index] || "観察")}\x3c/span>
              \x3c/div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderActions(record) {
      return `
        \x3csection class="panel">
          \x3cdiv class="panel-head">
            \x3ch2>今日・今週の行動\x3c/h2>
            \x3cspan>実行の基準\x3c/span>
          \x3c/div>
          \x3cul class="action-list">
            ${record.group.actions.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
          \x3c/ul>
        \x3c/section>
      `;
    }

    function renderCautions(record) {
      return `
        \x3csection class="panel">
          \x3cdiv class="panel-head">
            \x3ch2>気をつけたい選択\x3c/h2>
            \x3cspan>速さを調整\x3c/span>
          \x3c/div>
          \x3cul class="caution-list">
            ${record.group.cautions.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
          \x3c/ul>
        \x3c/section>
      `;
    }

    function renderRelated(record) {
      const nav = neighbors(record);
      const relatedItems = related(record);
      return `
        \x3csection class="panel">
          \x3cdiv class="panel-head">
            \x3ch2>関連項目\x3c/h2>
            \x3cspan>${record.absolute_order} / ${flattenSections().length}\x3c/span>
          \x3c/div>
          \x3cdiv class="related-grid">
            ${relatedItems.map((item) => `
              <a class="related-link" href="${routeFor(item.section_id)}" data-related-section="${escapeHtml(item.section_id)}">
                <span>
                  <strong>${escapeHtml(item.title)}</strong>
                  <span>${escapeHtml(item.preview)}</span>
                </span>
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </a>
            `).join("")}
          \x3c/div>
          \x3cdiv class="nav-controls">
            \x3cbutton class="nav-button" type="button" data-nav-section="${nav.previous ? escapeHtml(nav.previous.section_id) : ""}" ${nav.previous ? "" : "disabled"}>前の項目\x3c/button>
            \x3cbutton class="nav-button" type="button" data-nav-section="${nav.next ? escapeHtml(nav.next.section_id) : ""}" ${nav.next ? "" : "disabled"}>次の項目\x3c/button>
          \x3c/div>
        \x3c/section>
      `;
    }

    function renderDetail(record) {
      const conclusion = conclusionFor(record);
      return `
        \x3csection class="hero">
          \x3cimg src="${escapeHtml(record.group.hero)}" alt="${escapeHtml(record.group.hero_alt)}" />
          \x3cdiv class="hero-copy">
            \x3cspan class="eyebrow">${String(record.group_index + 1).padStart(2, "0")} · ${escapeHtml(record.group.title)}\x3c/span>
            \x3ch1>${escapeHtml(record.title)}\x3c/h1>
            \x3cp>${escapeHtml(conclusion)}\x3c/p>
          \x3c/div>
        \x3c/section>
        \x3csection class="panel">
          \x3cdiv class="panel-head">
            \x3ch2>一行の結論\x3c/h2>
            \x3cspan>先に答え\x3c/span>
          \x3c/div>
          \x3cdiv class="body-copy">
            \x3cp>${escapeHtml(conclusion)}\x3c/p>
            \x3cp>${escapeHtml(record.preview)}\x3c/p>
          \x3c/div>
        \x3c/section>
        ${renderBasis(record)}
        ${renderReality(record)}
        ${renderConditions(record)}
        ${renderActions(record)}
        ${renderCautions(record)}
        ${renderRelated(record)}
      `;
    }

    function updateChips(record) {
      elements.groupChip.textContent = record ? record.group.title : "大分類を確認";
      elements.sectionChip.textContent = record ? `${record.absolute_order}番の項目` : "中分類を確認";
      const labels = {
        entitled: "詳細が開いた",
        locked: "決済が必要",
        missing: "レポートなし",
        expired: "入力の期限切れ",
        generating: "準備中",
        network_error: "再試行が必要",
        wrong: "権限の不一致。",
        invalid: "항목 없음",
      };
      elements.accessChip.textContent = labels[state.access] || "権限の確認";
    }

    function persistSelection(record) {
      if (!record) return;
      writeJson(storageKeys.selectedSection, {
        service_key: service.service_key,
        service_slug: service.service_slug,
        section_id: record.section_id,
        section_title: record.title,
        group_id: record.group.id,
        group_title: record.group.title,
        selected_at: new Date().toISOString(),
      });
      const history = readJson(storageKeys.detailHistory, []);
      const next = [{ section_id: record.section_id, title: record.title, visited_at: new Date().toISOString() }, ...history.filter((item) => item.section_id !== record.section_id)].slice(0, 12);
      writeJson(storageKeys.detailHistory, next);
    }

    function navigateTo(sectionId) {
      if (!sectionId) return;
      state.sectionId = sectionId;
      const record = currentRecord();
      state.access = resolveAccess();
      persistSelection(record);
      history.replaceState(null, "", routeFor(sectionId));
      render();
      document.querySelector("#step-6_1-report")?.scrollIntoView({ block: "start" });
    }

    function render() {
      const record = currentRecord();
      updateChips(record);
      if (state.access !== "entitled") {
        elements.root.innerHTML = renderGate(record);
        return;
      }
      persistSelection(record);
      elements.root.innerHTML = renderDetail(record);
      elements.root.querySelectorAll("img").forEach((img) => {
        img.addEventListener("error", () => {
          img.alt = "詳細画像を読み込めなかった";
          img.style.opacity = "0.12";
        }, { once: true });
      });
    }

    document.querySelector("#btn-back").addEventListener("click", () => {
      window.location.href = listRoute();
    });

    document.querySelector("#btn-list").addEventListener("click", () => {
      window.location.href = listRoute();
    });

    elements.root.addEventListener("click", (event) => {
      const nav = event.target.closest("[data-nav-section], [data-related-section]");
      if (!nav) return;
      event.preventDefault();
      navigateTo(nav.dataset.navSection || nav.dataset.relatedSection);
    });

    elements.form.addEventListener("submit", (event) => {
      event.preventDefault();
      const record = currentRecord();
      const message = elements.message.value.trim();
      if (!record) {
        showToast("一覧から項目を先に選んでください。");
        return;
      }
      writeJson(storageKeys.followup, {
        service_key: service.service_key,
        service_slug: service.service_slug,
        section_id: record.section_id,
        section_title: record.title,
        message,
        created_at: new Date().toISOString(),
      });
      elements.message.value = "";
      if (state.access !== "entitled") {
        showToast("詳細の相談は、権限を確認してから続く。");
        return;
      }
      showToast("選択項目を基準に、相談の質問を保存した。");
    });

    state.sectionId = resolveSection();
    state.access = resolveAccess();
    render();
  </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script src="/js/umsh-auth-session.js?v=live-20260916t"></script>
    <script src="/js/payment-bridge.js"></script>
    <script src="/js/umsh-chrome.js?v=20261008-three-voice-v1"></script>
    <script src="/js/marry-service.js?v=20261014-unknown-time" defer></script>

    </section>

    <nav class="nav-footer hidden" id="nav-footer" aria-label="詳細項目の移動">
      <a href="../05-step-5-chat/chat.html#step-5-chat" id="nav-list" data-cat-shell="list">一覧</a>
      <a href="#" id="nav-prev" data-cat-shell="previous">前へ</a>
      <a href="#" class="primary" id="nav-next" data-cat-shell="next">次へ</a>
    </nav>
  </main>

  <script src="/js/cat-report-store.js"></script>
    <script>
    (() => {
      "use strict";

      if (window.CatDisplayLocale?.isActive() || new URLSearchParams(location.search).get('displayOnly') === '1') {
        // This template's entitlement query and detail-data.json are not authority.
        // Only the shared authenticated readonly display renderer may paint output.
        const pilotListUrl = () => {
          const value = "/match/cat/05-step-5-chat/chat.html" + location.search + "#step-5-chat";
          return window.CatDisplayLocale?.withPilotUrl(value) || value;
        };
        const pilotBrand = document.querySelector("#brand-link");
        if (pilotBrand) pilotBrand.href = pilotListUrl();
        document.querySelector("#btn-back")?.addEventListener("click", () => {
          location.assign(pilotListUrl());
        });
        document.querySelector("#btn-vault")?.addEventListener("click", () => {
          location.assign("/vault");
        });
        return;
      }

      const SERVICE = {
        key: "cat_compatibility",
        reportVersion: "cat-compatibility-v1",
        defaultSection: "guardian-dna",
        analysisPeriod: "current-12m"
      };

      const params = new URLSearchParams(location.search);
      const reportId = params.get("report_id") || params.get("reportId") || "";
      const profileId = params.get("profile_id") || params.get("profileId") || "";
      const sectionId = params.get("section") || SERVICE.defaultSection;
      const hasReportReference = Boolean(reportId || profileId);

      const els = {
        content: document.querySelector("#content"),
        context: document.querySelector("#context-label"),
        nav: document.querySelector("#nav-footer"),
        navList: document.querySelector("#nav-list"),
        navPrev: document.querySelector("#nav-prev"),
        navNext: document.querySelector("#nav-next"),
        brand: document.querySelector("#brand-link")
      };

      const ACCESS_COPY = {
        locked: {
          pill: "確認が必要",
          title: "詳しい鑑定は、決済の確認後に開く",
          copy: "一覧は見られますが、選んだ項目の本文は閲覧権限の確認後に表示します。",
          actions: [["9,900 KRWの決済を確認。", "payment", true], ["一覧へ", "list", false]]
        },
        no_report: {
          pill: "入力が必要",
          title: "つながるレポートが見つからなかった",
          copy: "新しい分析を始めるか、保管庫から既存の結果を開き直してください。",
          actions: [["新しい分析", "input", true], ["保管庫。", "vault", false]]
        },
        generating: {
          pill: "生成中",
          title: "詳しい読みはまだ準備している",
          copy: "分析が終われば、同じアドレスで選んだ項目を続けて見られる。",
          actions: [["一覧へ", "list", true], ["無料ティーザー", "step04", false]]
        },
        expired: {
          pill: "保管期限切れ",
          title: "保管期間が過ぎた結果だ",
          copy: "個人の入力をアドレス欄に載せず、新しい分析や保管一覧へ進む。",
          actions: [["新しい分析", "input", true], ["保管庫。", "vault", false]]
        },
        failed: {
          pill: "再試行",
          title: "詳細の結果が最後まで作られなかった",
          copy: "画面が止まったままにならず、再び始められるよう案内する。",
          actions: [["再試行", "input", true], ["無料ティーザー", "step04", false]]
        },
        forbidden: {
          pill: "権限なし",
          title: "このレポートの閲覧権限を確認できません",
          copy: "別のアカウントの結果かもしれないため、詳しい本文は開きません。",
          actions: [["保管庫。", "vault", true], ["新しい分析", "input", false]]
        },
        network: {
          pill: "接続を確認",
          title: "接続が一時的に不安定です",
          copy: "詳しい本文を開く前に、状態をもう一度確かめてください。",
          actions: [["一覧へ", "list", true], ["無料ティーザー", "step04", false]]
        }
      };

      function readAccessState() {
        const status = (params.get("status") || "").toLowerCase();
        if (status === "forbidden" || status === "owner_mismatch") return "forbidden";
        if (status === "expired") return "expired";
        if (status === "failed" || status === "analysis_failed") return "failed";
        if (status === "generating" || status === "loading") return "generating";
        if (status === "network_error") return "network";
        if (!hasReportReference) return "no_report";
        if (params.get("entitlement") === "verified") return "entitled";
        return "locked";
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function compact(value) {
        if (!value) return "接続前";
        return value.length > 18 ? `${value.slice(0, 9)}...${value.slice(-5)}` : value;
      }

      function withCommonParams(url, targetSection = sectionId) {
        url.searchParams.set("section", targetSection);
        url.searchParams.set("service_key", SERVICE.key);
        if (reportId) url.searchParams.set("report_id", reportId);
        if (profileId) url.searchParams.set("profile_id", profileId);
        if (params.get("entitlement") === "verified") url.searchParams.set("entitlement", "verified");
        url.searchParams.set("analysis_period", params.get("analysis_period") || SERVICE.analysisPeriod);
        url.searchParams.set("report_version", params.get("report_version") || SERVICE.reportVersion);
        return url;
      }

      function listUrl() {
        const url = withCommonParams(new URL("../05-step-5-chat/chat.html", location.href), sectionId);
        url.hash = "step-5-chat";
        return window.CatDisplayLocale?.withPilotUrl(url.toString()) || url.toString();
      }

      function step04Url(hash = "step-4-report") {
        const url = new URL("../04-step-4-report/index.html", location.href);
        url.searchParams.set("service_key", SERVICE.key);
        if (reportId) url.searchParams.set("report_id", reportId);
        if (profileId) url.searchParams.set("profile_id", profileId);
        url.searchParams.set("analysis_period", params.get("analysis_period") || SERVICE.analysisPeriod);
        url.searchParams.set("report_version", params.get("report_version") || SERVICE.reportVersion);
        url.hash = hash;
        return window.CatDisplayLocale?.withPilotUrl(url.toString()) || url.toString();
      }

      function inputUrl() {
        const url = new URL("../02-step-2-saju-input/index.html", location.href);
        url.hash = "step-2-saju-input";
        return window.CatDisplayLocale?.withPilotUrl(url.toString()) || url.toString();
      }

      function detailUrl(targetSection) {
        const url = withCommonParams(new URL("index.html", location.href), targetSection);
        url.hash = "step-6_1-report";
        return window.CatDisplayLocale?.withPilotUrl(url.toString()) || url.toString();
      }

      function actionUrl(action) {
        if (action === "input") return inputUrl();
        if (action === "vault") return step04Url("vault");
        if (action === "payment" || action === "step04") return step04Url();
        return listUrl();
      }

      function renderState(accessKey) {
        const copy = ACCESS_COPY[accessKey] || ACCESS_COPY.locked;
        els.nav.classList.add("hidden");
        els.content.innerHTML = `
          <section class="state-panel">
            <span class="state-pill">${escapeHtml(copy.pill)}</span>
            <h2>${escapeHtml(copy.title)}</h2>
            <p>${escapeHtml(copy.copy)}</p>
            <div class="state-actions">
              ${copy.actions.map(([label, action, primary]) => `
                <a class="${primary ? "primary" : ""}" href="${escapeHtml(actionUrl(action))}">${escapeHtml(label)}</a>
              `).join("")}
            </div>
          </section>
        `;
      }

      function renderNotFound(data) {
        els.nav.classList.add("hidden");
        els.content.innerHTML = `
          \x3csection class="state-panel">
            \x3cspan class="state-pill">項目確認\x3c/span>
            \x3ch2>一覧にない項目だ\x3c/h2>
            \x3cp>結果一覧から項目を選び直して。新しい項目を勝手に作って見せることはしない。\x3c/p>
            \x3cdiv class="state-actions">
              \x3ca class="primary" href="${escapeHtml(listUrl())}">一覧に戻る\x3c/a>
              \x3ca href="${escapeHtml(detailUrl(data.default_section_id || SERVICE.defaultSection))}">最初の項目を見る\x3c/a>
            \x3c/div>
          \x3c/section>
        `;
      }

      function listMarkup(items, className, markerPrefix = "") {
        return `
          <ul class="${className}">
            ${items.map((item, index) => `
              <li><span class="marker">${markerPrefix === "!" ? "!" : `${markerPrefix}${index + 1}`}</span><span>${escapeHtml(item)}</span></li>
            `).join("")}
          </ul>
        `;
      }

      function blockMarkup(block) {
        if (block.type === "flow") {
          return `
            \x3csection class="block">
              \x3cspan class="block-kicker">時期と条件\x3c/span>
              \x3ch2>${escapeHtml(block.title)}\x3c/h2>
              \x3cp>${escapeHtml(block.content)}\x3c/p>
              ${listMarkup(block.steps || [], "step-list")}
            \x3c/section>
          `;
        }
        if (block.type === "action") {
          return `
            \x3csection class="block">
              \x3cspan class="block-kicker">今日やること\x3c/span>
              \x3ch2>${escapeHtml(block.title)}\x3c/h2>
              \x3cp>${escapeHtml(block.content)}\x3c/p>
              ${listMarkup(block.actions || [], "action-list")}
            \x3c/section>
          `;
        }
        if (block.type === "caution") {
          return `
            \x3csection class="block">
              \x3cspan class="block-kicker">注意\x3c/span>
              \x3ch2>${escapeHtml(block.title)}\x3c/h2>
              \x3cp>${escapeHtml(block.content)}\x3c/p>
              ${listMarkup(block.cautions || [], "caution-list", "!")}
            \x3c/section>
          `;
        }
        return `
          \x3csection class="block">
            \x3cspan class="block-kicker">解釈\x3c/span>
            \x3ch2>${escapeHtml(block.title)}\x3c/h2>
            \x3cp>${escapeHtml(block.content)}\x3c/p>
          \x3c/section>
        `;
      }

      function renderDetail(data, detail) {
        document.title = `${detail.title} | 猫と私、本当に相性が合う？ | 運命商会`;
        els.context.textContent = `${detail.group_title} · ${compact(reportId)}`;
        els.brand.href = listUrl();
        const related = detail.related_sections || [];
        const previous = related.find((item) => item.relation === "戻る 항목") || related[0];
        const next = related.find((item) => item.relation === "다음 항목") || related[1] || related[0];
        els.navList.href = listUrl();
        els.navPrev.href = previous ? detailUrl(previous.section_id) : listUrl();
        els.navNext.href = next ? detailUrl(next.section_id) : listUrl();
        els.nav.classList.remove("hidden");

        els.content.innerHTML = `
          \x3carticle class="detail-hero">
            \x3cdiv class="hero-media">
              \x3cimg src="${escapeHtml(detail.image.filename)}" alt="${escapeHtml(detail.image.alt)}" loading="eager" />
            \x3c/div>
            \x3cdiv class="hero-copy">
              \x3cspan class="eyebrow">${escapeHtml(detail.gate)} · ${escapeHtml(detail.group_title)}\x3c/span>
              \x3ch1>${escapeHtml(detail.title)}\x3c/h1>
              \x3cp class="lead">${escapeHtml(detail.conclusion)}\x3c/p>
              \x3cdiv class="meta-grid" aria-label="詳細の基準">
                \x3cdiv>\x3cspan>分類\x3c/span>\x3cstrong>${escapeHtml(data.service.category)}\x3c/strong>\x3c/div>
                \x3cdiv>\x3cspan>流れ\x3c/span>\x3cstrong>現在~12か月\x3c/strong>\x3c/div>
                \x3cdiv>\x3cspan>基準\x3c/span>\x3cstrong>${escapeHtml(detail.lens)}\x3c/strong>\x3c/div>
              \x3c/div>
            \x3c/div>
          \x3c/article>

          \x3cdiv class="block-stack">
            \x3csection class="block">
              \x3cspan class="block-kicker">読み解きの基準\x3c/span>
              \x3ch2>何を見て読んだか\x3c/h2>
              \x3cp>猫の生年月日時がない、または不明確な場合も考慮し、飼い主の四柱推命、猫の行動プロフィール、生活のルーティン、空間の条件を合わせて見ます。\x3c/p>
              ${listMarkup(detail.basis_summary.basis || [], "basis-list")}
            \x3c/section>
            ${detail.interpretation_blocks.map(blockMarkup).join("")}
          \x3c/div>

          \x3csection class="related-panel">
            \x3cspan class="block-kicker">関連項目\x3c/span>
            \x3ch2>続けて読むといい章\x3c/h2>
            \x3cp>同じレポート内で流れが続く項目。\x3c/p>
            \x3cdiv class="related-list">
              ${related.map((item) => `
                <a class="related-link" href="${escapeHtml(detailUrl(item.section_id))}">
                  <span><span>${escapeHtml(item.relation)}</span><strong>${escapeHtml(item.title)}</strong></span>
                  <span aria-hidden="true">›</span>
                </a>
              `).join("")}
            \x3c/div>
          \x3c/section>
        `;
      }

      async function loadDetail() {
        const access = readAccessState();
        if (access !== "entitled") {
          renderState(access);
          return;
        }

        try {
          const response = await fetch("detail-data.json", { cache: "no-store" });
          if (!response.ok) throw new Error("detail data missing");
          const data = await response.json();
          const detail = data.details.find((entry) => entry.section_id === sectionId);
          if (!detail) {
            renderNotFound(data);
            return;
          }
          renderDetail(data, detail);
        } catch (error) {
          renderState("network");
        }
      }

      document.querySelector("#btn-back").addEventListener("click", () => {
        location.href = listUrl();
      });

      document.querySelector("#btn-vault").addEventListener("click", () => {
        location.href = step04Url("vault");
      });

      document.addEventListener("error", (event) => {
        if (event.target instanceof HTMLImageElement) {
          event.target.dataset.broken = "true";
          event.target.alt = event.target.alt || "画像は読み込めなかったが、詳細の解説は続けて見られる。";
        }
      }, true);

      loadDetail();
    })();
  </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

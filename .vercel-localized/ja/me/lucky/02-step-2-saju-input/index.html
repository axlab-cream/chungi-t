er. */body.umsh-has-chrome .phone{overflow:clip}body.umsh-has-chrome{padding-bottom:calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px))}/* The shared bottom nav is fixed over the page, so the page's own sticky bars sit on top of it rather than under it. */body.umsh-has-chrome .sticky-cta,body.umsh-has-chrome .cta,body.umsh-has-chrome .composer{bottom:calc(max(74px, var(--umsh-chrome-bottom-h, 74px)) + env(safe-area-inset-bottom, 0px))}/* The page's own brand bar repeats the shared app bar's service name and price, so it goes away under the chrome. The bars that carry navigation stay, but stick to the top edge - the app bar scrolls away, and a bar hanging at its old height reads as a stray layer. */body.umsh-has-chrome .brand{display:none}body.umsh-has-chrome #step-5-chat > header,body.umsh-has-chrome .nav{top:0}/* The chrome injects a <footer> whose tabs are <button>s. The design styles those elements bare, which collapsed the bottom menu to an empty band, so the chrome gets its own box back. */body.umsh-has-chrome .umsh-service-bottom footer,body.umsh-has-chrome .umsh-service-bottom header,body.umsh-has-chrome .umsh-service-shell footer,body.umsh-has-chrome .umsh-service-shell header{margin:0;padding:0;color:inherit;font-size:inherit;line-height:normal;position:static}body.umsh-has-chrome .umsh-service-bottom button,body.umsh-has-chrome .umsh-service-shell button{width:auto;min-height:0;border-radius:0;background:transparent;font-size:inherit}body.umsh-has-chrome .umsh-service-bottom p,body.umsh-has-chrome .umsh-service-shell p{margin:0;color:inherit;font-size:inherit;line-height:normal}</style><link rel="stylesheet" href="/css/umsh-field.css?v=20260916-ymd3" /></head><body class="umsh-fields"><main class="phone" data-umsh-chrome data-service="私に運が寄る色と物" data-price="4,900 KRW" data-active="home" aria-label="自分を後押しする色と物の入力" id="step-2-saju-input"><header><div class="visual"><img src="../assets/lucky/02-scene-01-empathy.webp" alt="明るい部屋で鞄の小物を選ぶ人物の写真"></div><h1>色を選ぶ前に、<br>基本情報から見よう。</h1><p>共通の命式情報を入れるだけでよい。色や物を見るための追加アンケートは必要ないです。</p></header><form id="sajuForm" novalidate><fieldset><legend>共通の四柱入力</legend><label for="name">呼び方</label><input id="name" name="name" autocomplete="name" placeholder="例：ニックネームまたは名前"><div class="hint">レポートで呼ぶときだけ使って。</div><div class="row"><div><label for="birth">生年月日</label><input id="birth" name="birth" type="date" required></div><div><label for="time">出生時刻</label><input id="time" name="time" type="time"><label class="birth-time-unknown" style="display:flex;align-items:center;gap:8px;min-height:44px"><input id="birthTimeUnknown" type="checkbox" style="width:20px;height:20px;min-height:20px;padding:0">出生時刻はわからない</label></div></div><div class="hint">任意です。不明なら「出生時刻はわからない」を選んでください。推測で入力する必要はありません。わかる場合は、時刻に基づく詳しい項目も見られます。不明な場合、その項目は省きます。</div><div class="row"><div><label for="calendar">暦の基準</label><select id="calendar" name="calendar" required><option value="">選択</option><option value="solar">陽暦</option><option value="lunar">陰暦</option></select></div><div><label for="gender">性別の表示</label><select id="gender" name="gender"><option value="">未選択</option><option value="female">女性</option><option value="male">男性</option></select></div></div><div class="error" id="error">生年月日と暦の基準から確認してください。</div></fieldset><section class="panel"><p>このサービスはアカウントに保存された生年月日情報を使います。ここでの変更はアカウントには保存されません。 <a href="/profile?returnTo=%2Fme%2Flucky%2F02-step-2-saju-input%2Findex.html">アカウントの生年月日情報を確認・変更</a></p><p class="note">健康、投資、法律、採用の結果を判断する用途には使いません。</p></section><button type="submit">自分に合う色を確認</button></form></main><script>document.getElementById("sajuForm").addEventListener("submit",(event)=>{event.preventDefault();const form=event.currentTarget;const ok=form.birth.value&&form.calendar.value&&(document.getElementById("birthTimeUnknown").checked||/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(form.time.value));if(!ok){document.getElementById("error").style.display="block";return}location.href="../04-step-4-report/index.html#step-4-report"});</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/js/common-auth-return.js"></script><script src="/js/umsh-auth-session.js"></script><script src="/js/payment-bridge.js"></script><script src="/js/umsh-chrome.js?v=20261008-three-voice-v1"></script><script src="/js/lucky-service.js?v=20261014-unknown-time" defer></script><script>(()=>{const time=document.getElementById('time'),unknown=document.getElementById('birthTimeUnknown');unknown.addEventListener('change',()=>{time.disabled=unknown.checked;if(unknown.checked)time.value='';});})();</script></body></html>

        margin-top: 12px;
        padding: 7px;
        border: 1px solid rgba(255, 209, 137, 0.25);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 218, 154, 0.2), transparent 28%),
          linear-gradient(315deg, rgba(255, 218, 154, 0.14), transparent 26%),
          rgba(47, 9, 7, 0.9);
        box-shadow:
          0 18px 36px rgba(0, 0, 0, 0.44),
          inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .cta-frame::before,
      .cta-frame::after {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 222, 169, 0.82), transparent);
      }

      .cta-frame::before {
        top: 7px;
      }

      .cta-frame::after {
        bottom: 7px;
      }

      .primary-cta {
        width: 100%;
        min-height: 76px;
        border-radius: 6px;
        border: 1px solid rgba(255, 225, 168, 0.34);
        background: linear-gradient(180deg, #a22b20, #65120e);
        color: #fff8e8;
        font-size: clamp(21px, 6.5vw, 30px);
        font-weight: 950;
        letter-spacing: 0;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
      }

      .skip {
        align-self: center;
        margin-top: 14px;
        background: transparent;
        color: rgba(255, 248, 239, 0.84);
        font-size: 13px;
        font-weight: 800;
      }

      .panel {
        width: 100%;
        max-height: calc(100svh - 92px);
        overflow: auto;
        scrollbar-width: none;
        padding: 22px;
        border: 1px solid rgba(255, 227, 184, 0.18);
        border-radius: 18px;
        background: #100a0a;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
        animation: rise 260ms ease both;
      }

      .phone[data-scene="input"] .panel {
        border-color: rgba(255, 227, 184, 0.22);
        background:
          linear-gradient(180deg, rgba(16, 10, 10, 0.24), rgba(8, 4, 4, 0.12)),
          rgba(7, 4, 4, 0.08);
        box-shadow:
          0 18px 58px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(4px);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.22;
        letter-spacing: 0;
      }

      .panel p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .choices.single {
        grid-template-columns: 1fr;
      }

      .choice,
      .ghost,
      .next-cta {
        min-height: 54px;
        border-radius: 8px;
        font-weight: 850;
      }

      .choice {
        border: 1px solid rgba(255, 226, 175, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        transition:
          border-color 180ms ease,
          background 180ms ease,
          transform 180ms ease;
      }

      .choice:active {
        transform: translateY(1px);
      }

      .choice.is-selected {
        border-color: rgba(242, 191, 107, 0.72);
        background: rgba(184, 50, 36, 0.34);
        transform: translateY(-2px);
      }

      .field-grid {
        display: grid;
        gap: 10px;
      }

      .phone[data-step="name"] .field-grid {
        margin-bottom: 16px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field label {
        color: rgba(255, 247, 236, 0.72);
        font-size: 12px;
        font-weight: 850;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 50px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--ink);
        padding: 0 14px;
        outline: none;
      }

      .phone[data-scene="input"] .field input,
      .phone[data-scene="input"] .field select {
        border-color: rgba(255, 226, 175, 0.28);
        background: rgba(15, 10, 10, 0.18);
        box-shadow: inset 0 1px 10px rgba(0, 0, 0, 0.2);
      }

      .field input:focus,
      .field select:focus {
        border-color: rgba(242, 191, 107, 0.78);
        box-shadow: 0 0 0 3px rgba(242, 191, 107, 0.12);
      }

      .field input[aria-invalid="true"],
      .field select[aria-invalid="true"] {
        border-color: rgba(255, 78, 64, 0.86);
        box-shadow:
          0 0 0 3px rgba(255, 78, 64, 0.14),
          inset 0 1px 10px rgba(0, 0, 0, 0.2);
      }

      .field-error {
        min-height: 18px;
        color: #ff5a4f;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.45;
      }

      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }

      .segmented button {
        min-height: 42px;
        border-radius: 999px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: var(--dim);
        font-weight: 850;
      }

      .segmented button[aria-pressed="true"] {
        border-color: rgba(242, 191, 107, 0.7);
        background: rgba(242, 191, 107, 0.16);
        color: var(--ink);
      }

      .actions {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      .ghost {
        border: 1px solid rgba(255, 226, 175, 0.16);
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
      }

      .phone[data-step="concern"] .ghost {
        border-color: rgba(255, 226, 175, 0.24);
        background: rgba(18, 12, 12, 0.24);
      }

      .next-cta {
        border: 1px solid rgba(255, 225, 168, 0.34);
        background: linear-gradient(180deg, #b83224, #73140f);
        color: #fff8e8;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        margin-bottom: 12px;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(242, 191, 107, 0.12);
        color: #ffd894;
        font-size: 12px;
        font-weight: 850;
      }

      .loader {
        display: grid;
        place-items: center;
        width: 100%;
        padding: 0 0 18vh;
      }

      .interpret-loader-card {
        width: min(100%, 340px);
        display: grid;
        gap: 16px;
        padding: 22px 18px 18px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 0%, rgba(170, 37, 27, 0.26), transparent 46%),
          linear-gradient(180deg, rgba(34, 8, 7, 0.88), rgba(5, 2, 2, 0.94));
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
        text-align: center;
      }

      .interpret-orb {
        position: relative;
        width: 74px;
        height: 74px;
        margin: 0 auto;
        border-radius: 50%;
        border: 1px solid rgba(242, 191, 107, 0.26);
        background:
          radial-gradient(circle at 50% 50%, rgba(242, 191, 107, 0.32), transparent 32%),
          radial-gradient(circle at 50% 50%, rgba(156, 25, 20, 0.46), transparent 58%),
          #080303;
      }

      .interpret-orb::before {
        content: "";
        position: absolute;
        inset: -5px;
        border-radius: inherit;
        border: 2px solid rgba(242, 191, 107, 0.14);
        border-top-color: #f2bf6b;
        border-right-color: rgba(203, 56, 38, 0.76);
        animation: spin 1.05s linear infinite;
      }

      .interpret-orb::after {
        content: "";
        position: absolute;
        inset: 24px;
        border-radius: inherit;
        background: #f2bf6b;
        box-shadow: 0 0 20px rgba(242, 191, 107, 0.86);
        animation: pulse-glow 1.4s ease-in-out infinite;
      }

      .interpret-loader-copy {
        display: grid;
        gap: 8px;
      }

      .interpret-loader-copy .line-pill {
        justify-self: center;
        margin: 0;
      }

      .interpret-loader-copy p {
        margin: 0;
        color: rgba(255, 239, 211, 0.72);
        font-size: 13px;
        font-weight: 800;
        line-height: 1.55;
      }

      .interpret-progress {
        position: relative;
        height: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 226, 175, 0.13);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
      }

      .interpret-progress::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 46%;
        border-radius: inherit;
        background:
          linear-gradient(90deg, transparent, rgba(255, 244, 214, 0.84), transparent),
          linear-gradient(90deg, #721812, #d44731 54%, #f2bf6b);
        box-shadow: 0 0 18px rgba(242, 191, 107, 0.42);
        animation: progress-scan 1.65s ease-in-out infinite;
      }

      .interpret-steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }

      .interpret-steps span {
        min-width: 0;
        padding: 7px 5px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.045);
        color: rgba(255, 232, 197, 0.74);
        font-size: 11px;
        font-weight: 900;
        line-height: 1.2;
      }

      .interpret-steps span:nth-child(2) {
        color: #ffe4af;
        animation: step-glow 1.65s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse-glow {
        50% {
          opacity: 0.55;
          transform: scale(0.78);
        }
      }

      @keyframes progress-scan {
        0% {
          transform: translateX(-105%);
        }
        52% {
          transform: translateX(92%);
        }
        100% {
          transform: translateX(190%);
        }
      }

      @keyframes step-glow {
        50% {
          border-color: rgba(242, 191, 107, 0.42);
          background: rgba(146, 31, 23, 0.26);
        }
      }

      .result-list {
        display: grid;
        gap: 10px;
        margin: 14px 0;
      }

      .result-item {
        padding: 14px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
      }

      .result-item strong {
        display: block;
        margin-bottom: 5px;
        color: #ffe0a8;
        font-size: 14px;
      }

      .result-item span {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .phone[data-step="todayResult"] > [data-umsh-service-top]:not(:empty) ~ header.topbar { display: none; }

      .phone[data-step="todayResult"] .stage {
        top: var(--umsh-chrome-appbar-h, 85px);
        bottom: calc(var(--umsh-chrome-bottom-h, 74px) + env(safe-area-inset-bottom));
        padding: 18px 16px 28px;
        background: #080807;
      }

      .today-result-card {
        display: grid;
        gap: 22px;
        width: 100%;
        min-width: 0;
        max-height: none;
        overflow: visible;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .today-result-card > h1,
      .today-title-row h1 {
        margin: 0;
        font-size: clamp(27px, 7.4vw, 32px);
        line-height: 1.35;
      }

      .today-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .today-title-row h1 { min-width: 0; flex: 1; }
      .today-total-score {
        flex: 0 0 94px;
        display: grid;
        justify-items: center;
        gap: 4px;
        padding: 12px 6px;
        border: 1px solid rgba(216, 186, 114, 0.5);
        border-radius: 18px;
        background: linear-gradient(145deg, #2a2315, #14120d);
        color: #e8d49a;
        font: 600 11px/1.5 var(--font-meta);
      }
      .today-total-score strong { font: 700 34px/1.1 var(--font-meta); font-variant-numeric: tabular-nums; }
      .today-total-score strong small { margin-left: 3px; font-size: 13px; }
      .today-result-card .today-score-caption { margin: -14px 0 0; color: #a39a8c; font: 11px/1.6 var(--font-meta); }
      .today-score-badge {
        flex: 0 0 auto;
        padding: 4px 9px;
        border: 1px solid rgba(216, 186, 114, 0.3);
        border-radius: 999px;
        background: rgba(216, 186, 114, 0.08);
        color: #f0dfad;
        font: 700 14px/1.5 var(--font-meta);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .today-result-card > .today-result-meta {
        margin: -10px 0 0;
        color: #a39a8c;
        font: 12px/1.6 var(--font-meta);
      }

      .today-pillar-card,
      .today-zodiac-card,
      .today-action-box {
        display: grid;
        gap: 10px;
        padding: 18px;
        border: 1px solid rgba(216, 186, 114, 0.24);
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(216, 186, 114, 0.1), rgba(216, 186, 114, 0.025)), #0c0b0a;
      }

      .today-pillar-card span,
      .today-reading-head > span,
      .today-zodiac-label {
        color: #d8ba72;
        font: 700 12px/1.5 var(--font-meta);
      }

      .today-pillar-card strong {
        color: #f0e2b8;
        font-size: 23px;
        line-height: 1.35;
      }

      .today-pillar-card small {
        color: #bdb4a6;
        font: 13px/1.65 var(--font-meta);
      }

      .today-reading-head { display: grid; gap: 10px; }

      .today-reading-head h2,
      .today-zodiac-card h2 {
        margin: 0;
        color: #f7f2e9;
        font-size: 21px;
        line-height: 1.45;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .today-result-card .today-reading-copy p {
        margin: 0;
        color: #d8d0c3;
        font: 400 15px/1.85 var(--font-meta);
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .today-result-card .today-reading-copy p + p { margin-top: 12px; }
      .today-reading-list { gap: 14px; margin: 0; }

      .today-reading-list .result-item {
        min-width: 0;
        padding: 18px;
        border-color: rgba(247, 242, 233, 0.1);
        border-radius: 14px;
        background: #0c0b0a;
      }

      .today-item-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
      .today-item-head strong { min-width: 0; overflow-wrap: anywhere; }

      .today-item-head strong {
        margin: 0;
        color: #e8d49a;
        font-size: 16px;
        line-height: 1.5;
      }

      .today-result-card .today-detail-note {
        margin: 12px 0 0;
        color: #bdb4a6;
        font: 400 13px/1.75 var(--font-meta);
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .today-detail-note b {
        display: block;
        margin-bottom: 3px;
        color: #d8ba72;
        font-weight: 700;
      }

      .today-action-box strong { color: #f0e2b8; font-size: 17px; line-height: 1.5; }

      .teaser-panel {
        padding: 18px;
      }

      .teaser-kicker {
        color: var(--gold);
        font-size: 13px;
        font-weight: 900;
      }

      .teaser-title {
        margin: 8px 0 10px;
        font-size: 28px;
        line-height: 1.18;
        letter-spacing: 0;
      }

      .teaser-copy {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .teaser-block {
        margin-top: 16px;
        padding: 16px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.025)),
          rgba(24, 13, 12, 0.9);
      }

      .chapter {
        display: inline-flex;
        margin-bottom: 10px;
        padding: 6px 9px;
        border-radius: 999px;
        background: rgba(139, 30, 22, 0.42);
        color: #ffd894;
        font-size: 12px;
        font-weight: 900;
      }

      .teaser-block h2 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .agree-list {
        display: grid;
        gap: 8px;
      }

      .agree-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-height: 44px;
        margin: 0;
        padding: 10px 12px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
        color: inherit;
        font-size: 14px;
        font-weight: 750;
        cursor: pointer;
      }

      .agree-row input {
        width: 18px;
        height: 18px;
        margin: 2px 0 0;
        flex: 0 0 auto;
        accent-color: var(--gold);
      }

      .agree-row.agree-all {
        border-color: rgba(242, 191, 107, 0.42);
        background: rgba(139, 30, 22, 0.32);
        font-weight: 900;
      }

      .quote {
        margin: 12px 0 0;
        padding-left: 12px;
        border-left: 2px solid rgba(242, 191, 107, 0.68);
        color: #fff0d8;
        font-size: 15px;
        font-weight: 850;
        line-height: 1.6;
      }

      .saju-table {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
        margin-top: 12px;
      }

      .pillar {
        min-height: 74px;
        display: grid;
        place-items: center;
        gap: 4px;
        padding: 10px 6px;
        border-radius: 8px;
        border: 1px solid rgba(255, 226, 175, 0.16);
        background: rgba(0, 0, 0, 0.26);
        text-align: center;
      }

      .pillar b {
        color: #ffe0a8;
        font-size: 22px;
      }

      .pillar span {
        color: var(--dim);
        font-size: 11px;
      }

      .timeline {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .timeline-row {
        display: grid;
        grid-template-columns: 58px 1fr;
        gap: 10px;
        align-items: start;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .timeline-row strong {
        color: #ffe0a8;
      }

      .story-list {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .story-list-item {
        padding: 15px 15px 15px 17px;
        border-left: 2px solid rgba(242, 191, 107, 0.72);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.055);
        color: #f2dac2;
        font-size: 14px;
        font-weight: 780;
        line-height: 1.58;
      }

      .wealth-chart {
        display: grid;
        gap: 13px;
        margin-top: 20px;
        padding: 18px;
        border: 1px solid rgba(255, 226, 175, 0.17);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.28);
      }

      .chart-row {
        display: grid;
        grid-template-columns: 54px 1fr 44px;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .chart-track {
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .chart-fill {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #8b1e16, #f2bf6b);
        box-shadow: 0 0 18px rgba(242, 191, 107, 0.28);
      }

      .feature-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      .feature {
        padding: 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .feature strong {
        display: block;
        margin-bottom: 4px;
        color: #ffe0a8;
        font-size: 13px;
      }

      .story {
        width: 100%;
        color: var(--ink);
      }

      .sample-story {
        flex: 0 0 auto;
        width: 100%;
        overflow: visible;
        background: #000;
        color: #fff;
      }

      .story-local-nav {
        position: sticky;
        top: 0;
        z-index: 60;
        display: block;
        padding: 0;
        background: #000;
        color: #fff8ef;
        overflow: hidden;
      }

      .story-local-title {
        min-width: 0;
        line-height: 0;
      }

      .story-local-title.umsh-service-logo {
        display: grid;
        min-height: 112px;
        background: #000;
        line-height: 1;
      }

      .story-local-title.umsh-service-logo span {
        font-size: 34px;
      }

      .story-local-logo {
        display: block;
        width: 92%;
        height: 112px;
        margin: 0 auto;
        max-width: none;
        object-fit: contain;
        background: #000;
        vertical-align: top;
      }

      .story-vault-button {
        position: absolute;
        top: 50%;
        right: 17px;
        z-index: 2;
        width: 76px;
        height: 42px;
        transform: translateY(-50%);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: transparent;
        font-size: 0;
        font-weight: 950;
        box-shadow: none;
      }

      .story-vault-button:focus-visible {
        outline: 2px solid rgba(255, 226, 183, 0.86);
        outline-offset: 3px;
      }

      .story-local-back {
        position: absolute;
        top: 50%;
        left: 16px;
        z-index: 2;

  <body>
    <main class="phone" data-scene="landing" data-step="landing" aria-label="運命の扉の入口ページ">
      <div class="hero" aria-hidden="true"></div>
      <video class="concern-video-bg" aria-hidden="true" autoplay muted loop playsinline preload="auto">
        <source src="assets/chungi-concern-loop.mp4" type="video/mp4" />
      </video>
      <div class="concern-video-shade" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand topbar-brand-logo umsh-service-logo" href="/" aria-label="運命商会ホーム">
          <img src="/assets/umsh-brand-logo.png" alt="運命商会" />
        </a>
        <div class="topbar-actions">
          <button class="icon-button" type="button" aria-label="戻る" data-back-global>
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M15 18l-6-6 6-6"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="topbar-vault-button" type="button" aria-label="保管庫を開く" data-open-settings>
            <span aria-hidden="true">☰</span>
          </button>
        </div>
      </header>

      <button class="sound" type="button" id="soundButton">タップして音声をオンにする</button>
      <section class="stage" id="stage" aria-live="polite"></section>
      <aside class="settings-panel" data-settings-panel aria-hidden="true"></aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
      const phone = document.querySelector(".phone");
      const stage = document.querySelector("#stage");
      const soundButton = document.querySelector("#soundButton");
      const backGlobal = document.querySelector("[data-back-global]");
      const settingsButton = document.querySelector("[data-open-settings]");
      const settingsPanel = document.querySelector("[data-settings-panel]");
      const HISTORY_KEY = "cheongi_report_history_v1";
      const ACTIVE_REPORT_KEY = "cheongi_active_report_id";
      const AUTH_PENDING_KEY = "cheongi_pending_analysis_after_auth";
      const AUTH_FORM_KEY = "cheongi_pending_analysis_form";
      const PAID_REPORTS_KEY = "cheongi_paid_report_ids_v1";
      const USER_PROFILE_CACHE_KEY = "cheongi_user_birth_profile_v1";
      const AUTH_DEVICE_SESSION_KEY = "cheongi_auth_device_session_started_at_v1";
      const AUTH_DEVICE_SESSION_MS = 30 * 24 * 60 * 60 * 1000;
      const REMOTE_HISTORY_SYNC_LIMIT = 50;
      const TODAY_ENTRY_KEY = "cheongi_today_entry_pending";
      const TODAY_CONCERN = "今日自分に入る運、日辰、日運、避ける選択";
      let authConfigData = null;
      let authClient = null;
      let authSession = null;
      let authInitPromise = null;
      let authGateMessage = "";
      let authSignInProvider = "";
      let reportHistorySyncPromise = null;
      let todayChrome = null;
      let todayRequestError = "";

      const initialAuthParams = new URLSearchParams(location.search);
      const initialAuthEntry = initialAuthParams.get("authEntry") || initialAuthParams.get("entry") || "";
      const LOVE_THIS_YEAR_SERVICE_KEY = "love_this_year";
      const pathServiceKey = /^\/love\/this-year(?:\/|\.html)?$/i.test(location.pathname)
        ? LOVE_THIS_YEAR_SERVICE_KEY
        : "";
      function normalizeServiceKey(value) {
        const raw = String(value || "").trim();
        return raw === LOVE_THIS_YEAR_SERVICE_KEY || raw === "love-this-year" || raw === "love" ? LOVE_THIS_YEAR_SERVICE_KEY : "";
      }
      const requestedServiceKey = normalizeServiceKey(initialAuthParams.get("service") || initialAuthEntry || pathServiceKey);
      const SERVICE_CATALOG = {
        [LOVE_THIS_YEAR_SERVICE_KEY]: {
          key: LOVE_THIS_YEAR_SERVICE_KEY,
          path: "/love/this-year",
          title: "今年、恋愛できる？",
          eyebrow: "LOVE・恋愛運",
          price: "12,900ウォン",
          cta: "運命商会の相談",
          plan: "love-this-year",
          default고민: "今年、新しい恋愛が入る時期と、逃しやすいタイミングを知りたい。",
          defaultRelationship: "独身です",
          defaultOrientation: "異性の関係が中心",
          defaultWork: "日々の流れ",
        },
      };
      const isSignupPath = /^\/signup(?:\/|\.html)?$/i.test(location.pathname);
      const protectedAuthEntries = new Set(["destiny", "vault", "my"]);
      const isPortalSignupEntry =
        isSignupPath ||
        initialAuthEntry === "today" ||
        initialAuthEntry === "signup" ||
        protectedAuthEntries.has(initialAuthEntry);
      const isSignupReturn = initialAuthParams.get("signupReturn") === "1";
      const isAuthReturn = initialAuthParams.get("authReturn") === "1";

        birthTimeKnown: false,

        name: "",
        orientation: "",
        relationship: "",
        work: "",
        concern: "",
        partnerMode: "none",
        partnerName: "",
        partnerRelationship: "気になる相手",
        partnerCalendar: "陽暦",
        partnerBirth: "",
        partnerGender: "",
        partnerTime: "不明",
        partnerBirthTimeKnown: false,
        analysis: null,

        reportSectionCache: {},
        reportRequestToken: 0,
        reportTypingTimer: null,
        plan: requestedServiceKey ? SERVICE_CATALOG[requestedServiceKey].plan : "single",

        "birth",

        "name",
        "concern",
        "login",
        "my",

        "result",

      function authReturnUrl() {

        url.hash = "concern";
        url.searchParams.set("authReturn", "1");

        url.searchParams.delete("entry");
        url.searchParams.delete("signupReturn");

      function signupReturnUrl() {

          url.searchParams.set("entry", initialAuthEntry);
        }
        url.hash = initialAuthEntry === "today" ? "loading" : "name";
        return url.toString();
      }

      function isStandaloneSignupFlow() {
        return isPortalSignupEntry || isSignupReturn;
      }

      function clearSignupQuery() {
        const url = new URL(location.href);
        url.searchParams.delete("signupReturn");
        url.searchParams.delete("authEntry");
        url.searchParams.delete("entry");
        const nextUrl = `${url.pathname}${url.search}${url.hash}`;
        if (`${location.pathname}${location.search}${location.hash}` !== nextUrl) {
          history.replaceState(null, "", nextUrl);
        }
      }

      function persistAuthFormState() {
        sessionStorage.setItem(AUTH_FORM_KEY, JSON.stringify({
          scene: state.scene,
          serviceKey: state.serviceKey,
          target: state.target,
          calendar: state.calendar,
          birth: state.birth,
          gender: state.gender,
          time: state.time,
          birthTimeKnown: state.birthTimeKnown,
          birthTimeZone: state.birthTimeZone,
          birthTimeDisambiguation: state.birthTimeDisambiguation,

          orientation: state.orientation,
          relationship: state.relationship,
          work: state.work,
          concern: state.concern,

          partnerName: state.partnerName,
          partnerRelationship: state.partnerRelationship,

          partnerBirth: state.partnerBirth,
          partnerGender: state.partnerGender,
          partnerTime: state.partnerTime,
          partnerBirthTimeKnown: state.partnerBirthTimeKnown,
        }));
      }

      function restoreAuthFormState() {
        try {
          const saved = JSON.parse(sessionStorage.getItem(AUTH_FORM_KEY) || "null");
          if (!saved || typeof saved !== "object") return;
          Object.assign(state, {
            serviceKey: normalizeServiceKey(saved.serviceKey) || state.serviceKey,
            target: saved.target || state.target,
            calendar: normalizeBirthCalendar(saved.calendar || state.calendar),
            birth: saved.birth || state.birth,
            birthTimeZone: typeof saved.birthTimeZone === "string" ? saved.birthTimeZone : (saved.birth ? "Asia/Seoul" : state.birthTimeZone),
            birthTimeDisambiguation: saved.birthTimeDisambiguation === "earlier" || saved.birthTimeDisambiguation === "later" ? saved.birthTimeDisambiguation : "",
            gender: normalizeBirthGender(saved.gender || state.gender),
            time: saved.time || state.time,
            birthTimeKnown: saved.birthTimeKnown ?? Boolean(saved.time && saved.time !== "모름"),
            name: saved.name || state.name,
            orientation: saved.orientation || state.orientation,
            relationship: saved.relationship || state.relationship,
            work: saved.work || state.work,
            concern: saved.concern || state.concern,
            partnerMode: saved.partnerMode || state.partnerMode,
            partnerName: saved.partnerName || state.partnerName,
            partnerRelationship: saved.partnerRelationship || state.partnerRelationship,
            partnerCalendar: saved.partnerCalendar || state.partnerCalendar,
            partnerBirth: saved.partnerBirth || state.partnerBirth,
            partnerGender: saved.partnerGender || state.partnerGender,
            partnerTime: saved.partnerTime || state.partnerTime,
            partnerBirthTimeKnown: saved.partnerBirthTimeKnown ?? state.partnerBirthTimeKnown,
          });
          applyServiceDefaults({ preserve고민: true });
        } catch (err) {
          sessionStorage.removeItem(AUTH_FORM_KEY);
        }
      }

      function clearDeviceAuthSession() {
        try {
          localStorage.removeItem(AUTH_DEVICE_SESSION_KEY);
        } catch (err) {
          // localStorage can be unavailable in restricted browser modes.
        }
      }

      function deviceSessionStartedAt() {
        try {
          const value = Number(localStorage.getItem(AUTH_DEVICE_SESSION_KEY));
          return Number.isFinite(value) && value > 0 ? value : 0;
        } catch (err) {
          return 0;
        }
      }

      function inferDeviceSessionStartedAt(session) {
        const lastSignIn = Date.parse(session?.user?.last_sign_in_at || "");
        return Number.isFinite(lastSignIn) ? lastSignIn : Date.now();
      }

      function rememberDeviceAuthSession(session) {
        if (!session?.access_token) {
          clearDeviceAuthSession();
          return 0;
        }
        const existing = deviceSessionStartedAt();
        if (existing) return existing;
        const startedAt = inferDeviceSessionStartedAt(session);
        try {
          localStorage.setItem(AUTH_DEVICE_SESSION_KEY, String(startedAt));
        } catch (err) {
          // Supabase still persists its own session when browser storage allows it.
        }
        return startedAt;
      }

      async function enforceDeviceAuthSession(session) {
        if (!session?.access_token) {
          clearDeviceAuthSession();
          return null;
        }
        const startedAt = deviceSessionStartedAt();
        if (!startedAt) {
          const inferredStartedAt = rememberDeviceAuthSession(session);
          if (Date.now() - inferredStartedAt <= AUTH_DEVICE_SESSION_MS) return session;
        } else if (Date.now() - startedAt <= AUTH_DEVICE_SESSION_MS) {
          return session;
        }

        clearDeviceAuthSession();
        authGateMessage = "30日のログイン保持期間が過ぎたので、もう一度ログインしてください。";
        if (authClient) {
          await authClient.auth.signOut({ scope: "local" }).catch(() => undefined);
        }
        return null;
      }

      async function initAuth() {
        if (authInitPromise) return authInitPromise;
        authInitPromise = (async () => {
          const configRes = await fetch("/api/auth/config");
          const config = await configRes.json();
          authConfigData = config;
          if (!config.enabled) return null;
          if (!window.supabase?.createClient) {
            throw new Error("会員登録モジュールを読み込めませんでした。");
          }
          authClient = window.supabase.createClient(config.url, config.publishableKey, {
            auth: {
              persistSession: true,
              detectSessionInUrl: true,
              flowType: "pkce",
            },
          });
          const { data, error } = await authClient.auth.getSession();
          if (error) throw error;
          authSession = await enforceDeviceAuthSession(data.session || null);
          authClient.auth.onAuthStateChange((_event, session) => {
            enforceDeviceAuthSession(session || null)
              .then((nextSession) => {
                authSession = nextSession;
                if (nextSession?.access_token) {
                  setTimeout(() => {
                    syncRemoteReportHistory().catch((err) => console.warn("リモートの解説保管庫との同期に失敗した。", err));
                  }, 0);
                }
              })
              .catch(() => {
                authSession = session || null;
              });
          });
          if (authSession?.access_token) {
            setTimeout(() => {
              syncRemoteReportHistory().catch((err) => console.warn("リモートの解説保管庫との同期に失敗した。", err));
            }, 0);
          }
          return authSession;
        })();
        return authInitPromise;
      }

      async function currentAuthSession() {
        await initAuth();
        if (!authClient) return null;
        const { data, error } = await authClient.auth.getSession();
        if (error) throw error;
        authSession = await enforceDeviceAuthSession(data.session || null);
        return authSession;
      }

      async function authHeaders(base = {}) {
        const headers = { ...base };
        const session = authSession || await currentAuthSession().catch(() => null);
        if (session?.access_token) headers.Authorization = `Bearer ${session.access_token}`;
        return headers;
      }

      function setTodayEntryPending() {
        todayEntryActive = true;
        sessionStorage.setItem(TODAY_ENTRY_KEY, "1");
      }

      function clearTodayEntryPending() {
        todayEntryActive = false;
        sessionStorage.removeItem(TODAY_ENTRY_KEY);
      }

      function wantsTodayEntry() {
        return todayEntryActive || sessionStorage.getItem(TODAY_ENTRY_KEY) === "1";
      }

      function wantsProtectedProfileEntry() {
        return protectedAuthEntries.has(initialAuthEntry);
      }

      function protectedEntryLabel() {
        if (initialAuthEntry === "destiny") return "運命の記録";
        if (initialAuthEntry === "vault") return "保管庫";
        if (initialAuthEntry === "my") return "MY";
        return "該当するメニュー";
      }

      function protectedEntryTarget() {
        if (initialAuthEntry === "destiny") return "/destiny";
        if (initialAuthEntry === "vault") return "/cmdg/#vault";
        return "";
      }

      function currentService() {
        return SERVICE_CATALOG[state.serviceKey] || null;
      }

      function isLoveThisYearService() {
        return currentService()?.key === LOVE_THIS_YEAR_SERVICE_KEY;
      }

      function applyServiceDefaults(options = {}) {
        const service = currentService();
        if (!service) return;
        state.target = "本人";
        state.plan = service.plan;
        if (!options.preserve고민 && !state.concern) state.concern = service.default고민;
        if (!state.relationship) state.relationship = service.defaultRelationship;
        if (!state.orientation) state.orientation = service.defaultOrientation;
        if (!state.work) state.work = service.defaultWork;
        if (!state.partnerMode) state.partnerMode = "none";
      }

      function parsePartnerBirthInput() {
        const digits = String(state.partnerBirth || "").replace(/\D/g, "");
        const year = Number(digits.slice(0, 4));
        const month = Number(digits.slice(4, 6));
        const day = Number(digits.slice(6, 8));
        let hour = 12;
        let minute = 0;
        if (state.partnerBirthTimeKnown && state.partnerTime && state.partnerTime !== "모름") {
          const m = state.partnerTime.match(/(\d{1,2}):(\d{2})/);
          if (m) {
            hour = Number(m[1]);
            minute = Number(m[2]);
          }
        }
        return {
          year,
          month,
          day,
          hour,
          minute,
          gender: state.partnerGender === "女性" ? "female" : "male",
          calendar: state.partnerCalendar === "旧暦" ? "lunar" : "solar",
        };
      }

      function getPartnerContext() {
        if (!isLoveThisYearService() || state.partnerMode !== "known") {
          return { mode: "none", relationship: state.partnerRelationship || "" };
        }
        return {
          mode: "known",
          name: state.partnerName,
          relationship: state.partnerRelationship,
          birthTimeKnown: state.partnerBirthTimeKnown,
          birth: parsePartnerBirthInput(),
        };
      }

      function servicePathForCurrentPage() {
        return currentService()?.path || "/cmdg/";
      }

      function profileDateValue(birth = {}) {
        if (!birth.year || !birth.month || !birth.day) return "";
        return `${birth.year}${pad2(birth.month)}${pad2(birth.day)}`;
      }

      function readCachedUserProfile() {
        try {
          const parsed = JSON.parse(localStorage.getItem(USER_PROFILE_CACHE_KEY) || "null");
          return parsed && typeof parsed === "object" ? parsed : null;
        } catch (err) {
          localStorage.removeItem(USER_PROFILE_CACHE_KEY);
          return null;
        }
      }

      function writeCachedUserProfile(profile) {
        if (!profile) return;
        try {
          localStorage.setItem(USER_PROFILE_CACHE_KEY, JSON.stringify(profile));
        } catch (err) {
          console.warn("四柱推命のプロフィールを、ローカルのキャッシュに保存できませんでした。", err);
        }
      }

      function cachedProfileForSession(session) {
        const cached = readCachedUserProfile();
        if (!cached) return null;
        if (!session?.user?.id) return cached;
        return cached.userId === session.user.id ? cached : null;
      }

      function applyUserProfile(profile, options = {}) {
        if (!profile?.birth) return false;
        const birth = profile.birth;
        state.birthTimeZone = birth.birthTimeZone || "Asia/Seoul";
        state.birthTimeDisambiguation = birth.birthTimeDisambiguation || "";
        state.name = profile.name || state.name;
        state.target = profile.context?.target || state.target || "本人";
        state.relationship = profile.context?.relationship || state.relationship;
        state.orientation = profile.context?.orientation || state.orientation;
        state.work = profile.context?.work || state.work;
        state.calendar = normalizeBirthCalendar(birth.calendar);
        state.birth = profileDateValue(birth);
        state.gender = normalizeBirthGender(birth.gender);
        state.birthTimeKnown = profile.birthTimeKnown !== false;
        state.time = state.birthTimeKnown
          ? `${pad2(birth.hour)}:${pad2(birth.minute || 0)}`
          : "不明";
        if (!options.preserve고민) state.concern = state.concern || "";
        syncBirthSessionFromState();
        return true;
      }

      function localUserProfileFromState() {
        const timestamp = new Date().toISOString();
        return {
          userId: "local",
          name: state.name,
          birth: parseBirthInput(),
          birthTimeKnown: state.birthTimeKnown,
          context: {
            target: state.target,
            relationship: state.relationship,
            orientation: state.orientation,
            work: state.work,
          },
          createdAt: timestamp,
          updatedAt: timestamp,
        };
      }

      function syncBirthSessionFromState() {
        const birth = parseBirthInput();
        sessionStorage.setItem("cheongi_birth", JSON.stringify({
          ...birth,
          birthTimeKnown: state.birthTimeKnown,
          serviceKey: state.serviceKey,
          target: state.target,
          concern: state.concern,
          relationship: state.relationship,
          work: state.work,
          orientation: state.orientation,
          partner: getPartnerContext(),
        }));
      }

      async function fetchUserProfile(options = {}) {
        const headers = await authHeaders();
        if (!headers.Authorization) return null;
        const res = await fetch("/api/user/profile", { headers });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "保存済みの四柱推命プロフィールを読み込めなかった。");
        if (json.profile) {
          writeCachedUserProfile(json.profile);
          if (options.apply !== false) applyUserProfile(json.profile, options);
        }
        return json.profile || null;
      }

      async function saveCurrentUserProfile() {
        const localProfile = localUserProfileFromState();
        writeCachedUserProfile(localProfile);
        const headers = await authHeaders({ "Content-Type": "application/json" });
        if (!headers.Authorization) return localProfile;
        const res = await fetch("/api/user/profile", {
          method: "PUT",
          headers,
          body: JSON.stringify({
            name: state.name,
            birth: localProfile.birth,
            birthTimeKnown: state.birthTimeKnown,
            context: localProfile.context,
          }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "命式プロフィールを保存できませんでした。");
        if (json.profile) {
          writeCachedUserProfile(json.profile);
          applyUserProfile(json.profile, { preserve고민: true });
        }
        return json.profile || localProfile;
      }

      async function startStandardReading() {
        clearTodayEntryPending();
        resetReadingState();
        let profile = null;
        let session = null;
        try {
          session = await currentAuthSession();
          if (session?.access_token) {
            profile = await fetchUserProfile();
          }
        } catch (err) {
          profile = cachedProfileForSession(session);
          if (profile) applyUserProfile(profile);
        }
        applyServiceDefaults({ preserve고민: true });
        go(profile ? "concern" : "name");
      }

      async function beginTodayAfterAuth() {
        todayRequestError = "";
        setTodayEntryPending();
        let session = null;
        try {
          session = await currentAuthSession();
        } catch (err) {
          showAuthGate(err.message || "会員の認証状態を確認できなかった。");
          return;
        }
        if (!session?.access_token) {
          showAuthGate("今日の運を見るには、先に登録してください。");
          return;
        }

        sessionStorage.removeItem(AUTH_PENDING_KEY);
        sessionStorage.removeItem(AUTH_FORM_KEY);
        go("todayResult", false);

        try {
          const todayParams = new URLSearchParams(location.search);
          const requestedTodayId = todayParams.get("reportId") || todayParams.get("resultId");
          const res = await (window.UMSHReportAccess ? window.UMSHReportAccess.fetch : fetch)("/api/today/fortune", {
            method: "POST",
            headers: await authHeaders({ "Content-Type": "application/json" }),
            body: requestedTodayId ? JSON.stringify({ reportId: requestedTodayId }) : undefined,
          });
          const json = await res.json();
          if (res.status === 409 || json.code === "PROFILE_REQUIRED") {
            const cached = cachedProfileForSession(session);
            if (cached) applyUserProfile(cached);
            state.concern = TODAY_CONCERN;
            go("name", false);
            showNudge("今日の運を見るには、先に基本の四柱情報を保存してください。");
            return;
          }
          if (!res.ok) throw new Error(json.error || "今日の運勢を読み込めませんでした。");
          if (json.profile) applyUserProfile(json.profile, { preserve고민: true });
          state.concern = TODAY_CONCERN;
          state.todayFortune = {
            ...json.todayFortune,
            reportId: json.reportId || json.todayFortune?.reportId,
            resultId: json.resultId || json.todayFortune?.resultId,
            publicUrl: json.publicUrl || json.todayFortune?.publicUrl,
          };
          syncBirthSessionFromState();
          clearTodayEntryPending();
          go("todayResult", false);
        } catch (err) {
          todayRequestError = err.message || "今日の運勢を読み込めませんでした。";
          go("todayResult", false);
        }
      }

      async function completeTodayProfileFromInput() {
        setTodayEntryPending();
        go("loading", false);
        try {
          await saveCurrentUserProfile();
          await beginTodayAfterAuth();
        } catch (err) {
          go("time", false);
          showNudge(err.message || "命式プロフィールを保存できませんでした。");
        }
      }

      async function completeProtectedProfileFromInput() {
        go("loading", false);
        try {
          await saveCurrentUserProfile();
          const target = protectedEntryTarget();
          if (target) {
            location.href = target;
            return;
          }
          clearSignupQuery();
          go("my", false);
          showNudge("四柱プロフィールを保存しました。");
        } catch (err) {
          go("time", false);
          showNudge(err.message || "命式プロフィールを保存できませんでした。");
        }
      }

      async function beginProtectedEntryAfterAuth() {
        const label = protectedEntryLabel();
        let session = null;
        try {
          session = await currentAuthSession();

          showAuthGate(err.message || `${label}のアクセス状態を確認できませんでした。`);

        sessionStorage.removeItem(AUTH_FORM_KEY);

          if (profile) applyUserProfile(profile);

        go("my", false);
      }

      function authProviderLabel(provider) {
        if (provider === "kakao") return "Kakao";
        if (provider === "naver") return "Naver";
        return "Google";
      }

      function unavailableAuthMessage(provider) {
        if (provider === "naver") {
          return "Naverログインは、Supabase Custom OAuth Providerの設定を確認してください。";
        }
        return `${authProviderLabel(provider)}のログイン設定を確認してください。`;
      }

      function showAuthGate(message = "") {
        authGateMessage = message;
        sessionStorage.setItem(AUTH_PENDING_KEY, "1");
        if (state.scene !== "login") {
          go("login");
          return;
        }
        renderLogin();
      }

      function setAuthMessage(message) {
        const target = document.querySelector("[data-auth-message]");
        if (target) target.textContent = message;
      }

      async function signInWithProvider(providerName) {
        let providerButton = null;
        try {
          authSignInProvider = providerName;
          providerButton = document.querySelector(`[data-auth-provider="${providerName}"]`);
          providerButton?.classList.add("is-loading");
          providerButton?.setAttribute("aria-busy", "true");
          setAuthMessage(`${authProviderLabel(providerName)}の登録へ進む。`);

          if (isStandaloneSignupFlow()) {
            if (initialAuthEntry === "today") {
              setTodayEntryPending();
            } else {
              clearTodayEntryPending();
            }
            sessionStorage.removeItem(AUTH_PENDING_KEY);
            sessionStorage.removeItem(AUTH_FORM_KEY);
          } else {
            persistAuthFormState();
            sessionStorage.setItem(AUTH_PENDING_KEY, "1");
          }

          await initAuth();
          if (!authConfigData?.enabled || !authClient) {
            throw new Error("Supabaseの公開URLとpublishable keyの設定を確認してください。");
          }
          const provider = authConfigData.providers?.[providerName];
          if (!provider) {
            throw new Error(unavailableAuthMessage(providerName));
          }
          const options = {
            redirectTo: isStandaloneSignupFlow() ? signupReturnUrl() : authReturnUrl(),
          };
          if (providerName === "kakao") {
            options.scopes = "profile_nickname profile_image";
            options.queryParams = { scope: "profile_nickname profile_image" };
          }
          if (providerName === "google") {
            options.queryParams = { prompt: "select_account" };
          }
          const { error } = await authClient.auth.signInWithOAuth({ provider, options });
          if (error) throw error;
        } catch (err) {
          sessionStorage.removeItem(AUTH_PENDING_KEY);
          authSignInProvider = "";
          providerButton?.classList.remove("is-loading");
          providerButton?.removeAttribute("aria-busy");
          setAuthMessage(err.message || `${authProviderLabel(providerName)}の会員登録を開始できませんでした。`);
        }
      }

      async function beginAnalysisAfterAuth() {
        let session = null;
        try {
          session = await currentAuthSession();
        } catch (err) {
          showAuthGate(err.message || "会員の認証状態を確認できなかった。");
          return;
        }
        if (!session?.access_token) {
          showAuthGate();
          return;
        }

        // 로그인에서 돌아온 뒤 폼 상태가 비어 있을 수 있다. 새로고침, 다른 탭 진입,

      function readReportHistory() {
        try {
          const parsed = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
          return Array.isArray(parsed) ? parsed.filter((item) => item?.reportId && item?.analysis) : [];
        } catch (err) {
          return [];
        }
      }

      function writeReportHistory(items) {
        const seen = new Set();
        const next = items.filter((item) => {
          if (!item?.reportId || seen.has(item.reportId)) return false;
          seen.add(item.reportId);
          return true;
        });
        next.sort((a, b) => historyTimestamp(b.savedAt) - historyTimestamp(a.savedAt));
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(next));
        } catch (err) {
          console.warn("鑑定保管庫の保存領域が不足しています。既存のデータは維持されます。", err);
        }
      }

      function historyTimestamp(value) {
        const time = new Date(value || 0).getTime();
        return Number.isFinite(time) ? time : 0;
      }

      function mergeReportHistory(remoteItems = []) {
        const usableRemoteItems = remoteItems.filter((item) => item?.reportId && item?.analysis);
        if (!usableRemoteItems.length) return readReportHistory();
        const localItems = readReportHistory();
        const byReportId = new Map();
        [...localItems, ...usableRemoteItems].forEach((item) => {
          const existing = byReportId.get(item.reportId);
          if (!existing || historyTimestamp(item.savedAt) >= historyTimestamp(existing.savedAt)) {
            byReportId.set(item.reportId, {
              ...existing,
              ...item,
              chatHistory: Array.isArray(item.chatHistory) && item.chatHistory.length
                ? item.chatHistory
                : (existing?.chatHistory || []),
              initial고민: item.initial고민 || existing?.initial고민 || "",
            });
          }
        });
        writeReportHistory(Array.from(byReportId.values()));
        return readReportHistory();
      }

      async function syncRemoteReportHistory(force = false) {
        if (reportHistorySyncPromise && !force) return reportHistorySyncPromise;
        reportHistorySyncPromise = (async () => {
          const headers = await authHeaders();
          if (!headers.Authorization) return readReportHistory();
          const res = await fetch(`/api/user/reports?limit=${REMOTE_HISTORY_SYNC_LIMIT}`, { headers });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || "リモートの解説保管庫を読み込めなかった。");
          return mergeReportHistory(Array.isArray(json.reports) ? json.reports : []);
        })();
        try {
          return await reportHistorySyncPromise;
        } finally {
          reportHistorySyncPromise = null;
        }
      }

      async function deleteRemoteReport(reportId) {
        const headers = await authHeaders();
        if (!headers.Authorization) return false;
        const res = await fetch(`/api/user/reports/${encodeURIComponent(reportId)}`, {
          method: "DELETE",
          headers,
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(json.error || "遠隔で保存した鑑定の削除に失敗しました。");
        return Boolean(json.deleted);
      }

        const reportId = report.reportId || "";

        return Boolean(

          || report.entitlement === "paid"
          || (reportId && paidIds.includes(reportId))
        );

      function formatSavedAt(value) {
        const date = new Date(value || Date.now());
        if (Number.isNaN(date.getTime())) return "たった今";
        return date.toLocaleString("ko-KR", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function formatReportId(reportId) {
        const raw = String(reportId || "").trim();
        if (!raw) return "ID 없음";
        return raw.length > 16 ? `${raw.slice(0, 8)}...${raw.slice(-6)}` : raw;
      }

      function buildReportLink(reportId) {
        const url = new URL(location.href);
        url.searchParams.set("reportId", reportId);
        url.hash = "result";
        return url.href;
      }

      function syncFullReportResultUrl(reportId) {
        if (!reportId) return;
        const url = new URL("/cmdg/", location.origin);
        url.searchParams.set("authReturn", "1");
        url.searchParams.set("reportId", reportId);
        url.hash = "result";
        history.replaceState(null, "", url.toString());
      }

      function syncReportIdInUrl(reportId) {
        const url = new URL(location.href);
        if (reportId) {
          url.searchParams.set("reportId", reportId);
        } else {
          url.searchParams.delete("reportId");
        }
        const hash = state.scene === "landing" ? "" : `#${state.scene}`;
        const nextUrl = `${url.pathname}${url.search}${hash}`;
        if (`${location.pathname}${location.search}${location.hash}` !== nextUrl) {
          history.replaceState(null, "", nextUrl);
        }
      }

      function pad2(value) {
        return String(Number(value || 0)).padStart(2, "0");
      }

      function applyReadingPayload(payload) {
        const analysis = payload?.analysis;
        if (!analysis) return false;

        const saved = payload.birthState || {};
        const birth = payload.birth || analysis.birth || {};
        const context = payload.context || {};
        state.birthTimeZone = saved.birthTimeZone || birth.birthTimeZone || "Asia/Seoul";
        state.birthTimeDisambiguation = saved.birthTimeDisambiguation || birth.birthTimeDisambiguation || "";
        const partner = saved.partner || context.partner || {};
        state.serviceKey = normalizeServiceKey(saved.serviceKey || context.serviceKey) || state.serviceKey;
        state.target = saved.target || context.target || "本人";
        state.calendar = normalizeBirthCalendar(saved.calendar || birth.calendar);
        state.birth = saved.birth || (birth.year ? `${birth.year}.${pad2(birth.month || 1)}.${pad2(birth.day || 1)}` : "");
        state.gender = normalizeBirthGender(saved.gender || birth.gender);
        state.time = saved.time || (Number.isFinite(Number(birth.hour)) ? `${pad2(birth.hour)}:${pad2(birth.minute || 0)}` : "不明");
        state.birthTimeKnown = saved.birthTimeKnown ?? state.time !== "모름";
        state.name = saved.name || context.name || "";
        state.orientation = saved.orientation || context.orientation || "";
        state.relationship = saved.relationship || context.relationship || "";
        state.work = saved.work || context.work || "";
        state.concern = saved.concern || context.concern || "";
        state.partnerMode = partner.mode || "none";
        state.partnerName = partner.name || "";
        state.partnerRelationship = partner.relationship || "曖昧な恋・気になる相手";
        state.partnerCalendar = partner.birth?.calendar === "lunar" ? "陰暦" : "陽暦";
        state.partnerBirth = partner.birth?.year ? `${partner.birth.year}${pad2(partner.birth.month || 1)}${pad2(partner.birth.day || 1)}` : "";
        state.partnerGender = partner.birth?.gender === "female" ? "女性" : partner.birth?.gender === "male" ? "男性" : "";
        state.partnerBirthTimeKnown = partner.birthTimeKnown === true;
        state.partnerTime = state.partnerBirthTimeKnown && Number.isFinite(Number(partner.birth?.hour))
          ? `${pad2(partner.birth.hour)}:${pad2(partner.birth.minute || 0)}`
          : "不明";
        applyServiceDefaults({ preserve고민: true });
        state.analysis = analysis;
        state.reportPageIndex = 0;
        state.reportSectionCache = {};
        state.reportRequestToken += 1;
        stopReportTyping();

        const birthForSession = parseBirthInput();
        const reportId = analysis.report?.reportId || payload.reportId || "";
        const chatHistory = Array.isArray(payload.chatHistory) ? payload.chatHistory : [];
        setActiveReportId(reportId);
        sessionStorage.setItem("cheongi_analysis", JSON.stringify(analysis));
        sessionStorage.setItem("cheongi_birth", JSON.stringify({
          ...birthForSession,
          birthTimeKnown: state.birthTimeKnown,
          serviceKey: state.serviceKey,
          target: state.target,
          concern: state.concern,
          relationship: state.relationship,
          work: state.work,
          orientation: state.orientation,
          partner: getPartnerContext(),
        }));
        sessionStorage.setItem("cheongi_chat_history", JSON.stringify(chatHistory));
        if (state.concern) sessionStorage.setItem("cheongi_initial_concern", state.concern);
        return true;
      }

      function historySubtitle(entry) {
        const bits = [
          entry.birthState?.relationship,
          entry.birthState?.work,
          entry.birthState?.concern,
        ].filter(Boolean);
        const progress = entry.progress?.total
          ? `${entry.progress.complete || 0}/${entry.progress.total}`
          : "保存済み";
        return `${bits.join(" · ") || "解説を保存"} · ${progress} · ${formatSavedAt(entry.savedAt)}`;
      }

      function buildHistoryEntry() {
        const report = state.analysis?.report;
        if (!report?.reportId) return null;
        const birth = parseBirthInput();
        let chatHistory = [];
        try {
          chatHistory = JSON.parse(sessionStorage.getItem("cheongi_chat_history") || "[]");
        } catch (err) {
          chatHistory = [];
        }
        const birthState = {
          serviceKey: state.serviceKey,
          target: state.target,
          calendar: state.calendar,
          birth: state.birth,
          gender: state.gender,
          time: state.time,
          birthTimeKnown: state.birthTimeKnown,
          birthTimeZone: state.birthTimeZone,
          birthTimeDisambiguation: state.birthTimeDisambiguation,
          name: state.name,
          orientation: state.orientation,
          relationship: state.relationship,
          work: state.work,
          concern: state.concern,
          partner: getPartnerContext(),
        };
        const titleName = state.name || state.target || "君";
        return {
          reportId: report.reportId,
          savedAt: new Date().toISOString(),
          title: `${titleName} · ${birthCalendarLabel(state.calendar)} ${formatBirthLabel(state.birth)}`,
          birth,
          birthState,
          context: getReportContext(),
          analysis: state.analysis,
          progress: report.progress,
          storage: report.storage,
          corpusFingerprint: report.corpus?.fingerprint,
          chatHistory: Array.isArray(chatHistory) ? chatHistory : [],
          initial고민: state.concern || "",
        };
      }

      function saveCurrentReading() {
        const entry = buildHistoryEntry();
        if (!entry) return;
        setActiveReportId(entry.reportId);
        const items = readReportHistory();
        const existing = items.find((item) => item.reportId === entry.reportId);
        const merged = {
          ...existing,
          ...entry,
          chatHistory: entry.chatHistory.length ? entry.chatHistory : (existing?.chatHistory || []),
          initial고민: entry.initial고민 || existing?.initial고민 || "",
        };
        writeReportHistory([merged, ...items.filter((item) => item.reportId !== entry.reportId)]);
      }

      async function ensureVaultAccess() {
        let session = null;
        try {
          session = await currentAuthSession();
        } catch (err) {
          console.warn("保管庫のログイン状態を確認できなかった", err);
        }
        if (!session?.access_token) {
          location.href = "/signup?entry=vault";
          return false;
        }

        try {
          const profile = await fetchUserProfile();
          if (profile?.name && applyUserProfile(profile)) return true;
        } catch (err) {
          console.warn("保管庫の命式プロフィールを確認できない", err);
        }

        location.href = "/signup?entry=vault";
        return false;
      }

      async function openSettings() {
        if (!(await ensureVaultAccess())) return;
        renderSettingsPanel();
        settingsPanel.classList.add("is-open");
        settingsPanel.setAttribute("aria-hidden", "false");
        syncRemoteReportHistory(true)
          .then(() => {
            if (settingsPanel.classList.contains("is-open")) renderSettingsPanel();
          })
          .catch((err) => console.warn("リモートの解説保管庫との同期に失敗した。", err));
      }

      function closeSettings() {
        settingsPanel.classList.remove("is-open");
        settingsPanel.setAttribute("aria-hidden", "true");
      }

        state.gender = "";
        state.time = "不明";
        state.birthTimeKnown = false;
        state.birthTimeZone = "";
        state.birthTimeDisambiguation = "";
        state.name = "";
        state.orientation = "";
        state.relationship = "";
        state.work = "";

        state.serviceKey = preservedServiceKey;
        state.partnerMode = "none";

      function restoreHistoryEntry(reportId) {
        const entry = readReportHistory().find((item) => item.reportId === reportId);
        if (!entry?.analysis || !applyReadingPayload(entry)) return;
        closeSettings();
        historyStack.length = 0;
        go("result", false);
      }

      async function loadReportById(reportId) {
        const trimmed = String(reportId || "").trim();
        if (!trimmed) throw new Error("풀이 ID가 비어 있습니다.");

        const cached = readReportHistory().find((item) => item.reportId === trimmed);
        if (cached?.analysis && applyReadingPayload(cached)) {
          historyStack.length = 0;
          go("result", false);
          return;
        }

        const res = await fetch(`/api/report/${encodeURIComponent(trimmed)}`, {
          headers: await authHeaders(),
        });
        const json = await res.json();
        if (!res.ok || !json.analysis) {

      function validateName(value) {
        const name = String(value || "").trim().normalize("NFC");
        if (!name) return "名前を入力してください。";
        if (Array.from(name).length < 2 || Array.from(name).length > 20) return "名前は2〜20文字で入力してください。";
        if (!/^[\p{L}\p{M}][\p{L}\p{M} .'’\-]*$/u.test(name)) return "名前には文字、スペース、アポストロフィ、ハイフンを使ってください。";
        return "";
      }

      function validateBirth(value) {
        const birth = String(value || "").trim();
        if (!birth) return "生年月日を入力してください。";
        if (!/^\d{8}$/.test(birth)) return "生年月日は数字8桁で入力してください。例：19750926";

        const year = Number(birth.slice(0, 4));
        const month = Number(birth.slice(4, 6));
        const day = Number(birth.slice(6, 8));
        const date = new Date(year, month - 1, day);
        const isValidDate =
          date.getFullYear() === year &&
          date.getMonth() === month - 1 &&
          date.getDate() === day;

        if (!isValidDate) return "存在しない日付です。生年月日をもう一度確認してください。";
        if (year < 1900 || year > new Date().getFullYear()) return "生年をもう一度確認してください。";
        return "";
      }

      function normalizeTime(value) {
        const raw = String(value || "").trim();
        const match = raw.match(/^(\d{1,2})(?::?(\d{2}))?$/);
        if (!match) return raw;
        return `${pad2(match[1])}:${pad2(match[2] || 0)}`;
      }

      function validateTime(value) {
        const raw = String(value || "").trim();
        if (!raw) return "生まれた時間を入力するか、時間不明を選んでください。";
        const match = raw.match(/^(\d{1,2})(?::?(\d{2}))?$/);
        if (!match) return "出生時刻は13:30のように入力してください。";
        const hour = Number(match[1]);
        const minute = Number(match[2] || 0);
        if (hour < 0 || hour > 23 || minute < 0 || minute > 59) {
          return "出生時刻は00:00から23:59の間で入力してください。";
        }
        return "";
      }

      function syncLove고민FieldsFromDom() {

      function formatBirthLabel(value) {
        const raw = String(value || "").trim();
        const digits = raw.replace(/\D/g, "");
        if (digits.length === 8) return `${digits.slice(0, 4)}.${digits.slice(4, 6)}.${digits.slice(6, 8)}`;
        return raw || "生年月日が未入力";
      }

      function normalizeBirthGender(value) {
        const label = String(value || "").trim().toLowerCase();
        if (["female", "woman", "女性", "여자", "여성"].includes(label)) return "female";
        if (["male", "man", "男性", "남자", "남성"].includes(label)) return "male";
        return "";
      }
      function normalizeBirthCalendar(value) {
        return ["lunar", "lunar calendar", "旧暦", "陰暦", "음력"].includes(String(value || "").trim().toLowerCase()) ? "lunar" : "solar";
      }
      function birthGenderLabel(value) { return normalizeBirthGender(value) === "female" ? "女性" : "男性"; }
      function birthCalendarLabel(value) { return normalizeBirthCalendar(value) === "lunar" ? "旧暦" : "新暦"; }

      function parseBirthInput() {
        const birthSource = state.birth || "2000.01.01";
        const birthDigits = birthSource.replace(/\D/g, "");
        const raw =
          birthDigits.length === 8
            ? [birthDigits.slice(0, 4), birthDigits.slice(4, 6), birthDigits.slice(6, 8)]
            : birthSource.replace(/[./-]/g, ".").split(".");
        const year = Number(raw[0] || 2000);
        const month = Number(raw[1] || 1);
        const day = Number(raw[2] || 1);
        let hour = 12;
        let minute = 0;
        if (state.time && state.time !== "모름") {
          const m = state.time.match(/(\d{1,2}):(\d{2})/);
          if (m) {
            hour = Number(m[1]);
            minute = Number(m[2]);
          }
        }
        return {
          name: state.name,
          ...(state.birthTimeZone ? { birthTimeZone: state.birthTimeZone } : {}),
          ...(state.birthTimeDisambiguation ? { birthTimeDisambiguation: state.birthTimeDisambiguation } : {}),
          year,
          month,
          day,
          hour,
          minute,
          gender: normalizeBirthGender(state.gender) || "male",
          calendar: normalizeBirthCalendar(state.calendar),
        };
      }

      async function analyzeBirth() {
        const birth = parseBirthInput();
        const context = {
          serviceKey: state.serviceKey,
          name: state.name,
          target: state.target,
          concern: state.concern,
          relationship: state.relationship,
          orientation: state.orientation,
          work: state.work,
          partner: getPartnerContext(),
        };
        await saveCurrentUserProfile();
        state.reportPageIndex = 0;
        state.reportSectionCache = {};
        state.reportRequestToken += 1;
        if (state.reportTypingTimer) clearTimeout(state.reportTypingTimer);
        state.reportTypingTimer = null;
        const headers = await authHeaders({ "Content-Type": "application/json" });
        const res = await (window.UMSHReportAccess ? window.UMSHReportAccess.fetch : fetch)("/api/saju/analyze", {
          method: "POST",
          headers,
          body: JSON.stringify({ ...birth, ...context, birthTimeKnown: state.birthTimeKnown, context }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "分析失敗");
        state.analysis = json;
        const reportId = json.report?.reportId || "";
        const stored = readReportHistory().find((item) => item.reportId === reportId);
        setActiveReportId(reportId);
        syncBirthSessionFromState();
        sessionStorage.setItem("cheongi_analysis", JSON.stringify(json));
        sessionStorage.setItem("cheongi_chat_history", JSON.stringify(stored?.chatHistory || []));
        if (state.concern) sessionStorage.setItem("cheongi_initial_concern", state.concern);
        saveCurrentReading();
      }

      function syncSceneUrl(scene) {
        const url = new URL(location.href);
        if (/^\/signup(?:\/|\.html)?$/i.test(url.pathname) && scene !== "login") {
          url.pathname = "/cmdg/";
        }
        if (scene === "result" && state.analysis?.report?.reportId) {
          url.searchParams.set("reportId", state.analysis.report.reportId);
        }
        if (scene === "todayResult") {
          url.searchParams.delete("authEntry");
          url.searchParams.delete("entry");
          url.searchParams.delete("signupReturn");
          const todayId = state.todayFortune?.resultId || state.todayFortune?.reportId;
          if (todayId) url.searchParams.set("reportId", todayId);
        }
        const hash = scene === "landing" ? "" : `#${scene}`;
        const nextUrl = `${url.pathname}${url.search}${hash}`;
        if (`${location.pathname}${location.search}${location.hash}` !== nextUrl) {
          history.replaceState(null, "", nextUrl);
        }
      }

        return clean
          .split(/\n{2,}/)
          .map((paragraph) => `<p>${escapeHtml(paragraph).replace(/\n/g, "<br />")}</p>`)
          .join("");

      function seedReportCache() {
        for (const section of getReportSections()) {
          if (!state.reportSectionCache[section.id]) {
            state.reportSectionCache[section.id] = { ...section, generatedBy: "template" };
          }
        }

      function stopReportTyping() {
        if (state.reportTypingTimer) clearTimeout(state.reportTypingTimer);
        state.reportTypingTimer = null;
      }

      function updateReportToc() {
        const toc = document.querySelector("[data-report-toc]");
        const sections = getReportSections();
        if (toc && sections.length) {
          toc.innerHTML = renderReportTocMarkup(sections, state.reportPageIndex);
        }
      }

      function showReportPageFrame(section, status = "") {
        const reader = document.querySelector("[data-report-reader]");
        const sections = getReportSections();
        if (!reader || !section || !sections.length) return;
        reader.innerHTML = renderReportPageMarkup(section, state.reportPageIndex, sections.length, "", status);
        updateReportToc();
      }

      function typeReportText(section, token) {
        const body = document.querySelector("[data-report-body]");
        const status = document.querySelector(".report-status");
        if (!body || !section) return;
        const fullText = String(section.interpretation || "");
        let cursor = 0;
        const step = Math.max(2, Math.ceil(fullText.length / 260));
        body.classList.add("typing-cursor");
        if (status) status.remove();

        const tick = () => {
          if (token !== state.reportRequestToken) return;
          cursor = Math.min(fullText.length, cursor + step);
          body.innerHTML = formatInterpretationHtml(fullText.slice(0, cursor));
          if (cursor < fullText.length) {
            state.reportTypingTimer = setTimeout(tick, 18);
          } else {
            body.classList.remove("typing-cursor");
            state.reportTypingTimer = null;
          }
        };
        tick();
      }

      async function fetchReportSection(section) {
        const birth = parseBirthInput();
        const res = await fetch("/api/report/section", {
          method: "POST",
          headers: await authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({
            birth,
            reportId: state.analysis?.report?.reportId,
            sectionId: section.id,
            context: getReportContext(),
          }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "レポートの生成に失敗");
        if (json.report && state.analysis) {
          state.analysis.report = json.report;
          seedReportCache();
          saveCurrentReading();
        }
        return { ...json.section, generatedBy: json.generatedBy, model: json.model };
      }

        const reportId = state.analysis?.report?.reportId;
        if (!reportId) return;
        const birth = parseBirthInput();
        try {
          const res = await fetch("/api/report/prewarm", {
            method: "POST",
            headers: await authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({
              birth,
              reportId,
              context: getReportContext(),
            }),
          });
          const json = await res.json();
          if (!res.ok || !json.report || !state.analysis) return;
          state.analysis.report = json.report;
          seedReportCache();
          saveCurrentReading();
        } catch (err) {
          // The section API still falls back to on-demand generation.
        }
      }

      async function copyReportLink(button) {

        if (!reportId) return;
        const link = buildReportLink(reportId);
        syncReportIdInUrl(reportId);
        try {
          await navigator.clipboard.writeText(link);
          if (button) {

            button.textContent = "コピーしました";
            setTimeout(() => {
              button.textContent = original || "リンクをコピー";
            }, 1400);
          }
        } catch (err) {
          if (button) button.textContent = "IDを確認";
        }
      }

      async function loadReportPage(index, force = false) {
        const sections = getReportSections();
        if (!sections.length) return;
        const nextIndex = Math.min(Math.max(index, 0), sections.length - 1);
        state.reportPageIndex = nextIndex;
        const templateSection = sections[nextIndex];
        stopReportTyping();
        const token = state.reportRequestToken + 1;
        state.reportRequestToken = token;

        const cached = state.reportSectionCache[templateSection.id];
        if (cached && !force && (cached.generatedBy === "openai" || cached.status === "complete")) {
          showReportPageFrame(cached, "");
          typeReportText(cached, token);
          return;
        }

        showReportPageFrame(templateSection, "チョンミョン四柱推命がこの章の気を広げている");
        try {
          const generated = await fetchReportSection(templateSection);
          if (token !== state.reportRequestToken) return;
          state.reportSectionCache[templateSection.id] = generated;
          showReportPageFrame(generated, "");
          typeReportText(generated, token);
        } catch (err) {
          if (token !== state.reportRequestToken) return;
          const fallback = cached || templateSection;
          state.reportSectionCache[templateSection.id] = fallback;
          showReportPageFrame(fallback, "");
          typeReportText(fallback, token);
        }
      }

      function setupReportReader() {
        if (!getReportSections().length) return;
        seedReportCache();
        requestAnimationFrame(() => {
          loadReportPage(state.reportPageIndex || 0);
          prewarmReport();
        });
      }

          linear-gradient(315deg, rgba(255, 218, 154, 0.14), transparent 26%),
          rgba(47, 9, 7, 0.9);
        box-shadow:
          0 18px 36px rgba(0, 0, 0, 0.44),
          inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .cta-frame::before,
      .cta-frame::after {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 222, 169, 0.82), transparent);
      }

      .cta-frame::before {
        top: 7px;
      }

      .cta-frame::after {
        bottom: 7px;
      }

      .primary-cta {
        width: 100%;
        min-height: 76px;
        border-radius: 6px;
        border: 1px solid rgba(255, 225, 168, 0.34);
        background: linear-gradient(180deg, #a22b20, #65120e);
        color: #fff8e8;
        font-size: clamp(21px, 6.5vw, 30px);
        font-weight: 950;
        letter-spacing: 0;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
      }

      .skip {
        align-self: center;
        margin-top: 14px;
        background: transparent;
        color: rgba(255, 248, 239, 0.84);
        font-size: 13px;
        font-weight: 800;
      }

      .panel {
        width: 100%;
        max-height: calc(100svh - 92px);
        overflow: auto;
        scrollbar-width: none;
        padding: 22px;
        border: 1px solid rgba(255, 227, 184, 0.18);
        border-radius: 18px;
        background: #100a0a;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
        animation: rise 260ms ease both;
      }

      .phone[data-scene="input"] .panel {
        border-color: rgba(255, 227, 184, 0.22);
        background:
          linear-gradient(180deg, rgba(16, 10, 10, 0.24), rgba(8, 4, 4, 0.12)),
          rgba(7, 4, 4, 0.08);
        box-shadow:
          0 18px 58px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(4px);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.22;
        letter-spacing: 0;
      }

      .panel p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .choices.single {
        grid-template-columns: 1fr;
      }

      .choice,
      .ghost,
      .next-cta {
        min-height: 54px;
        border-radius: 8px;
        font-weight: 850;
      }

      .choice {
        border: 1px solid rgba(255, 226, 175, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        transition:
          border-color 180ms ease,
          background 180ms ease,
          transform 180ms ease;
      }

      .choice:active {
        transform: translateY(1px);
      }

      .choice.is-selected {
        border-color: rgba(242, 191, 107, 0.72);
        background: rgba(184, 50, 36, 0.34);
        transform: translateY(-2px);
      }

      .field-grid {
        display: grid;
        gap: 10px;
      }

      .phone[data-step="name"] .field-grid {
        margin-bottom: 16px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field label {
        color: rgba(255, 247, 236, 0.72);
        font-size: 12px;
        font-weight: 850;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 50px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--ink);
        padding: 0 14px;
        outline: none;
      }

      .phone[data-scene="input"] .field input,
      .phone[data-scene="input"] .field select {
        border-color: rgba(255, 226, 175, 0.28);
        background: rgba(15, 10, 10, 0.18);
        box-shadow: inset 0 1px 10px rgba(0, 0, 0, 0.2);
      }

      .field input:focus,
      .field select:focus {
        border-color: rgba(242, 191, 107, 0.78);
        box-shadow: 0 0 0 3px rgba(242, 191, 107, 0.12);
      }

      .field input[aria-invalid="true"],
      .field select[aria-invalid="true"] {
        border-color: rgba(255, 78, 64, 0.86);
        box-shadow:
          0 0 0 3px rgba(255, 78, 64, 0.14),
          inset 0 1px 10px rgba(0, 0, 0, 0.2);
      }

      .field-error {
        min-height: 18px;
        color: #ff5a4f;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.45;
      }

      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }

      .segmented button {
        min-height: 42px;
        border-radius: 999px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: var(--dim);
        font-weight: 850;
      }

      .segmented button[aria-pressed="true"] {
        border-color: rgba(242, 191, 107, 0.7);
        background: rgba(242, 191, 107, 0.16);
        color: var(--ink);
      }

      .actions {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      .ghost {
        border: 1px solid rgba(255, 226, 175, 0.16);
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
      }

      .phone[data-step="concern"] .ghost {
        border-color: rgba(255, 226, 175, 0.24);
        background: rgba(18, 12, 12, 0.24);
      }

      .next-cta {
        border: 1px solid rgba(255, 225, 168, 0.34);
        background: linear-gradient(180deg, #b83224, #73140f);
        color: #fff8e8;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        margin-bottom: 12px;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(242, 191, 107, 0.12);
        color: #ffd894;
        font-size: 12px;
        font-weight: 850;
      }

      .loader {
        display: grid;
        place-items: center;
        width: 100%;
        padding: 0 0 18vh;
      }

      .interpret-loader-card {
        width: min(100%, 340px);
        display: grid;
        gap: 16px;
        padding: 22px 18px 18px;
        border: 1px solid rgba(255, 226, 175, 0.18);
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 0%, rgba(170, 37, 27, 0.26), transparent 46%),
          linear-gradient(180deg, rgba(34, 8, 7, 0.88), rgba(5, 2, 2, 0.94));
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
        text-align: center;
      }

      .interpret-orb {
        position: relative;
        width: 74px;
        height: 74px;
        margin: 0 auto;
        border-radius: 50%;
        border: 1px solid rgba(242, 191, 107, 0.26);
        background:
          radial-gradient(circle at 50% 50%, rgba(242, 191, 107, 0.32), transparent 32%),
          radial-gradient(circle at 50% 50%, rgba(156, 25, 20, 0.46), transparent 58%),
          #080303;
      }

      .interpret-orb::before {
        content: "";
        position: absolute;
        inset: -5px;
        border-radius: inherit;
        border: 2px solid rgba(242, 191, 107, 0.14);
        border-top-color: #f2bf6b;
        border-right-color: rgba(203, 56, 38, 0.76);
        animation: spin 1.05s linear infinite;
      }

      .interpret-orb::after {
        content: "";
        position: absolute;
        inset: 24px;
        border-radius: inherit;
        background: #f2bf6b;
        box-shadow: 0 0 20px rgba(242, 191, 107, 0.86);
        animation: pulse-glow 1.4s ease-in-out infinite;
      }

      .interpret-loader-copy {
        display: grid;
        gap: 8px;
      }

      .interpret-loader-copy .line-pill {
        justify-self: center;
        margin: 0;
      }

      .interpret-loader-copy p {
        margin: 0;
        color: rgba(255, 239, 211, 0.72);
        font-size: 13px;
        font-weight: 800;
        line-height: 1.55;
      }

      .interpret-progress {
        position: relative;
        height: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 226, 175, 0.13);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
      }

      .interpret-progress::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 46%;
        border-radius: inherit;
        background:
          linear-gradient(90deg, transparent, rgba(255, 244, 214, 0.84), transparent),
          linear-gradient(90deg, #721812, #d44731 54%, #f2bf6b);
        box-shadow: 0 0 18px rgba(242, 191, 107, 0.42);
        animation: progress-scan 1.65s ease-in-out infinite;
      }

      .interpret-steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }

      .interpret-steps span {
        min-width: 0;
        padding: 7px 5px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.045);
        color: rgba(255, 232, 197, 0.74);
        font-size: 11px;
        font-weight: 900;
        line-height: 1.2;
      }

      .interpret-steps span:nth-child(2) {
        color: #ffe4af;
        animation: step-glow 1.65s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse-glow {
        50% {
          opacity: 0.55;
          transform: scale(0.78);
        }
      }

      @keyframes progress-scan {
        0% {
          transform: translateX(-105%);
        }
        52% {
          transform: translateX(92%);
        }
        100% {
          transform: translateX(190%);
        }
      }

      @keyframes step-glow {
        50% {
          border-color: rgba(242, 191, 107, 0.42);
          background: rgba(146, 31, 23, 0.26);
        }
      }

      .result-list {
        display: grid;
        gap: 10px;
        margin: 14px 0;
      }

      .result-item {
        padding: 14px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
      }

      .result-item strong {
        display: block;
        margin-bottom: 5px;
        color: #ffe0a8;
        font-size: 14px;
      }

      .result-item span {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .phone[data-step="todayResult"] > [data-umsh-service-top]:not(:empty) ~ header.topbar { display: none; }

      .phone[data-step="todayResult"] .stage {
        top: var(--umsh-chrome-appbar-h, 85px);
        bottom: calc(var(--umsh-chrome-bottom-h, 74px) + env(safe-area-inset-bottom));
        padding: 18px 16px 28px;
        background: #080807;
      }

      .today-result-card {
        display: grid;
        gap: 22px;
        width: 100%;
        min-width: 0;
        max-height: none;
        overflow: visible;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .today-result-card > h1,
      .today-title-row h1 {
        margin: 0;
        font-size: clamp(27px, 7.4vw, 32px);
        line-height: 1.35;
      }

      .today-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .today-title-row h1 { min-width: 0; flex: 1; }
      .today-total-score {
        flex: 0 0 94px;
        display: grid;
        justify-items: center;
        gap: 4px;
        padding: 12px 6px;
        border: 1px solid rgba(216, 186, 114, 0.5);
        border-radius: 18px;
        background: linear-gradient(145deg, #2a2315, #14120d);
        color: #e8d49a;
        font: 600 11px/1.5 var(--font-meta);
      }
      .today-total-score strong { font: 700 34px/1.1 var(--font-meta); font-variant-numeric: tabular-nums; }
      .today-total-score strong small { margin-left: 3px; font-size: 13px; }
      .today-result-card .today-score-caption { margin: -14px 0 0; color: #a39a8c; font: 11px/1.6 var(--font-meta); }
      .today-score-badge {
        flex: 0 0 auto;
        padding: 4px 9px;
        border: 1px solid rgba(216, 186, 114, 0.3);
        border-radius: 999px;
        background: rgba(216, 186, 114, 0.08);
        color: #f0dfad;
        font: 700 14px/1.5 var(--font-meta);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .today-result-card > .today-result-meta {
        margin: -10px 0 0;
        color: #a39a8c;
        font: 12px/1.6 var(--font-meta);
      }

      .today-pillar-card,
      .today-zodiac-card,
      .today-action-box {
        display: grid;
        gap: 10px;
        padding: 18px;
        border: 1px solid rgba(216, 186, 114, 0.24);
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(216, 186, 114, 0.1), rgba(216, 186, 114, 0.025)), #0c0b0a;
      }

      .today-pillar-card span,
      .today-reading-head > span,
      .today-zodiac-label {
        color: #d8ba72;
        font: 700 12px/1.5 var(--font-meta);
      }

      .today-pillar-card strong {
        color: #f0e2b8;
        font-size: 23px;
        line-height: 1.35;
      }

      .today-pillar-card small {
        color: #bdb4a6;
        font: 13px/1.65 var(--font-meta);
      }

      .today-reading-head { display: grid; gap: 10px; }

      .today-reading-head h2,
      .today-zodiac-card h2 {
        margin: 0;
        color: #f7f2e9;
        font-size: 21px;
        line-height: 1.45;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .today-result-card .today-reading-copy p {
        margin: 0;
        color: #d8d0c3;
        font: 400 15px/1.85 var(--font-meta);
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .today-result-card .today-reading-copy p + p { margin-top: 12px; }
      .today-reading-list { gap: 14px; margin: 0; }

      .today-reading-list .result-item {
        min-width: 0;
        padding: 18px;
        border-color: rgba(247, 242, 233, 0.1);
        border-radius: 14px;
        background: #0c0b0a;
      }

      .today-item-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
      .today-item-head strong { min-width: 0; overflow-wrap: anywhere; }

      .today-item-head strong {
        margin: 0;
        color: #e8d49a;
        font-size: 16px;
        line-height: 1.5;
      }

      .today-result-card .today-detail-note {
        margin: 12px 0 0;
        color: #bdb4a6;
        font: 400 13px/1.75 var(--font-meta);
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .today-detail-note b {
        display: block;
        margin-bottom: 3px;
        color: #d8ba72;
        font-weight: 700;
      }

      .today-action-box strong { color: #f0e2b8; font-size: 17px; line-height: 1.5; }

      .teaser-panel {
        padding: 18px;
      }

      .teaser-kicker {
        color: var(--gold);
        font-size: 13px;
        font-weight: 900;
      }

      .teaser-title {
        margin: 8px 0 10px;
        font-size: 28px;
        line-height: 1.18;

      .teaser-copy {

        line-height: 1.65;
      }

      .teaser-block {
        margin-top: 16px;
        padding: 16px;
        border: 1px solid rgba(255, 226, 175, 0.14);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.025)),
          rgba(24, 13, 12, 0.9);

      .chapter {
        display: inline-flex;
        margin-bottom: 10px;
        padding: 6px 9px;
        border-radius: 999px;
        background: rgba(139, 30, 22, 0.42);
        color: #ffd894;
        font-size: 12px;
        font-weight: 900;
      }

      .teaser-block h2 {
        margin: 0 0 8px;

        letter-spacing: 0;

      .agree-list {

      }

      .agree-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;

      .quote {

    <script>

      const pathServiceKey = /^\/love\/this-year(?:\/|\.html)?$/i.test(location.pathname)
        ? LOVE_THIS_YEAR_SERVICE_KEY
        : "";
      function normalizeServiceKey(value) {
        const raw = String(value || "").trim();

      }
      const requestedServiceKey = normalizeServiceKey(initialAuthParams.get("service") || initialAuthEntry || pathServiceKey);

          key: LOVE_THIS_YEAR_SERVICE_KEY,
          path: "/love/this-year",

          eyebrow: "LOVE · Love fortune",
          price: "12,900 KRW",
          cta: "Fortune Shop consultation",
          plan: "love-this-year",
          default고민: "I want to know when new love arrives this year and which timing I might miss.",
          defaultRelationship: "I'm single",

          defaultWork: "Daily-life flow",

      const isSignupPath = /^\/signup(?:\/|\.html)?$/i.test(location.pathname);
      const protectedAuthEntries = new Set(["destiny", "vault", "my"]);
      const isPortalSignupEntry =
        isSignupPath ||
        initialAuthEntry === "today" ||
        initialAuthEntry === "signup" ||
        protectedAuthEntries.has(initialAuthEntry);

      const isAuthReturn = initialAuthParams.get("authReturn") === "1";

        sessionStorage.setItem(TODAY_ENTRY_KEY, "1");

        scene: "landing",
        serviceKey: requestedServiceKey,
        target: "You",
        calendar: "solar",
        birth: "",
        gender: "",
        time: "Unknown",
        birthTimeKnown: false,

      function clearDeviceAuthSession() {
        try {
          localStorage.removeItem(AUTH_DEVICE_SESSION_KEY);

          // localStorage can be unavailable in restricted browser modes.
        }

      function deviceSessionStartedAt() {
        try {
          const value = Number(localStorage.getItem(AUTH_DEVICE_SESSION_KEY));
          return Number.isFinite(value) && value > 0 ? value : 0;
        } catch (err) {
          return 0;
        }
      }

      function inferDeviceSessionStartedAt(session) {
        const lastSignIn = Date.parse(session?.user?.last_sign_in_at || "");
        return Number.isFinite(lastSignIn) ? lastSignIn : Date.now();
      }

      function rememberDeviceAuthSession(session) {
        if (!session?.access_token) {
          clearDeviceAuthSession();
          return 0;
        }
        const existing = deviceSessionStartedAt();
        if (existing) return existing;
        const startedAt = inferDeviceSessionStartedAt(session);
        try {
          localStorage.setItem(AUTH_DEVICE_SESSION_KEY, String(startedAt));
        } catch (err) {
          // Supabase still persists its own session when browser storage allows it.
        }
        return startedAt;
      }

      async function enforceDeviceAuthSession(session) {
        if (!session?.access_token) {
          clearDeviceAuthSession();
          return null;
        }
        const startedAt = deviceSessionStartedAt();
        if (!startedAt) {
          const inferredStartedAt = rememberDeviceAuthSession(session);
          if (Date.now() - inferredStartedAt <= AUTH_DEVICE_SESSION_MS) return session;
        } else if (Date.now() - startedAt <= AUTH_DEVICE_SESSION_MS) {
          return session;
        }

        clearDeviceAuthSession();
        authGateMessage = "The 30-day sign-in period has expired. Please sign in again.";
        if (authClient) {
          await authClient.auth.signOut({ scope: "local" }).catch(() => undefined);
        }
        return null;
      }

      async function initAuth() {
        if (authInitPromise) return authInitPromise;
        authInitPromise = (async () => {
          const configRes = await fetch("/api/auth/config");
          const config = await configRes.json();
          authConfigData = config;
          if (!config.enabled) return null;
          if (!window.supabase?.createClient) {
            throw new Error("The sign-up module could not be loaded.");
          }
          authClient = window.supabase.createClient(config.url, config.publishableKey, {
            auth: {
              persistSession: true,
              detectSessionInUrl: true,
              flowType: "pkce",
            },
          });
          const { data, error } = await authClient.auth.getSession();
          if (error) throw error;
          authSession = await enforceDeviceAuthSession(data.session || null);
          authClient.auth.onAuthStateChange((_event, session) => {
            enforceDeviceAuthSession(session || null)
              .then((nextSession) => {
                authSession = nextSession;
                if (nextSession?.access_token) {
                  setTimeout(() => {
                    syncRemoteReportHistory().catch((err) => console.warn("Failed to sync the remote reading archive.", err));
                  }, 0);
                }
              })
              .catch(() => {
                authSession = session || null;
              });
          });
          if (authSession?.access_token) {
            setTimeout(() => {
              syncRemoteReportHistory().catch((err) => console.warn("Failed to sync the remote reading archive.", err));
            }, 0);
          }
          return authSession;
        })();
        return authInitPromise;
      }

      async function currentAuthSession() {
        await initAuth();
        if (!authClient) return null;
        const { data, error } = await authClient.auth.getSession();
        if (error) throw error;
        authSession = await enforceDeviceAuthSession(data.session || null);
        return authSession;
      }

        if (state.partnerBirthTimeKnown && state.partnerTime && state.partnerTime !== "모름") {

        return {

      async function signInWithProvider(providerName) {
        let providerButton = null;
        try {
          authSignInProvider = providerName;
          providerButton = document.querySelector(`[data-auth-provider="${providerName}"]`);
          providerButton?.classList.add("is-loading");
          providerButton?.setAttribute("aria-busy", "true");
          setAuthMessage(`Going to ${authProviderLabel(providerName)} sign-up.`);

          if (isStandaloneSignupFlow()) {
            if (initialAuthEntry === "today") {
              setTodayEntryPending();
            } else {
              clearTodayEntryPending();
            }
            sessionStorage.removeItem(AUTH_PENDING_KEY);
            sessionStorage.removeItem(AUTH_FORM_KEY);
          } else {
            persistAuthFormState();
            sessionStorage.setItem(AUTH_PENDING_KEY, "1");
          }

          await initAuth();
          if (!authConfigData?.enabled || !authClient) {
            throw new Error("Check the Supabase public URL and publishable key settings.");
          }
          const provider = authConfigData.providers?.[providerName];
          if (!provider) {
            throw new Error(unavailableAuthMessage(providerName));
          }
          const options = {
            redirectTo: isStandaloneSignupFlow() ? signupReturnUrl() : authReturnUrl(),
          };
          if (providerName === "kakao") {
            options.scopes = "profile_nickname profile_image";
            options.queryParams = { scope: "profile_nickname profile_image" };
          }
          if (providerName === "google") {
            options.queryParams = { prompt: "select_account" };
          }
          const { error } = await authClient.auth.signInWithOAuth({ provider, options });
          if (error) throw error;
        } catch (err) {
          sessionStorage.removeItem(AUTH_PENDING_KEY);
          authSignInProvider = "";
          providerButton?.classList.remove("is-loading");
          providerButton?.removeAttribute("aria-busy");
          setAuthMessage(err.message || `Could not start ${authProviderLabel(providerName)} sign-up.`);
        }
      }

      function readReportHistory() {
        try {
          const parsed = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
          return Array.isArray(parsed) ? parsed.filter((item) => item?.reportId && item?.analysis) : [];
        } catch (err) {
          return [];
        }
      }

      function writeReportHistory(items) {
        const seen = new Set();
        const next = items.filter((item) => {
          if (!item?.reportId || seen.has(item.reportId)) return false;
          seen.add(item.reportId);
          return true;
        });
        next.sort((a, b) => historyTimestamp(b.savedAt) - historyTimestamp(a.savedAt));
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(next));
        } catch (err) {
          console.warn("Not enough storage space for the reading vault. Existing saved data remains intact.", err);
        }
      }

      function historyTimestamp(value) {
        const time = new Date(value || 0).getTime();
        return Number.isFinite(time) ? time : 0;
      }

      function mergeReportHistory(remoteItems = []) {
        const usableRemoteItems = remoteItems.filter((item) => item?.reportId && item?.analysis);
        if (!usableRemoteItems.length) return readReportHistory();
        const localItems = readReportHistory();
        const byReportId = new Map();
        [...localItems, ...usableRemoteItems].forEach((item) => {
          const existing = byReportId.get(item.reportId);
          if (!existing || historyTimestamp(item.savedAt) >= historyTimestamp(existing.savedAt)) {
            byReportId.set(item.reportId, {
              ...existing,
              ...item,
              chatHistory: Array.isArray(item.chatHistory) && item.chatHistory.length
                ? item.chatHistory
                : (existing?.chatHistory || []),
              initial고민: item.initial고민 || existing?.initial고민 || "",
            });
          }
        });
        writeReportHistory(Array.from(byReportId.values()));
        return readReportHistory();
      }

      async function syncRemoteReportHistory(force = false) {
        if (reportHistorySyncPromise && !force) return reportHistorySyncPromise;
        reportHistorySyncPromise = (async () => {
          const headers = await authHeaders();
          if (!headers.Authorization) return readReportHistory();
          const res = await fetch(`/api/user/reports?limit=${REMOTE_HISTORY_SYNC_LIMIT}`, { headers });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || "Unable to load the remote reading archive.");
          return mergeReportHistory(Array.isArray(json.reports) ? json.reports : []);
        })();
        try {
          return await reportHistorySyncPromise;
        } finally {
          reportHistorySyncPromise = null;
        }
      }

      async function deleteRemoteReport(reportId) {
        const headers = await authHeaders();
        if (!headers.Authorization) return false;
        const res = await fetch(`/api/user/reports/${encodeURIComponent(reportId)}`, {
          method: "DELETE",
          headers,
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(json.error || "Failed to delete the remotely saved reading.");
        return Boolean(json.deleted);
      }

      function setActiveReportId(reportId) {
        if (!reportId) return;
        sessionStorage.setItem(ACTIVE_REPORT_KEY, reportId);
        localStorage.setItem(ACTIVE_REPORT_KEY, reportId);
      }

      function clearActiveReportId(reportId) {
        if (sessionStorage.getItem(ACTIVE_REPORT_KEY) === reportId) {
          sessionStorage.removeItem(ACTIVE_REPORT_KEY);
          sessionStorage.removeItem("cheongi_chat_history");
        }
        if (localStorage.getItem(ACTIVE_REPORT_KEY) === reportId) {
          localStorage.removeItem(ACTIVE_REPORT_KEY);
        }
      }

        return Boolean(

          || (reportId && paidIds.includes(reportId))

      function formatSavedAt(value) {
        const date = new Date(value || Date.now());
        if (Number.isNaN(date.getTime())) return "Just now";
        return date.toLocaleString("ko-KR", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function formatReportId(reportId) {
        const raw = String(reportId || "").trim();
        if (!raw) return "ID 없음";
        return raw.length > 16 ? `${raw.slice(0, 8)}...${raw.slice(-6)}` : raw;
      }

      function buildReportLink(reportId) {
        const url = new URL(location.href);
        url.searchParams.set("reportId", reportId);
        url.hash = "result";
        return url.href;
      }

      function syncFullReportResultUrl(reportId) {
        if (!reportId) return;
        const url = new URL("/cmdg/", location.origin);
        url.searchParams.set("authReturn", "1");
        url.searchParams.set("reportId", reportId);
        url.hash = "result";
        history.replaceState(null, "", url.toString());
      }

      function syncReportIdInUrl(reportId) {
        const url = new URL(location.href);
        if (reportId) {
          url.searchParams.set("reportId", reportId);
        } else {
          url.searchParams.delete("reportId");
        }
        const hash = state.scene === "landing" ? "" : `#${state.scene}`;
        const nextUrl = `${url.pathname}${url.search}${hash}`;
        if (`${location.pathname}${location.search}${location.hash}` !== nextUrl) {
          history.replaceState(null, "", nextUrl);
        }
      }

      function pad2(value) {
        return String(Number(value || 0)).padStart(2, "0");
      }

      function applyReadingPayload(payload) {
        const analysis = payload?.analysis;
        if (!analysis) return false;

        const saved = payload.birthState || {};
        const birth = payload.birth || analysis.birth || {};
        const context = payload.context || {};
        state.birthTimeZone = saved.birthTimeZone || birth.birthTimeZone || "Asia/Seoul";
        state.birthTimeDisambiguation = saved.birthTimeDisambiguation || birth.birthTimeDisambiguation || "";
        const partner = saved.partner || context.partner || {};
        state.serviceKey = normalizeServiceKey(saved.serviceKey || context.serviceKey) || state.serviceKey;
        state.target = saved.target || context.target || "You";
        state.calendar = normalizeBirthCalendar(saved.calendar || birth.calendar);
        state.birth = saved.birth || (birth.year ? `${birth.year}.${pad2(birth.month || 1)}.${pad2(birth.day || 1)}` : "");
        state.gender = normalizeBirthGender(saved.gender || birth.gender);
        state.time = saved.time || (Number.isFinite(Number(birth.hour)) ? `${pad2(birth.hour)}:${pad2(birth.minute || 0)}` : "Unknown");
        state.birthTimeKnown = saved.birthTimeKnown ?? state.time !== "모름";
        state.name = saved.name || context.name || "";
        state.orientation = saved.orientation || context.orientation || "";
        state.relationship = saved.relationship || context.relationship || "";
        state.work = saved.work || context.work || "";
        state.concern = saved.concern || context.concern || "";
        state.partnerMode = partner.mode || "none";
        state.partnerName = partner.name || "";
        state.partnerRelationship = partner.relationship || "Flirting / Person of interest";
        state.partnerCalendar = partner.birth?.calendar === "lunar" ? "Lunar calendar" : "Solar calendar";
        state.partnerBirth = partner.birth?.year ? `${partner.birth.year}${pad2(partner.birth.month || 1)}${pad2(partner.birth.day || 1)}` : "";
        state.partnerGender = partner.birth?.gender === "female" ? "Woman" : partner.birth?.gender === "male" ? "Male" : "";
        state.partnerBirthTimeKnown = partner.birthTimeKnown === true;
        state.partnerTime = state.partnerBirthTimeKnown && Number.isFinite(Number(partner.birth?.hour))
          ? `${pad2(partner.birth.hour)}:${pad2(partner.birth.minute || 0)}`
          : "Unknown";
        applyServiceDefaults({ preserve고민: true });
        state.analysis = analysis;
        state.reportPageIndex = 0;
        state.reportSectionCache = {};
        state.reportRequestToken += 1;
        stopReportTyping();

        const birthForSession = parseBirthInput();
        const reportId = analysis.report?.reportId || payload.reportId || "";
        const chatHistory = Array.isArray(payload.chatHistory) ? payload.chatHistory : [];
        setActiveReportId(reportId);
        sessionStorage.setItem("cheongi_analysis", JSON.stringify(analysis));
        sessionStorage.setItem("cheongi_birth", JSON.stringify({
          ...birthForSession,
          birthTimeKnown: state.birthTimeKnown,
          serviceKey: state.serviceKey,
          target: state.target,
          concern: state.concern,
          relationship: state.relationship,
          work: state.work,
          orientation: state.orientation,
          partner: getPartnerContext(),
        }));
        sessionStorage.setItem("cheongi_chat_history", JSON.stringify(chatHistory));
        if (state.concern) sessionStorage.setItem("cheongi_initial_concern", state.concern);
        return true;
      }

      function historySubtitle(entry) {
        const bits = [
          entry.birthState?.relationship,
          entry.birthState?.work,
          entry.birthState?.concern,
        ].filter(Boolean);
        const progress = entry.progress?.total
          ? `${entry.progress.complete || 0}/${entry.progress.total}`
          : "Saved";
        return `${bits.join(" · ") || "Save reading"} · ${progress} · ${formatSavedAt(entry.savedAt)}`;
      }

      function buildHistoryEntry() {
        const report = state.analysis?.report;
        if (!report?.reportId) return null;
        const birth = parseBirthInput();
        let chatHistory = [];
        try {
          chatHistory = JSON.parse(sessionStorage.getItem("cheongi_chat_history") || "[]");
        } catch (err) {
          chatHistory = [];
        }
        const birthState = {
          serviceKey: state.serviceKey,
          target: state.target,
          calendar: state.calendar,
          birth: state.birth,
          gender: state.gender,
          time: state.time,
          birthTimeKnown: state.birthTimeKnown,
          birthTimeZone: state.birthTimeZone,
          birthTimeDisambiguation: state.birthTimeDisambiguation,
          name: state.name,
          orientation: state.orientation,
          relationship: state.relationship,
          work: state.work,
          concern: state.concern,
          partner: getPartnerContext(),
        };
        const titleName = state.name || state.target || "You";
        return {
          reportId: report.reportId,
          savedAt: new Date().toISOString(),
          title: `${titleName} · ${birthCalendarLabel(state.calendar)} ${formatBirthLabel(state.birth)}`,
          birth,
          birthState,
          context: getReportContext(),
          analysis: state.analysis,
          progress: report.progress,
          storage: report.storage,
          corpusFingerprint: report.corpus?.fingerprint,
          chatHistory: Array.isArray(chatHistory) ? chatHistory : [],
          initial고민: state.concern || "",
        };
      }

      function saveCurrentReading() {
        const entry = buildHistoryEntry();
        if (!entry) return;
        setActiveReportId(entry.reportId);
        const items = readReportHistory();
        const existing = items.find((item) => item.reportId === entry.reportId);
        const merged = {
          ...existing,
          ...entry,
          chatHistory: entry.chatHistory.length ? entry.chatHistory : (existing?.chatHistory || []),
          initial고민: entry.initial고민 || existing?.initial고민 || "",
        };
        writeReportHistory([merged, ...items.filter((item) => item.reportId !== entry.reportId)]);
      }

      function restoreHistoryEntry(reportId) {
        const entry = readReportHistory().find((item) => item.reportId === reportId);
        if (!entry?.analysis || !applyReadingPayload(entry)) return;
        closeSettings();
        historyStack.length = 0;
        go("result", false);
      }

      async function loadReportById(reportId) {
        const trimmed = String(reportId || "").trim();
        if (!trimmed) throw new Error("풀이 ID가 비어 있습니다.");

        const cached = readReportHistory().find((item) => item.reportId === trimmed);
        if (cached?.analysis && applyReadingPayload(cached)) {
          historyStack.length = 0;
          go("result", false);
          return;
        }

        const res = await fetch(`/api/report/${encodeURIComponent(trimmed)}`, {
          headers: await authHeaders(),
        });
        const json = await res.json();
        if (!res.ok || !json.analysis) {
          throw new Error(json.error || "The saved reading was not found.");
        }
        if (!applyReadingPayload(json)) {
          throw new Error("저장된 풀이를 화면에 복원하지 못했습니다.");
        }
        saveCurrentReading();
        historyStack.length = 0;
        go("result", false);
      }

        if (openButton) {

        const deleteButton = event.target.closest("[data-history-delete]");
        if (deleteButton) {
          const reportId = deleteButton.dataset.historyDelete;
          const items = readReportHistory();
          const entry = items.find((item) => item.reportId === reportId);
          if (!confirmPermanentDelete(entry)) return;
          writeReportHistory(items.filter((item) => item.reportId !== reportId));
          clearActiveReportId(reportId);
          renderSettingsPanel();
          deleteRemoteReport(reportId).catch((err) => console.warn("Failed to delete the remotely saved reading.", err));

          closeSettings();
          historyStack.length = 0;
          resetReadingState();
          go("name", false);

      function validateName(value) {
        const name = String(value || "").trim().normalize("NFC");
        if (!name) return "Please enter your name.";
        if (Array.from(name).length < 2 || Array.from(name).length > 20) return "Use 2 to 20 characters for your name.";
        if (!/^[\p{L}\p{M}][\p{L}\p{M} .'’\-]*$/u.test(name)) return "Use letters, spaces, apostrophes or hyphens.";
        return "";
      }

      function validateBirth(value) {
        const birth = String(value || "").trim();
        if (!birth) return "Enter your birth date.";
        if (!/^\d{8}$/.test(birth)) return "Enter birth date as 8 digits. Example: 19750926";

        const year = Number(birth.slice(0, 4));
        const month = Number(birth.slice(4, 6));
        const day = Number(birth.slice(6, 8));
        const date = new Date(year, month - 1, day);
        const isValidDate =
          date.getFullYear() === year &&
          date.getMonth() === month - 1 &&
          date.getDate() === day;

        if (!isValidDate) return "This date does not exist. Check your birth date again.";
        if (year < 1900 || year > new Date().getFullYear()) return "Please recheck your birth year.";
        return "";
      }

      function normalizeTime(value) {
        const raw = String(value || "").trim();
        const match = raw.match(/^(\d{1,2})(?::?(\d{2}))?$/);
        if (!match) return raw;
        return `${pad2(match[1])}:${pad2(match[2] || 0)}`;
      }

      function validateTime(value) {
        const raw = String(value || "").trim();
        if (!raw) return "Enter the birth time, or choose that the time is unknown.";
        const match = raw.match(/^(\d{1,2})(?::?(\d{2}))?$/);
        if (!match) return "Enter birth time like 13:30.";
        const hour = Number(match[1]);
        const minute = Number(match[2] || 0);
        if (hour < 0 || hour > 23 || minute < 0 || minute > 59) {
          return "Enter birth time between 00:00 and 23:59.";
        }
        return "";
      }

          "\"": "&quot;",

      function formatBirthLabel(value) {
        const raw = String(value || "").trim();
        const digits = raw.replace(/\D/g, "");
        if (digits.length === 8) return `${digits.slice(0, 4)}.${digits.slice(4, 6)}.${digits.slice(6, 8)}`;
        return raw || "Birth date not entered";
      }

      function normalizeBirthGender(value) {
        const label = String(value || "").trim().toLowerCase();
        if (["female", "woman", "女性", "여자", "여성"].includes(label)) return "female";
        if (["male", "man", "男性", "남자", "남성"].includes(label)) return "male";
        return "";
      }
      function normalizeBirthCalendar(value) {
        return ["lunar", "lunar calendar", "旧暦", "陰暦", "음력"].includes(String(value || "").trim().toLowerCase()) ? "lunar" : "solar";
      }
      function birthGenderLabel(value) { return normalizeBirthGender(value) === "female" ? "Female" : "Male"; }
      function birthCalendarLabel(value) { return normalizeBirthCalendar(value) === "lunar" ? "Lunar" : "Solar"; }

      function parseBirthInput() {
        const birthSource = state.birth || "2000.01.01";
        const birthDigits = birthSource.replace(/\D/g, "");
        const raw =
          birthDigits.length === 8
            ? [birthDigits.slice(0, 4), birthDigits.slice(4, 6), birthDigits.slice(6, 8)]
            : birthSource.replace(/[./-]/g, ".").split(".");
        const year = Number(raw[0] || 2000);
        const month = Number(raw[1] || 1);
        const day = Number(raw[2] || 1);
        let hour = 12;
        let minute = 0;
        if (state.time && state.time !== "모름") {
          const m = state.time.match(/(\d{1,2}):(\d{2})/);
          if (m) {
            hour = Number(m[1]);
            minute = Number(m[2]);
          }
        }
        return {
          name: state.name,
          ...(state.birthTimeZone ? { birthTimeZone: state.birthTimeZone } : {}),
          ...(state.birthTimeDisambiguation ? { birthTimeDisambiguation: state.birthTimeDisambiguation } : {}),
          year,
          month,
          day,
          hour,
          minute,
          gender: normalizeBirthGender(state.gender) || "male",
          calendar: normalizeBirthCalendar(state.calendar),
        };
      }

      async function analyzeBirth() {
        const birth = parseBirthInput();
        const context = {
          serviceKey: state.serviceKey,
          name: state.name,
          target: state.target,
          concern: state.concern,
          relationship: state.relationship,
          orientation: state.orientation,
          work: state.work,
          partner: getPartnerContext(),
        };
        await saveCurrentUserProfile();
        state.reportPageIndex = 0;
        state.reportSectionCache = {};
        state.reportRequestToken += 1;
        if (state.reportTypingTimer) clearTimeout(state.reportTypingTimer);
        state.reportTypingTimer = null;
        const headers = await authHeaders({ "Content-Type": "application/json" });
        const res = await (window.UMSHReportAccess ? window.UMSHReportAccess.fetch : fetch)("/api/saju/analyze", {
          method: "POST",
          headers,
          body: JSON.stringify({ ...birth, ...context, birthTimeKnown: state.birthTimeKnown, context }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "Analysis failed");
        state.analysis = json;
        const reportId = json.report?.reportId || "";
        const stored = readReportHistory().find((item) => item.reportId === reportId);
        setActiveReportId(reportId);
        syncBirthSessionFromState();
        sessionStorage.setItem("cheongi_analysis", JSON.stringify(json));
        sessionStorage.setItem("cheongi_chat_history", JSON.stringify(stored?.chatHistory || []));
        if (state.concern) sessionStorage.setItem("cheongi_initial_concern", state.concern);
        saveCurrentReading();
      }

      function syncSceneUrl(scene) {
        const url = new URL(location.href);
        if (/^\/signup(?:\/|\.html)?$/i.test(url.pathname) && scene !== "login") {
          url.pathname = "/cmdg/";
        }
        if (scene === "result" && state.analysis?.report?.reportId) {
          url.searchParams.set("reportId", state.analysis.report.reportId);
        }
        if (scene === "todayResult") {
          url.searchParams.delete("authEntry");
          url.searchParams.delete("entry");
          url.searchParams.delete("signupReturn");
          const todayId = state.todayFortune?.resultId || state.todayFortune?.reportId;
          if (todayId) url.searchParams.set("reportId", todayId);
        }
        const hash = scene === "landing" ? "" : `#${scene}`;
        const nextUrl = `${url.pathname}${url.search}${hash}`;
        if (`${location.pathname}${location.search}${location.hash}` !== nextUrl) {
          history.replaceState(null, "", nextUrl);
        }
      }

        return clean
          .split(/\n{2,}/)
          .map((paragraph) => `<p>${escapeHtml(paragraph).replace(/\n/g, "<br />")}</p>`)
          .join("");

      function seedReportCache() {
        for (const section of getReportSections()) {
          if (!state.reportSectionCache[section.id]) {
            state.reportSectionCache[section.id] = { ...section, generatedBy: "template" };
          }
        }
      }

      function stopReportTyping() {
        if (state.reportTypingTimer) clearTimeout(state.reportTypingTimer);
        state.reportTypingTimer = null;
      }

      function updateReportToc() {
        const toc = document.querySelector("[data-report-toc]");
        const sections = getReportSections();
        if (toc && sections.length) {
          toc.innerHTML = renderReportTocMarkup(sections, state.reportPageIndex);
        }
      }

      function showReportPageFrame(section, status = "") {
        const reader = document.querySelector("[data-report-reader]");
        const sections = getReportSections();
        if (!reader || !section || !sections.length) return;
        reader.innerHTML = renderReportPageMarkup(section, state.reportPageIndex, sections.length, "", status);
        updateReportToc();
      }

      function typeReportText(section, token) {
        const body = document.querySelector("[data-report-body]");
        const status = document.querySelector(".report-status");
        if (!body || !section) return;
        const fullText = String(section.interpretation || "");
        let cursor = 0;
        const step = Math.max(2, Math.ceil(fullText.length / 260));
        body.classList.add("typing-cursor");
        if (status) status.remove();

        const tick = () => {
          if (token !== state.reportRequestToken) return;
          cursor = Math.min(fullText.length, cursor + step);
          body.innerHTML = formatInterpretationHtml(fullText.slice(0, cursor));
          if (cursor < fullText.length) {
            state.reportTypingTimer = setTimeout(tick, 18);
          } else {
            body.classList.remove("typing-cursor");
            state.reportTypingTimer = null;
          }
        };
        tick();
      }

      async function fetchReportSection(section) {
        const birth = parseBirthInput();
        const res = await fetch("/api/report/section", {
          method: "POST",
          headers: await authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({
            birth,
            reportId: state.analysis?.report?.reportId,
            sectionId: section.id,
            context: getReportContext(),
          }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "Report generation failed");
        if (json.report && state.analysis) {
          state.analysis.report = json.report;
          seedReportCache();
          saveCurrentReading();
        }
        return { ...json.section, generatedBy: json.generatedBy, model: json.model };
      }

      async function prewarmReport() {
        const reportId = state.analysis?.report?.reportId;
        if (!reportId) return;
        const birth = parseBirthInput();
        try {
          const res = await fetch("/api/report/prewarm", {
            method: "POST",
            headers: await authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({
              birth,
              reportId,
              context: getReportContext(),
            }),
          });
          const json = await res.json();
          if (!res.ok || !json.report || !state.analysis) return;
          state.analysis.report = json.report;
          seedReportCache();
          saveCurrentReading();
        } catch (err) {
          // The section API still falls back to on-demand generation.
        }
      }

        const reportId = state.analysis?.report?.reportId;
        if (!reportId) return;
        const link = buildReportLink(reportId);
        syncReportIdInUrl(reportId);
        try {
          await navigator.clipboard.writeText(link);
          if (button) {
            const original = button.textContent;
            button.textContent = "Copied";
            setTimeout(() => {
              button.textContent = original || "Copy link";
            }, 1400);
          }
        } catch (err) {
          if (button) button.textContent = "Check ID";
        }
      }

      async function loadReportPage(index, force = false) {
        const sections = getReportSections();
        if (!sections.length) return;
        const nextIndex = Math.min(Math.max(index, 0), sections.length - 1);
        state.reportPageIndex = nextIndex;
        const templateSection = sections[nextIndex];
        stopReportTyping();
        const token = state.reportRequestToken + 1;
        state.reportRequestToken = token;

        const cached = state.reportSectionCache[templateSection.id];
        if (cached && !force && (cached.generatedBy === "openai" || cached.status === "complete")) {
          showReportPageFrame(cached, "");
          typeReportText(cached, token);
          return;
        }

        showReportPageFrame(templateSection, "Four Pillars Reading is unfolding this chapter’s energy");
        try {
          const generated = await fetchReportSection(templateSection);
          if (token !== state.reportRequestToken) return;
          state.reportSectionCache[templateSection.id] = generated;
          showReportPageFrame(generated, "");
          typeReportText(generated, token);
        } catch (err) {
          if (token !== state.reportRequestToken) return;
          const fallback = cached || templateSection;
          state.reportSectionCache[templateSection.id] = fallback;
          showReportPageFrame(fallback, "");
          typeReportText(fallback, token);
        }
      }

      function setupReportReader() {

          loadReportPage(state.reportPageIndex || 0);

      function renderAuthProviderButton(providerName, className, label, helper, mark) {
        // 네이버는 검수 전이라 서버가 꺼 두면 비활성 버튼도 남기지 않는다. 설정을 받기 전에도
        // 그리지 않아야 켜져 있지 않은 버튼이 잠깐 보였다 사라지지 않는다.
        if (providerName === "naver" && !authConfigData?.providers?.naver) return "";
        const isLoading = !authConfigData;
        const isConfigured = Boolean(authConfigData?.providers?.[providerName]);
        const isSigningIn = authSignInProvider === providerName;
        const stateAttrs = isLoading
          ? `data-auth-loading="${providerName}" aria-disabled="true"`
          : isConfigured
            ? `data-auth-provider="${providerName}"`
            : `data-auth-unavailable="${providerName}" aria-disabled="true"`;
        const stateClass = [
          className,
          isConfigured ? "" : "is-unavailable",
          isSigningIn ? "is-loading" : "",
        ].filter(Boolean).join(" ");
        const statusText = isLoading ? "Checking connection" : helper;

        return `
          <button class="auth-provider ${stateClass}" type="button" ${stateAttrs}>
            <span class="auth-provider-mark" aria-hidden="true">${escapeHtml(mark)}</span>
            <span class="auth-provider-copy">
              <strong>${escapeHtml(label)}</strong>
              <small>${escapeHtml(statusText)}</small>
            </span>
          </button>
        `;
      }

                  \x3cinput type="checkbox"${allOn ? " checked" : ""}>
                  \x3cspan>Select all\x3c/span>
                \x3c/label>
                \x3clabel class="agree-row" data-action="toggle-agree" data-agree="privacyAgree">
                  \x3cinput type="checkbox"${state.privacyAgree ? " checked" : ""}>
                  \x3cspan>Agree to privacy policy\x3c/span>
                \x3c/label>
                \x3clabel class="agree-row" data-action="toggle-agree" data-agree="paymentAgree">
                  \x3cinput type="checkbox"${state.paymentAgree ? " checked" : ""}>
                  \x3cspan>Required agreement to proceed with payment\x3c/span>
                \x3c/label>
                \x3clabel class="agree-row" data-action="toggle-agree" data-agree="marketingAgree">
                  \x3cinput type="checkbox"${state.marketingAgree ? " checked" : ""}>
                  \x3cspan>Receive marketing (optional)\x3c/span>
                \x3c/label>
              \x3c/div>`;
      }

      function renderLoveThisYearPurchase() {
        const service = currentService();
        stage.innerHTML = `
          \x3csection class="panel teaser-panel">
            \x3cdiv class="status">Payment guide demo\x3c/div>
            \x3ch1>${escapeHtml(service.title)}\x3c/h1>
            \x3cp>${escapeHtml(state.name || "You")}’s full love-fortune report for this year. This demo screen is not yet connected to an actual payment module.\x3c/p>

            \x3cdiv class="teaser-block">
              \x3cspan class="chapter">Product summary\x3c/span>
              \x3cdiv class="timeline">
                \x3cdiv class="timeline-row">\x3cstrong>Product\x3c/strong>\x3cspan>${escapeHtml(service.title)}\x3c/span>\x3c/div>
                \x3cdiv class="timeline-row">\x3cstrong>Includes\x3c/strong>\x3cspan>10 dedicated love-fortune topics\x3c/span>\x3c/div>
                \x3cdiv class="timeline-row">\x3cstrong>Partner’s saju\x3c/strong>\x3cspan>${state.partnerMode === "known" ? "Input included" : "Criteria for new connections"}\x3c/span>\x3c/div>
                \x3cdiv class="timeline-row">\x3cstrong>Payment amount\x3c/strong>\x3cspan>${escapeHtml(service.price)}\x3c/span>\x3c/div>
              \x3c/div>
            \x3c/div>

            \x3cdiv class="result-list">
              ${[
                "This year's relationship possibilities",
                "When attraction stars become strong",
                "Connection types through the spouse star",
                "Compatibility flow when the other person's chart is entered",
                "The difference between your emotional intensity and theirs",
                "Strategy for starting a relationship",
              ].map((item) => `\x3cdiv class="result-item">\x3cstrong>${item}\x3c/strong>\x3cspan>Detailed reading in the full interpretation\x3c/span>\x3c/div>`).join("")}
            \x3c/div>

            \x3cdiv class="teaser-block">
              ${agreeListMarkup()}
            \x3c/div>

            \x3cdiv class="actions">
              \x3cbutton class="ghost" type="button" data-action="prev">Previous\x3c/button>
              \x3cbutton class="next-cta" type="button" data-action="pay-demo">Pay\x3c/button>
            \x3c/div>
          \x3c/section>
        `;
      }

      function renderPurchase() {
        if (isLoveThisYearService()) {
          renderLoveThisYearPurchase();
          return;
        }
        const plans = [
          { id: "single", title: "Destiny Shrine traditional Four Pillars", badge: "Basic", discount: "21%", origin: "63,000 KRW", price: "49,900 won" },
          { id: "solo", title: "Leave-single-life package", badge: "Recommended", discount: "44%", origin: "₩108,000", price: "60,000 KRW" },
          { id: "deep", title: "MZ fortune package", badge: "Popular", discount: "30%", origin: "96,000 KRW", price: "₩67,000" },
        ];
        const selected = plans.find((plan) => plan.id === state.plan) || plans[0];

        stage.innerHTML = `
          \x3csection class="panel teaser-panel">
            \x3cdiv class="status">Payment guide demo\x3c/div>
            \x3ch1>Open the full reading?\x3c/h1>
            \x3cp>${state.name || "You"}’s inputs were used to create this full-report selection screen. This demo has no actual payment connected.\x3c/p>

            \x3cdiv class="result-list">
              ${plans
                .map(
                  (plan) => `
                    \x3cbutton class="result-item choice ${state.plan === plan.id ? "is-selected" : ""}" type="button" data-key="plan" data-value="${plan.id}">
                      \x3cstrong>${plan.badge} · ${plan.title}\x3c/strong>
                      \x3cspan>${plan.discount} off · \x3cs>${plan.origin}\x3c/s> → ${plan.price}\x3c/span>
                    \x3c/button>
                  `,
                )
                .join("")}
            \x3c/div>

            \x3cdiv class="teaser-block">
              \x3cspan class="chapter">Payment summary\x3c/span>
              \x3cdiv class="timeline">
                \x3cdiv class="timeline-row">\x3cstrong>Product\x3c/strong>\x3cspan>${selected.title}\x3c/span>\x3c/div>
                \x3cdiv class="timeline-row">\x3cstrong>Sale price\x3c/strong>\x3cspan>${selected.origin}\x3c/span>\x3c/div>
                \x3cdiv class="timeline-row">\x3cstrong>Discount\x3c/strong>\x3cspan>${selected.discount} applied\x3c/span>\x3c/div>
                \x3cdiv class="timeline-row">\x3cstrong>Payment amount\x3c/strong>\x3cspan>${selected.price}\x3c/span>\x3c/div>
              \x3c/div>
              \x3cbutton class="ghost" type="button" style="width: 100%; margin-top: 12px;">Apply coupon\x3c/button>
            \x3c/div>

            \x3cdiv class="teaser-block">
              ${agreeListMarkup()}
            \x3c/div>

            \x3cdiv class="actions">
              \x3cbutton class="ghost" type="button" data-action="prev">Back\x3c/button>
              \x3cbutton class="next-cta" type="button" data-action="pay-demo">Pay\x3c/button>
            \x3c/div>
          \x3c/section>
        `;
      }

      function renderPaymentReady() {
        if (isLoveThisYearService()) {
          const service = currentService();
          stage.innerHTML = `
            \x3csection class="panel">
              \x3cdiv class="status">Connect to the actual payment module here\x3c/div>
              \x3ch1>${escapeHtml(service.title)} is at the step just before payment\x3c/h1>
              \x3cp>In the original flow, external payment and ordering follow this step. For safety, this demo implements screen transitions only.\x3c/p>
              \x3cdiv class="result-list">
                \x3cdiv class="result-item">\x3cstrong>Selected product\x3c/strong>\x3cspan>${escapeHtml(service.title)}\x3c/span>\x3c/div>
                \x3cdiv class="result-item">\x3cstrong>Payment amount\x3c/strong>\x3cspan>${escapeHtml(service.price)}\x3c/span>\x3c/div>
                \x3cdiv class="result-item">\x3cstrong>Partner’s Four Pillars\x3c/strong>\x3cspan>${state.partnerMode === "known" ? "Input included" : "Criteria for new connections"}\x3c/span>\x3c/div>
              \x3c/div>
              \x3cbutton class="next-cta" type="button" data-action="restart" style="width: 100%">Start again\x3c/button>
            \x3c/section>
          `;
          return;
        }
        stage.innerHTML = `
          \x3csection class="panel">
            \x3cdiv class="status">The actual payment module would connect here\x3c/div>
            \x3ch1>This is the step before payment\x3c/h1>
            \x3cp>In the original flow, external payment and ordering follow this step. This demo safely implements only the screen transition.\x3c/p>
            \x3cdiv class="result-list">
              \x3cdiv class="result-item">\x3cstrong>Selected product\x3c/strong>\x3cspan>${state.plan === "single" ? "Unmyeong Shrine traditional Four Pillars" : state.plan === "solo" ? "Leave-single-life package" : "MZ fortune package"}\x3c/span>\x3c/div>
              \x3cdiv class="result-item">\x3cstrong>Required consent\x3c/strong>\x3cspan>Privacy policy and required consent for proceeding with payment completed\x3c/span>\x3c/div>
            \x3c/div>
            \x3cbutton class="next-cta" type="button" data-action="restart" style="width: 100%">Start again from the beginning\x3c/button>
          \x3c/section>
        `;
      }

      function renderReportLookupError(message) {
        phone.dataset.scene = "input";
        stage.innerHTML = `
          <section class="panel">
            <div class="status">Could not look up the reading ID</div>
            <h1>The saved reading was not found</h1>
            <p>${escapeHtml(message || "Saved data for this ID is not on the server yet, or has been deleted from the library.")}</p>
            <div class="actions">
              <button class="ghost" type="button" data-action="open-settings">Open saved readings</button>
              <button class="next-cta" type="button" data-action="restart">Enter a new chart</button>
            </div>
          </section>
        `;
      }

      const initialScene = isPortalSignupEntry && !location.hash.slice(1) ? "login" : location.hash.slice(1);
      const removedInputScenes = new Set(["immersion", "target", "gender", "orientation", "relationship", "work"]);
      const resolvedInitialScene = removedInputScenes.has(initialScene) ? "name" : initialScene;
      const freshInputScenes = new Set(["name", "birth", "time", "concern"]);
      const settingsEntryScenes = new Set(["vault", "settings", "history"]);
      const initialReportId = new URLSearchParams(location.search).get("reportId");
      if (isStandaloneSignupFlow() && !isAuthReturn) {
        sessionStorage.removeItem(AUTH_PENDING_KEY);
        sessionStorage.removeItem(AUTH_FORM_KEY);
      }
      if (isAuthReturn || sessionStorage.getItem(AUTH_PENDING_KEY) === "1") {
        restoreAuthFormState();
      }
      if (initialReportId && (!resolvedInitialScene || resolvedInitialScene === "result")) {
        go("loading", false);
        loadReportById(initialReportId).catch((err) => {
          renderReportLookupError(err.message);
        });
      } else if (urlScenes.has(resolvedInitialScene)) {
        if (freshInputScenes.has(resolvedInitialScene) && !isAuthReturn && sessionStorage.getItem(AUTH_PENDING_KEY) !== "1") {
          resetReadingState();
        }
        go(resolvedInitialScene, false);
      } else if (settingsEntryScenes.has(resolvedInitialScene)) {
        syncSceneUrl("landing");
        renderLanding();
        requestAnimationFrame(() => openSettings());
      } else if (legacyPolicyPaths[resolvedInitialScene]) {
        location.replace(legacyPolicyPaths[resolvedInitialScene]);
      } else {
        renderLanding();
        syncSceneUrl("landing");
      }
      if (isSignupReturn) {
        clearSignupQuery();
      }
      initAuth().then(() => {
        if (wantsProtectedProfileEntry() && authSession?.access_token) {
          beginProtectedEntryAfterAuth();
          return;
        }
        if (wantsTodayEntry()) {
          beginTodayAfterAuth();
          return;
        }
        if (!initialReportId && (isAuthReturn || sessionStorage.getItem(AUTH_PENDING_KEY) === "1") && authSession?.access_token) {
          beginAnalysisAfterAuth();
        }
      }).catch((err) => {
        if (wantsTodayEntry() || isAuthReturn || sessionStorage.getItem(AUTH_PENDING_KEY) === "1") {
          showAuthGate(err.message || "Couldn't verify member authentication.");
        }
      });
    </script>
  </body>
</html>

      /* Shared UMSH chrome: keep the fixed bottom nav clear of the page's own CTA.

  <script>
    const DETAIL_ROUTE = "index.html";
    const LIST_ROUTE = "../05-step-5-chat/chat.html";
    const DETAILS = JSON.parse(document.getElementById("DETAIL_DATA").textContent);
    const CALCULATED_FACTS = JSON.parse(document.getElementById("CALCULATED_FACTS").textContent);
    const params = new URLSearchParams(window.location.search);
    const isLocalPreview = window.location.protocol === "file:";

    const els = {
      chip: document.getElementById("context-chip"),
      state: document.getElementById("state-panel"),
      content: document.getElementById("detail-content"),
      groupTitle: document.getElementById("group-title"),
      title: document.getElementById("detail-title"),
      conclusion: document.getElementById("detail-conclusion"),
      hero: document.getElementById("hero-image"),
      sourceGrid: document.getElementById("source-grid"),
      stack: document.getElementById("detail-stack"),
      toast: document.getElementById("toast"),
      scroll: document.getElementById("scroll-area"),
    };

    function currentSectionId() {
      return params.get("section") || DETAILS[0].section_id;
    }

    function getAccessMode() {
      if (params.get("payment") === "processing") return "processing";
      if (params.get("entitlement") === "denied" || params.get("access") === "locked") return "locked";
      if (params.get("report") === "missing") return "missing";
      if (!isLocalPreview && !params.get("report_id")) return "missing";
      return "ready";
    }

    function withRoute(sectionId) {
      const nextParams = new URLSearchParams(params);
      nextParams.set("section", sectionId);
      return DETAIL_ROUTE + "?" + nextParams.toString() + "#step-6_1-report";
    }

    function listRoute() {
      const nextParams = new URLSearchParams(params);
      nextParams.delete("section");
      const query = nextParams.toString();
      return LIST_ROUTE + (query ? "?" + query : "") + "#step-5-chat";
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("is-visible");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("is-visible"), 2200);
    }

    function showState(title, message, actionLabel, action) {
      els.content.hidden = true;
      els.state.classList.add("is-visible");
      els.state.innerHTML = "";
      const h = document.createElement("h2");
      h.textContent = title;
      const p = document.createElement("p");
      p.textContent = message;
      const button = document.createElement("button");
      button.className = "nav-button";
      button.type = "button";
      button.textContent = actionLabel;
      button.addEventListener("click", action);
      els.state.append(h, p, button);
    }

    function renderSources(detail) {
      const rows = [
        ...CALCULATED_FACTS.confirmed_facts.map((fact) => ({
          label: fact.label,
          text: fact.value,
        })),
        {
          label: CALCULATED_FACTS.personalization_note ? "Personal calculation basis" : "Waiting for personalization",
          text: CALCULATED_FACTS.personalization_note || "Detailed conditions are filled in when the birth date and time, partner-sign criteria, current status, this year’s annual Ten Gods, major-cycle Ten Gods, and monthly cycles are connected.",
        },
        ...detail.evidence
          .filter((entry) => entry.kind === "rag")
          .slice(0, 3)
          .map((entry) => ({
            label: entry.label,
            text: entry.value,
          })),
      ];
      els.sourceGrid.innerHTML = "";
      rows.forEach((row) => {
        const item = document.createElement("div");
        item.className = "source-row";
        const label = document.createElement("span");
        label.textContent = row.label;
        const text = document.createElement("p");
        text.textContent = row.text;
        item.append(label, text);
        els.sourceGrid.append(item);
      });
    }

    function renderBlock(block) {
      const card = document.createElement("article");
      card.className = "detail-card";
      const title = document.createElement("h2");
      title.textContent = block.title;
      card.append(title);

      if (block.type === "action") {
        const p = document.createElement("p");
        p.textContent = block.content;
        const list = document.createElement("ol");
        list.className = "action-list";
        (block.data.actions || []).forEach((action, index) => {
          const li = document.createElement("li");
          const b = document.createElement("b");
          b.textContent = String(index + 1);
          const span = document.createElement("span");
          span.textContent = action;
          li.append(b, span);
          list.append(li);
        });
        card.append(p, list);
      } else {
        const p = document.createElement("p");
        p.textContent = block.content;
        card.append(p);
      }
      return card;
    }

    function renderDetail() {
      const mode = getAccessMode();
      if (mode === "processing") {
        showState("Generating report", "Payment has carried over, and detailed results are being organized. You can check again shortly.", "Back to list", () => (window.location.href = listRoute()));
        return;
      }
      if (mode === "locked") {
        showState("Detailed access is required", "This detail opens only within the purchased report. Check access again on the previous screen.", "Back to the previous page", () => (window.location.href = "../04-step-4-report/index.html#step-4-report"));
        return;
      }
      if (mode === "missing") {
        showState("Report not found", "The result identifier is missing or expired. Coming back in from the list can restore the status.", "Back to list", () => (window.location.href = listRoute()));
        return;
      }

      let detail = DETAILS.find((entry) => entry.section_id === currentSectionId());
      if (!detail) {
        detail = DETAILS[0];
        showToast("Item absent, so moved to the first detail.");
        window.history.replaceState(null, "", withRoute(detail.section_id));
      }

      const currentIndex = DETAILS.findIndex((entry) => entry.section_id === detail.section_id);
      els.state.classList.remove("is-visible");
      els.content.hidden = false;
      els.chip.textContent = detail.group_title + " · " + (currentIndex + 1) + "/" + DETAILS.length;
      els.groupTitle.textContent = detail.group_title;
      els.title.textContent = detail.title;
      els.conclusion.textContent = detail.conclusion;
      els.hero.src = "../assets/thisyear/report-sections/00-year-love-report-hero-v1.png";
      els.hero.alt = "A woman by a window looks at her phone and thinks about this year’s encounters";
      renderSources(detail);
      els.stack.innerHTML = "";
      detail.interpretation_blocks.forEach((block) => els.stack.append(renderBlock(block)));
      els.scroll.scrollTop = 0;
    }

    document.getElementById("btn-back").addEventListener("click", () => {
      if (window.history.length > 1 && document.referrer) {
        window.history.back();
        return;
      }
      window.location.href = listRoute();
    });

    document.getElementById("btn-vault").addEventListener("click", () => {
      showToast("Archive connection opens in the production environment.");
    });

    window.addEventListener("popstate", renderDetail);
    renderDetail();
  </script>
